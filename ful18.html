<style>

#set{position:fixed;left:50%;top:60px;width:min(340px,92vw);transform:translate(-50%,-12px);opacity:0;pointer-events:none;

.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}

<script>
const CH = [{"num": "1", "label": "Kapitel 1", "title": "Die Kiste reist mit", "html": "<p>Die Kiste war schwerer, als sie aussah.<\/p>\n<p>Felix trug sie an einem Griff, Lina am anderen, und so gingen sie den Pfad von der Station hinunter zur Straße, wo Birks altes Auto wartete. Die Kiste schaukelte zwischen ihnen. Im Inneren, auf dem blauen Samt, lagen der rote und der blaue Stein, und jedes Mal, wenn die Kiste schaukelte, hörte man ein ganz leises Klacken.<\/p>\n<p>„Langsamer“, sagte Lina.<\/p>\n<p>„Ich bin langsam.“<\/p>\n<p>„Du bist schnell, wenn du aufgeregt bist.“<\/p>\n<p>Felix wurde langsamer.<\/p>\n<p>Professor Birk stand am Auto und hielt etwas in der Hand. Es war flach und rot und so groß wie ein Brot, und als Felix und Lina näher kamen, schwebte es plötzlich aus Birks Hand hoch in die Luft. Es hatte zwei Augen auf dem Bildschirm, blau und rund, und es drehte sich einmal im Kreis.<\/p>\n<p>„Bzzt! Hallo!“, sagte es. „Ich bin bereit!“<\/p>\n<p>Felix stellte die Kiste so schnell ab, dass es darin wieder klackte.<\/p>\n<p>„Ein Smart-Rotom“, sagte Birk. „Ein Rotom, das in einem Telefon wohnt. Es weiß alles, was im Pokédex steht, es hat jede Karte von Hoenn im Kopf, und es kann mich anrufen. Und ich kann euch anrufen.“<\/p>\n<p>Das Rotom schwebte zu Lina hinüber und schaute ihr ins Gesicht.<\/p>\n<p>„Lina“, sagte es. „Elf Jahre. Pikachu, Knuddeluff, Kyogre und noch sehr viele andere. Stimmt das?“<\/p>\n<p>„Woher weißt du das?“<\/p>\n<p>„Der Professor hat es mir erzählt. Bzzt. Ich höre gut zu.“<\/p>\n<p>Dann schwebte es zu Felix.<\/p>\n<p>„Felix. Zwölf Jahre. Groudon, Garados, Turtok und noch sehr viele andere. Du schreibst viel in ein Buch. Warum? Du kannst alles mir sagen.“<\/p>\n<p>Felix legte die Hand auf die Jackentasche, in der sein Notizbuch steckte.<\/p>\n<p>„Das ist etwas anderes“, sagte er.<\/p>\n<p>„Was ist anders?“<\/p>\n<p>„In dir steht, was alle wissen“, sagte Felix. „In meinem Buch steht, was ich denke.“<\/p>\n<p>Das Rotom drehte sich einmal langsam um sich selbst, als müsste es darüber nachdenken.<\/p>\n<p>„Bzzt“, sagte es dann. „Das speichere ich ab.“<\/p>\n<p>Birk lachte. Es war das erste Mal seit Tagen, dass er lachte.<\/p>\n<p>„Genau so“, sagte er. „Es ist ein Lexikon, das fliegen kann. Kein Ratgeber. Wenn ihr wissen wollt, wie schwer ein Relaxo ist, fragt Rotom. Wenn ihr wissen wollt, was ihr tun sollt, fragt euch selbst.“<\/p>\n<p>Er wurde ernst.<\/p>\n<p>„Ich komme nicht mit“, sagte er. „Ich bin zu alt, um in einen Krater zu tauchen, und irgendjemand muss hierbleiben, falls Wassili noch einmal schreibt. Aber ich bin da. Jederzeit. Rotom muss nur klingeln.“<\/p>\n<p>„Bzzt!“, sagte Rotom stolz. „Ich kann sehr laut klingeln.“<\/p>\n<p>Sie fuhren nach Graphitport.<\/p>\n<p>Am Hafen lag die Fähre nach Moosbach City, weiß und breit, mit einem roten Streifen am Bug. Die Leute schoben Koffer und Fahrräder über die Rampe, Möwen schrien, und es roch nach Diesel und Fisch und nach den Waffeln, die jemand am Kai verkaufte.<\/p>\n<p>Und am Kai, vor der kleinen Übungsarena mit dem Wasserbecken, stand Oda.<\/p>\n<p>Sie hatte die Arme verschränkt und schaute ihnen entgegen, als hätte sie schon seit einer Stunde gewartet.<\/p>\n<p>„Birk hat mir erzählt, dass ihr wegfahrt“, sagte sie. „Er hat nicht gesagt wohin.“<\/p>\n<p>„Wir dürfen es nicht sagen“, sagte Felix.<\/p>\n<p>„Hab ich mir gedacht.“ Oda zog einen Zettel aus der Tasche. Er war gefaltet, wie immer. „Ich hab trotzdem was geschrieben.“<\/p>\n<p>Felix faltete den Zettel auf. Darauf standen, wie immer, drei Sätze.<\/p>\n<p class=\"doc\">WER ETWAS ZURÜCKBRINGT, MUSS NICHT GEWINNEN. ER MUSS NUR ANKOMMEN. UND ER MUSS WISSEN, WANN ER LOSLÄSST.<\/p>\n<p>„Woher weißt du, dass wir etwas zurückbringen?“, fragte Lina.<\/p>\n<p>Oda zeigte auf die Kiste.<\/p>\n<p>„Niemand trägt eine so alte Kiste so vorsichtig, wenn er sie behalten will“, sagte sie. „Gute Fahrt.“<\/p>\n<p>Die Fähre legte um elf ab.<\/p>\n<p>Felix und Lina standen an der Reling und schauten zu, wie Graphitport kleiner wurde. Die Kiste stand zwischen ihren Füßen, und Felix hatte einen Fuß fest dagegen gestellt, damit sie nicht rutschen konnte. Rotom schwebte über ihren Köpfen und las ihnen Dinge vor, die keiner wissen wollte.<\/p>\n<p>„Die Fähre ist zweiundachtzig Meter lang. Bzzt. Sie braucht bis Moosbach City sechs Stunden und vierzig Minuten. Unter uns ist das Wasser jetzt dreißig Meter tief. Jetzt vierzig. Jetzt …“<\/p>\n<p>„Rotom“, sagte Lina.<\/p>\n<p>„Ja?“<\/p>\n<p>„Danke.“<\/p>\n<p>„Gern geschehen! Jetzt fünfundfünfzig.“<\/p>\n<p>Am Nachmittag schlief Felix auf einer Bank an Deck ein, den Kopf auf seinem Rucksack, einen Arm um die Kiste gelegt.<\/p>\n<p>Er wachte auf, weil seine Jackentasche warm war.<\/p>\n<p>Nicht ein bisschen warm. Heiß. So, als hätte jemand eine Wärmflasche hineingesteckt. Er setzte sich auf und holte Groudons Ball heraus. Der Ball glühte nicht, aber er war so warm, dass Felix ihn von einer Hand in die andere werfen musste.<\/p>\n<p>Lina saß neben ihm. Sie hielt Kyogres Ball in beiden Händen, und auf dem Ball standen kleine Wassertropfen.<\/p>\n<p>„Seit fünf Minuten“, sagte sie leise.<\/p>\n<p>„Rotom“, sagte Felix. „Wie tief ist es hier?“<\/p>\n<p>Rotom schwebte heran. Sein Bildschirm zeigte eine Karte mit vielen blauen Linien.<\/p>\n<p>„Bzzt. Hier ist es sehr tief. Hier hört der Sockel von Hoenn auf. Ab hier ist offenes Meer. Tief. Ganz tief.“<\/p>\n<p>Felix schaute auf die Kiste.<\/p>\n<p>Durch den Spalt unter dem Deckel kam Licht. Ganz schwach. Rot und blau, in zwei dünnen Streifen, die über die Planken des Decks liefen und sich in der Mitte trafen.<\/p>\n<p>„Wo das Land aufhört“, sagte Lina. „Und das Meer anfängt.“<\/p>\n<p>„So wie auf der Landzunge“, sagte Felix.<\/p>\n<p>Er legte die Hand auf den Deckel. Er war kühl auf der einen Seite und warm auf der anderen. Nach einer Weile wurde das Licht schwächer, und dann war es weg, und die Bälle wurden wieder normal, und die Fähre fuhr weiter über das tiefe Wasser, als wäre nichts gewesen.<\/p>\n<p>Felix holte sein Notizbuch heraus und schrieb.<\/p>\n<p>Die Steine merken, wo sie sind. Sie merken es jedes Mal genauer.<\/p>\n<p>Lina schaute ihm über die Schulter.<\/p>\n<p>„Rotom weiß das nicht“, sagte sie.<\/p>\n<p>„Nein“, sagte Felix. „Das steht in keinem Pokédex.“<\/p>\n<p>Rotom schwebte heran und schaute auch über seine Schulter.<\/p>\n<p>„Bzzt“, sagte es. „Darf ich das abspeichern?“<\/p>\n<p>„Nein“, sagte Felix. Aber er lächelte dabei.<\/p>\n<p>Als die Sonne tiefer stand, ging Lina nach hinten zum Heck, um zu schauen, ob man Graphitport noch sehen konnte. Man konnte es nicht mehr. Man sah nur Wasser.<\/p>\n<p>Und auf der letzten Bank am Heck, mit dem Rücken zu ihr, saßen zwei Leute.<\/p>\n<p>Sie trugen große Sonnenhüte. Zwischen ihnen stand ein Picknickkorb. Und der Picknickkorb hatte zwei kleine Löcher im Deckel, und aus den Löchern schauten zwei Augen, die sehr schnell zugingen, als Lina hinschaute.<\/p>\n<p>Lina blieb ganz ruhig stehen. Sie zählte bis drei. Dann drehte sie sich um und ging zurück zu Felix, ohne sich ein einziges Mal umzuschauen.<\/p>\n<p>„Felix“, sagte sie und setzte sich ganz dicht neben ihn. „Halt die Kiste fest.“<\/p>\n<p>„Ich halte sie fest.“<\/p>\n<p>„Fester.“<\/p>\n<p>Felix schaute sie an. Dann schaute er zum Heck. Dann seufzte er sehr tief.<\/p>\n<p>„Sonnenhüte?“, fragte er.<\/p>\n<p>„Sonnenhüte“, sagte Lina. „Und ein Korb mit Augen.“<\/p>"}, {"num": "2", "label": "Kapitel 2", "title": "Ein Mann mit Kliklak", "html": "<p>Die Fähre legte in Moosbach City an, als es schon dämmerte.<\/p>\n<p>Moosbach City lag auf einer Insel, flach und grün, und über den Dächern ragte ein riesiger weißer Turm auf, mit einer Spitze, die im letzten Licht glänzte. Rotom flog sofort hoch, um besser sehen zu können.<\/p>\n<p>„Bzzt! Das Weltraumzentrum! Von hier fliegen Raketen ins All! Die letzte ist vor …“<\/p>\n<p>„Rotom, komm runter“, sagte Lina. „Wir müssen auf die Kiste aufpassen.“<\/p>\n<p>Rotom kam runter.<\/p>\n<p>Sie trugen die Kiste über die Rampe, Felix vorne, Lina hinten, und sie schauten beide nicht zum Heck. Hinter ihnen gingen die anderen Passagiere von Bord, mit Koffern und Fahrrädern, und irgendwo dazwischen zwei Sonnenhüte und ein Picknickkorb.<\/p>\n<p>Und am Ende des Stegs, unter einer Laterne, stand ein Mann.<\/p>\n<p>Er war über vierzig, hatte einen Bart und eine Brille, und er trug eine Jacke mit dem Abzeichen der Pokémon-Liga auf der Brust. Unter dem Arm hatte er eine Mappe. Zu seinen Füßen saß ein Nachtara, schwarz mit gelben Ringen, und schaute den Passagieren entgegen.<\/p>\n<p>Und über seiner Schulter schwebte ein Kliklak. Zwei graue Zahnräder, ineinander verhakt, die sich langsam drehten.<\/p>\n<p>Felix blieb so plötzlich stehen, dass Lina gegen die Kiste lief.<\/p>\n<p>„Christoph?“<\/p>\n<p>Christoph schaute auf. Er sah nicht überrascht aus. Er sah aus wie jemand, der etwas befürchtet hat und gerade recht bekommt.<\/p>\n<p>„Natürlich“, sagte er. „Natürlich seid ihr das.“<\/p>\n<p>„Was machst du hier?“, fragte Lina.<\/p>\n<p>„Ich wurde geschickt.“ Christoph klopfte auf die Mappe. „Ich hasse es, geschickt zu werden. Die Liga hat eine Meldung aus Xeneroville bekommen. In der Arena dort sinkt jede Nacht der Wasserstand im Kampfbecken. Ohne Grund. Und jeden Morgen ist er wieder da. Ohne Grund. Ich soll herausfinden, was der Grund ist.“<\/p>\n<p>Er schaute auf die Kiste zwischen ihnen.<\/p>\n<p>„Und dann ruft mich gestern Abend ein Professor Birk an“, sagte er, „den ich nicht kenne, und sagt, ich soll heute Abend am Fähranleger in Moosbach City stehen, weil zwei Kinder kommen, die ich kenne. Und ich frage, welche Kinder, und er sagt, das wüsste ich dann schon.“<\/p>\n<p>„Bzzt!“, sagte Rotom. „Das war ich! Ich habe die Nummer herausgesucht!“<\/p>\n<p>Christoph schaute Rotom an. Er schaute es sehr lange an.<\/p>\n<p>„Es redet“, sagte er.<\/p>\n<p>„Ja“, sagte Felix.<\/p>\n<p>„Ich mag keine Geräte, die reden“, sagte Christoph. „Geräte sollen messen. Nicht reden.“<\/p>\n<p>„Ich kann auch messen!“, sagte Rotom.<\/p>\n<p>„Was denn?“<\/p>\n<p>„Die Uhrzeit!“<\/p>\n<p>Christoph seufzte. Nachtara stupste ihn ans Bein, und er kraulte es hinter den Ohren, ohne hinzuschauen.<\/p>\n<p>In diesem Moment fing Kliklak an, sich schneller zu drehen.<\/p>\n<p>Es war erst nur ein bisschen schneller. Dann noch schneller. Die Zahnräder surrten, und Kliklak schwebte von Christophs Schulter weg, einen halben Meter, einen Meter, genau auf die Kiste zu. Es blieb über dem Deckel stehen und drehte sich so schnell, dass man die Zähne nicht mehr sehen konnte.<\/p>\n<p>Christoph nahm die Brille ab, putzte sie am Hemd und setzte sie wieder auf.<\/p>\n<p>„Was ist in der Kiste?“, fragte er.<\/p>\n<p>Felix und Lina schauten sich an.<\/p>\n<p>„Nicht hier“, sagte Lina.<\/p>\n<p>Christoph schaute sich um. Er sah die Laternen und die Passagiere und die Möwen. Und er sah, ganz am Rand des Stegs, zwei Sonnenhüte, die sehr interessiert eine Wand anschauten, an der nichts hing.<\/p>\n<p>„Nein“, sagte er leise. „Nicht hier.“<\/p>\n<p>Er hatte ein Zimmer in einer Pension am Hafen. Es war klein und hatte zwei Betten und ein Sofa und ein Fenster zum Meer, und Christophs Relaxo lag davor auf der Wiese und schlief, und die Pensionswirtin sagte, sie würde es lieber nicht wecken.<\/p>\n<p>„Niemand weckt Relaxo“, sagte Christoph. „Relaxo wacht auf, wenn Relaxo will.“<\/p>\n<p>Sie stellten die Kiste auf den Tisch. Felix machte den Deckel auf.<\/p>\n<p>Christoph schaute lange hinein. Er sagte nichts. Kliklak schwebte über den beiden Steinen und drehte sich, und es surrte leise, wie ein Kühlschrank in der Nacht.<\/p>\n<p>„Rotom“, sagte Felix. „Zeig ihm den Eintrag.“<\/p>\n<p>Rotom schwebte über den Tisch. Auf seinem Bildschirm erschien Text.<\/p>\n<p class=\"doc\">PROTOMORPHOSE · DURCH DEN ROTEN EDELSTEIN NIMMT GROUDON SEINE URFORM AN, DURCH DEN BLAUEN EDELSTEIN KYOGRE · DIE URFORMEN BESITZEN DIE FÄHIGKEITEN ENDLAND UND URMEER<\/p>\n<p>Christoph las es dreimal. Dann setzte er sich hin.<\/p>\n<p>„Wo sind Groudon und Kyogre?“, fragte er.<\/p>\n<p>Felix legte Groudons Ball auf den Tisch. Lina legte Kyogres Ball daneben.<\/p>\n<p>Christoph schaute die beiden Bälle an. Dann die Steine. Dann Felix und Lina. Und dann sagte er einen Satz, den er in Kalos schon einmal gesagt hatte, über etwas ganz anderes.<\/p>\n<p>„Ich nenne das gerade anders“, sagte er. „Aber nicht vor Kindern.“<\/p>\n<p>Lina musste lachen.<\/p>\n<p>Dann erzählten sie alles. Von der Inschrift unter dem Samt. Von der Landzunge. Von Wassilis Brief. Von der Höhle, die wartet. Und von dem, was Birk gesagt hatte: dass die Urformen keine Waffe sind und nur an einem einzigen Ort sicher.<\/p>\n<p>Christoph hörte zu. Er schrieb nichts auf. Er unterbrach sie nicht. Als sie fertig waren, nahm er die Mappe der Liga und legte sie auf den Tisch.<\/p>\n<p>„Rotom“, sagte er. „Steht in deinem Pokédex, warum es die Urzeithöhle sein muss?“<\/p>\n<p>„Bzzt. Nein.“<\/p>\n<p>„Steht darin, was passiert, wenn man es woanders macht?“<\/p>\n<p>„Bzzt. Nein.“<\/p>\n<p>„Steht darin, wie man nach Xeneroville kommt?“<\/p>\n<p>„Ja!“ Rotom drehte sich vor Freude. „Fliegen oder tauchen! Es gibt keinen Hafen und keine Straße und keine Brücke! Die Stadt liegt in einem Krater, und der Krater ist rundherum aus Fels!“<\/p>\n<p>Christoph schaute aus dem Fenster auf Relaxo. Relaxo wog vierhundertsechzig Kilo und schnarchte.<\/p>\n<p>„Fliegen oder tauchen“, sagte er.<\/p>\n<p>„Ja!“<\/p>\n<p>„Mit Relaxo.“<\/p>\n<p>Rotom sagte nichts mehr. Sogar Rotom wusste, dass das ein Problem war.<\/p>\n<p>Spät am Abend, als Christoph auf dem Sofa schlief und Nachtara an der Tür lag, saßen Felix und Lina am Fenster. Draußen war es dunkel, nur die Laternen am Hafen brannten.<\/p>\n<p>„Christoph misst alles“, sagte Lina. „So wie du.“<\/p>\n<p>„Ich messe nicht alles.“<\/p>\n<p>„Doch. Du zählst. Er misst. Das ist dasselbe.“<\/p>\n<p>Felix holte sein Notizbuch heraus. Er schrieb lange. Dann zeigte er Lina, was er geschrieben hatte.<\/p>\n<p>Rotom weiß, was in den Büchern steht. Christoph misst, was man messen kann. Aber was die Steine wollen, weiß keiner von beiden.<\/p>\n<p>Lina nickte langsam.<\/p>\n<p>Unten am Hafen, unter dem Steg, wo das Wasser gegen die Pfähle schwappte, bewegte sich etwas. Ein kleiner Schatten mit spitzen Ohren. Er hatte die ganze Zeit unter dem offenen Fenster der Pension gesessen.<\/p>\n<p>Jetzt huschte er davon, über den Steg, zu einem Boot, das sehr klein war und sehr seltsam aussah. Rund. Mit zwei Ohren oben drauf. Und einem Fenster vorne, das aussah wie ein Gesicht.<\/p>\n<p>Niemand sah es. Nur Nachtara hob an der Tür ganz kurz den Kopf. Und legte ihn dann wieder auf die Pfoten, ohne die Augen zu schließen.<\/p>"}, {"num": "3", "label": "Kapitel 3", "title": "Ein Schatten über dem Wasser", "html": "<p>Der Fischer hieß Ole und hatte ein Boot, das nach Seetang und Benzin roch und an der Seite den Namen <b>MÖWE II<\/b> trug. Was mit der ersten Möwe passiert war, wollte er nicht sagen.<\/p>\n<p>„Bis vor den Krater fahre ich euch“, sagte er. „Weiter nicht. Weiter fährt keiner.“<\/p>\n<p>„Warum nicht?“, fragte Lina.<\/p>\n<p>Ole zeigte nach vorne.<\/p>\n<p>Aus dem Meer stieg eine Wand. Sie war grau und steil und so hoch, dass man den Kopf in den Nacken legen musste, und sie lief in einem großen Kreis um etwas herum, das man nicht sehen konnte. Kein Strand. Keine Treppe. Kein Tor. Nur Felsen, an denen die Wellen weiß zerplatzten.<\/p>\n<p>„Darum“, sagte Ole.<\/p>\n<p>Rotom schwebte über den Bug.<\/p>\n<p>„Bzzt! Der Kraterrand von Xeneroville! Bis zu hundertzwanzig Meter hoch! Innen liegt ein See, und um den See herum ist die Stadt in den Fels gebaut! Unter dem Rand gibt es einen Tunnel unter Wasser. Er ist kurz. Sehr kurz. Aber dunkel.“<\/p>\n<p>„Wie kurz?“, fragte Christoph.<\/p>\n<p>„Ein Garados braucht zwanzig Sekunden!“<\/p>\n<p>Christoph nahm die Brille ab und putzte sie, obwohl sie sauber war.<\/p>\n<p>„Und ein Relaxo?“, fragte er.<\/p>\n<p>Rotom drehte sich langsam um sich selbst. Es sagte nichts. Das war bei Rotom selten genug.<\/p>\n<p>Relaxo lag mitten auf dem Deck der MÖWE II und schlief. Das Boot lag deswegen ein bisschen schief im Wasser. Ole hatte zweimal gesagt, dass er das nicht gut fand.<\/p>\n<p>„Es gibt nur zwei Wege hinein“, sagte Felix. „Fliegen oder tauchen. Relaxo kann beides nicht.“<\/p>\n<p>„Relaxo kann schlafen“, sagte Christoph. „Darin ist es Weltmeister.“<\/p>\n<p>In diesem Moment fiel ein Schatten über das Boot.<\/p>\n<p>Er war groß und kam von oben, und er glitt über das Deck, über Relaxo, über die Kiste, über Felix und Lina und dann weiter übers Wasser. Ole duckte sich. Christoph schaute hoch. Lina schaute auch hoch, und dann fing sie an zu lachen.<\/p>\n<p>Über ihnen zog ein Dragoran einen Kreis. Es war orange und rund und hatte kleine Flügel, die eigentlich viel zu klein aussahen für so ein großes Pokémon. Und auf seinem Rücken saß eine Frau mit einem grünen Wollpullover und einem Rucksack, an dem eine Thermoskanne baumelte.<\/p>\n<p>„Caro!“, schrie Lina.<\/p>\n<p>Dragoran landete auf dem Wasser neben der MÖWE II, ganz vorsichtig, wie jemand, der nicht stören will. Caro rutschte von seinem Rücken direkt aufs Deck.<\/p>\n<p>„Birk hat geschrieben“, sagte sie. „Ich hab nicht lang überlegt.“<\/p>\n<p>Lina umarmte sie so fest, dass die Thermoskanne klapperte. Felix gab ihr die Hand, und dann umarmte er sie doch auch.<\/p>\n<p>„Dragoran“, sagte Felix. Er schaute hinauf zu dem großen, freundlichen Gesicht über der Reling. „Das letzte Mal war es noch ein Dragonir.“<\/p>\n<p>„Im Winter hat es sich entwickelt“, sagte Caro. „Mitten in der Nacht. Ich bin aufgewacht, weil der Wohnwagen gewackelt hat. Es hat sich so erschrocken, dass es sich danach drei Tage lang wieder in die Regentonne setzen wollte. Es passt nur nicht mehr hinein.“<\/p>\n<p>Dragoran senkte den Kopf, als wäre ihm die Geschichte ein bisschen peinlich.<\/p>\n<p>Caro schaute sich auf dem Deck um. Sie sah die Kiste. Sie sah Kliklak, das über der Kiste schwebte und sich drehte. Sie sah das Relaxo. Und dann sah sie Christoph.<\/p>\n<p>„Sie sind der Mann aus Kalos“, sagte sie. „Mit den Evoli. Lina hat mir von Ihnen erzählt.“<\/p>\n<p>„Und Sie sind die Frau aus Galar“, sagte Christoph. „Mit dem Nebel. Felix hat mir von Ihnen erzählt.“<\/p>\n<p>Sie gaben sich die Hand. Sie schauten sich beide ein bisschen misstrauisch an, so wie zwei Katzen, die sich zum ersten Mal auf demselben Zaun treffen.<\/p>\n<p>„Gut“, sagte Caro. „Dann zum Problem.“<\/p>\n<p>Sie zeigte auf Relaxo.<\/p>\n<p>„Dragoran kann zwei Leute tragen“, sagte sie. „Vielleicht drei, wenn sie nicht zappeln. Aber kein Relaxo.“<\/p>\n<p>„Ich weiß“, sagte Christoph.<\/p>\n<p>„Haben Sie es mal im Ball versucht?“<\/p>\n<p>Es wurde still auf dem Deck. Felix und Lina schauten sich an. Ole schaute Christoph an. Sogar Rotom schaute Christoph an.<\/p>\n<p>„Relaxo mag seinen Ball nicht“, sagte Christoph steif. „Es war noch nie gern darin. Ich habe es nie dazu gezwungen.“<\/p>\n<p>„Dann zwingen Sie es nicht“, sagte Caro. „Fragen Sie es.“<\/p>\n<p>Christoph schaute sie an. Dann schaute er auf Relaxo, das auf dem Deck lag und schnarchte und von dem ganzen Gespräch nichts mitbekam.<\/p>\n<p>„Es entscheidet“, sagte Lina leise. „Nicht du.“<\/p>\n<p>Christoph seufzte. Er kniete sich neben Relaxo hin. Er holte den Ball aus der Tasche, einen alten, zerkratzten Ball, der aussah, als hätte er seit Jahren keinen Einsatz mehr gehabt. Und er legte ihn auf seine flache, offene Hand, neben Relaxos riesigen Bauch.<\/p>\n<p>„Relaxo“, sagte er. „Wir müssen in einen Krater. Ich kann dich nicht tragen. Niemand kann dich tragen. Du musst nicht. Aber wenn du mitwillst, dann ist das hier der einzige Weg.“<\/p>\n<p>Relaxo öffnete ein Auge. Es schaute den Ball an. Es schaute Christoph an. Es schaute lange.<\/p>\n<p>Dann streckte es eine riesige Pfote aus und tippte ganz vorsichtig auf den Knopf.<\/p>\n<p>Ein Lichtblitz. Das Deck der MÖWE II hob sich mit einem Ruck aus dem Wasser, als hätte jemand einen Anker gelichtet. Ole hielt sich am Steuer fest.<\/p>\n<p>Christoph kniete auf dem Deck und hielt den Ball in der Hand. Er sagte eine ganze Weile nichts.<\/p>\n<p>„Seit elf Jahren“, sagte er dann. „Seit elf Jahren hab ich das nicht versucht.“<\/p>\n<p>„Manchmal muss man nur fragen“, sagte Caro.<\/p>\n<p>Christoph schaute zu ihr hoch. Er sah nicht mehr ganz so misstrauisch aus.<\/p>\n<p>Dann teilten sie sich auf.<\/p>\n<p>Caro würde fliegen, mit Christoph und mit der Kiste. Dragoran konnte die Kiste tragen, und es war sicherer, wenn die Steine nicht ins Wasser mussten. Lina würde mitfliegen, und Voltrean würde neben ihnen herfliegen und über den Rand schauen, ob dort oben jemand wartete.<\/p>\n<p>Und Felix würde tauchen.<\/p>\n<p>„Allein?“, fragte Christoph.<\/p>\n<p>„Mit Garados“, sagte Felix. „Garados kennt das Meer. Und ich will sehen, wie man hineinkommt. Von unten. Wenn wir mal schnell wieder raus müssen, muss einer den Weg kennen.“<\/p>\n<p>Christoph wollte etwas sagen. Caro legte ihm die Hand auf den Arm.<\/p>\n<p>„Er hat recht“, sagte sie.<\/p>\n<p>Felix warf den Ball. Garados kam aus dem Wasser, riesig und blau, und das Boot schaukelte in seiner Welle. Felix kletterte auf seinen Kopf und hielt sich an den Hörnern fest.<\/p>\n<p>„Rotom“, sagte er. „Bleib bei Lina.“<\/p>\n<p>„Bzzt. Ich kann nicht tauchen. Ich bin ein Telefon.“<\/p>\n<p>„Genau.“<\/p>\n<p>Felix holte tief Luft.<\/p>\n<p>„Wir zählen“, sagte er. Lina stand an der Reling und zählte mit.<\/p>\n<p>„Eins. Zwei. Drei.“<\/p>\n<p>Garados tauchte.<\/p>\n<p>Es war sofort dunkel. Nicht ganz schwarz, sondern dunkelblau, und dann dunkelgrün, und dann gar keine Farbe mehr. Felix spürte das Wasser an den Ohren drücken. Er spürte Garados' Hörner unter seinen Händen. Er zählte im Kopf. Fünf. Sechs. Sieben.<\/p>\n<p>Bei zwölf sah er das Licht.<\/p>\n<p>Es kam von oben, hell und grün, wie Sonnenlicht durch Blätter. Garados schwamm darauf zu, und bei neunzehn brachen sie durch die Wasseroberfläche, und Felix holte Luft, so tief, dass es wehtat.<\/p>\n<p>Und dann sah er die Stadt.<\/p>\n<p>Rund um den See, in den Fels gebaut, standen weiße Häuser. Sie klebten an den Wänden, eins über dem anderen, mit Treppen dazwischen und kleinen Brücken und Blumenkästen vor den Fenstern. Ganz oben war der Himmel, ein runder Fleck aus Blau. Und mitten im See, auf einer Insel aus Fels, stand ein großes, flaches Gebäude mit einem Dach aus Glas.<\/p>\n<p>Die Arena.<\/p>\n<p>Über ihm zog ein Schatten über den Kraterrand. Dragoran kam herein, groß und orange, mit Caro und Christoph und Lina auf dem Rücken und der Kiste dazwischen, und Voltrean flog daneben und schrie, und es klang ein bisschen wie Jubel.<\/p>\n<p>Felix schaute ihnen zu, wie sie hereinschwebten. Dann schaute er weiter nach oben, in den runden Fleck aus Himmel.<\/p>\n<p>Ganz oben, sehr hoch, über den Wolken, bewegte sich etwas. Es war lang und schmal und grün, und es glitt durch die Wolken wie ein Band durch Wasser.<\/p>\n<p>Felix blinzelte.<\/p>\n<p>Als er wieder hinschaute, war nur noch Himmel da.<\/p>"}, {"num": "4", "label": "Kapitel 4", "title": "Wassili", "html": "<p>Die Stadt hatte einen Ring.<\/p>\n<p>Felix bemerkte ihn, als Garados zum Ufer schwamm. Rund um den See, an allen Felswänden, auf der gleichen Höhe, lief ein heller Streifen. Er war etwa eine Handbreit hoch, und er sah aus wie der Rand in einer Badewanne, aus der jemand das Wasser abgelassen hat.<\/p>\n<p>„Das ist von heute Nacht“, sagte jemand.<\/p>\n<p>Am Ufer, auf der untersten Treppe, stand ein Mann. Er war groß und schlank, hatte graues Haar, das ordentlich nach hinten gekämmt war, und er trug einen langen, dunkelblauen Umhang, der bei jedem Windstoß ein bisschen wehte. Neben ihm stand Caro, die schon gelandet war, und Christoph, der seinen Liga-Ausweis in der Hand hielt.<\/p>\n<p>„Wassili“, sagte der Mann. „Arenaleiter von Xeneroville. Ihr seid die Kinder von Birk.“<\/p>\n<p>„Wir sind nicht Birks Kinder“, sagte Felix und kletterte von Garados herunter. „Wir sind nur …“<\/p>\n<p>„Ich weiß“, sagte Wassili. „Er hat geschrieben, ihr würdet das sagen.“<\/p>\n<p>Er drehte sich um und ging die Treppe hinauf. Sie folgten ihm. Lina und Felix trugen wieder die Kiste. Rotom schwebte hinterher und las jedes Schild vor, an dem sie vorbeikamen.<\/p>\n<p>„Bzzt. Bäckerei. Bzzt. Treppe zum Oberdorf. Bzzt. Bitte nicht auf die Blumen treten.“<\/p>\n<p>„Rotom“, sagte Lina.<\/p>\n<p>„Ich bin leise!“<\/p>\n<p>Wassili führte sie in die Arena. Sie fuhren mit einem kleinen Boot hinüber, das an einem Seil über den See gezogen wurde, und drinnen war es kühl und hell, und in der Mitte lag ein großes Becken mit klarem Wasser, in dem Kampfplattformen schwammen.<\/p>\n<p>An den Wänden des Beckens war derselbe Ring wie draußen. Eine Handbreit.<\/p>\n<p>„Jede Nacht“, sagte Wassili. „Seit dem Frühsommer. Um Mitternacht fängt es an zu sinken. Um vier Uhr morgens ist es eine Handbreit tiefer. Und wenn die Sonne aufgeht, steigt es wieder. Es gibt hier keine Ebbe und keine Flut. Der See ist ganz vom Meer abgeschlossen, bis auf den einen Tunnel, und der ist zu schmal dafür.“<\/p>\n<p>Christoph hielt Kliklak über das Wasser. Kliklak drehte sich. Nicht schnell. Aber schneller als sonst.<\/p>\n<p>„Etwas zieht“, sagte Christoph. „Ganz schwach. Ich kann nicht sagen, wohin.“<\/p>\n<p>„Ich kann“, sagte Wassili. „Kommt.“<\/p>\n<p>Er führte sie hinter die Arena. Dort, wo die Felswand des Kraters bis ans Wasser reichte, war eine Tür. Sie war alt und aus Holz und mit Eisen beschlagen, und sie war mit einem dicken Balken verriegelt.<\/p>\n<p>Wassili legte die Hand auf den Fels neben der Tür.<\/p>\n<p>„Fühlt“, sagte er.<\/p>\n<p>Felix legte die Hand auf den Fels. Er war warm. Nicht von der Sonne, denn hier unten kam keine Sonne hin. Er war warm von innen, so wie ein Stein, unter dem ein Feuer brennt. Und gleichzeitig war er feucht, und die Feuchtigkeit war kalt.<\/p>\n<p>„Warm und kalt“, sagte Lina, die ihre Hand neben seine gelegt hatte. „Gleichzeitig.“<\/p>\n<p>„Die Urzeithöhle“, sagte Wassili.<\/p>\n<p>Kliklak drehte sich jetzt so schnell, dass es surrte.<\/p>\n<p>Wassili drehte sich zu ihnen um. Er schaute die Kiste an, und dann schaute er Christoph an, der immer noch seinen Ausweis in der Hand hielt.<\/p>\n<p>„Sie sind von der Liga“, sagte er.<\/p>\n<p>„Abteilung Arenabetrieb“, sagte Christoph. „Die Liga möchte wissen, warum …“<\/p>\n<p>„Die Liga möchte wissen, ob sie die Arena schließen muss“, sagte Wassili. „Ich weiß, was die Liga möchte. Ich war früher selbst bei der Liga.“ Er schob den Ausweis mit einem Finger zur Seite. „Das hier beeindruckt mich nicht. Hinter dieser Tür liegt der älteste Ort in ganz Hoenn. Ich lasse niemanden hinein, nur weil er ein Papier hat.“<\/p>\n<p>Christoph steckte den Ausweis langsam ein. Er sah ein bisschen gekränkt aus. Und gleichzeitig ein bisschen so, als hätte er genau das erwartet.<\/p>\n<p>„Und ich lasse niemanden hinein“, sagte Wassili, und jetzt schaute er Felix und Lina an, „der diesen Ort benutzen will. Für einen Kampf. Für Macht. Für irgendetwas. Es sind schon Leute gekommen, die das wollten. Vor langer Zeit. Es ist nicht gut ausgegangen.“<\/p>\n<p>Es war still hinter der Arena. Man hörte nur das Wasser gegen den Fels schlagen.<\/p>\n<p>Dann trat Caro einen Schritt vor.<\/p>\n<p>„Wir wollen nichts benutzen“, sagte sie ruhig. „Wir bringen etwas zurück.“<\/p>\n<p>Wassili schaute sie an. Lange.<\/p>\n<p>„Was?“<\/p>\n<p>Felix stellte die Kiste auf den Boden. Er klappte den Deckel auf.<\/p>\n<p>Der rote und der blaue Stein lagen auf dem Samt, und kaum war der Deckel offen, fingen sie an zu leuchten. Nicht schwach, wie auf der Fähre. Hell. Rot und blau, in zwei Strahlen, die beide in dieselbe Richtung zeigten. Auf die alte Tür.<\/p>\n<p>Felix holte Groudons Ball heraus. Lina holte Kyogres Ball heraus. Der eine war heiß. Der andere tropfte.<\/p>\n<p>Wassili schaute auf die Steine. Dann auf die Bälle. Dann auf die Tür. Seine Hand, die auf dem Fels lag, zitterte ein bisschen.<\/p>\n<p>„Seit dem Frühsommer“, sagte er leise. „Seit dem Frühsommer wartet sie. Und ich wusste nicht, auf was.“<\/p>\n<p>Er nahm die Hand vom Fels.<\/p>\n<p>„Ihr könnt bleiben“, sagte er. „Alle. Ich habe Zimmer im Oberdorf. Aber diese Tür geht erst auf, wenn ich es sage. Nicht vorher. Habt ihr das verstanden?“<\/p>\n<p>„Ja“, sagten Felix und Lina gleichzeitig.<\/p>\n<p>Auf dem Rückweg durch die Stadt ließ Felix Shaymin aus dem Ball.<\/p>\n<p>Er wusste selbst nicht genau, warum. Es war nur so ein Gefühl, seit sie durch den Tunnel gekommen waren. Shaymin landete auf der Treppe, klein und weiß und grün, mit den rosa Blüten hinter den Ohren, und schnupperte.<\/p>\n<p>Dann lief es los.<\/p>\n<p>Es lief die Treppe hinauf, an den Häusern vorbei, bis zu den Blumenkästen vor den Fenstern. Die Blumen darin waren braun. Alle. Vertrocknet, obwohl der See direkt unter ihnen lag. Shaymin schnupperte an jeder einzelnen, und seine Ohren hingen herunter.<\/p>\n<p>Caro hockte sich daneben. Sie nahm eine der braunen Blüten zwischen die Finger.<\/p>\n<p>„Die sind nicht verdurstet“, sagte sie. „Die sind müde.“<\/p>\n<p>„Pflanzen werden nicht müde“, sagte Christoph.<\/p>\n<p>„Doch“, sagte Caro. „Wenn um sie herum etwas nicht stimmt. Wenn die Kraft, aus der sie wachsen, hin und her gezogen wird. Mal zum Wasser. Mal zum Feuer. Dann wissen sie nicht mehr, wohin sie wachsen sollen.“<\/p>\n<p>Sie ließ Folipurba aus dem Ball. Folipurba und Shaymin schauten sich an, das große, ruhige Pflanzen-Pokémon und das kleine aus Sinnoh, und dann setzten sie sich nebeneinander vor den Blumenkasten und blieben ganz still.<\/p>\n<p>„Sie hören zu“, sagte Caro leise.<\/p>\n<p>Am Abend rief Birk an.<\/p>\n<p>Rotom klingelte so laut, dass in drei Häusern die Fenster aufgingen. Birks Gesicht erschien auf dem Bildschirm, ein bisschen verschwommen, mit dem Arbeitszimmer im Hintergrund und dem leeren Schrank.<\/p>\n<p>„Ihr seid drin“, sagte er.<\/p>\n<p>„Wir sind drin“, sagte Lina. „Mit Caro. Und Christoph. Und Wassili lässt uns bleiben.“<\/p>\n<p>„Wassili“, sagte Birk und lächelte. „Grüßt ihn von mir. Er wird so tun, als wäre es ihm egal.“<\/p>\n<p>Wassili stand am Fenster und tat so, als wäre es ihm egal.<\/p>\n<p>Um Mitternacht konnte Felix nicht schlafen. Er stand am Fenster des kleinen Zimmers im Oberdorf und schaute hinunter auf den See. Neben ihm auf der Fensterbank schwebte Kliklak, das Christoph ihm für die Nacht geliehen hatte, und drehte sich.<\/p>\n<p>Unten an den Felswänden sank das Wasser. Langsam. Man sah es fast nicht.<\/p>\n<p>Felix schlug sein Notizbuch auf.<\/p>\n<p>Die Höhle zieht. Mal zum Wasser. Mal zum Feuer. Und die Blumen wissen nicht mehr, wohin.<\/p>\n<p>Dann sah er etwas auf dem See.<\/p>\n<p>Mitten im dunklen Wasser, dort, wo der Tunnel unter dem Kraterrand herauskam, zog etwas eine kleine Spur. Ein dünner Stab ragte aus dem Wasser. Oben an dem Stab war etwas Rundes. Mit zwei Spitzen.<\/p>\n<p>Wie Ohren.<\/p>\n<p>Der Stab drehte sich einmal langsam im Kreis. Er schaute zur Arena. Er schaute zur alten Tür. Er schaute zum Oberdorf hinauf, genau zu Felix' Fenster.<\/p>\n<p>Dann versank er im See, ohne ein Geräusch.<\/p>"}, {"num": "5", "label": "Kapitel 5", "title": "Das Geweih zählt", "html": "<p>Beim Frühstück erzählte Felix von dem Stab mit den Ohren.<\/p>\n<p>Er erzählte es schnell und leise, damit Wassili es nicht hörte, aber Wassili stand ohnehin am Herd und tat so, als würde er nicht zuhören.<\/p>\n<p>„Ein Periskop“, sagte Christoph. „Ein Tauchboot.“<\/p>\n<p>„Mit Ohren“, sagte Lina.<\/p>\n<p>„Natürlich mit Ohren.“ Christoph legte sein Brot hin. „Die drei haben noch nie etwas gebaut, das keine Ohren hatte.“<\/p>\n<p>„Sie kommen durch den Tunnel“, sagte Felix. „So wie ich. Nur unter Wasser.“<\/p>\n<p>Caro schaute zum Fenster hinaus, auf den See.<\/p>\n<p>„Dann braucht die Stadt nachts Augen“, sagte sie. „Und Ohren. Unsere.“<\/p>\n<p>Sie ließ Noctuh aus dem Ball. Christoph ließ Nachtara aus dem Ball. Die beiden schauten sich an, das kleine braune Eulen-Pokémon und das schwarze mit den gelben Ringen, und Noctuh legte den Kopf schief, ganz schief, bis es fast auf dem Kopf stand. Nachtara schaute es an. Dann legte es auch den Kopf schief.<\/p>\n<p>„Ich glaube, die verstehen sich“, sagte Lina.<\/p>\n<p>„Nachtara versteht sich mit niemandem“, sagte Christoph. „Grundsätzlich nicht.“<\/p>\n<p>Nachtara legte sich neben Noctuh auf die Fensterbank.<\/p>\n<p>Christoph sagte nichts mehr.<\/p>\n<p>Nach dem Frühstück stiegen sie auf die oberste Terrasse des Oberdorfs, dorthin, wo die Häuser aufhörten und nur noch Fels war und ein schmaler Streifen Gras. Von dort sah man den ganzen See und die Arena und, ganz klein, die alte Tür hinter der Arena.<\/p>\n<p>Caro ließ Kronjuwild aus dem Ball.<\/p>\n<p>Es stand auf dem Gras, groß und ruhig, und sein Geweih breitete sich über ihm aus wie die Krone eines Baumes. An den Enden des Geweihs wuchsen Blätter. Sie waren orange und rot und braun, so wie Blätter im Herbst eben sind.<\/p>\n<p>„Kronjuwilds Geweih ist ein Kalender“, sagte Caro. „Im Frühling blüht es. Im Sommer ist es grün. Im Herbst färbt es sich. Es weiß immer, welche Zeit gerade ist, besser als jede Uhr.“<\/p>\n<p>„Bzzt!“, sagte Rotom. „Ich weiß auch, welche Zeit ist! Neun Uhr zwölf!“<\/p>\n<p>„Das ist eine andere Zeit“, sagte Caro freundlich.<\/p>\n<p>Kronjuwild hob den Kopf und schaute hinunter auf den See. Es schaute lange. Dann drehte es den Kopf, ganz langsam, bis es auf die alte Tür schaute.<\/p>\n<p>Und an seinem Geweih, ganz vorne, an der äußersten Spitze, verfärbte sich ein einzelnes Blatt.<\/p>\n<p>Es wurde nicht rot und nicht braun. Es wurde blau. Und dann, ein paar Atemzüge später, wurde es wieder orange. Und dann wieder blau.<\/p>\n<p>Caro hielt die Luft an.<\/p>\n<p>„Das hat es noch nie gemacht“, sagte sie.<\/p>\n<p>Felix holte sein Notizbuch heraus. Christoph holte Kliklak heraus. Sie standen beide nebeneinander und schauten auf das Blatt, Felix mit dem Stift und Christoph mit dem surrenden Kliklak, und sie sahen in diesem Moment so ähnlich aus, dass Lina lachen musste.<\/p>\n<p>„Es wechselt“, sagte Felix. „Orange. Blau. Orange. Blau.“<\/p>\n<p>„Feuer und Wasser“, sagte Lina.<\/p>\n<p>„Und es wird langsamer“, sagte Christoph. Er hatte auf die Uhr geschaut. „Vor einer Minute hat jedes Blau acht Sekunden gedauert. Jetzt sind es neun.“<\/p>\n<p>Sie standen eine ganze Stunde auf der Terrasse. Christoph maß. Felix zählte und schrieb. Caro stand neben Kronjuwild und legte ihm die Hand auf den Hals und sagte gar nichts.<\/p>\n<p>Dann rechnete Felix.<\/p>\n<p>„Wenn es so weitergeht“, sagte er, „dann ist das Blatt irgendwann halb blau und halb orange. Gleichzeitig. Nicht mehr abwechselnd.“<\/p>\n<p>„Wann?“, fragte Lina.<\/p>\n<p>Felix rechnete noch einmal. Christoph rechnete auch, im Kopf, mit zusammengekniffenen Augen.<\/p>\n<p>„In drei Nächten“, sagten beide gleichzeitig.<\/p>\n<p>Sie schauten sich an. Christoph sah aus, als wüsste er nicht, ob er sich ärgern oder freuen sollte.<\/p>\n<p>„Rotom“, sagte Lina. „Was ist in drei Nächten?“<\/p>\n<p>Rotom drehte sich. Auf seinem Bildschirm erschien ein Mond, der von Tag zu Tag schmaler wurde.<\/p>\n<p>„Bzzt! In drei Nächten ist Neumond! Dann sind Sonne und Mond auf derselben Seite der Erde. Beide ziehen am Meer, in dieselbe Richtung. Dann gibt es eine Springflut. Das Wasser steigt höher als sonst.“<\/p>\n<p>„Und warum ist das wichtig?“, fragte Felix.<\/p>\n<p>„Bzzt“, sagte Rotom. Dann sagte es nichts mehr. Das war die Grenze dessen, was in Rotom stand.<\/p>\n<p>Caro streichelte Kronjuwild über die Nase.<\/p>\n<p>„Weil sonst immer einer gegen den anderen zieht“, sagte sie. „Die Sonne hierhin, der Mond dahin. Wie bei den Blumen im Oberdorf. Wie bei dem Wasser im See. Aber bei Neumond ziehen beide in dieselbe Richtung.“<\/p>\n<p>Sie schaute Felix und Lina an.<\/p>\n<p>„Die Sonne ist Groudon“, sagte sie. „Das Meer ist Kyogre. Vielleicht wartet die Höhle auf eine Nacht, in der beide in dieselbe Richtung ziehen. Nicht gegeneinander.“<\/p>\n<p>Es war still auf der Terrasse. Unter ihnen glitzerte der See.<\/p>\n<p>Felix schrieb den Satz auf. Dann strich er nichts durch. Er schrieb nur darunter: Caro. Nicht Rotom.<\/p>\n<p>Am Nachmittag machte Wassili die alte Tür auf.<\/p>\n<p>Er tat es nicht gern. Er stand lange davor, mit der Hand auf dem Balken, und schaute die Kinder an und dann Caro und dann Christoph.<\/p>\n<p>„Nur schauen“, sagte er. „Bis zur ersten Biegung. Nicht weiter.“<\/p>\n<p>Er zog den Balken zurück. Die Tür öffnete sich nach innen, schwer und langsam, und warme Luft kam heraus, die nach Stein roch und nach Meer und nach etwas, das Felix nicht kannte. Etwas sehr Altem.<\/p>\n<p>Dahinter war ein Gang. Er war rund und glatt, als hätte ihn Wasser ausgewaschen, und er führte ein paar Meter in den Fels hinein. Dann teilte er sich.<\/p>\n<p>Links ging es nach oben. Von dort kam ein rotes Licht, schwach und flackernd, und die Luft war so warm, dass man es auf den Wangen spürte.<\/p>\n<p>Rechts ging es nach unten. Von dort kam ein blaues Licht, und man hörte Wasser, das tropfte, und die Luft war kühl und feucht.<\/p>\n<p>Kliklak schoss aus Christophs Hand nach vorn. Es drehte sich so schnell, dass es surrte wie eine Biene, und es stieg und stieg, bis es fast an die Decke des Ganges stieß. Christoph fing es mit beiden Händen und hielt es fest.<\/p>\n<p>„Das reicht“, sagte er. „Das reicht für eine Messung.“<\/p>\n<p>Felix und Lina standen an der Gabelung. Felix schaute nach links, ins Rote. Lina schaute nach rechts, ins Blaue.<\/p>\n<p>Dann machten sie beide gleichzeitig einen Schritt nach vorn. Felix nach links, Lina nach rechts.<\/p>\n<p>Ein Windstoß kam aus beiden Gängen. Er war nicht stark, aber er schob sie zurück, beide gleichzeitig, sanft und bestimmt, so wie man jemanden zurückschiebt, der zu früh durch eine Tür will.<\/p>\n<p>Felix stolperte rückwärts gegen Lina. Lina hielt ihn fest.<\/p>\n<p>„Was war das?“, flüsterte sie.<\/p>\n<p>Wassili stand hinter ihnen in der Tür. Er sah nicht überrascht aus.<\/p>\n<p>„Die alten Leute in der Stadt sagen“, sagte er langsam, „dass Groudon und Kyogre am Anfang jeder allein hierhergekommen sind. Jeder durch seinen eigenen Gang. Und dass die Höhle jeden zuerst allein kennenlernen will. Bevor sie zusammen hineindürfen.“<\/p>\n<p>Felix schaute nach links. Lina schaute nach rechts.<\/p>\n<p>„Einzeln“, sagte Felix.<\/p>\n<p>„Einzeln“, sagte Lina.<\/p>\n<p>Am Abend saßen sie auf der Terrasse. Nachtara und Noctuh saßen am Geländer und schauten auf den dunklen See hinunter. Noch war nichts darauf zu sehen.<\/p>\n<p>„Morgen gehe ich“, sagte Felix. „Links. Mit Groudon.“<\/p>\n<p>Lina nickte.<\/p>\n<p>„Und übermorgen ich“, sagte sie. „Rechts. Mit Kyogre.“<\/p>\n<p>„Und dann ist Neumond.“<\/p>\n<p>„Dann ist Neumond.“<\/p>\n<p>Felix schlug sein Notizbuch auf. Er schrieb einen Plan für morgen. Drei Schritte, ordentlich nummeriert. Er schrieb ihn sehr sorgfältig.<\/p>\n<p>Caro schaute ihm über die Schulter. Sie sagte nichts. Aber sie lächelte ein bisschen, auf eine Art, die Felix nicht gefiel.<\/p>"}, {"num": "6", "label": "Kapitel 6", "title": "Felix und das Feuer im Fels", "html": "<p>Felix hatte drei Schritte aufgeschrieben.<\/p>\n<p>Erstens: Mit Turtok bis zur Kammer gehen. Zweitens: Groudon herauslassen und den roten Stein zeigen. Drittens: Groudon sagen, dass es bei Neumond wiederkommen soll, und zurückgehen.<\/p>\n<p>Es war ein guter Plan. Er war kurz und klar, und Felix konnte ihn auswendig.<\/p>\n<p>Christoph begleitete ihn bis zur Gabelung. Er hatte Kliklak dabei und eine Taschenlampe und eine Flasche Wasser, die er Felix in die Hand drückte.<\/p>\n<p>„Ich bleibe hier“, sagte er. „Genau hier. Ich gehe keinen Schritt weiter, weil die Höhle mich nicht eingeladen hat. Aber wenn du rufst, bin ich in zehn Sekunden bei dir. Und wenn Kliklak sich komisch verhält, rufe ich dich.“<\/p>\n<p>„Was heißt komisch?“, fragte Felix.<\/p>\n<p>„Das weiß ich erst, wenn es passiert.“ Christoph schob die Brille hoch. „Ich mag solche Antworten auch nicht.“<\/p>\n<p>Felix nickte. Er warf den Ball, und Turtok stand neben ihm im Gang, breit und blau, und schaute neugierig in das rote Licht.<\/p>\n<p>„Komm“, sagte Felix.<\/p>\n<p>Sie gingen nach links.<\/p>\n<p>Der Gang stieg an. Er wurde enger und dann wieder breiter, und die Wände wurden wärmer, und dann heiß. Nach zwanzig Schritten lief Felix der Schweiß in den Nacken. Nach fünfzig Schritten war der Boden so heiß, dass er die Hitze durch die Schuhsohlen spürte.<\/p>\n<p>„Turtok“, sagte er. „Aquaknarre. Auf den Boden. Ganz leicht.“<\/p>\n<p>Turtok richtete eine Kanone nach unten und spritzte. Das Wasser zischte, als es den Stein traf. Dampf stieg auf, weiß und dicht, und hüllte sie ein, und dann war der Boden kühl genug, und sie gingen weiter.<\/p>\n<p>Spritzen. Zischen. Dampf. Weitergehen.<\/p>\n<p>So ging es lange. Felix wusste nicht, wie lange. Er hatte vergessen zu zählen. Das passierte ihm sonst nie.<\/p>\n<p>Dann öffnete sich der Gang.<\/p>\n<p>Die Kammer war rund und so hoch, dass Felix die Decke nicht sehen konnte. In der Mitte lag ein Becken aus schwarzem Stein, und auf dem Grund des Beckens glühte etwas, rot und langsam, wie Glut in einem Kamin, der fast heruntergebrannt ist. Die Wände waren glatt und dunkel, und auf ihnen waren Zeichen. Bilder. Ganz alt.<\/p>\n<p>Felix holte sein Notizbuch heraus. Die Seiten wellten sich in der Hitze. Er schaute auf seinen Plan.<\/p>\n<p>Zweitens: Groudon herauslassen und den roten Stein zeigen.<\/p>\n<p>Er hatte den roten Stein nicht dabei. Die Kiste stand oben bei Wassili, verschlossen. Er hatte geplant, Groudon den Stein zu zeigen, und er hatte vergessen, dass er ihn gar nicht mitnehmen durfte.<\/p>\n<p>Felix stand in der heißen Kammer und starrte auf seinen Plan.<\/p>\n<p>Dann ließ er Groudon trotzdem aus dem Ball.<\/p>\n<p>Groudon erschien mit einem Beben, das Felix bis in die Zähne spürte. Es war riesig, rot und grau, mit Platten auf dem Rücken wie ein Berg, und die Kammer war gerade groß genug für es. Es öffnete die Augen. Es schaute sich um.<\/p>\n<p>Und dann wurde es unruhig.<\/p>\n<p>Es drehte den Kopf hin und her. Es schnaubte, und aus seinen Nasenlöchern kam heiße Luft. Es machte einen Schritt auf das Becken zu, und dann einen Schritt zurück, und dann wieder nach vorn, und der Boden bebte bei jedem Schritt.<\/p>\n<p>„Groudon“, sagte Felix. „Groudon, ruhig. Hör zu. Wir kommen bei Neumond wieder. In drei Tagen. Dann …“<\/p>\n<p>Groudon hörte nicht zu.<\/p>\n<p>Es stampfte. Kleine Steine fielen von der Decke. Turtok zog den Kopf ein Stück in den Panzer.<\/p>\n<p>„Groudon!“, rief Felix. „Hör auf! Bleib stehen!“<\/p>\n<p>Groudon blieb nicht stehen. Es ging um das Becken herum, immer schneller, und das Glühen auf dem Grund wurde heller, und die Luft wurde noch heißer, und Felix stand da mit seinem Notizbuch in der Hand, in dem ein Plan stand, der überhaupt nicht funktionierte.<\/p>\n<p>Er schaute auf die Seite. Erstens. Zweitens. Drittens.<\/p>\n<p>Dann klappte er das Notizbuch zu.<\/p>\n<p>Er steckte es in die Tasche. Er ging zur Wand, weg vom Becken, und setzte sich auf den Boden. Turtok setzte sich neben ihn und spritzte vorsichtig ein bisschen Wasser auf den Stein, damit es nicht so heiß war.<\/p>\n<p>Und Felix hörte auf zu reden.<\/p>\n<p>Er saß einfach da. Er schaute Groudon zu. Er sagte nichts mehr, keine Befehle, keine Erklärungen, keinen Plan. Er tat das, was Lina am ersten Tag der Sommerschule den Kindern beigebracht hatte. Er atmete. Und er merkte, wie Groudon atmete.<\/p>\n<p>Es dauerte lange.<\/p>\n<p>Groudon ging noch zwei Runden um das Becken. Dann eine. Dann blieb es stehen. Es stand an der Wand gegenüber, mit dem Rücken zu Felix, und es schaute auf die Bilder.<\/p>\n<p>Felix stand ganz leise auf. Er ging um das Becken herum. Er stellte sich neben Groudons riesiges Bein und schaute auch auf die Wand.<\/p>\n<p>Auf der Wand war Groudon.<\/p>\n<p>Es war in den Stein geritzt, ganz alt und ganz einfach, mit wenigen Strichen. Aber man erkannte es sofort, den großen Kopf, die Platten auf dem Rücken. Und auf dem Körper des gezeichneten Groudon waren Linien. Lange, geschwungene Linien, die über die Arme liefen und über den Rücken, wie Adern.<\/p>\n<p>Und neben dem gezeichneten Groudon war ein See. Nur ein paar Wellenlinien. Und am Rand des Sees war die Wand abgebrochen, und der Rest des Bildes fehlte.<\/p>\n<p>Groudon hob eine Klaue und legte sie ganz vorsichtig auf die Wand. Genau auf die Stelle, wo das Bild aufhörte.<\/p>\n<p>Und Felix verstand.<\/p>\n<p>Groudon war nicht unruhig, weil es kämpfen wollte. Es war unruhig, weil es etwas suchte. Etwas, das hier gewesen war, am Anfang, und das jetzt fehlte. Es stand vor einer Wand und suchte die andere Hälfte eines Bildes.<\/p>\n<p>Felix legte seine Hand auf Groudons Bein. Es war heiß, aber nicht so heiß, dass es wehtat.<\/p>\n<p>„Ich weiß“, sagte er leise. „Ich weiß, was fehlt. Wir bringen es mit. Bei Neumond. Versprochen.“<\/p>\n<p>Groudon senkte den Kopf. Ganz langsam. Bis sein riesiges Auge direkt neben Felix war.<\/p>\n<p>Und auf Groudons Arm, dort wo Felix' Hand lag, leuchtete für einen Moment eine Linie auf. Ganz schwach, ganz dünn, rot wie die Glut im Becken. So wie die Linien auf dem Bild.<\/p>\n<p>Dann war sie wieder weg.<\/p>\n<p>„Nicht hier“, flüsterte Felix. „Nicht allein. Ich weiß.“<\/p>\n<p>Groudon ging von selbst zurück in den Ball. Felix hatte nicht einmal gefragt.<\/p>\n<p>Als Felix an der Gabelung ankam, saß Christoph auf dem Boden, Kliklak auf dem Knie. Er stand sofort auf.<\/p>\n<p>„Was ist passiert?“, fragte er.<\/p>\n<p>„Mein Plan hat nicht funktioniert“, sagte Felix.<\/p>\n<p>„Ich weiß“, sagte Christoph. „Kliklak hat sich zehn Minuten lang gedreht wie verrückt. Ich wollte schon rufen.“ Er hielt Kliklak hoch. „Und dann hat es plötzlich aufgehört. Ganz ruhig. Fast still. Was hast du da gemacht?“<\/p>\n<p>Felix dachte nach.<\/p>\n<p>„Ich hab mich hingesetzt“, sagte er. „Und zugehört.“<\/p>\n<p>Christoph schaute ihn an. Dann schaute er Kliklak an. Er nahm die Brille ab und putzte sie und setzte sie wieder auf.<\/p>\n<p>„Das kann ich nicht messen“, sagte er. „Aber ich hab gemessen, dass es passiert ist.“<\/p>\n<p>Draußen, vor der alten Tür, saß Lina auf einem Stein und wartete. Sie sprang auf, als Felix herauskam. Sie fragte nichts. Sie schaute ihn nur an.<\/p>\n<p>„Groudon sucht etwas“, sagte Felix. „Auf der Wand ist ein Bild. Die eine Hälfte fehlt.“<\/p>\n<p>„Welche Hälfte?“<\/p>\n<p>„Die mit dem See.“<\/p>\n<p>Lina schaute zur Tür. Dann nach rechts, wo morgen ihr Gang sein würde.<\/p>\n<p>„Vielleicht finde ich die andere Hälfte“, sagte sie.<\/p>\n<p>Am Abend schlug Felix sein Notizbuch auf. Er schaute lange auf den Plan mit den drei Schritten. Er strich ihn nicht durch. Er schrieb nur einen Satz darunter.<\/p>\n<p>Der Plan war falsch. Aber ohne ihn hätte ich nicht gemerkt, dass ich keinen brauche.<\/p>"}, {"num": "7", "label": "Kapitel 7", "title": "Lina und das Wasser im Dunkeln", "html": "<p>Lina hatte keinen Plan.<\/p>\n<p>Sie hatte nie Pläne. Das war Felix' Sache. Lina hatte Geduld, und Geduld war bisher immer genug gewesen. Sie konnte stundenlang warten, bis ein Pokémon von selbst kam. Sie konnte still sitzen, bis die anderen aufgaben. Sie wusste, wann man nichts tun musste.<\/p>\n<p>Aber als sie an der Gabelung stand und in den rechten Gang hinunterschaute, wusste sie zum ersten Mal nicht, ob Warten reichen würde.<\/p>\n<p>Der Gang führte nach unten. Steil. Und unten war Wasser. Man hörte es tropfen und plätschern, und das blaue Licht flackerte auf der Wasseroberfläche, und dahinter war es dunkel.<\/p>\n<p>Sehr dunkel.<\/p>\n<p>„Ich bleibe hier“, sagte Caro. Sie saß auf einem Stein an der Gabelung, Folipurba neben sich und Shaymin auf dem Schoß. „Genau wie Christoph gestern. Wenn du rufst, bin ich da.“<\/p>\n<p>„Kannst du schwimmen?“, fragte Lina.<\/p>\n<p>„Schlecht“, sagte Caro ehrlich. „Aber Folipurba hat lange Ranken.“<\/p>\n<p>Lina nickte. Sie ließ Pikachu aus dem Ball. Pikachu landete auf ihrer Schulter, schaute in den dunklen Gang hinunter, sah das Wasser und machte ein Geräusch, das nicht begeistert klang.<\/p>\n<p>„Ich weiß“, sagte Lina. „Ich auch nicht.“<\/p>\n<p>Sie gingen nach unten.<\/p>\n<p>Der Gang wurde feucht und dann nass. Das Wasser lief an den Wänden herunter, und es war kalt, und Linas Schuhe rutschten. Pikachu hielt sich mit allen vier Pfoten an ihrer Jacke fest. Nach dreißig Schritten stand Lina bis zu den Knöcheln im Wasser. Nach vierzig bis zu den Knien.<\/p>\n<p>Dann hörte der Gang auf.<\/p>\n<p>Vor ihr lag ein See. Ein See mitten im Berg. Er war schwarz und still, und das blaue Licht kam von irgendwo tief darunter, ganz schwach, und an den Wänden ringsum glitzerten Tropfen. Wie weit der See reichte, konnte man nicht sehen. Die Dunkelheit fing einfach an und hörte nicht mehr auf.<\/p>\n<p>Lina stand am Rand und schaute.<\/p>\n<p>Pikachu fing ganz leise an zu leuchten. Nicht mit Blitzen, nur die roten Backen, die ein wenig knisterten und einen kleinen gelben Schein auf Linas Gesicht warfen. Es war nicht viel Licht. Aber es war besser als nichts.<\/p>\n<p>„Danke“, flüsterte Lina.<\/p>\n<p>Dann ließ sie Kyogre aus dem Ball.<\/p>\n<p>Kyogre glitt ins Wasser, als hätte es sein ganzes Leben auf diesen See gewartet. Es war riesig und blau, und an seinen Flossen waren rote Streifen, und als es auftauchte, hob sich das Wasser in einer langen, langsamen Welle, die bis an Linas Knie schwappte.<\/p>\n<p>Kyogre schaute sie an. Dann drehte es sich zur Dunkelheit hin.<\/p>\n<p>Dann schaute es sie wieder an.<\/p>\n<p>„Du willst, dass ich mitkomme“, sagte Lina.<\/p>\n<p>Kyogre schob sich ganz nah an den Rand. So nah, dass Lina nur einen Schritt machen musste, um auf seinen Rücken zu steigen.<\/p>\n<p>Sie machte den Schritt nicht.<\/p>\n<p>Sie stand am Rand, und ihr Herz klopfte, und sie schaute in die Dunkelheit. Bis jetzt hatte Lina immer gewusst, wo sie war. Wenn sie wartete, wartete sie an einem Ort, den sie kannte. Am Zaun einer Weide. An einem Ufer. Sie konnte sehen, was kam.<\/p>\n<p>Hier konnte sie nichts sehen.<\/p>\n<p>„Ich kann nicht“, flüsterte sie. „Ich weiß nicht, wohin.“<\/p>\n<p>Kyogre wartete.<\/p>\n<p>Es wartete so, wie Lina immer gewartet hatte. Ganz still. Ohne zu drängen. Und während es wartete, merkte Lina etwas. Sie merkte, dass Kyogre genau das tat, was sie sonst tat. Es fragte. Es sagte: Du musst nicht.<\/p>\n<p>Lina musste fast lachen, so überrascht war sie.<\/p>\n<p>„Du machst das mit mir“, sagte sie. „Was ich immer mit den anderen mache.“<\/p>\n<p>Kyogre blinzelte.<\/p>\n<p>Lina holte tief Luft. Pikachu drückte sich an ihren Hals.<\/p>\n<p>Dann stieg sie auf Kyogres Rücken.<\/p>\n<p>Es war glatt und kühl und viel breiter, als sie gedacht hatte. Sie setzte sich hin und legte beide Hände flach auf die Haut. Kyogre wartete noch einen Moment, bis sie richtig saß.<\/p>\n<p>Dann schwamm es los, in die Dunkelheit.<\/p>\n<p>Lina sah nichts. Nur Pikachus kleinen gelben Schein und das Wasser, das schwarz an ihnen vorbeiglitt. Sie wusste nicht, ob sie nach links schwammen oder nach rechts, ob es tief unter ihnen war oder flach. Sie wusste nichts.<\/p>\n<p>Und nach einer Weile hörte sie auf, es wissen zu wollen.<\/p>\n<p>Sie spürte Kyogres Atem unter ihren Händen, langsam und gleichmäßig. Sie spürte, wie es um etwas herumschwamm, ganz vorsichtig, und dann weiter. Es wusste, wohin. Lina musste es nicht wissen. Sie musste nur sitzen bleiben.<\/p>\n<p>Dann hielt Kyogre an.<\/p>\n<p>Vor ihnen war eine Wand. Pikachu beugte sich vor und leuchtete ein bisschen heller, und Lina sah, dass auf der Wand Bilder waren. In den Stein geritzt. Ganz alt.<\/p>\n<p>Kyogre war darauf.<\/p>\n<p>Mit wenigen Strichen, aber man erkannte es sofort, die großen Flossen, das breite Maul. Und auf dem Körper des gezeichneten Kyogre waren Linien. Lange, geschwungene Linien, wie Adern aus Licht.<\/p>\n<p>Neben dem gezeichneten Kyogre war ein Berg. Nur ein paar Zacken, aber es war ein Berg. Und dahinter, am Rand, war die Wand abgebrochen.<\/p>\n<p>Lina hielt den Atem an.<\/p>\n<p>Sie legte die Hand auf die Wand. Genau an die Stelle, wo das Bild aufhörte.<\/p>\n<p>Der Stein war warm.<\/p>\n<p>Nicht kühl wie alles andere hier unten. Warm, wie ein Ofen, der auf der anderen Seite einer Mauer steht. So warm wie der Fels neben der alten Tür.<\/p>\n<p>„Felix“, flüsterte Lina. „Felix ist da drüben.“<\/p>\n<p>Und dann verstand sie.<\/p>\n<p>Es waren nicht zwei Bilder. Es war ein Bild. Ein einziges, großes, das quer durch die Wand ging, durch den Berg hindurch, von Groudons Kammer bis hierher. Auf der einen Seite Groudon mit dem See. Auf der anderen Seite Kyogre mit dem Berg. Und dazwischen der Fels, der irgendwann einmal gebrochen war.<\/p>\n<p>Am Anfang hatten sie nebeneinander gestanden. Nicht gegeneinander. Nebeneinander.<\/p>\n<p>Kyogre schob seinen Kopf an die Wand, an die warme Stelle. Und auf seiner Flosse, genau neben Linas Hand, leuchtete eine Linie auf. Ganz dünn. Ganz blau.<\/p>\n<p>Dann erlosch sie wieder.<\/p>\n<p>„Nicht hier“, flüsterte Lina. „Nicht allein.“<\/p>\n<p>Kyogre drehte sich um und schwamm zurück. Auf halbem Weg bemerkte Lina etwas, das sie auf dem Hinweg nicht gesehen hatte. Links von ihnen, tief unten im Wasser, war ein heller Fleck. Grünlich. Wie Tageslicht.<\/p>\n<p>„Was ist das?“, fragte sie.<\/p>\n<p>Kyogre schwamm ein Stück darauf zu, damit sie es sehen konnte. Es war ein Loch im Fels, unter Wasser, groß genug für ein Boot. Und durch das Loch schimmerte der Kratersee. Der See der Stadt. Mit der Sonne darüber.<\/p>\n<p>„Ein zweiter Eingang“, sagte Lina langsam. „Von unten. Vom See aus.“<\/p>\n<p>Sie dachte an das Periskop mit den Ohren.<\/p>\n<p>Als sie zurück an der Gabelung war, sprang Caro auf. Lina war nass bis zum Bauch, ihre Haare tropften, und Pikachu saß auf ihrem Kopf und schüttelte sich.<\/p>\n<p>„Die beiden Bilder sind eins“, sagte Lina. „Groudon und Kyogre. Nebeneinander. Und es gibt einen zweiten Eingang. Unter Wasser. Direkt vom See.“<\/p>"}, {"num": "8", "label": "Kapitel 8", "title": "Nachtwache", "html": "<p>„Ein zweiter Eingang“, sagte Wassili.<\/p>\n<p>Sie saßen alle in seiner Küche im Oberdorf, und auf dem Tisch stand die Kiste. Draußen wurde es dunkel. Es war die vorletzte Nacht vor Neumond.<\/p>\n<p>„Unter Wasser“, sagte Lina. „Groß genug für ein Boot.“<\/p>\n<p>„Das wusste ich nicht“, sagte Wassili langsam. „Ich lebe seit vierzig Jahren hier. Das wusste ich nicht.“<\/p>\n<p>„Dann wissen die es vielleicht auch nicht“, sagte Christoph.<\/p>\n<p>„Die haben ein Periskop“, sagte Felix. „Die schauen sich seit zwei Nächten alles an.“<\/p>\n<p>Es war still in der Küche.<\/p>\n<p>Dann sagte Caro etwas, das niemand erwartet hatte.<\/p>\n<p>„Letzte Nacht ist das Wasser weniger gesunken“, sagte sie. „Ich hab es heute früh an den Wänden gesehen. Nicht eine Handbreit. Nur drei Finger.“<\/p>\n<p>„Warum?“, fragte Lina.<\/p>\n<p>„Weil die Steine näher an der Höhle waren“, sagte Christoph plötzlich. Er stand auf und ging zum Fenster und schaute hinunter auf den See. „Gestern hatte Wassili die Kiste unten in der Arena. Direkt neben der Tür. Vorher war sie hier oben.“ Er drehte sich um. „Kliklak hat sich in der Nacht langsamer gedreht. Ich hab es aufgeschrieben.“<\/p>\n<p>„Die Höhle wird ruhiger, wenn die Steine nah sind“, sagte Felix.<\/p>\n<p>Wassili schaute die Kiste lange an.<\/p>\n<p>„Dann stellen wir sie hinein“, sagte er. „An die Gabelung. Hinter die Tür. Ich verriegle die Tür, und vor der Tür wacht jemand.“<\/p>\n<p>„Und der zweite Eingang?“, fragte Lina.<\/p>\n<p>„Der zweite Eingang führt in den See im Berg“, sagte Wassili. „Von dort bis zur Gabelung muss man durch Kyogres ganzen Gang. Im Dunkeln. Gegen das Wasser.“ Er schüttelte den Kopf. „Das schafft niemand, der den Weg nicht kennt.“<\/p>\n<p>Lina sagte nichts. Aber sie dachte an das Periskop.<\/p>\n<p>Um zehn trugen sie die Kiste hinunter. Wassili stellte sie an die Gabelung, genau in die Mitte, zwischen den roten und den blauen Gang. Kaum stand sie dort, wurde das Licht aus beiden Gängen ein kleines bisschen ruhiger. Weniger flackernd.<\/p>\n<p>Dann verriegelte Wassili die Tür.<\/p>\n<p>Vor der Tür setzte sich Nachtara hin. Auf dem Felsen darüber landete Noctuh. Sie schauten sich kurz an, das schwarze und das braune Pokémon, und dann schauten beide in die Nacht.<\/p>\n<p>„Nachtara sieht im Dunkeln“, sagte Christoph. „Und seine Ringe leuchten, wenn es in Gefahr ist. Dann sehe ich das von oben.“<\/p>\n<p>„Noctuh hört alles“, sagte Caro. „Wenn irgendwo ein Tropfen fällt, den es nicht kennt, weckt es mich.“<\/p>\n<p>Felix und Lina gingen nicht ins Bett. Sie setzten sich ans Fenster ihres Zimmers, mit Decken um die Schultern, und schauten hinunter auf den dunklen See. Rotom schwebte neben ihnen und hatte den Bildschirm ganz dunkel gestellt, damit man es von unten nicht sah.<\/p>\n<p>„Bzzt“, flüsterte es. „Ich bin ganz leise.“<\/p>\n<p>„Du bist sehr gut darin“, flüsterte Lina.<\/p>\n<p>Um Mitternacht passierte nichts.<\/p>\n<p>Um eins passierte nichts.<\/p>\n<p>Um zwei schlief Felix ein, den Kopf auf dem Fensterbrett.<\/p>\n<p>Um zehn nach zwei schrie Noctuh.<\/p>\n<p>Es war ein lauter, schriller Schrei, und er hallte von den Felswänden wider, rund um den ganzen Krater. Felix fuhr hoch. Lina war schon an der Tür. Unten am See, vor der Arena, leuchteten Nachtaras gelbe Ringe auf, hell wie Laternen.<\/p>\n<p>Sie rannten die Treppen hinunter. Hinter ihnen rannten Caro und Christoph. Wassili kam mit einer Laterne aus seinem Haus, im Bademantel, mit nackten Füßen.<\/p>\n<p>Sie fuhren mit dem kleinen Boot zur Arena hinüber, und es dauerte viel zu lange, und Felix zog mit am Seil, so fest er konnte.<\/p>\n<p>Die Tür war noch verriegelt.<\/p>\n<p>Nachtara stand davor und knurrte. Noctuh saß auf dem Felsen und hatte die Federn gesträubt. Beide schauten nicht auf die Tür. Sie schauten auf den Fels daneben, und durch den Fels hörte man es.<\/p>\n<p>Stimmen. Von drinnen.<\/p>\n<p>„Sie sind durch den See gekommen“, sagte Lina. „Durch den zweiten Eingang.“<\/p>\n<p>Wassili riss den Balken zurück. Die Tür flog auf.<\/p>\n<p>An der Gabelung, im roten und blauen Licht, standen drei Gestalten. Sie waren nass von Kopf bis Fuß. Sie trugen Taucherbrillen und Schwimmflossen, und eine von ihnen hatte eine Schnorchelmaske, die viel zu groß war und zwei Löcher für Ohren hatte.<\/p>\n<p>Sie hatten die Kiste aufgemacht.<\/p>\n<p>„Wer taucht herauf aus tiefem See?“, rief Jessie und warf die Taucherbrille ab.<\/p>\n<p>„Wer schnappt sich Steine, eins, zwei, juchhe?“, rief James und zog die Flossen aus.<\/p>\n<p>„Mauzi, genau! Mit nassem Zeh!“, rief Mauzi und schüttelte sich das Wasser aus dem Fell.<\/p>\n<p>„Team Rocket“, sagte Felix.<\/p>\n<p>„Ihr seid zu spät“, sagte Jessie und lächelte. „Dieser schöne, runde Tunnel unter dem See. Wir haben ihn vorgestern gefunden. Mit unserem Periskop. Und die kleine Lina hat uns heute Mittag freundlicherweise gezeigt, wie man hindurchkommt.“<\/p>\n<p>Lina wurde ganz weiß.<\/p>\n<p>„Wir sind hinter euch hergeschwommen“, sagte James. „Mit Abstand. Ganz leise. Euer großes Kyogre macht sehr schöne Wellen. Man kann ihnen gut folgen.“<\/p>\n<p>Mauzi hatte den roten Stein. Er hielt ihn mit beiden Pfoten fest an die Brust gedrückt. James hatte den blauen.<\/p>\n<p>„Gebt sie her“, sagte Wassili. Seine Stimme war ganz ruhig und ganz kalt.<\/p>\n<p>„Nö“, sagte Mauzi.<\/p>\n<p>„Noctuh“, sagte Caro leise. „Hypnose. Nur den mit den lila Haaren.“<\/p>\n<p>Noctuh breitete die Flügel aus. Seine Augen leuchteten auf, rot und dann gelb, in Kreisen, die sich drehten. James schaute hinein, nur einen Moment. Dann gähnte er.<\/p>\n<p>„Oh“, sagte er. „Ich bin plötzlich so …“<\/p>\n<p>Er fiel um. Einfach so, wie ein Brett, mitten in den blauen Gang. Der blaue Stein rollte aus seiner Hand, über den Boden, und Lina machte einen Satz nach vorn und fing ihn auf, bevor er ins Wasser rollen konnte.<\/p>\n<p>„James!“, schrie Jessie.<\/p>\n<p>„Lass ihn!“, rief Mauzi. „Wir haben den roten! Weg hier!“<\/p>\n<p>Jessie packte den schlafenden James am Kragen. Mauzi hielt den roten Stein fest. Und dann sprangen sie in den blauen Gang, alle drei, Jessie zog James hinter sich her wie einen nassen Sack, und sie rutschten den nassen Fels hinunter, bis zum See im Berg, und dann hörte man nur noch ein Platschen.<\/p>\n<p>„Garados!“, rief Felix und griff nach dem Ball.<\/p>\n<p>„Nicht!“, rief Wassili. „Nicht im Dunkeln! Du findest den Weg nicht!“<\/p>\n<p>Felix ließ den Ball sinken.<\/p>\n<p>Unten im See im Berg hörte man einen Motor anspringen. Ein leises, hohes Surren. Dann wurde es leiser. Und leiser. Dann war es weg.<\/p>\n<p>Lina stand an der Gabelung, den blauen Stein in beiden Händen.<\/p>\n<p>Er leuchtete.<\/p>\n<p>Er leuchtete so hell wie noch nie, blau und kalt, und er wurde immer kälter, so kalt, dass ihre Finger wehtaten. In ihrer Jackentasche fing Kyogres Ball an zu zittern.<\/p>\n<p>„Lina“, sagte Felix. „Leg ihn hin.“<\/p>\n<p>Lina legte ihn in die Kiste. Er hörte nicht auf zu leuchten.<\/p>\n<p>Aus dem blauen Gang kam ein Geräusch. Ein tiefes, langsames Rauschen. Das Wasser im See im Berg stieg an. Man hörte es gegen die Wände schlagen.<\/p>\n<p>Und draußen, über dem Krater, wo eben noch der Sternenhimmel gewesen war, zog eine Wolke auf. Sie war schwarz und schwer und kam von allen Seiten gleichzeitig, und sie schloss den runden Fleck aus Himmel wie ein Deckel.<\/p>\n<p>Der erste Tropfen fiel auf Felix' Hand.<\/p>\n<p>Dann der zweite.<\/p>\n<p>Dann fing es an zu regnen.<\/p>"}, {"num": "9", "label": "Kapitel 9", "title": "Ein Stein allein", "html": "<p>Es regnete nicht wie sonst.<\/p>\n<p>Es regnete, als hätte jemand den Himmel umgedreht. Die Tropfen waren dick und schwer und fielen so dicht, dass man die Arena nicht mehr sah, obwohl sie nur ein paar Meter entfernt war. Sie trommelten auf das Glasdach und auf die Felsen und auf das Boot, und das Boot lief voll, während Felix und Wassili noch am Seil zogen.<\/p>\n<p>Als sie am Ufer ankamen, standen sie bis zu den Knöcheln im Wasser.<\/p>\n<p>„Das war vorhin trocken“, sagte Wassili. „Das war die unterste Stufe der Treppe.“<\/p>\n<p>Felix schaute auf die Felswände. Der helle Ring, der Badewannenrand, den er am ersten Tag gesehen hatte, war verschwunden. Nicht weil das Wasser gesunken war. Weil es gestiegen war. Der See stand schon darüber.<\/p>\n<p>„Rotom“, sagte Lina. „Wie schnell steigt es?“<\/p>\n<p>Rotom kam aus ihrer Kapuze gekrochen, wo es sich vor dem Regen versteckt hatte.<\/p>\n<p>„Bzzt. Ich messe … zwei Zentimeter. In einer Minute. Bzzt. Jetzt zweieinhalb.“<\/p>\n<p>„Und wie lange, bis es an den ersten Häusern ist?“<\/p>\n<p>Rotom drehte sich. Auf seinem Bildschirm erschien eine Karte vom Krater, und ganz unten, am Ufer, leuchteten ein paar Häuser rot.<\/p>\n<p>„Bzzt. Die Unterstadt. Zwölf Häuser. Ungefähr … vierzig Minuten.“<\/p>\n<p>Wassili drehte sich sofort um.<\/p>\n<p>„Ich wecke die Leute“, sagte er. „Alle nach oben. Ins Oberdorf.“<\/p>\n<p>Er rannte die Treppe hinauf, mit der Laterne in der Hand, und man hörte ihn an Türen klopfen und rufen. Fenster gingen auf. Lichter gingen an.<\/p>\n<p>Christoph stand am Ufer und schaute auf das Wasser. Er hatte Kliklak in beiden Händen, und Kliklak drehte sich, und es drehte sich nur in eine Richtung, schnell und gleichmäßig, wie eine Pumpe.<\/p>\n<p>„Ich hab mich verrechnet“, sagte er leise.<\/p>\n<p>Felix schaute ihn an.<\/p>\n<p>„Ich hab gedacht, ein Stein allein tut nichts“, sagte Christoph. „Ich hab gedacht, sie funktionieren nur zusammen. Wie zwei Hälften von einem Schlüssel. Ich hab es sogar aufgeschrieben.“ Er schüttelte den Kopf. „Aber ein Stein allein tut etwas. Er tut nur das Falsche. Der blaue zieht, und nichts zieht dagegen.“<\/p>\n<p>Er nahm die Brille ab. Sie war nass, und er putzte sie nicht.<\/p>\n<p>„Es tut mir leid“, sagte er. „Ich hätte das wissen müssen.“<\/p>\n<p>„Das konnte niemand wissen“, sagte Caro. Sie war neben ihn getreten, die Kapuze ihres Pullovers über dem Kopf. „Nicht mal Rotom.“<\/p>\n<p>„Bzzt. Nein. Stand nirgends.“<\/p>\n<p>In Linas Tasche zitterte Kyogres Ball. Es war kein großes Zittern, nur ein feines, ständiges Beben, wie bei einem Handy, das klingelt und klingelt. Lina legte die Hand darauf.<\/p>\n<p>„Kyogre will raus“, sagte sie.<\/p>\n<p>„Lass es drin“, sagte Felix sofort.<\/p>\n<p>„Ich weiß.“ Lina hielt den Ball fest. „Es will nicht kämpfen. Es will helfen. Aber wenn es jetzt rauskommt, mit dem blauen Stein so nah, dann regnet es noch mehr.“<\/p>\n<p>Sie sprach leise mit dem Ball, so wie sie mit Pokémon sprach, die Angst hatten. Das Zittern wurde ein bisschen schwächer.<\/p>\n<p>Felix griff in seine eigene Tasche. Groudons Ball war warm. Nicht heiß, wie in der Höhle, aber warm. Ruhig.<\/p>\n<p>„Groudon könnte den Regen aufhören lassen“, sagte Christoph plötzlich. „Es macht die Sonne. Wenn es hier draußen …“<\/p>\n<p>„Nein“, sagte Felix.<\/p>\n<p>Christoph schaute ihn an.<\/p>\n<p>„Nicht allein“, sagte Felix. „Nicht hier. Wenn Groudon jetzt gegen den Regen kämpft, dann kämpft es gegen Kyogre. Dann ist es wieder wie früher. Einer gegen den anderen.“ Er schaute auf seinen Ball. „Genau das soll nicht mehr passieren.“<\/p>\n<p>Christoph sagte eine Weile nichts. Dann nickte er.<\/p>\n<p>„Du hast recht“, sagte er. „Ich hab schon wieder gerechnet statt nachgedacht.“<\/p>\n<p>Das Wasser stand jetzt an der zweiten Stufe.<\/p>\n<p>Lina schaute die Treppe hinauf, zur Unterstadt. Die ersten Leute kamen heraus, in Mänteln und Hausschuhen, mit Kindern auf dem Arm, und gingen nach oben. Aber die Häuser blieben. Die Möbel, die Bilder, die Blumenkästen mit den müden Blumen. Das Wasser würde in vierzig Minuten in die Häuser laufen.<\/p>\n<p>„Wir müssen es aufhalten“, sagte Lina. „Nicht den Regen. Nur das Wasser. Nur bis morgen.“<\/p>\n<p>Sie griff in die andere Tasche und holte einen Ball heraus. Und dann hob sie das Handgelenk, an dem ihr Armband war.<\/p>\n<p>„Diancie“, sagte sie.<\/p>\n<p>Diancie kam aus dem Ball, klein und rosa und weiß, mit dem großen Stein auf der Stirn, und schaute sich im Regen um. Es sah das Wasser. Es sah die Häuser. Es sah Lina.<\/p>\n<p>„Wir müssen eine Wand bauen“, sagte Lina. „Eine ganz lange. Am Ufer entlang, vor den Häusern. Eine, die das Wasser hält.“<\/p>\n<p>Diancie nickte.<\/p>\n<p>Lina schaute Felix an.<\/p>\n<p>„Wir zählen“, sagte Felix.<\/p>\n<p>„Eins“, sagte Lina. „Zwei. Drei.“<\/p>\n<p>Sie berührte den Schlüsselstein an ihrem Armband. Er war kühl, wie immer, und wurde in dem Moment warm, in dem sie ihn berührte.<\/p>\n<p>„Diancie. Mega-Entwicklung.“<\/p>\n<p>Ein Faden aus Licht spannte sich zwischen dem Armband und Diancie, hell und rosa, mitten durch den Regen. Das Licht lief über Diancie, vom Kopf bis zu den Füßen, und Diancie wuchs. Es bekam ein Kleid aus Kristall, das sich weit ausbreitete, und Haare aus Diamant, die in alle Richtungen funkelten, und als das Licht verlosch, schwebte Mega-Diancie über dem Wasser, und der Regen, der auf seine Kristalle fiel, glitzerte wie Sterne.<\/p>\n<p>„Jetzt“, sagte Lina. „Die Wand.“<\/p>\n<p>Mega-Diancie hob beide Arme.<\/p>\n<p>Aus dem Boden am Ufer stiegen Kristalle. Erst einer, dann zehn, dann hundert. Sie wuchsen schnell, wie Eis an einer Fensterscheibe im Winter, flach und rund und dicht aneinander, und sie wuchsen hoch. Kniehoch. Hüfthoch. Brusthoch. Sie liefen am Ufer entlang, vor der Unterstadt, von einer Felswand bis zur anderen, und als Mega-Diancie die Arme sinken ließ, stand dort eine Mauer aus rosa schimmerndem Kristall, so lang wie eine ganze Straße.<\/p>\n<p>Das Wasser schwappte dagegen. Es stieg an der Mauer hoch. Aber es kam nicht hindurch.<\/p>\n<p>„Sie hält“, flüsterte Caro.<\/p>\n<p>Dann knackte es.<\/p>\n<p>Nicht laut. Aber deutlich. Ganz in der Mitte der Mauer, dort, wo das Wasser am stärksten drückte, lief ein feiner Riss durch den Kristall. Ein Tropfen kam hindurch. Dann noch einer.<\/p>\n<p>Mega-Diancie streckte die Arme wieder aus. Der Riss schloss sich. Aber Lina sah, dass Diancie zitterte.<\/p>\n<p>„Es ist zu viel Wasser“, sagte sie. „Die Mauer ist stark. Aber das Wasser ist schwer. Es drückt und drückt.“<\/p>\n<p>„Dann braucht die Mauer etwas, das dagegen drückt“, sagte Christoph.<\/p>\n<p>Er zog einen alten, zerkratzten Ball aus der Tasche.<\/p>\n<p>Er warf ihn nicht. Er legte ihn auf seine flache, offene Hand und hielt ihn in den Regen.<\/p>\n<p>„Relaxo“, sagte er. „Ich weiß, es ist mitten in der Nacht. Ich weiß, es regnet. Du musst nicht.“<\/p>\n<p>Der Ball öffnete sich von selbst.<\/p>\n<p>Relaxo erschien auf der Treppe, hinter der Kristallmauer, und der Boden bebte. Es schaute sich um. Es schaute auf den Regen und auf das Wasser und auf die Mauer, in der gerade wieder ein feiner Riss lief.<\/p>\n<p>Dann gähnte es.<\/p>\n<p>Und dann legte es sich hin. Genau hinter die Mauer. Mit dem ganzen breiten Rücken dagegen, mit allen vierhundertsechzig Kilo, und schloss die Augen.<\/p>\n<p>Der Riss hörte auf zu wachsen.<\/p>\n<p>Mega-Diancie ließ die Arme ein bisschen sinken und atmete aus. Lina legte Diancie eine Hand auf den Kristall.<\/p>\n<p>„Danke“, sagte sie. „Du kannst dich ausruhen. Relaxo hält.“<\/p>\n<p>„Relaxo hält immer“, sagte Christoph. Seine Stimme klang komisch. „Wenn es sich einmal hingelegt hat, steht es nicht mehr auf. Das ist das Einzige, worauf ich mich bei Relaxo verlassen kann.“<\/p>\n<p>Das Wasser stieg noch eine Weile. Dann stand es an der Mauer und stieg nicht weiter. Es regnete weiter, schwer und laut. Aber die Unterstadt blieb trocken.<\/p>\n<p>Sie saßen die ganze Nacht auf der Treppe. Wassili brachte Decken und eine Kanne Tee. Die Leute aus der Unterstadt kamen herunter und schauten sich die Mauer an und das schlafende Relaxo dahinter, und ein kleines Mädchen legte eine Blume auf Relaxos Bauch.<\/p>\n<p>Felix schrieb nichts. Sein Notizbuch war zu nass.<\/p>\n<p>Gegen Morgen, als es hinter den Wolken langsam grau wurde, schaute Lina nach oben.<\/p>\n<p>Über dem Krater, über den schwarzen Regenwolken, war ein Licht. Grün. Es zog einen langen, langsamen Bogen. Einmal ganz um den Krater herum.<\/p>\n<p>Und dann noch einmal.<\/p>"}, {"num": "10", "label": "Kapitel 10", "title": "Das Grüne über dem Krater", "html": "<p>Es kam durch die Wolken herunter, als es hell wurde.<\/p>\n<p>Zuerst war es nur ein Schatten, lang und schmal. Dann wurde es deutlicher. Ein Körper wie ein Band, grün wie junges Gras, mit gelben Zeichen darauf und langen Flossen, die sich in der Luft bewegten wie im Wasser. Es glitt durch den Regen, ohne nass zu werden, so schien es, und es zog seinen Kreis über dem Krater, ganz langsam, ganz hoch.<\/p>\n<p>Niemand auf der Treppe sagte ein Wort.<\/p>\n<p>„Bzzt“, flüsterte Rotom schließlich, sehr leise. „Rayquaza. Drache und Flug. Es lebt hoch in der Luft, über den Wolken. Es heißt, es ist in der Urzeit gekommen, als Groudon und Kyogre gegeneinander gekämpft haben. Und es hat sie getrennt.“<\/p>\n<p>Wassili stand neben ihnen. Er hatte die ganze Nacht nicht geschlafen.<\/p>\n<p>„Die alten Leute sagen“, sagte er, „dass Rayquaza jedes Mal kommt, wenn Groudon und Kyogre die Welt aus dem Gleichgewicht bringen. Und dass es nicht wieder geht, bis das Gleichgewicht zurück ist.“<\/p>\n<p>Rayquaza kam ein Stück tiefer. Es schaute hinunter. Es schaute auf die Mauer aus Kristall und auf den See und auf die Arena.<\/p>\n<p>Und dann schaute es auf Felix und Lina.<\/p>\n<p>Felix spürte den Blick wie einen Wind. Er war nicht böse. Er war nicht freundlich. Er war wie der Blick von jemandem, der sehr alt ist und sehr viel gesehen hat und jetzt wissen will, was als Nächstes passiert.<\/p>\n<p>„Es greift nicht an“, sagte Christoph leise.<\/p>\n<p>„Nein“, sagte Caro. Sie hatte die ganze Zeit hinaufgeschaut. „Es wartet.“<\/p>\n<p>„Worauf?“<\/p>\n<p>Caro antwortete nicht gleich. Sie schaute Rayquaza an, so wie sie Kronjuwild ansah, wenn das Geweih etwas Neues zeigte.<\/p>\n<p>„Darauf, ob die beiden wieder gegeneinander stehen“, sagte sie. „Dann greift es ein. Und wenn sie zusammenstehen, dann muss es gar nichts tun.“<\/p>\n<p>Felix schaute auf Groudons Ball. Lina schaute auf Kyogres Ball.<\/p>\n<p>„Dann müssen wir den roten Stein zurückholen“, sagte Felix. „Bevor irgendwer auf die Idee kommt, dass Groudon gegen den Regen kämpfen soll.“<\/p>\n<p>„Aber wo ist er?“, fragte Lina. „Sie sind durch den Tunnel. Sie sind draußen auf dem Meer. Im Sturm.“<\/p>\n<p>Lina holte einen Ball heraus.<\/p>\n<p>„Voltrean“, sagte sie.<\/p>\n<p>Voltrean kam heraus und schüttelte sich. Es war ein Seevogel, gelb und weiß, mit Flügeln, an deren Rändern kleine Funken liefen. Es schaute in den Regen hinauf, in die schwarzen Wolken, und seine Augen leuchteten.<\/p>\n<p>„Voltrean liebt Gewitter“, sagte Lina. „Es reitet auf dem Wind. Und es sammelt Strom in seinem Kehlsack, wenn es blitzt. Es merkt, wo die Blitze einschlagen.“ Sie schaute Felix an. „Und Blitze schlagen in Metall ein. In Antennen. In ein Periskop.“<\/p>\n<p>„Rotom“, sagte Felix. „Blitzt es draußen?“<\/p>\n<p>„Bzzt! Über dem Meer! Östlich vom Krater! Viele Blitze!“<\/p>\n<p>Lina legte Voltrean die Hand auf den Rücken.<\/p>\n<p>„Such sie“, sagte sie. „Such die Blitze, die in etwas Rundes mit Ohren einschlagen.“<\/p>\n<p>Voltrean schrie einmal, laut und hell, und schoss nach oben. Es flog geradewegs durch den Regen, an Rayquaza vorbei, das nur kurz den Kopf drehte, und über den Kraterrand. Dann war es weg.<\/p>\n<p>Sie warteten.<\/p>\n<p>Zwei Minuten. Fünf. Felix zählte nicht. Er hatte es sich abgewöhnt, seit der Höhle.<\/p>\n<p>Dann kam Voltrean zurück. Es kreiste einmal über Lina und flog dann wieder los, nach Osten, langsam, und schaute sich um, ob jemand folgte.<\/p>\n<p>„Es hat sie gefunden“, sagte Lina.<\/p>\n<p>Caro ließ Dragoran aus dem Ball.<\/p>\n<p>„Ich fliege“, sagte sie. „Lina, du kommst mit. Und Pikachu.“<\/p>\n<p>„Und ich schwimme“, sagte Felix.<\/p>\n<p>„Im Sturm?“, fragte Christoph. „Draußen? Auf dem offenen Meer?“<\/p>\n<p>„Mit Garados“, sagte Felix. Er hob das Handgelenk. „Und nicht mit irgendeinem.“<\/p>\n<p>Christoph schaute ihn an. Dann auf das Armband. Dann nickte er.<\/p>\n<p>„Ich bleibe bei Relaxo“, sagte er. „Und bei der Mauer. Und beim blauen Stein. Und ich rufe Birk an und erzähle ihm alles, damit er sich Sorgen macht, und nicht ich.“<\/p>\n<p>„Bzzt! Ich wähle schon!“<\/p>\n<p>Felix tauchte mit Garados durch den Tunnel. Es war dunkel und laut, und die Strömung war stark, viel stärker als beim ersten Mal. Bei zwanzig waren sie draußen.<\/p>\n<p>Draußen war das Meer grau und wild. Die Wellen waren so hoch wie Häuser, und der Wind riss die Schaumkronen ab und warf sie Felix ins Gesicht. Garados kämpfte sich durch die erste Welle. Die zweite warf es zur Seite. Die dritte drückte es unter Wasser, und Felix hielt sich mit aller Kraft an den Hörnern fest.<\/p>\n<p>Als sie wieder auftauchten, hustete er.<\/p>\n<p>„Garados“, sagte er. „Wir schaffen das nicht so. Nicht bei diesen Wellen.“<\/p>\n<p>Garados schaute ihn an, über die Schulter, mit seinem großen, ernsten Auge.<\/p>\n<p>Felix berührte den Schlüsselstein an seinem Armband. Er war kühl. Und dann warm.<\/p>\n<p>„Garados. Mega-Entwicklung.“<\/p>\n<p>Der Faden aus Licht spannte sich durch den Sturm. Garados wurde größer. Seine Schuppen wurden dunkler, fast schwarz, und an den Seiten wuchsen ihm große Flossen, und seine Hörner wurden länger und schärfer, und als das Licht verlosch, brüllte Mega-Garados so laut, dass das Brüllen über die Wellen rollte wie Donner.<\/p>\n<p>Die nächste Welle kam. Mega-Garados schwamm einfach hindurch. Als wäre sie gar nicht da.<\/p>\n<p>Über ihnen flog Dragoran, mit Caro und Lina auf dem Rücken. Pikachu saß vor Lina und hielt sich an ihren Fingern fest. Und noch weiter vorn flog Voltrean, und vor Voltrean schlug ein Blitz ins Meer. Und noch einer. Genau an derselben Stelle.<\/p>\n<p>Dort ragte etwas aus dem Wasser. Ein dünner Stab. Oben drauf etwas Rundes mit zwei Spitzen.<\/p>\n<p>Das Periskop.<\/p>\n<p>Mega-Garados schwamm darauf zu. Unter der Oberfläche sah Felix jetzt das Tauchboot. Es war rund und hatte Ohren und ein Fenster, das aussah wie ein Gesicht, und es schaukelte hilflos in der Strömung. Aus einer Ritze in der Luke stieg Dampf.<\/p>\n<p>Dann ging die Luke auf.<\/p>\n<p>Jessie steckte den Kopf heraus. Sie war rot im Gesicht, und ihr Haar klebte ihr an der Stirn.<\/p>\n<p>„Es ist so heiß hier drin!“, schrie sie. „Warum ist es so heiß?!“<\/p>\n<p>„Der Stein!“, schrie James von unten. Er war offenbar wieder wach. „Der Stein wird immer heißer! Seit wir draußen auf dem Meer sind!“<\/p>\n<p>„Er will zurück“, sagte Felix leise. Er sagte es zu sich selbst. „Er will zu Groudon.“<\/p>\n<p>Dann sah Jessie ihn. Und das Mega-Garados. Und das Dragoran darüber, und Pikachu, und Voltrean, und hinter allem, ganz hoch am Himmel, einen langen grünen Schatten, der ihnen gefolgt war.<\/p>\n<p>„Ach du liebe Zeit“, sagte Jessie.<\/p>\n<p>„Gebt den Stein zurück“, rief Felix.<\/p>\n<p>„Nie!“, rief Mauzi von unten. Seine Stimme klang heiser. „Der gehört jetzt uns! Wir fahren nach Hause und …“<\/p>\n<p>Der Motor des Tauchboots heulte auf. Das Boot drehte sich, und das Periskop schwenkte herum, und die kleine Antenne darüber zeigte genau nach oben.<\/p>\n<p>„Lina“, sagte Caro.<\/p>\n<p>„Ich weiß“, sagte Lina.<\/p>\n<p>Sie beugte sich vor. Pikachu richtete sich auf. Die roten Backen fingen an zu knistern, und dann knisterten sie lauter, und dann leuchtete Pikachu so hell, dass der Regen um es herum aufblitzte.<\/p>\n<p>„Nur die Antenne“, sagte Lina. „Nicht ins Wasser. Ins Wasser würde es alle treffen. Nur die Antenne.“<\/p>\n<p>Pikachu nickte.<\/p>\n<p>„Blitzkanone!“<\/p>\n<p>Ein einzelner, gerader Blitz schoss von Dragorans Rücken herunter. Er traf die Antenne, genau an der Spitze, und lief die Antenne hinunter, ins Boot hinein. Drinnen knallte es. Das Licht hinter dem Gesichtsfenster flackerte und ging aus. Der Motor hustete einmal. Dann war er still.<\/p>\n<p>Das Tauchboot schaukelte in den Wellen, ohne Antrieb.<\/p>\n<p>Und dann kam Mauzi aus der Luke geklettert. Es hielt den roten Stein in beiden Pfoten, und seine Pfoten dampften.<\/p>\n<p>„Heiß!“, kreischte es. „Heiß, heiß, heiß! Ich kann ihn nicht mehr halten!“<\/p>\n<p>Es warf den Stein.<\/p>\n<p>Er flog in einem hohen Bogen über die Wellen, rot und glühend, und Felix streckte die Arme aus, und Mega-Garados hob den Kopf, so hoch es konnte, und Felix fing den Stein mit seiner Jacke auf, die er sich in letzter Sekunde um beide Hände gewickelt hatte.<\/p>\n<p>Der Stein war heiß. Aber in dem Moment, in dem er in Felix' Händen lag, so nah an Groudons Ball, wurde er kühler. Nicht kalt. Nur ruhig.<\/p>\n<p>Felix drückte ihn an die Brust.<\/p>\n<p>Eine Welle traf das Tauchboot von der Seite. Es drehte sich einmal um sich selbst und wurde von der Strömung erfasst und trieb davon, schnell, nach Osten, auf das offene Meer hinaus, immer kleiner zwischen den grauen Bergen aus Wasser.<\/p>\n<p>Von dort, ganz klein und sehr deutlich, kam Mauzis Stimme.<\/p>\n<p>„Das war mal wieder ein Schuss in den Ofen!“<\/p>\n<p>Und dann, noch kleiner: „Und diesmal war es wirklich ein Ofen!“<\/p>\n<p>Felix musste lachen. Er saß auf Mega-Garados im Sturm, den heißen Stein an der Brust, und lachte, bis ihm Wasser in den Mund lief.<\/p>\n<p>Als er aufschaute, war Rayquaza direkt über ihm.<\/p>\n<p>Es war tiefer gekommen. Viel tiefer. Felix sah jetzt jede Schuppe, die gelben Zeichen, die Augen. Rayquaza schaute auf den roten Stein in seinen Händen. Dann schaute es hinauf zu Lina auf Dragorans Rücken, die Kyogres Ball in der Hand hielt.<\/p>\n<p>Dann stieg es wieder auf. Langsam. Bis in die Wolken.<\/p>\n<p>Es ging nicht weg. Es blieb da oben, über dem Krater. Felix sah seinen Schatten noch lange durch die Wolken gleiten.<\/p>\n<p>„Es wartet immer noch“, rief Lina herunter.<\/p>\n<p>„Ich weiß“, rief Felix zurück. „Auf heute Nacht.“<\/p>"}];
