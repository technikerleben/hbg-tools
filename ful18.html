<style>

#set{position:fixed;left:50%;top:60px;width:min(340px,92vw);transform:translate(-50%,-12px);opacity:0;pointer-events:none;

#set .lbl{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}

.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}

<script>
const CH = [{"num": "1", "label": "Kapitel 1", "title": "Die Kiste reist mit", "html": "<p>Die Kiste war schwerer, als sie aussah.<\/p>\n<p>Felix trug sie an einem Griff, Lina am anderen, und so gingen sie den Pfad von der Station hinunter zur Straße, wo Birks altes Auto wartete. Die Kiste schaukelte zwischen ihnen. Im Inneren, auf dem blauen Samt, lagen der rote und der blaue Stein, und jedes Mal, wenn die Kiste schaukelte, hörte man ein ganz leises Klacken.<\/p>\n<p>„Langsamer“, sagte Lina.<\/p>\n<p>„Ich bin langsam.“<\/p>\n<p>„Du bist schnell, wenn du aufgeregt bist.“<\/p>\n<p>Felix wurde langsamer.<\/p>\n<p>Professor Birk stand am Auto und hielt etwas in der Hand. Es war flach und rot und so groß wie ein Brot, und als Felix und Lina näher kamen, schwebte es plötzlich aus Birks Hand hoch in die Luft. Es hatte zwei Augen auf dem Bildschirm, blau und rund, und es drehte sich einmal im Kreis.<\/p>\n<p>„Bzzt! Hallo!“, sagte es. „Ich bin bereit!“<\/p>\n<p>Felix stellte die Kiste so schnell ab, dass es darin wieder klackte.<\/p>\n<p>„Ein Smart-Rotom“, sagte Birk. „Ein Rotom, das in einem Telefon wohnt. Es weiß alles, was im Pokédex steht, es hat jede Karte von Hoenn im Kopf, und es kann mich anrufen. Und ich kann euch anrufen.“<\/p>\n<p>Das Rotom schwebte zu Lina hinüber und schaute ihr ins Gesicht.<\/p>\n<p>„Lina“, sagte es. „Elf Jahre. Pikachu, Knuddeluff, Kyogre und noch sehr viele andere. Stimmt das?“<\/p>\n<p>„Woher weißt du das?“<\/p>\n<p>„Der Professor hat es mir erzählt. Bzzt. Ich höre gut zu.“<\/p>\n<p>Dann schwebte es zu Felix.<\/p>\n<p>„Felix. Zwölf Jahre. Groudon, Garados, Turtok und noch sehr viele andere. Du schreibst viel in ein Buch. Warum? Du kannst alles mir sagen.“<\/p>\n<p>Felix legte die Hand auf die Jackentasche, in der sein Notizbuch steckte.<\/p>\n<p>„Das ist etwas anderes“, sagte er.<\/p>\n<p>„Was ist anders?“<\/p>\n<p>„In dir steht, was alle wissen“, sagte Felix. „In meinem Buch steht, was ich denke.“<\/p>\n<p>Das Rotom drehte sich einmal langsam um sich selbst, als müsste es darüber nachdenken.<\/p>\n<p>„Bzzt“, sagte es dann. „Das speichere ich ab.“<\/p>\n<p>Birk lachte. Es war das erste Mal seit Tagen, dass er lachte.<\/p>\n<p>„Genau so“, sagte er. „Es ist ein Lexikon, das fliegen kann. Kein Ratgeber. Wenn ihr wissen wollt, wie schwer ein Relaxo ist, fragt Rotom. Wenn ihr wissen wollt, was ihr tun sollt, fragt euch selbst.“<\/p>\n<p>Er wurde ernst.<\/p>\n<p>„Ich komme nicht mit“, sagte er. „Ich bin zu alt, um in einen Krater zu tauchen, und irgendjemand muss hierbleiben, falls Wassili noch einmal schreibt. Aber ich bin da. Jederzeit. Rotom muss nur klingeln.“<\/p>\n<p>„Bzzt!“, sagte Rotom stolz. „Ich kann sehr laut klingeln.“<\/p>\n<p>Sie fuhren nach Graphitport.<\/p>\n<p>Am Hafen lag die Fähre nach Moosbach City, weiß und breit, mit einem roten Streifen am Bug. Die Leute schoben Koffer und Fahrräder über die Rampe, Möwen schrien, und es roch nach Diesel und Fisch und nach den Waffeln, die jemand am Kai verkaufte.<\/p>\n<p>Und am Kai, vor der kleinen Übungsarena mit dem Wasserbecken, stand Oda.<\/p>\n<p>Sie hatte die Arme verschränkt und schaute ihnen entgegen, als hätte sie schon seit einer Stunde gewartet.<\/p>\n<p>„Birk hat mir erzählt, dass ihr wegfahrt“, sagte sie. „Er hat nicht gesagt wohin.“<\/p>\n<p>„Wir dürfen es nicht sagen“, sagte Felix.<\/p>\n<p>„Hab ich mir gedacht.“ Oda zog einen Zettel aus der Tasche. Er war gefaltet, wie immer. „Ich hab trotzdem was geschrieben.“<\/p>\n<p>Felix faltete den Zettel auf. Darauf standen, wie immer, drei Sätze.<\/p>\n<p class=\"doc\">WER ETWAS ZURÜCKBRINGT, MUSS NICHT GEWINNEN. ER MUSS NUR ANKOMMEN. UND ER MUSS WISSEN, WANN ER LOSLÄSST.<\/p>\n<p>„Woher weißt du, dass wir etwas zurückbringen?“, fragte Lina.<\/p>\n<p>Oda zeigte auf die Kiste.<\/p>\n<p>„Niemand trägt eine so alte Kiste so vorsichtig, wenn er sie behalten will“, sagte sie. „Gute Fahrt.“<\/p>\n<p>Die Fähre legte um elf ab.<\/p>\n<p>Felix und Lina standen an der Reling und schauten zu, wie Graphitport kleiner wurde. Die Kiste stand zwischen ihren Füßen, und Felix hatte einen Fuß fest dagegen gestellt, damit sie nicht rutschen konnte. Rotom schwebte über ihren Köpfen und las ihnen Dinge vor, die keiner wissen wollte.<\/p>\n<p>„Die Fähre ist zweiundachtzig Meter lang. Bzzt. Sie braucht bis Moosbach City sechs Stunden und vierzig Minuten. Unter uns ist das Wasser jetzt dreißig Meter tief. Jetzt vierzig. Jetzt …“<\/p>\n<p>„Rotom“, sagte Lina.<\/p>\n<p>„Ja?“<\/p>\n<p>„Danke.“<\/p>\n<p>„Gern geschehen! Jetzt fünfundfünfzig.“<\/p>\n<p>Am Nachmittag schlief Felix auf einer Bank an Deck ein, den Kopf auf seinem Rucksack, einen Arm um die Kiste gelegt.<\/p>\n<p>Er wachte auf, weil seine Jackentasche warm war.<\/p>\n<p>Nicht ein bisschen warm. Heiß. So, als hätte jemand eine Wärmflasche hineingesteckt. Er setzte sich auf und holte Groudons Ball heraus. Der Ball glühte nicht, aber er war so warm, dass Felix ihn von einer Hand in die andere werfen musste.<\/p>\n<p>Lina saß neben ihm. Sie hielt Kyogres Ball in beiden Händen, und auf dem Ball standen kleine Wassertropfen.<\/p>\n<p>„Seit fünf Minuten“, sagte sie leise.<\/p>\n<p>„Rotom“, sagte Felix. „Wie tief ist es hier?“<\/p>\n<p>Rotom schwebte heran. Sein Bildschirm zeigte eine Karte mit vielen blauen Linien.<\/p>\n<p>„Bzzt. Hier ist es sehr tief. Hier hört der Sockel von Hoenn auf. Ab hier ist offenes Meer. Tief. Ganz tief.“<\/p>\n<p>Felix schaute auf die Kiste.<\/p>\n<p>Durch den Spalt unter dem Deckel kam Licht. Ganz schwach. Rot und blau, in zwei dünnen Streifen, die über die Planken des Decks liefen und sich in der Mitte trafen.<\/p>\n<p>„Wo das Land aufhört“, sagte Lina. „Und das Meer anfängt.“<\/p>\n<p>„So wie auf der Landzunge“, sagte Felix.<\/p>\n<p>Er legte die Hand auf den Deckel. Er war kühl auf der einen Seite und warm auf der anderen. Nach einer Weile wurde das Licht schwächer, und dann war es weg, und die Bälle wurden wieder normal, und die Fähre fuhr weiter über das tiefe Wasser, als wäre nichts gewesen.<\/p>\n<p>Felix holte sein Notizbuch heraus und schrieb.<\/p>\n<p>Die Steine merken, wo sie sind. Sie merken es jedes Mal genauer.<\/p>\n<p>Lina schaute ihm über die Schulter.<\/p>\n<p>„Rotom weiß das nicht“, sagte sie.<\/p>\n<p>„Nein“, sagte Felix. „Das steht in keinem Pokédex.“<\/p>\n<p>Rotom schwebte heran und schaute auch über seine Schulter.<\/p>\n<p>„Bzzt“, sagte es. „Darf ich das abspeichern?“<\/p>\n<p>„Nein“, sagte Felix. Aber er lächelte dabei.<\/p>\n<p>Als die Sonne tiefer stand, ging Lina nach hinten zum Heck, um zu schauen, ob man Graphitport noch sehen konnte. Man konnte es nicht mehr. Man sah nur Wasser.<\/p>\n<p>Und auf der letzten Bank am Heck, mit dem Rücken zu ihr, saßen zwei Leute.<\/p>\n<p>Sie trugen große Sonnenhüte. Zwischen ihnen stand ein Picknickkorb. Und der Picknickkorb hatte zwei kleine Löcher im Deckel, und aus den Löchern schauten zwei Augen, die sehr schnell zugingen, als Lina hinschaute.<\/p>\n<p>Lina blieb ganz ruhig stehen. Sie zählte bis drei. Dann drehte sie sich um und ging zurück zu Felix, ohne sich ein einziges Mal umzuschauen.<\/p>\n<p>„Felix“, sagte sie und setzte sich ganz dicht neben ihn. „Halt die Kiste fest.“<\/p>\n<p>„Ich halte sie fest.“<\/p>\n<p>„Fester.“<\/p>\n<p>Felix schaute sie an. Dann schaute er zum Heck. Dann seufzte er sehr tief.<\/p>\n<p>„Sonnenhüte?“, fragte er.<\/p>\n<p>„Sonnenhüte“, sagte Lina. „Und ein Korb mit Augen.“<\/p>"}, {"num": "2", "label": "Kapitel 2", "title": "Ein Mann mit Kliklak", "html": "<p>Die Fähre legte in Moosbach City an, als es schon dämmerte.<\/p>\n<p>Moosbach City lag auf einer Insel, flach und grün, und über den Dächern ragte ein riesiger weißer Turm auf, mit einer Spitze, die im letzten Licht glänzte. Rotom flog sofort hoch, um besser sehen zu können.<\/p>\n<p>„Bzzt! Das Weltraumzentrum! Von hier fliegen Raketen ins All! Die letzte ist vor …“<\/p>\n<p>„Rotom, komm runter“, sagte Lina. „Wir müssen auf die Kiste aufpassen.“<\/p>\n<p>Rotom kam runter.<\/p>\n<p>Sie trugen die Kiste über die Rampe, Felix vorne, Lina hinten, und sie schauten beide nicht zum Heck. Hinter ihnen gingen die anderen Passagiere von Bord, mit Koffern und Fahrrädern, und irgendwo dazwischen zwei Sonnenhüte und ein Picknickkorb.<\/p>\n<p>Und am Ende des Stegs, unter einer Laterne, stand ein Mann.<\/p>\n<p>Er war über vierzig, hatte einen Bart und eine Brille, und er trug eine Jacke mit dem Abzeichen der Pokémon-Liga auf der Brust. Unter dem Arm hatte er eine Mappe. Zu seinen Füßen saß ein Nachtara, schwarz mit gelben Ringen, und schaute den Passagieren entgegen.<\/p>\n<p>Und über seiner Schulter schwebte ein Kliklak. Zwei graue Zahnräder, ineinander verhakt, die sich langsam drehten.<\/p>\n<p>Felix blieb so plötzlich stehen, dass Lina gegen die Kiste lief.<\/p>\n<p>„Christoph?“<\/p>\n<p>Christoph schaute auf. Er sah nicht überrascht aus. Er sah aus wie jemand, der etwas befürchtet hat und gerade recht bekommt.<\/p>\n<p>„Natürlich“, sagte er. „Natürlich seid ihr das.“<\/p>\n<p>„Was machst du hier?“, fragte Lina.<\/p>\n<p>„Ich wurde geschickt.“ Christoph klopfte auf die Mappe. „Ich hasse es, geschickt zu werden. Die Liga hat eine Meldung aus Xeneroville bekommen. In der Arena dort sinkt jede Nacht der Wasserstand im Kampfbecken. Ohne Grund. Und jeden Morgen ist er wieder da. Ohne Grund. Ich soll herausfinden, was der Grund ist.“<\/p>\n<p>Er schaute auf die Kiste zwischen ihnen.<\/p>\n<p>„Und dann ruft mich gestern Abend ein Professor Birk an“, sagte er, „den ich nicht kenne, und sagt, ich soll heute Abend am Fähranleger in Moosbach City stehen, weil zwei Kinder kommen, die ich kenne. Und ich frage, welche Kinder, und er sagt, das wüsste ich dann schon.“<\/p>\n<p>„Bzzt!“, sagte Rotom. „Das war ich! Ich habe die Nummer herausgesucht!“<\/p>\n<p>Christoph schaute Rotom an. Er schaute es sehr lange an.<\/p>\n<p>„Es redet“, sagte er.<\/p>\n<p>„Ja“, sagte Felix.<\/p>\n<p>„Ich mag keine Geräte, die reden“, sagte Christoph. „Geräte sollen messen. Nicht reden.“<\/p>\n<p>„Ich kann auch messen!“, sagte Rotom.<\/p>\n<p>„Was denn?“<\/p>\n<p>„Die Uhrzeit!“<\/p>\n<p>Christoph seufzte. Nachtara stupste ihn ans Bein, und er kraulte es hinter den Ohren, ohne hinzuschauen.<\/p>\n<p>In diesem Moment fing Kliklak an, sich schneller zu drehen.<\/p>\n<p>Es war erst nur ein bisschen schneller. Dann noch schneller. Die Zahnräder surrten, und Kliklak schwebte von Christophs Schulter weg, einen halben Meter, einen Meter, genau auf die Kiste zu. Es blieb über dem Deckel stehen und drehte sich so schnell, dass man die Zähne nicht mehr sehen konnte.<\/p>\n<p>Christoph nahm die Brille ab, putzte sie am Hemd und setzte sie wieder auf.<\/p>\n<p>„Was ist in der Kiste?“, fragte er.<\/p>\n<p>Felix und Lina schauten sich an.<\/p>\n<p>„Nicht hier“, sagte Lina.<\/p>\n<p>Christoph schaute sich um. Er sah die Laternen und die Passagiere und die Möwen. Und er sah, ganz am Rand des Stegs, zwei Sonnenhüte, die sehr interessiert eine Wand anschauten, an der nichts hing.<\/p>\n<p>„Nein“, sagte er leise. „Nicht hier.“<\/p>\n<p>Er hatte ein Zimmer in einer Pension am Hafen. Es war klein und hatte zwei Betten und ein Sofa und ein Fenster zum Meer, und Christophs Relaxo lag davor auf der Wiese und schlief, und die Pensionswirtin sagte, sie würde es lieber nicht wecken.<\/p>\n<p>„Niemand weckt Relaxo“, sagte Christoph. „Relaxo wacht auf, wenn Relaxo will.“<\/p>\n<p>Sie stellten die Kiste auf den Tisch. Felix machte den Deckel auf.<\/p>\n<p>Christoph schaute lange hinein. Er sagte nichts. Kliklak schwebte über den beiden Steinen und drehte sich, und es surrte leise, wie ein Kühlschrank in der Nacht.<\/p>\n<p>„Rotom“, sagte Felix. „Zeig ihm den Eintrag.“<\/p>\n<p>Rotom schwebte über den Tisch. Auf seinem Bildschirm erschien Text.<\/p>\n<p class=\"doc\">PROTOMORPHOSE · DURCH DEN ROTEN EDELSTEIN NIMMT GROUDON SEINE URFORM AN, DURCH DEN BLAUEN EDELSTEIN KYOGRE · DIE URFORMEN BESITZEN DIE FÄHIGKEITEN ENDLAND UND URMEER<\/p>\n<p>Christoph las es dreimal. Dann setzte er sich hin.<\/p>\n<p>„Wo sind Groudon und Kyogre?“, fragte er.<\/p>\n<p>Felix legte Groudons Ball auf den Tisch. Lina legte Kyogres Ball daneben.<\/p>\n<p>Christoph schaute die beiden Bälle an. Dann die Steine. Dann Felix und Lina. Und dann sagte er einen Satz, den er in Kalos schon einmal gesagt hatte, über etwas ganz anderes.<\/p>\n<p>„Ich nenne das gerade anders“, sagte er. „Aber nicht vor Kindern.“<\/p>\n<p>Lina musste lachen.<\/p>\n<p>Dann erzählten sie alles. Von der Inschrift unter dem Samt. Von der Landzunge. Von Wassilis Brief. Von der Höhle, die wartet. Und von dem, was Birk gesagt hatte: dass die Urformen keine Waffe sind und nur an einem einzigen Ort sicher.<\/p>\n<p>Christoph hörte zu. Er schrieb nichts auf. Er unterbrach sie nicht. Als sie fertig waren, nahm er die Mappe der Liga und legte sie auf den Tisch.<\/p>\n<p>„Rotom“, sagte er. „Steht in deinem Pokédex, warum es die Urzeithöhle sein muss?“<\/p>\n<p>„Bzzt. Nein.“<\/p>\n<p>„Steht darin, was passiert, wenn man es woanders macht?“<\/p>\n<p>„Bzzt. Nein.“<\/p>\n<p>„Steht darin, wie man nach Xeneroville kommt?“<\/p>\n<p>„Ja!“ Rotom drehte sich vor Freude. „Fliegen oder tauchen! Es gibt keinen Hafen und keine Straße und keine Brücke! Die Stadt liegt in einem Krater, und der Krater ist rundherum aus Fels!“<\/p>\n<p>Christoph schaute aus dem Fenster auf Relaxo. Relaxo wog vierhundertsechzig Kilo und schnarchte.<\/p>\n<p>„Fliegen oder tauchen“, sagte er.<\/p>\n<p>„Ja!“<\/p>\n<p>„Mit Relaxo.“<\/p>\n<p>Rotom sagte nichts mehr. Sogar Rotom wusste, dass das ein Problem war.<\/p>\n<p>Spät am Abend, als Christoph auf dem Sofa schlief und Nachtara an der Tür lag, saßen Felix und Lina am Fenster. Draußen war es dunkel, nur die Laternen am Hafen brannten.<\/p>\n<p>„Christoph misst alles“, sagte Lina. „So wie du.“<\/p>\n<p>„Ich messe nicht alles.“<\/p>\n<p>„Doch. Du zählst. Er misst. Das ist dasselbe.“<\/p>\n<p>Felix holte sein Notizbuch heraus. Er schrieb lange. Dann zeigte er Lina, was er geschrieben hatte.<\/p>\n<p>Rotom weiß, was in den Büchern steht. Christoph misst, was man messen kann. Aber was die Steine wollen, weiß keiner von beiden.<\/p>\n<p>Lina nickte langsam.<\/p>\n<p>Unten am Hafen, unter dem Steg, wo das Wasser gegen die Pfähle schwappte, bewegte sich etwas. Ein kleiner Schatten mit spitzen Ohren. Er hatte die ganze Zeit unter dem offenen Fenster der Pension gesessen.<\/p>\n<p>Jetzt huschte er davon, über den Steg, zu einem Boot, das sehr klein war und sehr seltsam aussah. Rund. Mit zwei Ohren oben drauf. Und einem Fenster vorne, das aussah wie ein Gesicht.<\/p>\n<p>Niemand sah es. Nur Nachtara hob an der Tür ganz kurz den Kopf. Und legte ihn dann wieder auf die Pfoten, ohne die Augen zu schließen.<\/p>"}];
const NUMBERED = CH.filter(c=>c.num).length;
const KEY = "ebook_Felix_und_Lina_Die_Urzeithöhle";
const $ = s => document.querySelector(s);
const vp = $("#viewport"), ct = $("#content");
let state = {ch:0, frac:0, fs:null, theme:"light", font:"serif"};
let page = 0, pages = 1, GAP = 0;

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s) Object.assign(state,s); return !!s; }catch(e){ return false; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function applyPrefs(){
  const r = document.documentElement;
  r.dataset.theme = state.theme; r.dataset.font = state.font;
  if(state.fs) r.style.setProperty("--fs", state.fs+"px"); else r.style.removeProperty("--fs");
  $("#fsv").textContent = Math.round(parseFloat(getComputedStyle(r).getPropertyValue("--fs")))+" px";
  document.querySelectorAll("[data-font]").forEach(b=>b.classList.toggle("on", b.dataset.font===state.font));
  document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("on", b.dataset.theme===state.theme));
}

function layout(){
  const w = vp.clientWidth;
  const side = Math.max(20, Math.min(64, w*0.07));
  const pad = Math.floor((w - Math.min(w - 2*side, 720))/2);
  const colW = w - 2*pad;
  GAP = pad*2;
  ct.style.padding = "0 " + pad + "px";
  ct.style.columnWidth = colW + "px";
  ct.style.columnGap = GAP + "px";
  ct.style.columnFill = "auto";
  ct.style.width = w + "px";
  ct.style.transform = "none";
  pages = Math.max(1, Math.round((vp.scrollWidth + pad) / w));
}

function render(ch, frac){
  state.ch = ch;
  const c = CH[ch];
  let h = (c.label ? `<p class="kap">${c.label}</p>` : "") + `<h2>${c.title}</h2>` + c.html;
  if(ch < CH.length-1) h += `<p class="next"><button class="btn" onclick="go(${ch+1},0)">Weiter: ${CH[ch+1].label||CH[ch+1].title}</button></p>`;
  ct.innerHTML = h;
  $("#chTitle").textContent = (c.num ? c.num + " · " : (c.label ? c.label + " · " : "")) + c.title;
  document.querySelectorAll("#tocList li").forEach((li,i)=>li.classList.toggle("cur", i===ch));
  layout();
  show(Math.min(pages-1, Math.round((frac||0)*(pages-1))));
}

function show(p){
  page = Math.max(0, Math.min(pages-1, p));
  vp.scrollLeft = 0; ct.style.transform = `translateX(${-page * vp.clientWidth}px)`;
  state.frac = pages>1 ? page/(pages-1) : 0;
  $("#pg").textContent = `Seite ${page+1} von ${pages}`;
  const total = (state.ch + (pages>1? page/(pages-1)*0.999 : 0)) / CH.length;
  $("#pct").textContent = `${CH[state.ch].num ? "Kapitel "+CH[state.ch].num+" von "+NUMBERED : CH[state.ch].label} · ${Math.round(total*100)} %`;
  $("#prog").style.width = (total*100) + "%";
  save();
}

function go(ch, frac){ render(ch, frac); }
function next(){ if(page < pages-1) show(page+1); else if(state.ch < CH.length-1) render(state.ch+1, 0); }
function prev(){ if(page > 0) show(page-1); else if(state.ch > 0) render(state.ch-1, 1); }

/* Bedienung */
$("#tapR").onclick = next; $("#tapL").onclick = prev;
$("#tapM").onclick = () => $("#bar").style.transform = $("#bar").style.transform ? "" : "translateY(-100%)";
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  if(e.key==="Escape") closeAll();
});
let tx=null, ty=null;
document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && !document.querySelector(".open")){ dx<0?next():prev(); }
  tx=null;
}, {passive:true});
vp.addEventListener("wheel", e=>{ e.preventDefault(); if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<8) return;
  clearTimeout(vp._w); vp._w=setTimeout(()=>{ (e.deltaY+e.deltaX>0)?next():prev(); }, 40); }, {passive:false});

/* Inhaltsverzeichnis & Einstellungen */
const list = $("#tocList");
CH.forEach((c,i)=>{ const li=document.createElement("li");
  li.innerHTML=`<button><span class="n">${c.num||"✦"}</span><span>${c.title}</span></button>`;
  li.firstChild.onclick=()=>{ closeAll(); go(i,0); }; list.appendChild(li); });
function closeAll(){ ["#toc","#set","#scrim"].forEach(s=>$(s).classList.remove("open")); }
$("#tocBtn").onclick=()=>{ $("#toc").classList.add("open"); $("#scrim").classList.add("open"); };
$("#setBtn").onclick=()=>{ const o=$("#set").classList.toggle("open"); $("#scrim").classList.toggle("open",o); };
$("#scrim").onclick=closeAll;
function relayout(){ const f=state.frac; layout(); show(Math.round(f*(pages-1))); }
function setFs(d){ const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"));
  state.fs=Math.max(14,Math.min(34,cur+d)); applyPrefs(); relayout(); }
$("#fsUp").onclick=()=>setFs(2); $("#fsDown").onclick=()=>setFs(-2);
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{ state.font=b.dataset.font; applyPrefs(); relayout(); });
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ state.theme=b.dataset.theme; applyPrefs(); save(); });
let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(relayout,120); });

/* Start */
const had = load();
applyPrefs();
if(had && (state.ch>0 || state.frac>0)){ $("#contBtn").hidden=false;
  $("#contBtn").textContent = "Weiterlesen · " + (CH[state.ch].label || ("Kapitel " + (state.ch+1))); }
function open_(ch,frac){ $("#cover").classList.add("hidden"); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>render(ch,frac)); }
$("#startBtn").onclick=()=>open_(0,0);
$("#contBtn").onclick=()=>open_(state.ch,state.frac);
</script>
</body>
</html>
