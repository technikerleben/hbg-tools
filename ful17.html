von dort hinaus in die Nacht, und über der Station senkte sich der Mauzi-Ballon herab, so tief, dass man das Lachen aus dem Korb hörte.<\/p>\n<p>„Hast du sie?“, rief Jessie.<\/p>\n<p>„Ich hab sie!“, rief Mauzi.<\/p>\n<p>Ein Seil fiel herunter. Mauzi hielt sich daran fest, mit der Kiste im Arm, und das Seil wurde eingezogen, und der Ballon stieg.<\/p>\n<p>„Turtok!“, rief Felix. Er warf den Ball. „Hydropumpe!“<\/p>\n<p>Turtok erschien auf dem Hof und schoss. Aber es war dunkel, und der Ballon war schon zu hoch, und der Wasserstrahl ging knapp daneben und regnete auf den Hof herunter.<\/p>\n<p>Birk kam aus der Tür, im Bademantel, und schaute hinauf. Sein Gesicht war weiß.<\/p>\n<p>Der Ballon stieg nicht weiter.<\/p>\n<p>Er hing über der Station, ein Stück über den Dächern, und man hörte, wie oben im Korb gestritten wurde.<\/p>\n<p>„Warum steigen wir nicht?“<\/p>\n<p>„Die Kiste ist zu schwer!“<\/p>\n<p>„Das sind zwei Steine!“<\/p>\n<p>„Das sind zwei uralte Steine! Die wiegen mehr als du denkst!“<\/p>\n<p>„Dann wirf Sandsäcke raus!“<\/p>\n<p>„Wir haben keine Sandsäcke mehr, du hast sie gestern als Kissen benutzt!“<\/p>\n<p>Der Ballon trieb langsam vom Land weg, hinaus über die Bucht. Er stieg nicht. Er sank auch nicht. Er trieb nur, schwer und rund, mit dem Wind, der nachts vom Land aufs Meer hinausweht.<\/p>\n<p>Inzwischen standen alle auf dem Hof. Lina. Birk. Und die vier Kinder in Schlafanzügen, die von dem Geschrei aufgewacht waren.<\/p>\n<p>„Sie fliegen weg“, sagte Caspar. „Mit den Steinen.“<\/p>\n<p>„Nein“, sagte Carlo.<\/p>\n<p>Alle drehten sich zu ihm um. Carlo hatte sein Klemmbrett dabei. Er hatte es sogar im Schlaf dabei, unter dem Kopfkissen. Er blätterte darin, im Licht von Turtoks Panzer, der im Mondschein ein bisschen schimmerte.<\/p>\n<p>„Ich hab den Wind aufgeschrieben“, sagte er. „Jeden Tag. Nachts weht er raus aufs Meer. Aber jeden Morgen, kurz nach Sonnenaufgang, dreht er. Dann weht er vom Meer zurück. Und dann …“<\/p>\n<p>Er zeigte mit dem Stift über die Bucht, hinüber zu der langen, schmalen Landzunge, die die Bucht im Norden abschloss.<\/p>\n<p>„Dann treibt er dahin. Zur Landzunge. Ganz langsam. Und tief.“<\/p>\n<p>Birk schaute Carlo an. Dann schaute er den Ballon an.<\/p>\n<p>„Wann?“, fragte er.<\/p>\n<p>„Um sechs“, sagte Carlo. „Ungefähr. Ich hab nicht so genau gezählt.“<\/p>\n<p>Es war still auf dem Hof.<\/p>\n<p>„Professor“, sagte Lina. „Die Kinder …“<\/p>\n<p>„Ich weiß“, sagte Birk.<\/p>\n<p>Er schaute die vier Kinder an. Glitzerstern in ihrer Paillettenjacke. Carlo mit dem Klemmbrett. Rosalie mit Ponita im Arm. Caspar barfuß, mit seinem einen, leeren Ball in der Hand.<\/p>\n<p>„Ihr habt in zwei Wochen gelernt, zu reiten, zu warten, zu verlieren und keine Angst zu haben“, sagte er. „Ihr habt gelernt, Leuten nicht alles zu erzählen. Und ihr habt gelernt, dass man zuerst fragt.“<\/p>\n<p>Er machte eine Pause.<\/p>\n<p>„Also frage ich euch. Wollt ihr morgen früh mitkommen? Am Strand. Auf den Gallopa. Nicht ins Wasser. Nicht in die Nähe des Ballons, wenn ich es sage. Lina reitet mit. Felix ist auf dem Wasser. Und ich fahre das Boot.“<\/p>\n<p>Vier Köpfe nickten. Gleichzeitig.<\/p>\n<p>„Dann schlaft jetzt“, sagte Birk. „Drei Stunden. Mehr nicht.“<\/p>\n<p>Niemand schlief.<\/p>\n<p>Felix saß auf dem Steg und schaute auf den Ballon, der als dunkler, runder Fleck vor den Sternen über der Bucht hing. Er schlug sein Notizbuch auf. Er schrieb nichts. Zum ersten Mal in zwei Wochen wusste er genau, was morgen zu tun war, und er musste es nicht aufschreiben.<\/p>\n<p>Lina setzte sich neben ihn.<\/p>\n<p>„Hast du einen Plan?“, fragte sie.<\/p>\n<p>„Nein“, sagte Felix. „Carlo hat einen.“<\/p>"}, {"num": "12", "label": "Kapitel 12", "title": "Reiten, Schwimmen, Fangen", "html": "<p>Um halb sechs war der Himmel über dem Meer grau, und dann rosa, und dann gelb.<\/p>\n<p>Die drei Gallopa standen auf dem Strand. Das große Galar-Gallopa trug Glitzerstern, und hinter Glitzerstern saß Lina. Das junge Galar-Gallopa trug Carlo und Caspar, Carlo vorne, Caspar hinten, die Arme um Carlos Bauch. Und auf dem Feuer-Gallopa saß Rosalie, ganz allein, und neben ihr stand Ponita im Sand und scharrte mit dem Huf.<\/p>\n<p>„Drei Pferde“, sagte Carlo. „Vier Kinder. Zwei teilen.“<\/p>\n<p>„Es geht auf“, sagte Rosalie.<\/p>\n<p>Draußen in der Bucht lag Birk mit dem Boot aus dem Bootshaus, den Motor im Leerlauf.<\/p>\n<p>Und mitten in der Bucht, auf dem Kopf von Garados, stand Felix.<\/p>\n<p>Garados war riesig und blau, und das Morgenlicht glänzte auf seinen Schuppen. Um Garados herum schwammen Turtok, Golking, Milotic, Aquana und Tohaido. Rosalie schaute hinüber. Sie schaute Garados lange an.<\/p>\n<p>Dann hob sie die Hand und winkte.<\/p>\n<p>Garados hob den Kopf ein Stückchen. Felix hätte schwören können, dass es zurückwinkte.<\/p>\n<p>Der Ballon hing über der Bucht. Er war in der Nacht ein Stück gesunken. Man sah den Korb jetzt deutlich, und drei Köpfe, die über den Rand schauten. Einer davon hatte Ohren.<\/p>\n<p>Und dann drehte der Wind.<\/p>\n<p>Man merkte es zuerst an den Wellen. Sie liefen plötzlich anders. Dann merkte man es im Gesicht, ein kühler, salziger Hauch vom Meer. Und dann setzte sich der Ballon in Bewegung, langsam, ganz langsam, zurück übers Wasser, genau auf die Landzunge zu.<\/p>\n<p>„Sechs Uhr vier“, sagte Carlo.<\/p>\n<p>„Los“, sagte Lina.<\/p>\n<p>Die Gallopa liefen. Sie liefen am Strand entlang, auf dem festen, nassen Sand, und das Feuer-Gallopa war vorne, mit Rosalie, und Ponita lief daneben, und hinter ihnen kamen die beiden Galar-Gallopa, lila und türkis, und die Mähnen wehten. Draußen auf dem Wasser zog Garados mit Felix eine lange Spur, und Felix' Pokémon schwammen darum herum wie ein Schwarm.<\/p>\n<p>Im Ballon wurde es laut.<\/p>\n<p>„Sie kommen!“, rief James. „Alle! Auf Pferden! Und auf einem Garados!“<\/p>\n<p>„Dann wirf etwas raus!“, rief Jessie. „Damit wir steigen!“<\/p>\n<p>„Was denn?“<\/p>\n<p>„Irgendwas!“<\/p>\n<p>James warf seinen Hut. Dann Jessies Sonnenbrille. Dann die Picknickdecke. Der Ballon stieg ein ganz kleines bisschen und sank dann wieder.<\/p>\n<p>„Die Kiste!“, rief Mauzi. „Die Kiste ist zu schwer!“<\/p>\n<p>„Wir werfen doch nicht die Kiste raus! Die Kiste ist der ganze Grund!“<\/p>\n<p>„Dann eben anders!“ Jessie zog etwas aus dem Korb. Es war ein langes Rohr mit einem Netz vorne dran. „Wenn wir nicht steigen, dann halten wir sie eben auf!“<\/p>\n<p>Sie zielte auf den Strand.<\/p>\n<p>Glitzerstern sah es als Erste. Natürlich sah sie es als Erste.<\/p>\n<p>„Lina, sie zielen!“<\/p>\n<p>„Glitzerstern“, sagte Lina, „hast du eine Idee?“<\/p>\n<p>Glitzerstern hatte eine Idee. Sie hob Loturzel hoch, so hoch sie konnte, mit beiden Armen. Die Sonne kam gerade über den Horizont. Sie fiel auf die goldene Paillette auf Loturzels Hut.<\/p>\n<p>Und die Paillette warf einen hellen, goldenen Lichtfleck. Direkt in Jessies Gesicht.<\/p>\n<p>„Ah! Ich sehe nichts!“<\/p>\n<p>Das Netz schoss los. Es flog weit am Strand vorbei und wickelte sich um einen Pfahl im Wasser.<\/p>\n<p>„Rosalie!“, rief Carlo von hinten. „Kein Feuer! Wenn Feuer an den Ballon kommt, wird die Luft drin heiß, und dann steigt er!“<\/p>\n<p>Rosalie nickte. Sie beugte sich nach vorne und drückte ganz leicht mit den Beinen.<\/p>\n<p>Das Feuer-Gallopa wurde schneller. Es lief vorneweg, schneller als die anderen, bis ganz vorne an die Spitze der Landzunge, wo die Wellen von zwei Seiten kamen. Dort blieb Rosalie stehen und drehte sich um. Sie war jetzt genau unter der Stelle, an der der Ballon vorbeikommen musste.<\/p>\n<p>„Er kommt hier lang!“, rief sie. „Und er ist ganz tief!“<\/p>\n<p>Der Ballon kam. Der Korb hing jetzt nur noch ein paar Meter über dem Wasser, und unter dem Korb schleifte ein langes Seil durch die Wellen. Das Seil, an dem Mauzi in der Nacht hochgezogen worden war.<\/p>\n<p>„Carlo“, sagte Felix vom Wasser aus. „Das Seil.“<\/p>\n<p>Carlo verstand sofort.<\/p>\n<p>„Krebscorps!“, rief er. „Warte auf die Welle!“<\/p>\n<p>Krebscorps sprang vom Rücken des jungen Galar-Gallopa ins flache Wasser. Die Welle kam. Krebscorps wartete. Die Welle ging zurück, und das Seil schleifte durch den Sand, und Krebscorps lief los, flach am Boden, genau wie damals zwischen den Felsen.<\/p>\n<p>Und packte das Seil mit seiner großen Schere. Klammer.<\/p>\n<p>Es ließ nicht los.<\/p>\n<p>„Golking, Turtok“, rief Felix. „Helft ihm!“<\/p>\n<p>Golking packte das Seil hinter Krebscorps mit dem Maul. Turtok packte es dahinter. Und dann zogen sie.<\/p>\n<p>Der Ballon ruckte. Er neigte sich zur Seite. Er sank. Der Korb setzte mit einem dumpfen Platsch auf dem Sand der Landzunge auf, ganz vorne, wo das Wasser flach war.<\/p>\n<p>„Raus!“, schrie Jessie. „Alle raus!“<\/p>\n<p>Mauzi sprang als Erster. Er hatte die Kiste im Arm, und er rannte, so schnell ihn seine Hinterpfoten trugen, die Landzunge hinauf, in die Dünen hinein, ins hohe Gras.<\/p>\n<p>„Er hat die Kiste!“, rief Rosalie.<\/p>\n<p>Ponita lief Mauzi nach, ein paar Sprünge, und seine kleine Mähne leuchtete im Gras wie eine Fackel und zeigte allen, wo Mauzi hingelaufen war. Dann blieb Ponita stehen und wieherte. Mauzi war verschwunden.<\/p>\n<p>Als Mauzi wieder aus dem Gras kam, hatte er keine Kiste mehr.<\/p>\n<p>„Wo ist sie?“, rief Jessie.<\/p>\n<p>„Versteckt!“, rief Mauzi und grinste. „Im Sand! Die finden sie nie! Und wenn die weg sind, holen wir sie!“<\/p>\n<p>Die Dünen waren groß. Das Gras war hoch. Es gab tausend Stellen, an denen man eine Kiste vergraben konnte.<\/p>\n<p>Lina sprang vom Galar-Gallopa. Felix kam durch das flache Wasser ans Ufer gewatet. Alle schauten auf die Dünen.<\/p>\n<p>„Wir finden die nie“, sagte Glitzerstern leise.<\/p>\n<p>Caspar rutschte vom Rücken des jungen Galar-Gallopa.<\/p>\n<p>Er ging ein paar Schritte in die Dünen. Dann blieb er stehen. Er setzte sich in den Sand. Er holte seinen Ball heraus. Den einen. Den, der einmal zu früh geflogen war. Und er legte ihn auf seine flache, offene Hand.<\/p>\n<p>Und er hielt still.<\/p>\n<p>Hinter ihm waren Team Rocket. Hinter ihm stritten Jessie und James darüber, wer schuld war. Hinter ihm klapperte Krebscorps und schnaubten die Gallopa. Caspar hielt still. Er hielt so still, wie er noch nie in seinem Leben stillgehalten hatte.<\/p>\n<p>Im Gras raschelte es.<\/p>\n<p>Es kam im Zickzack. Einmal links, einmal rechts. Es blieb stehen. Es schnupperte. Braun und cremeweiß gestreift, mit einer schwarzen Nase, die nie aufhörte, sich zu bewegen.<\/p>\n<p>Das Zigzachs.<\/p>\n<p>Es kam näher. Zwei Meter. Es blieb stehen, wie gestern.<\/p>\n<p>Caspar bewegte sich nicht.<\/p>\n<p>Ein Meter.<\/p>\n<p>„Du musst nicht“, flüsterte Caspar. „Wirklich nicht. Ich warte auch noch länger.“<\/p>\n<p>Das Zigzachs schaute ihn an. Es schaute den Ball an. Und dann tippte es mit seiner schwarzen Nase dagegen, ganz kurz, so wie man jemanden anstupst, um zu sagen: Da bin ich.<\/p>\n<p>Licht.<\/p>\n<p>Klick.<\/p>\n<p>Caspar öffnete den Ball sofort. Zigzachs saß vor ihm im Sand und schaute ihn an, und Caspars Augen waren ganz nass, und er wischte sie nicht weg.<\/p>\n<p>„Zigzachs“, sagte Lina leise, „finden Sachen. Das können sie besser als jedes andere Pokémon. Sie graben Dinge aus, die andere verloren haben.“<\/p>\n<p>Caspar schaute Zigzachs an.<\/p>\n<p>„Kannst du etwas für mich finden?“, fragte er. „Du musst nicht.“<\/p>\n<p>Zigzachs hob die Nase. Es schnupperte. Und dann lief es los, im Zickzack, durch das Gras, einmal links, einmal rechts, und alle liefen hinterher, und Mauzi rief „Nein, nein, nein!“, und Zigzachs blieb mitten in einer Mulde stehen und fing an zu graben.<\/p>\n<p>Sand flog. Unter dem Sand kam Holz zum Vorschein. Eine Ecke. Ein Deckel.<\/p>\n<p>Die Kiste.<\/p>\n<p>Birk war inzwischen mit dem Boot gelandet. Er kniete sich hin und klappte den Deckel auf. Der rote Stein. Der blaue Stein. Beide da, auf blauem Samt, und sie schimmerten in der Morgensonne.<\/p>\n<p>„Das gibt es doch nicht!“, schrie Jessie. „Von einem Zigzachs!“<\/p>\n<p>„Das ist gemein!“, rief James. „Wir hatten sie schon!“<\/p>\n<p>„Ihr hattet sie nie“, sagte Birk ruhig. „Sie hatten euch.“<\/p>\n<p>„Jetzt reicht's!“, kreischte Mauzi. „Wir nehmen sie uns einfach!“<\/p>\n<p>Felix stellte sich neben Lina. Garados hob sich hinter ihm aus dem Wasser, groß und blau. Hinter Lina stand das große Galar-Gallopa, und sein Horn leuchtete schon.<\/p>\n<p>„Wir zählen“, sagte Felix.<\/p>\n<p>„Eins“, sagte Lina.<\/p>\n<p>„Zwei“, sagten Glitzerstern und Carlo und Rosalie und Caspar.<\/p>\n<p>„Drei!“<\/p>\n<p>„Garados, Hyperstrahl! Auf den Ballon!“<\/p>\n<p>„Galar-Gallopa, Psychokinese! Alle drei hinein!“<\/p>\n<p>Jessie, James und Mauzi schwebten in die Luft, sehr überrascht, und wurden sanft in ihren Korb gesetzt. Und dann traf der Hyperstrahl den Ballon von unten, nicht hart, nur mit einem gewaltigen Schub, und der Ballon schoss nach oben, hoch über die Landzunge, hoch über die Bucht, und wurde kleiner und kleiner, bis er nur noch ein Punkt am Morgenhimmel war.<\/p>\n<p>Von dort kam es herunter, laut und deutlich.<\/p>\n<p>„Das war mal wieder ein Schuss in den Ofen!“<\/p>\n<p>Diesmal war es James.<\/p>\n<p>„Wenigstens hab ich den Joghurt noch“, rief Mauzi.<\/p>\n<p>Dann waren sie weg.<\/p>\n<p>Um zehn kamen die Eltern.<\/p>\n<p>Sie standen am Zaun der Weide und auf dem Steg und schauten zu. Sie sahen Glitzerstern auf dem großen Galar-Gallopa, ganz gerade, mit Loturzel vor sich, und beide funkelten. Sie sahen Carlo, der mit Krebscorps einen Kampf gegen Golking gewann, weil Krebscorps auf die Welle wartete. Sie sahen Rosalie, die auf dem Feuer-Gallopa am Strand galoppierte, und neben ihr Ponita. Rosalies Oma stand ganz vorne am Zaun und hielt sich die Hand vor den Mund.<\/p>\n<p>Und sie sahen Caspar, der still im Gras saß, ganz still, bis Zigzachs angelaufen kam und sich auf seinen Schoß legte.<\/p>\n<p>„Das ist das Schwerste, was ich gelernt habe“, sagte Caspar zu seinem Vater. „Stillsitzen.“<\/p>\n<p>Sein Vater schaute ihn lange an. „Das glaube ich dir“, sagte er.<\/p>\n<p>Später, als alle gegangen waren, stand Birk in seinem Arbeitszimmer. Er legte die Kiste zurück in den Schrank. Dann holte er aus der Tasche zwei neue Schlösser. Er schaute sie an. Und dann legte er sie auf den Tisch, ohne sie anzubringen.<\/p>\n<p>„Keine neuen Schlösser?“, fragte Felix.<\/p>\n<p>„Doch“, sagte Birk. „Morgen. Aber ich habe heute gelernt, dass das beste Schloss vier Kinder sind, die wissen, wann man still sein muss. Und ein Zigzachs.“<\/p>\n<p>Am Abend saßen Felix und Lina ein letztes Mal auf dem Steg.<\/p>\n<p>Die Bucht war glatt wie ein Teller. Die Wingull saßen auf den Pfählen. In der Ferne, zwischen den Felsen, klapperte ein Krebscorps, ein anderes, ein wildes, und Felix musste lächeln.<\/p>\n<p>Er schlug sein Notizbuch auf. Er blätterte zurück bis zu dem Satz vom zweiten Abend.<\/p>\n<p>Morgen bin ich dran. Und ich weiß nicht, wie man das macht.<\/p>\n<p>Er schaute den Satz lange an. Dann blätterte er auf eine neue, leere Seite und schrieb.<\/p>\n<p>Man muss nicht wissen, wie man es macht. Man muss nur fragen, und dann zuhören, wer es schon weiß.<\/p>\n<p>Lina nahm ihm den Stift aus der Hand. Sie setzte unter den Satz einen Punkt. Einen viel zu großen Punkt.<\/p>\n<p>„So“, sagte sie. „Jetzt gilt er.“<\/p>"}, {"num": "", "label": "Epilog", "title": "Was unter dem Samt stand", "html": "<p>Drei Tage nach dem Abschluss rief Professor Birk sie in sein Arbeitszimmer.<\/p>\n<p>Die Sommerschule war vorbei. Das Bootshaus war gefegt, die Schwimmwesten hingen wieder in vier Größen an der Wand, und auf der Tafel stand immer noch, ganz blass, Regel Nummer fünf. Niemand hatte es übers Herz gebracht, sie wegzuwischen.<\/p>\n<p>Birk saß nicht an seinem Schreibtisch. Er saß auf dem Fußboden, vor dem Schrank mit den zwei Schlössern, und vor ihm lag die Holzkiste. Der Deckel war offen, daneben lagen eine Lupe und ein Stapel sehr alter Bücher.<\/p>\n<p>„Setzt euch“, sagte Birk. „Am besten auf den Boden. Es dauert ein bisschen.“<\/p>\n<p>Sie setzten sich.<\/p>\n<p>„Als Zigzachs die Kiste ausgegraben hat“, sagte Birk, „ist sie ein bisschen kaputtgegangen. Hier.“<\/p>\n<p>Er zeigte auf den blauen Samt im Inneren. An einer Ecke war er eingerissen, und an der Stelle sah man das Holz darunter. Es war dunkel und sehr glatt, wie ein Stein, über den lange Wasser gelaufen ist.<\/p>\n<p>„Ich wollte den Samt nur festkleben“, sagte Birk. „Dann habe ich ihn ganz herausgenommen.“<\/p>\n<p>Er hob den Samt an.<\/p>\n<p>Unter dem Samt, in den Boden der Kiste geritzt, standen Zeichen. Sie waren alt und flach und an manchen Stellen fast verschwunden. Aber man konnte sie lesen, wenn man die Lupe nahm und das Licht schräg hielt.<\/p>\n<p>Birk hatte sie abgeschrieben, auf einen Zettel, in seiner ordentlichen Handschrift.<\/p>\n<p class=\"doc\">WO DAS MEER IN DEN BERG FIEL · DORT ERINNERN SICH DIE ALTEN · AN DAS, WAS SIE AM ANFANG WAREN<\/p>\n<p>Lina las es zweimal. Felix las es dreimal.<\/p>\n<p>„Wer hat das geschrieben?“, fragte Lina.<\/p>\n<p>„Das weiß ich nicht“, sagte Birk. „Jemand, der die Steine vom Pyroberg geholt hat. Vor sehr langer Zeit. Jemand, der wollte, dass der Nächste es weiß.“<\/p>\n<p>„Und was heißt es?“, fragte Felix.<\/p>\n<p>Birk lehnte sich an den Schrank.<\/p>\n<p>„Bevor ich das sage“, sagte er, „möchte ich euch etwas fragen. Am Morgen auf der Landzunge. Als Zigzachs gegraben hat. Ist euch etwas aufgefallen?“<\/p>\n<p>Felix und Lina schauten sich an.<\/p>\n<p>„Groudons Ball“, sagte er langsam. „In meiner Jackentasche. Er ist warm geworden. Nicht ein bisschen. Richtig warm. Wie ein Stein, der den ganzen Tag in der Sonne gelegen hat. Genau in dem Moment, als die Kiste aus dem Sand kam.“<\/p>\n<p>„Kyogres Ball war kalt“, sagte Lina leise. „Und nass. Ich hab gedacht, das kommt vom Meer. Aber ich war gar nicht im Wasser.“<\/p>\n<p>Birk nickte.<\/p>\n<p>„Die Steine haben auch etwas getan“, sagte er. „Ich hab es gesehen, als ich den Deckel aufgemacht habe. Ich dachte, es wäre die Morgensonne. Aber die Sonne kam von der anderen Seite.“<\/p>\n<p>„Sie haben geleuchtet“, sagte Lina.<\/p>\n<p>„Sie haben geantwortet“, sagte Birk.<\/p>\n<p>Er nahm den roten Stein aus der Kiste und hielt ihn ins Licht. Er war rund und schwer, und in seinem Inneren war ein Zeichen, das aussah wie eine Flamme oder wie ein Berg, je nachdem, wie man ihn drehte.<\/p>\n<p>„Ich habe diese Steine jahrelang untersucht“, sagte er. „Ich habe sie gemessen und gewogen und unter jedes Gerät gelegt, das ich habe. Sie haben nie etwas getan. Nie. Ich dachte, sie wären einfach sehr alt und sehr schön und sonst nichts.“<\/p>\n<p>Er legte den roten Stein zurück.<\/p>\n<p>„Aber am Morgen auf der Landzunge waren zum ersten Mal drei Dinge an einem Ort. Die Steine. Groudon und Kyogre. Und eine Stelle, an der das Land ins Meer geht. Sand und Wasser. Beides zugleich.“<\/p>\n<p>Felix holte sein Notizbuch heraus. Er schrieb die drei Dinge untereinander.<\/p>\n<p>„Und dann hat es ein bisschen funktioniert“, sagte er.<\/p>\n<p>„Ein bisschen“, sagte Birk. „Ein Anfang. Mehr nicht. Eine Landzunge ist nicht der richtige Ort. Sie ist nur so ähnlich wie der richtige Ort.“<\/p>\n<p>Er tippte auf den Zettel.<\/p>\n<p>„Wo das Meer in den Berg fiel.“<\/p>\n<p>Es war still im Arbeitszimmer. Draußen schrie ein Wingull.<\/p>\n<p>„Xeneroville“, sagte Lina plötzlich.<\/p>\n<p>Birk schaute sie an, und zum ersten Mal an diesem Morgen lächelte er.<\/p>\n<p>„Xeneroville“, sagte er. „Eine Stadt in einem Krater. Ganz von Felsen umschlossen, mitten im Meer. Früher war dort ein Berg, und dann ist das Meer hineingefallen. Man kommt nur hin, wenn man fliegt oder taucht. Und hinter der Arena von Xeneroville gibt es eine Höhle.“<\/p>\n<p>„Die Urzeithöhle“, sagte Felix.<\/p>\n<p>„Die Leute sagen“, sagte Birk, „dass dort alles angefangen hat. Dass Groudon und Kyogre dort zum ersten Mal aufgewacht sind, als die Welt noch jung war. Und dass sie damals anders aussahen. Größer. Älter. So, wie sie am Anfang waren.“<\/p>\n<p>Er schlug eines der alten Bücher auf. Auf der Seite war eine Zeichnung, verblasst und fleckig. Ein riesiges Wesen aus dem Meer, mit leuchtenden Linien auf dem Körper, wie Adern aus Licht. Und daneben eines aus Fels und Feuer, mit denselben Linien, nur rot.<\/p>\n<p>„Proto-Kyogre“, sagte Birk. „Und Proto-Groudon. Die Urformen.“<\/p>\n<p>Lina hielt den Atem an.<\/p>\n<p>„Und die Steine?“, fragte Felix.<\/p>\n<p>„Die Steine sind die Erinnerung“, sagte Birk. „Der blaue erinnert Kyogre daran, wer es am Anfang war. Der rote erinnert Groudon. Aber eine Erinnerung allein reicht nicht. Man braucht auch den Ort, an dem es passiert ist. So wie man sich an manche Dinge erst wieder erinnert, wenn man an der Stelle steht, wo sie geschehen sind.“<\/p>\n<p>Felix dachte an den Steg zu Hause. An das Pokémon, das nie wiedergekommen war. Er verstand genau, was Birk meinte.<\/p>\n<p>„Professor“, sagte Lina, und ihre Stimme war jetzt ernst. „Warum erzählen Sie uns das? Wir können Kyogre und Groudon doch einfach so lassen, wie sie sind.“<\/p>\n<p>Birk antwortete nicht gleich.<\/p>\n<p>Er stand auf, ging zum Schreibtisch und holte einen Brief. Der Umschlag war dick und ein bisschen wellig, als wäre er nass geworden. Auf der Rückseite stand ein Name. Wassili, Arenaleiter von Xeneroville.<\/p>\n<p>„Der kam gestern“, sagte Birk. „Ich habe Wassili vor einer Woche geschrieben und nach der Höhle gefragt. Das ist seine Antwort.“<\/p>\n<p>Er las vor.<\/p>\n<p>„Lieber Professor. Seit Anfang des Sommers ist in der Urzeithöhle etwas nicht in Ordnung. Nachts leuchtet sie. Das Wasser im Krater sinkt jeden Abend um eine Handbreit und steigt jeden Morgen wieder, ohne dass es Ebbe oder Flut gibt. Die Felsen am Eingang sind warm. Die alten Leute in der Stadt sagen, die Höhle ist aufgewacht und wartet auf jemanden. Ich weiß nicht, auf wen. Wenn Sie etwas wissen, kommen Sie bitte. Und bringen Sie mit, was Sie im Schrank haben. Ich glaube, Sie wissen, was ich meine.“<\/p>\n<p>Birk ließ den Brief sinken.<\/p>\n<p>„Seit Anfang des Sommers“, sagte Felix langsam. „Seit wir Groudon und Kyogre hierhergebracht haben. Zu den Steinen.“<\/p>\n<p>„Ja“, sagte Birk.<\/p>\n<p>„Die Höhle wartet auf sie“, sagte Lina.<\/p>\n<p>„Ich glaube, die Höhle wartet auf alle vier“, sagte Birk. „Auf die beiden Pokémon. Und auf die beiden Steine. Und weil Groudon und Kyogre nur mit euch gehen und mit niemandem sonst, wartet sie wohl auch auf euch.“<\/p>\n<p>Er schaute die beiden lange an.<\/p>\n<p>„Ich sage euch noch etwas, und das ist das Wichtigste. Die Urformen sind nicht zum Kämpfen da. Sie sind keine Waffe. Wenn Kyogre seine Urform annimmt, regnet es so, wie es seit dem Anfang der Welt nicht mehr geregnet hat. Wenn Groudon seine annimmt, brennt die Sonne so, dass das Meer verdunstet. An einem falschen Ort würde das alles kaputt machen. Nur in der Urzeithöhle ist Platz genug dafür. Nur dort ist es sicher.“<\/p>\n<p>„Und warum sollen sie es dann überhaupt tun?“, fragte Felix.<\/p>\n<p>„Das weiß ich nicht“, sagte Birk ehrlich. „Das werdet ihr herausfinden müssen. Vielleicht, damit die Höhle wieder schlafen kann. Vielleicht, weil Groudon und Kyogre etwas wiederfinden müssen, das sie verloren haben. Ich bin ein alter Mann mit vielen Büchern. Aber in keinem davon steht die Antwort.“<\/p>\n<p>Lina holte Kyogres Ball aus der Tasche. Felix holte Groudons Ball heraus. Sie legten beide auf den Boden, neben die offene Kiste.<\/p>\n<p>Einen Moment lang passierte gar nichts.<\/p>\n<p>Dann wurde der rote Ball warm. So warm, dass Felix es spürte, obwohl er ihn gar nicht mehr anfasste. Und auf dem blauen Ball bildeten sich kleine Tropfen, wie an einem Glas kaltem Wasser im Sommer.<\/p>\n<p>In der Kiste begannen die beiden Steine ganz leise zu leuchten. Rot. Und blau. Und das Zeichen in jedem Stein drehte sich langsam zu dem Ball, der zu ihm gehörte.<\/p>\n<p>„Sie wollen“, flüsterte Lina.<\/p>\n<p>Felix schaute die beiden Bälle an. Dann die Steine. Dann Birk.<\/p>\n<p>„Wann fahren wir?“, fragte er.<\/p>\n<p>Birk klappte den Deckel der Kiste zu. Das Leuchten verschwand. Er schloss den Schrank nicht wieder ab.<\/p>\n<p>„Sobald ihr gepackt habt“, sagte er. „Und diesmal nehmt ihr die Kiste mit.“<\/p>\n<p>Am Abend saßen Felix und Lina auf dem Steg. Die Bucht war glatt wie ein Teller, und am Horizont, wo das Meer anfing, lag irgendwo, unsichtbar, eine Stadt in einem Krater.<\/p>\n<p>Felix schrieb einen Satz in sein Notizbuch.<\/p>\n<p>Manche Dinge muss man nicht verstehen. Man muss nur hinfahren.<\/p>\n<p>Lina las ihn. Diesmal nahm sie den Stift nicht.<\/p>\n<p>„Der ist noch nicht fertig“, sagte sie. „Der gilt erst, wenn wir zurück sind.“<\/p>\n<p class=\"ende\">✦ Ende ✦<\/p>"}];
const NUMBERED = CH.filter(c=>c.num).length;
const KEY = "ebook_Felix_und_Lina_Die_Sommerschule";
const $ = s => document.querySelector(s);
const vp = $("#viewport"), ct = $("#content");
let state = {ch:0, frac:0, fs:null, theme:"light", font:"serif"};
let page = 0, pages = 1, GAP = 0;

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s) Object.assign(state,s); return !!s; }catch(e){ return false; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function applyPrefs(){
  const r = document.documentElement;
  r.dataset.theme = state.theme; r.dataset.font = state.font;
  if(state.fs) r.style.setProperty("--fs", state.fs+"px"); else r.style.removeProperty("--fs");
  $("#fsv").textContent = Math.round(parseFloat(getComputedStyle(r).getPropertyValue("--fs")))+" px";
  document.querySelectorAll("[data-font]").forEach(b=>b.classList.toggle("on", b.dataset.font===state.font));
  document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("on", b.dataset.theme===state.theme));
}

function layout(){
  const w = vp.clientWidth;
  const side = Math.max(20, Math.min(64, w*0.07));
  const pad = Math.floor((w - Math.min(w - 2*side, 720))/2);
  const colW = w - 2*pad;
  GAP = pad*2;
  ct.style.padding = "0 " + pad + "px";
  ct.style.columnWidth = colW + "px";
  ct.style.columnGap = GAP + "px";
  ct.style.columnFill = "auto";
  ct.style.width = w + "px";
  ct.style.transform = "none";
  pages = Math.max(1, Math.round((vp.scrollWidth + pad) / w));
}

function render(ch, frac){
  state.ch = ch;
  const c = CH[ch];
  let h = (c.label ? `<p class="kap">${c.label}</p>` : "") + `<h2>${c.title}</h2>` + c.html;
  if(ch < CH.length-1) h += `<p class="next"><button class="btn" onclick="go(${ch+1},0)">Weiter: ${CH[ch+1].label||CH[ch+1].title}</button></p>`;
  ct.innerHTML = h;
  $("#chTitle").textContent = (c.num ? c.num + " · " : (c.label ? c.label + " · " : "")) + c.title;
  document.querySelectorAll("#tocList li").forEach((li,i)=>li.classList.toggle("cur", i===ch));
  layout();
  show(Math.min(pages-1, Math.round((frac||0)*(pages-1))));
}

function show(p){
  page = Math.max(0, Math.min(pages-1, p));
  vp.scrollLeft = 0; ct.style.transform = `translateX(${-page * vp.clientWidth}px)`;
  state.frac = pages>1 ? page/(pages-1) : 0;
  $("#pg").textContent = `Seite ${page+1} von ${pages}`;
  const total = (state.ch + (pages>1? page/(pages-1)*0.999 : 0)) / CH.length;
  $("#pct").textContent = `${CH[state.ch].num ? "Kapitel "+CH[state.ch].num+" von "+NUMBERED : CH[state.ch].label} · ${Math.round(total*100)} %`;
  $("#prog").style.width = (total*100) + "%";
  save();
}

function go(ch, frac){ render(ch, frac); }
function next(){ if(page < pages-1) show(page+1); else if(state.ch < CH.length-1) render(state.ch+1, 0); }
function prev(){ if(page > 0) show(page-1); else if(state.ch > 0) render(state.ch-1, 1); }

/* Bedienung */
$("#tapR").onclick = next; $("#tapL").onclick = prev;
$("#tapM").onclick = () => $("#bar").style.transform = $("#bar").style.transform ? "" : "translateY(-100%)";
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  if(e.key==="Escape") closeAll();
});
let tx=null, ty=null;
document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && !document.querySelector(".open")){ dx<0?next():prev(); }
  tx=null;
}, {passive:true});
vp.addEventListener("wheel", e=>{ e.preventDefault(); if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<8) return;
  clearTimeout(vp._w); vp._w=setTimeout(()=>{ (e.deltaY+e.deltaX>0)?next():prev(); }, 40); }, {passive:false});

/* Inhaltsverzeichnis & Einstellungen */
const list = $("#tocList");
CH.forEach((c,i)=>{ const li=document.createElement("li");
  li.innerHTML=`<button><span class="n">${c.num||"✦"}</span><span>${c.title}</span></button>`;
  li.firstChild.onclick=()=>{ closeAll(); go(i,0); }; list.appendChild(li); });
function closeAll(){ ["#toc","#set","#scrim"].forEach(s=>$(s).classList.remove("open")); }
$("#tocBtn").onclick=()=>{ $("#toc").classList.add("open"); $("#scrim").classList.add("open"); };
$("#setBtn").onclick=()=>{ const o=$("#set").classList.toggle("open"); $("#scrim").classList.toggle("open",o); };
$("#scrim").onclick=closeAll;
function relayout(){ const f=state.frac; layout(); show(Math.round(f*(pages-1))); }
function setFs(d){ const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"));
  state.fs=Math.max(14,Math.min(34,cur+d)); applyPrefs(); relayout(); }
$("#fsUp").onclick=()=>setFs(2); $("#fsDown").onclick=()=>setFs(-2);
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{ state.font=b.dataset.font; applyPrefs(); relayout(); });
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ state.theme=b.dataset.theme; applyPrefs(); save(); });
let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(relayout,120); });

/* Start */
const had = load();
applyPrefs();
if(had && (state.ch>0 || state.frac>0)){ $("#contBtn").hidden=false;
  $("#contBtn").textContent = "Weiterlesen · " + (CH[state.ch].label || ("Kapitel " + (state.ch+1))); }
function open_(ch,frac){ $("#cover").classList.add("hidden"); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>render(ch,frac)); }
$("#startBtn").onclick=()=>open_(0,0);
$("#contBtn").onclick=()=>open_(state.ch,state.frac);
</script>
</body>
</html>
