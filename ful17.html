const CH = [{"num": "1", "label": "Kapitel 1", "title": "Vier Namen auf einer Liste", "html": "<p>Der Zettel hing am Bootshaus, mit vier Reißzwecken festgemacht, und der Wind von der Bucht zerrte an seiner unteren Ecke.<\/p>\n<p class=\"doc\">SOMMERSCHULE BUCHT · ZWEI WOCHEN · VIER PLÄTZE<\/p>\n<p>Darunter standen vier Namen, mit der Hand geschrieben, in vier verschiedenen Handschriften.<\/p>\n<p>Felix las sie zweimal.<\/p>\n<p>„Glitzerstern“, sagte er. „Das ist doch kein Name.“<\/p>\n<p>„Für irgendwen schon“, sagte Lina.<\/p>\n<p>Professor Birk kam den Pfad von der Station herunter, mit einer Thermoskanne unter dem Arm und einem Schlüsselbund in der Hand, der bei jedem Schritt klirrte. Er sah zufrieden aus. Er sah aus wie jemand, der eine Idee gehabt hat und sie jetzt endlich anderen Leuten aufhalsen kann.<\/p>\n<p>„Ihr habt die Liste gefunden“, sagte er.<\/p>\n<p>„Sie hängt an der Tür“, sagte Felix. „Man kann sie nicht nicht finden.“<\/p>\n<p>Birk schloss das Bootshaus auf. Drinnen war es kühl und roch nach Holz und Seil und ein bisschen nach Tang. An der einen Wand standen Bänke, an der anderen hingen Schwimmwesten in vier Größen, und ganz hinten, neben der Tür zum Lagerraum, stand eine kleine Tafel auf drei Beinen.<\/p>\n<p>„Hier ist eure Schule“, sagte Birk. „Vier Kinder, alle ungefähr acht. Sie kommen morgens um neun und gehen abends um sechs, und in der Mitte schlafen sie zwei Nächte pro Woche hier, weil ihre Eltern das so wollten. Ich bin der Erwachsene, der verantwortlich ist. Ihr seid die, die unterrichten.“<\/p>\n<p>„Was unterrichten?“, fragte Felix.<\/p>\n<p>„Das, was ihr könnt.“ Birk stellte die Thermoskanne ab. „Felix, du bringst ihnen bei, wie man gegen Wasser-Pokémon kämpft. Und wie man mit ihnen kämpft. Die Bucht ist voll davon.“<\/p>\n<p>Felix nickte langsam.<\/p>\n<p>„Lina, du bringst ihnen das Reiten bei.“<\/p>\n<p>„Auf Gallopa“, sagte Lina.<\/p>\n<p>„Auf allen dreien“, sagte Birk. „Und beide zusammen bringt ihr ihnen das Fangen bei. Am Ende der zwei Wochen soll jedes Kind ein Pokémon haben, das es selbst gefangen hat. Kein geschenktes.“<\/p>\n<p>Er schaute aus dem Fenster, hinauf zur Station.<\/p>\n<p>Dann schaute er, ganz kurz, zur anderen Seite des Raumes, wo man durch die offene Tür den Pfad und das Dach des Labors sehen konnte. Felix wusste, was er dort sah, obwohl man es von hier aus gar nicht sehen konnte: den Schrank im Arbeitszimmer, mit zwei Schlössern, und darin, in einer Holzkiste, einen roten und einen blauen Stein.<\/p>\n<p>„Und sonst?“, fragte Felix.<\/p>\n<p>„Sonst nichts“, sagte Birk. Er lächelte. „Es sind Ferien.“<\/p>\n<p>Am Abend saß Felix auf dem Steg und schrieb in sein Notizbuch.<\/p>\n<p>Er schrieb drei Pläne untereinander. Plan eins für den ersten Tag, Plan zwei für den Fall, dass Plan eins nicht klappt, und Plan drei für den Fall, dass die Kinder einfach nicht zuhören.<\/p>\n<p>Lina setzte sich neben ihn und las über seine Schulter.<\/p>\n<p>„Du hast für jede Stunde einen Plan“, sagte sie.<\/p>\n<p>„Man muss vorbereitet sein.“<\/p>\n<p>„Du kennst sie noch gar nicht.“<\/p>\n<p>„Deshalb ja“, sagte Felix.<\/p>\n<p>Am nächsten Morgen um neun kamen sie.<\/p>\n<p>Die Erste war Glitzerstern.<\/p>\n<p>Man hörte sie, bevor man sie sah. Sie trug eine Jacke, auf die jemand sehr viele Pailletten genäht hatte, und die Pailletten klimperten bei jedem Schritt, und als die Sonne darauf fiel, warf die Jacke kleine Lichtpunkte auf die Wand des Bootshauses. In ihren Haaren steckte eine Spange in Form eines Sterns.<\/p>\n<p>„Ich bin Glitzerstern“, sagte sie. „Mit zwei T in Glitzer.“<\/p>\n<p>„In Glitzer ist nur ein T“, sagte Felix.<\/p>\n<p>„In meinem sind zwei.“<\/p>\n<p>Felix öffnete den Mund. Lina trat ihm ganz leicht auf den Fuß.<\/p>\n<p>„Willkommen, Glitzerstern“, sagte Lina.<\/p>\n<p>Der Zweite war Carlo.<\/p>\n<p>Er hatte ein Klemmbrett dabei. Auf dem Klemmbrett klemmte ein Blatt mit Kästchen, und in die Kästchen schrieb er Dinge, während er noch den Steg entlangging. Er schaute Felix an, schrieb etwas, schaute Lina an, schrieb etwas.<\/p>\n<p>„Wie viele Pokémon habt ihr?“, fragte er.<\/p>\n<p>Felix wollte gerade nachdenken.<\/p>\n<p>„Dreiundvierzig“, sagte Lina. „Zusammen.“<\/p>\n<p>Carlo schrieb die Zahl auf. Dann unterstrich er sie zweimal.<\/p>\n<p>„Das ist viel“, sagte er.<\/p>\n<p>„Es sind nicht alle hier“, sagte Felix.<\/p>\n<p>„Wie viele sind hier?“<\/p>\n<p>„Neun.“<\/p>\n<p>Carlo schrieb auch das auf.<\/p>\n<p>Die Dritte war Rosalie.<\/p>\n<p>Sie trug einen gelben Regenmantel, obwohl kein Wölkchen am Himmel war, und sie kam nur bis zum Anfang des Stegs. Dort blieb sie stehen und hielt sich mit beiden Händen am Geländer fest.<\/p>\n<p>Felix hatte Garados am Morgen ins Wasser gelassen, damit es sich die Bucht anschauen konnte. Jetzt hob es den Kopf aus den Wellen, groß und blau und mit Wasser, das ihm in Fäden vom Maul lief, und schaute neugierig zum Steg herüber.<\/p>\n<p>Rosalie wurde ganz weiß im Gesicht.<\/p>\n<p>Felix sah es sofort. Er hob den Ball und holte Garados zurück, ohne ein Wort, und das Wasser schloss sich über der Stelle, als wäre nie etwas da gewesen.<\/p>\n<p>„Es ist weg“, sagte er. „Es ist lieb, aber es ist groß. Das war zu viel für den Anfang.“<\/p>\n<p>Rosalie ließ das Geländer nicht los. Aber sie nickte.<\/p>\n<p>Der Vierte war Caspar.<\/p>\n<p>Caspar kam gerannt. Er rannte den Pfad herunter, er rannte über den Sand, und er rannte direkt an Felix und Lina vorbei, dorthin, wo Linas Gallopa im Gras neben dem Bootshaus stand und in der Morgensonne döste.<\/p>\n<p>Gallopas Mähne brannte. Sie brannte ruhig und orange, so wie ein Kaminfeuer, wenn das Holz schon ganz durch ist.<\/p>\n<p>Caspar streckte die Hand aus und griff mitten hinein.<\/p>\n<p>Gallopa machte einen Schritt zur Seite. Nur einen. Ganz ruhig und ganz ohne Aufregung, aber so, dass Caspars Hand in die Luft griff.<\/p>\n<p>„He“, sagte Caspar. „Es ist weggegangen.“<\/p>\n<p>„Ja“, sagte Lina. Sie war schon neben ihm. „Das macht es, wenn jemand fragt, ohne zu fragen.“<\/p>\n<p>„Ich hab doch gar nicht gefragt.“<\/p>\n<p>„Genau“, sagte Lina.<\/p>\n<p>Zum Mittagessen gab es im Bootshaus Kakao aus Birks Thermoskanne und Brote, die Birk geschmiert hatte, und die Brote waren ein bisschen zu dick, aber niemand beschwerte sich.<\/p>\n<p>Felix schaute auf sein Notizbuch. Plan eins hatte vorgesehen, dass er am Vormittag eine Einführung über Wasser-Pokémon hält. Stattdessen hatte er zwanzig Minuten damit verbracht, Glitzerstern zu erklären, warum man Pailletten nicht ins Salzwasser tunken sollte, und weitere zehn Minuten damit, Carlo alle neun Pokémon einzeln zu nennen.<\/p>\n<p>Er strich Plan eins durch.<\/p>\n<p>Am Nachmittag führte Lina alle zur Weide hinter dem Bootshaus.<\/p>\n<p>Dort standen ihre drei Gallopa. Das Feuer-Gallopa mit der orangen Mähne. Das große Galar-Gallopa, dessen Mähne aussah wie Zuckerwatte in Lila und Türkis und das so ruhig stand, als hätte es alle Zeit der Welt. Und das junge Galar-Gallopa, kleiner und schlanker, mit einem Horn, das so durchsichtig war, dass die Sonne hindurchschien.<\/p>\n<p>Carlo zählte.<\/p>\n<p>„Drei Pferde“, sagte er. „Vier Kinder.“<\/p>\n<p>Er schaute auf sein Klemmbrett. Dann schaute er Lina an, sehr ernst.<\/p>\n<p>„Das geht nicht auf.“<\/p>\n<p>„Nein“, sagte Lina. „Noch nicht.“<\/p>\n<p>In der Nacht schliefen die vier Kinder im Bootshaus, in Schlafsäcken auf den Bänken, und Felix und Lina schliefen nebenan im kleinen Raum mit den Seilen.<\/p>\n<p>Felix wachte auf, weil es draußen knisterte.<\/p>\n<p>Er ging leise ans Fenster.<\/p>\n<p>Auf der Weide stand das Feuer-Gallopa und leuchtete im Dunkeln. Und zehn Meter davon entfernt, auf einem umgedrehten Eimer, saß Rosalie in ihrem gelben Regenmantel. Sie saß ganz still. Sie schaute das Feuer an, und das Feuer schaute sie an, und keiner von beiden bewegte sich.<\/p>\n<p>Lina stand plötzlich neben ihm.<\/p>\n<p>„Sollen wir sie reinholen?“, flüsterte Felix.<\/p>\n<p>„Nein“, sagte Lina. Sie schaute eine Weile hinaus. „Sie hat geübt.“<\/p>"}, {"num": "2", "label": "Kapitel 2", "title": "Feuer, das nicht brennt", "html": "<p>„Heute reitet niemand“, sagte Lina.<\/p>\n<p>Glitzerstern ließ die Arme fallen.<\/p>\n<p>„Aber du hast gesagt, du bringst uns Reiten bei!“<\/p>\n<p>„Mache ich auch“, sagte Lina. „Heute fängt es an. Und es fängt nicht oben an. Es fängt unten an.“<\/p>\n<p>Sie stellte einen Eimer mit Äpfeln ins Gras und einen zweiten Eimer mit Bürsten daneben. Dann nahm sie einen Stock und zog damit eine Linie in den Sand am Rand der Weide.<\/p>\n<p>„Drei Meter“, sagte sie. „Bis hierher dürft ihr. Weiter nicht, bis ein Gallopa selbst zu euch kommt.“<\/p>\n<p>Carlo schrieb auf: drei Meter.<\/p>\n<p>„Und wenn es nicht kommt?“, fragte Caspar.<\/p>\n<p>„Dann wartet ihr.“<\/p>\n<p>„Wie lange?“<\/p>\n<p>„So lange, wie es braucht“, sagte Lina.<\/p>\n<p>Caspar machte ein Gesicht, als hätte man ihm gesagt, dass Weihnachten dieses Jahr ausfällt.<\/p>\n<p>Lina setzte sich auf den Boden, genau auf die Linie, und die Kinder setzten sich neben sie. Vor ihnen grasten die drei Gallopa, und das Feuer-Gallopa hob ab und zu den Kopf und schaute herüber.<\/p>\n<p>„Ich erkläre euch etwas über das Feuer“, sagte Lina. „Und das ist das Wichtigste, was ihr heute lernt.“<\/p>\n<p>Rosalie zog die Knie an.<\/p>\n<p>„Ein Gallopa hat Feuer in der Mähne und im Schweif“, sagte Lina. „Das Feuer ist echt. Wenn jemand es angreift, ist es heiß. Wenn jemand fremd ist und zu schnell kommt, ist es auch heiß.“<\/p>\n<p>Sie machte eine Pause.<\/p>\n<p>„Aber wenn ein Gallopa jemandem vertraut, dann brennt das Feuer nicht. Dann ist es nur warm. Wie eine Decke.“<\/p>\n<p>„Woher weiß das Feuer das?“, fragte Carlo.<\/p>\n<p>„Das Feuer weiß es nicht“, sagte Lina. „Gallopa weiß es.“<\/p>\n<p>Caspar hielt es genau sieben Minuten aus.<\/p>\n<p>Dann stand er auf, nahm einen Apfel aus dem Eimer und ging über die Linie. Er ging nicht schnell, das musste man ihm lassen. Aber er ging, und er ging direkt auf das Feuer-Gallopa zu, den Apfel in der ausgestreckten Hand.<\/p>\n<p>„Caspar“, sagte Lina.<\/p>\n<p>„Ich frage ja diesmal“, sagte Caspar. „Mit dem Apfel.“<\/p>\n<p>Gallopa schaute ihn an. Es schaute den Apfel an. Und dann drehte es sich um und ging zum anderen Ende der Weide, ganz ruhig, ohne Eile, und fing dort wieder an zu grasen.<\/p>\n<p>Caspar stand mit dem Apfel allein im Gras.<\/p>\n<p>„Es mag mich nicht“, sagte er.<\/p>\n<p>„Es kennt dich nicht“, sagte Lina. „Das ist etwas anderes. Komm zurück hinter die Linie.“<\/p>\n<p>Caspar kam zurück. Er setzte sich hin und biss selbst in den Apfel, ziemlich wütend.<\/p>\n<p>Glitzerstern hatte inzwischen eine andere Idee gehabt.<\/p>\n<p>Sie stellte sich an die Linie, stemmte eine Hand in die Hüfte und hob das Kinn, und ihre Pailletten glitzerten in der Sonne. Sie stand da wie auf einem Foto. Dann drehte sie sich ein bisschen, damit die Pailletten auch von der anderen Seite glitzerten.<\/p>\n<p>„Was machst du?“, fragte Felix. Er war gerade von der Bucht heraufgekommen.<\/p>\n<p>„Ich zeige mich“, sagte Glitzerstern. „Damit sie sehen, wie schön ich bin. Dann kommen sie.“<\/p>\n<p>Das große Galar-Gallopa schaute kurz herüber. Dann schaute es wieder ins Gras.<\/p>\n<p>„Es hat nicht hingeschaut“, sagte Glitzerstern beleidigt.<\/p>\n<p>„Es hat hingeschaut“, sagte Lina. „Es war bloß nicht beeindruckt.“<\/p>\n<p>Carlo hatte die ganze Zeit gezählt.<\/p>\n<p>Er saß an der Linie, den Apfel auf dem flachen Knie, und zählte leise vor sich hin. Bei dreiundachtzig schaute Lina zu ihm hinüber.<\/p>\n<p>„Was zählst du?“<\/p>\n<p>„Sekunden“, sagte Carlo. „Damit ich weiß, wie lange es dauert.“<\/p>\n<p>„Hör auf zu zählen“, sagte Lina.<\/p>\n<p>Carlo schaute sie an, als hätte sie ihm gesagt, er solle aufhören zu atmen.<\/p>\n<p>„Warum?“<\/p>\n<p>„Weil du dann auf die Zahlen schaust und nicht auf das Gallopa. Und das Gallopa merkt das.“<\/p>\n<p>Carlo legte das Klemmbrett ins Gras, mit der beschriebenen Seite nach unten. Es fiel ihm sichtlich schwer. Dann saß er einfach da, den Apfel auf dem Knie, und schaute.<\/p>\n<p>Es dauerte ungefähr zwei Minuten. Niemand zählte sie.<\/p>\n<p>Das junge Galar-Gallopa hob den Kopf. Es kam herüber, mit kleinen, vorsichtigen Schritten, und das durchsichtige Horn fing das Licht und warf einen hellen Fleck auf Carlos Hand. Es blieb an der Linie stehen. Es senkte den Kopf.<\/p>\n<p>Und es nahm den Apfel.<\/p>\n<p>Carlo hielt die Luft an. Er bewegte sich nicht. Er bewegte sich auch dann noch nicht, als das Gallopa längst wieder zurück zu den anderen gegangen war.<\/p>\n<p>„Hast du das gesehen?“, flüsterte er schließlich.<\/p>\n<p>„Ja“, sagte Lina.<\/p>\n<p>„Wie lange hat es gedauert?“<\/p>\n<p>„Keine Ahnung“, sagte Lina und grinste. „Ich hab nicht gezählt.“<\/p>\n<p>Am Nachmittag bürsteten sie das große Galar-Gallopa, das sich hinstellte und alles mit sich machen ließ, als wäre es ein sehr geduldiger Sessel. Rosalie bürstete ganz vorsichtig an seinem Bein und schaute dabei immer wieder hinüber zum Feuer-Gallopa am anderen Ende der Weide.<\/p>\n<p>„Du schaust dauernd zu dem anderen“, sagte Lina leise.<\/p>\n<p>Rosalie bürstete weiter.<\/p>\n<p>„Bei meiner Oma“, sagte sie nach einer Weile, „gibt es einen Ofen. Einen alten. Aus Eisen. Man muss Holz hineinlegen. Und einmal war die Tür offen, und ich wollte nur gucken, und dann ist das Feuer herausgekommen. Nicht ganz. Nur ein bisschen. Aber so schnell.“<\/p>\n<p>Sie zeigte mit der Bürste, wie schnell.<\/p>\n<p>„Seitdem mag ich kein Feuer.“<\/p>\n<p>Lina nickte.<\/p>\n<p>„Das verstehe ich“, sagte sie. „Ein Ofen fragt nicht. Gallopa fragt.“<\/p>\n<p>Rosalie bürstete eine ganze Weile schweigend weiter.<\/p>\n<p>„Ich will auf dem Feuer-Gallopa reiten“, sagte sie dann. „Nicht auf dem hier. Auf dem anderen.“<\/p>\n<p>Lina schaute sie an.<\/p>\n<p>„Später“, sagte sie.<\/p>\n<p>Rosalie nickte, als hätte sie genau diese Antwort erwartet.<\/p>\n<p>Kurz vor Schluss versuchten Caspar und Glitzerstern gleichzeitig, sich auf das junge Galar-Gallopa zu setzen, weil es Carlo den Apfel abgenommen hatte und deshalb, wie Caspar sagte, „offensichtlich das netteste“ war.<\/p>\n<p>Sie kamen nicht weit.<\/p>\n<p>Das junge Gallopa schaute sie an, und sein Horn leuchtete ganz kurz auf, ein helles, weiches Licht. Und dann schwebten Caspar und Glitzerstern einen Zentimeter über dem Boden, wurden sanft einen Meter rückwärts getragen und ganz vorsichtig ins Gras gesetzt. Nebeneinander. Hinter die Linie.<\/p>\n<p>Sie saßen da und blinzelten.<\/p>\n<p>„Psychokinese“, sagte Lina. „Das war die höfliche Version.“<\/p>\n<p>„Gibt es eine unhöfliche?“, fragte Glitzerstern.<\/p>\n<p>„Ja“, sagte Lina. „Die wollt ihr nicht kennenlernen.“<\/p>\n<p>Am Abend fehlte eine Bürste.<\/p>\n<p>Lina zählte die Bürsten im Eimer, dann zählte Carlo sie noch einmal, weil er das besser konnte, und es waren vier statt fünf.<\/p>\n<p>Sie fanden sie im letzten Licht am anderen Ende der Weide, an der Stelle, wo das Feuer-Gallopa am Nachmittag gegrast hatte. Das Gras war dort noch warm. Neben der Bürste lag ein Apfel, einmal angebissen, mit kleinen Zahnspuren.<\/p>\n<p>Lina hockte sich hin und schaute.<\/p>\n<p>„Das ist fünf Meter vom Gallopa entfernt“, sagte sie.<\/p>\n<p>„Wer war das?“, fragte Felix.<\/p>\n<p>Lina schaute hinüber zum Bootshaus, wo im Fenster ein gelber Regenmantel am Haken hing.<\/p>\n<p>„Jemand, der geübt hat“, sagte sie. „Zehn Meter gestern. Fünf heute.“<\/p>\n<p>Später saß Felix allein auf dem Steg. Er schlug sein Notizbuch auf und schaute die drei Pläne für morgen an, die er gestern geschrieben hatte. Morgen war sein Tag. Morgen kam die Bucht dran, und das Wasser, und Garados, vor dem Rosalie so weiß geworden war.<\/p>\n<p>Er las die Pläne einmal durch.<\/p>\n<p>Dann strich er alle drei durch.<\/p>\n<p>Darunter schrieb er einen einzigen Satz.<\/p>\n<p>Morgen bin ich dran. Und ich weiß nicht, wie man das macht.<\/p>"}, {"num": "3", "label": "Kapitel 3", "title": "Sechs gegen einen", "html": "<p>Felix stand um sechs Uhr auf dem Steg, weil er nicht mehr schlafen konnte.<\/p>\n<p>Die Bucht war glatt wie ein Teller. Ein paar Wingull saßen auf den Pfählen und schauten ihn an, als wollten sie fragen, was er hier so früh zu suchen hätte.<\/p>\n<p>„Ich weiß es auch nicht“, sagte Felix zu ihnen.<\/p>\n<p>Er hatte keinen Plan. Er hatte nur sein Notizbuch, in dem drei durchgestrichene Pläne standen und ein Satz, den er lieber nicht noch einmal lesen wollte.<\/p>\n<p>Um neun saßen die vier Kinder auf der Bank am Ende des Stegs. Rosalie saß ganz außen, so weit vom Wasser weg, wie es auf einer Bank am Wasser eben ging.<\/p>\n<p>„Heute geht es um Wasserkämpfe“, sagte Felix.<\/p>\n<p>„Endlich“, sagte Caspar.<\/p>\n<p>Felix holte tief Luft. Dann warf er fünf Bälle, einen nach dem anderen.<\/p>\n<p>Turtok landete mit einem gewaltigen Platschen im flachen Wasser und richtete die Kanonen auf dem Panzer auf, sehr stolz. Golking schoss durch die Wellen, das Horn voraus. Milotic glitt aus dem Licht ins Wasser, so leise, dass man es kaum hörte, und die Sonne machte aus seinen Schuppen einen Regenbogen. Aquana tauchte ein und war verschwunden, und erst nach einem Moment sah man, dass es nicht weg war, sondern einfach durchsichtig geworden war, eins mit dem Wasser. Tohaido zog einen schnellen Kreis, und die Wingull flogen alle gleichzeitig auf.<\/p>\n<p>„Wow“, sagte Glitzerstern. Zum ersten Mal sagte sie nichts über sich selbst.<\/p>\n<p>Carlo zählte. „Fünf“, sagte er. „Du hast gesagt, es sind sechs.“<\/p>\n<p>Felix schaute zu Rosalie.<\/p>\n<p>„Das sechste ist Garados“, sagte er. „Du hast es gestern gesehen. Ich lasse es nur heraus, wenn du sagst, dass es in Ordnung ist.“<\/p>\n<p>Rosalie schaute ihn lange an.<\/p>\n<p>„Warum fragst du mich?“<\/p>\n<p>„Weil du die bist, die Angst hat“, sagte Felix. „Dann bist du auch die, die entscheidet.“<\/p>\n<p>Rosalie schaute auf das Wasser. Dann zeigte sie auf die andere Seite der Bucht, wo die Felsen waren, sehr weit weg.<\/p>\n<p>„Wenn es da drüben bleibt“, sagte sie.<\/p>\n<p>„Es bleibt da drüben“, sagte Felix.<\/p>\n<p>Er warf den Ball so weit er konnte, und Garados tauchte ganz am anderen Ende der Bucht auf, groß wie ein Bus, aber klein wie ein Spielzeug auf diese Entfernung. Es schaute herüber, und dann blieb es, wo es war, und legte den Kopf auf einen Felsen.<\/p>\n<p>Rosalie atmete aus. Sie rutschte auf der Bank einen halben Meter näher an die anderen.<\/p>\n<p>„So“, sagte Felix, und jetzt hatte er doch eine Idee. „Ich zeige euch, was passiert, wenn sechs Pokémon zusammenarbeiten.“<\/p>\n<p>Er suchte die Bucht ab. Zwischen den Steinen am Ufer, dort wo die Wellen kleine Pfützen hinterließen, bewegte sich etwas Rotes.<\/p>\n<p>Ein Krebscorps. Ein kleines, mit zwei großen Scheren, und es schaute aus einer Felsspalte heraus und klapperte.<\/p>\n<p>„Das da“, sagte Felix. „Sechs gegen einen. Wir versuchen, es aus seinem Versteck zu holen. Ganz vorsichtig. Niemand tut ihm weh. Wir zeigen nur, wie man ein Pokémon im Wasser einkreist.“<\/p>\n<p>Die Kinder rutschten nach vorn.<\/p>\n<p>„Golking, von links. Tohaido, von rechts. Milotic, versperr den Weg nach draußen. Aquana, unter Wasser bleiben. Turtok, von vorn.“<\/p>\n<p>Garados am anderen Ende hob den Kopf, um zu zeigen, dass es auch noch da war.<\/p>\n<p>„Garados, du bleibst da“, sagte Felix. „Du bist die Wand.“<\/p>\n<p>Es sah großartig aus. Golking kam von links, Tohaido von rechts, Milotic lag wie ein Band quer vor der kleinen Bucht, und Turtok watete langsam auf den Felsen zu.<\/p>\n<p>Krebscorps schaute ihnen entgegen.<\/p>\n<p>Dann kam eine Welle.<\/p>\n<p>Sie war nicht groß. Aber als sie zurücklief, lief Krebscorps mit ihr, flach am Boden, unter Milotic hindurch, zwischen zwei Steinen durch, die so eng standen, dass Turtok nicht hinterherkam, und plumpste in eine andere Spalte zwei Meter weiter.<\/p>\n<p>„Da!“, rief Caspar.<\/p>\n<p>„Tohaido, die andere Spalte!“<\/p>\n<p>Tohaido schoss hin. Die nächste Welle kam. Krebscorps war wieder weg.<\/p>\n<p>So ging es zehn Minuten. Sechs große, starke, gut trainierte Pokémon schwammen, wateten und tauchten zwischen den Felsen herum, und ein einziges kleines Krebscorps war immer genau dort, wo keines von ihnen war. Einmal saß es sogar kurz auf Turtoks Panzer, und Turtok merkte es nicht.<\/p>\n<p>Glitzerstern fing an zu kichern. Dann lachte Caspar. Dann lachte sogar Rosalie, mit der Hand vor dem Mund.<\/p>\n<p>Felix wurde rot.<\/p>\n<p>„Stopp“, sagte er. „Alle zurück.“<\/p>\n<p>Seine Pokémon kamen zum Steg zurück und schauten ziemlich beleidigt. Turtok spritzte sich Wasser über den Kopf, als müsste es sich abkühlen.<\/p>\n<p>Felix setzte sich auf den Steg. Er wusste nicht, was er jetzt sagen sollte. Er hatte zeigen wollen, wie stark seine Pokémon waren, und stattdessen hatten alle gesehen, wie ein Krebscorps sie an der Nase herumführte.<\/p>\n<p>Es war Carlo, der etwas sagte.<\/p>\n<p>„Es geht immer nach der Welle“, sagte er.<\/p>\n<p>Felix schaute auf.<\/p>\n<p>„Was?“<\/p>\n<p>„Krebscorps.“ Carlo hielt das Klemmbrett hoch. Er hatte Striche gemacht, eine ganze Reihe. „Es läuft nie, wenn die Welle kommt. Es läuft immer, wenn sie zurückgeht. Elfmal. Jedes Mal.“<\/p>\n<p>Felix starrte auf die Striche.<\/p>\n<p>„Und es läuft immer in eine Spalte, wo es vorher schon war“, sagte Glitzerstern. „Es hat drei. Ich hab gesehen, wie es da glänzt. Da sind Muscheln drin.“<\/p>\n<p>„Es kennt das Wasser“, sagte Rosalie leise. „Ihr nicht.“<\/p>\n<p>Es wurde still auf dem Steg.<\/p>\n<p>Felix schaute die vier Kinder an. Dann schaute er auf sein Notizbuch. Und dann lachte er auch, ein bisschen, über sich selbst.<\/p>\n<p>„Ihr habt recht“, sagte er. „Das ist die erste Regel. Und ich hab sie gerade selbst vergessen.“<\/p>\n<p>Er stand auf.<\/p>\n<p>„Im Wasser gewinnt nicht der, der stärker ist. Und auch nicht der, der mehr ist. Im Wasser gewinnt der, der das Wasser kennt.“<\/p>\n<p>„Dann müssen wir das Wasser kennenlernen“, sagte Carlo.<\/p>\n<p>„Genau“, sagte Felix.<\/p>\n<p>Den Rest des Tages lernten sie das Wasser kennen.<\/p>\n<p>Sie zählten Wellen, mit Carlo. Sie fanden heraus, wo die Strömung zog, indem Glitzerstern eine Paillette von ihrer Jacke abmachte und sie ins Wasser warf, und alle schauten, wohin sie trieb. Caspar legte sich bäuchlings auf den Steg und schaute zehn Minuten lang ins Wasser, ohne sich zu bewegen, was niemand für möglich gehalten hätte, und sah dabei drei Schmerbe und eine Qurtel, die sich unter dem Steg versteckt hatten.<\/p>\n<p>Und Aquana zeigte Rosalie, wie es sich im Wasser auflöste.<\/p>\n<p>Rosalie saß am Ende des Stegs, und Aquana tauchte vor ihr auf, ganz langsam, und dann wieder unter, und war fort, und dann tauchte es woanders wieder auf, ganz nah, und legte das Kinn auf den Rand des Stegs.<\/p>\n<p>Rosalie streckte einen Finger aus. Aquana schnupperte daran.<\/p>\n<p>„Es ist kühl“, sagte sie überrascht.<\/p>\n<p>„Wasser-Pokémon sind kühl“, sagte Felix. „Feuer-Pokémon sind warm. Das ist eigentlich ganz einfach.“<\/p>\n<p>Rosalie schaute zur Weide hinauf, wo das Feuer-Gallopa stand.<\/p>\n<p>„Ja“, sagte sie nachdenklich.<\/p>\n<p>Am Nachmittag kam das Krebscorps noch einmal aus seiner Spalte.<\/p>\n<p>Es kletterte auf den Stein ganz vorne, klapperte zweimal mit den Scheren und schaute direkt zum Steg herüber. Genau zu Carlo, der seine Striche zählte.<\/p>\n<p>„Es guckt mich an“, sagte Carlo.<\/p>\n<p>„Ja“, sagte Felix. „Ich glaube, es hat bemerkt, dass du es bemerkt hast.“<\/p>\n<p>Carlo schaute zurück. Er bewegte sich nicht. Und das Krebscorps auch nicht. Und dann kam eine Welle, und als sie zurückging, war das Krebscorps weg.<\/p>\n<p>Carlo schrieb etwas auf sein Klemmbrett. Felix sah, was es war. Es war keine Zahl.<\/p>\n<p>Es war ein kleines, sehr schief gezeichnetes Krebscorps.<\/p>\n<p>Am Abend saß Felix wieder auf dem Steg. Lina kam und setzte sich neben ihn und ließ die Beine über dem Wasser baumeln.<\/p>\n<p>„Ich habe gehört, ein Krebscorps hat deine sechs Pokémon besiegt“, sagte sie.<\/p>\n<p>„Wer hat das erzählt?“<\/p>\n<p>„Alle vier. Gleichzeitig.“<\/p>\n<p>Felix stöhnte.<\/p>\n<p>„Es war ein guter Tag“, sagte Lina. „Sie haben mehr gelernt, als wenn es geklappt hätte.“<\/p>\n<p>Felix schlug sein Notizbuch auf und schrieb einen Satz unter den von gestern.<\/p>\n<p>Sechs sind nicht mehr als einer, wenn der eine zu Hause ist.<\/p>"}, {"num": "4", "label": "Kapitel 4", "title": "Der Ball fliegt zu früh", "html": "<p>„Heute ist Fangen dran“, sagte Lina.<\/p>\n<p>Sie stand vor der kleinen Tafel im Bootshaus, und vor ihr auf dem Tisch lagen vier Pokébälle. Leere. Rot und weiß und neu, und sie glänzten so, dass Glitzerstern sofort einen haben wollte.<\/p>\n<p>„Die bekommt ihr“, sagte Lina. „Jeder einen. Für die ganzen zwei Wochen. Wenn er weg ist, ist er weg.“<\/p>\n<p>„Nur einen?“, fragte Caspar.<\/p>\n<p>„Nur einen“, sagte Felix. „Mehr braucht man nicht. Wenn man es richtig macht.“<\/p>\n<p>Carlo schrieb auf: ein Ball.<\/p>\n<p>Bevor irgendjemand einen Ball anfassen durfte, gingen sie hinaus auf den Strand, und Lina hob einen Ball vom Tisch hoch und legte ihn auf ihre flache, offene Hand.<\/p>\n<p>„So hält man einen Ball, wenn man ein Pokémon fragt“, sagte sie. „Nicht in der Faust. Auf der flachen Hand. Damit es sehen kann, was du hast. Und damit es sehen kann, dass du ihn nicht wirfst.“<\/p>\n<p>„Und dann?“, fragte Glitzerstern.<\/p>\n<p>„Dann sagt man: Du musst nicht.“<\/p>\n<p>Glitzerstern runzelte die Stirn. „Aber ich will doch, dass es muss.“<\/p>\n<p>„Nein“, sagte Felix. „Das willst du nicht. Glaub mir.“<\/p>\n<p>„Es entscheidet“, sagte Lina. „Nicht du.“<\/p>\n<p>Dann übten sie werfen.<\/p>\n<p>Felix stellte am Strand drei leere Eimer auf, in verschiedenen Abständen, und die Kinder warfen ihre Bälle hinein. Rosalie traf dreimal hintereinander den nächsten Eimer und dann keinen mehr. Glitzerstern warf mit einer Drehung, die sehr schön aussah und überhaupt nichts traf. Carlo rechnete erst lange, warf dann und traf den mittleren Eimer genau in die Mitte.<\/p>\n<p>Caspar traf alle drei.<\/p>\n<p>Er traf sie so schnell hintereinander, dass Felix kaum mit dem Aufstellen hinterherkam. Er warf hart und gerade und ohne zu zögern, und der Ball landete jedes Mal mit einem Klonk im Eimer.<\/p>\n<p>„Ich kann das“, sagte Caspar. „Ich kann das schon.“<\/p>\n<p>„Werfen kannst du“, sagte Lina. „Ja.“<\/p>\n<p>Zur Mittagszeit gingen sie hinauf zu den Dünen, hinter der Station, wo das Strandgras hoch stand und der Wind Muster in den Sand malte.<\/p>\n<p>„Hier leben Zigzachs“, sagte Lina. „Sie sind neugierig und flink, und sie laufen im Zickzack, deshalb heißen sie so. Wenn wir still sind, kommt vielleicht eins.“<\/p>\n<p>Sie setzten sich in eine Mulde zwischen zwei Dünen, und es wurde ganz still.<\/p>\n<p>Man hörte das Meer. Man hörte den Wind im Gras. Man hörte, wie Glitzersterns Pailletten klimperten, bis sie die Arme fest um die Knie legte.<\/p>\n<p>Dann raschelte es.<\/p>\n<p>Ein Zigzachs kam aus dem Gras, braun und cremeweiß gestreift, mit einer schwarzen Nase, die ununterbrochen schnupperte. Es lief einen Zickzack, blieb stehen, lief einen anderen Zickzack. Es kam näher. Es schnupperte an Linas Rucksack. Es schaute die Kinder an, eins nach dem anderen.<\/p>\n<p>Und dann schaute es Caspar an.<\/p>\n<p>Felix sah es kommen. Er sah, wie Caspars Hand zur Tasche ging, wie seine Finger sich um den Ball schlossen. Eine Faust.<\/p>\n<p>„Caspar, nicht …“<\/p>\n<p>Der Ball flog.<\/p>\n<p>Er flog gerade und hart, genau so wie am Strand, und er hätte getroffen. Aber Zigzachs war schneller. Es sprang zur Seite, einmal links, einmal rechts, und der Ball schlug in den Sand, öffnete sich, schnappte leer wieder zu und rollte die Düne hinunter.<\/p>\n<p>Zigzachs war fort. Man hörte noch das Gras rascheln. Dann nicht mehr.<\/p>\n<p>Niemand sagte etwas.<\/p>\n<p>Caspar stand auf, ging die Düne hinunter und hob den Ball auf. Er klopfte den Sand ab. Er kam zurück und setzte sich wieder hin, und er schaute niemanden an.<\/p>\n<p>„Es war so nah“, sagte er schließlich. „Es hat mich angeschaut.“<\/p>\n<p>„Ja“, sagte Lina. „Es hat dich angeschaut. Es wollte wissen, wer du bist.“<\/p>\n<p>„Und jetzt weiß es das“, sagte Caspar, sehr leise.<\/p>\n<p>Felix setzte sich neben ihn in den Sand.<\/p>\n<p>Er dachte eine Weile nach, ob er es erzählen sollte. Er hatte es noch nie jemandem erzählt außer Lina.<\/p>\n<p>„Als ich so alt war wie du“, sagte er, „stand ich mal auf einem Steg. Nicht hier. Zu Hause. Und unter dem Steg schwamm ein Pokémon, das ich unbedingt haben wollte. Es war wunderschön. Ich hatte meinen ersten Ball dabei.“<\/p>\n<p>Caspar schaute ihn jetzt an.<\/p>\n<p>„Es kam hoch und schaute mich an“, sagte Felix. „Genauso wie Zigzachs eben. Und ich hab geworfen. Sofort. Ich dachte, wenn ich warte, ist es weg.“<\/p>\n<p>„Und?“<\/p>\n<p>„Und dann war es weg“, sagte Felix. „Ich bin danach jeden Tag zu dem Steg gegangen. Einen ganzen Sommer lang. Es ist nie wiedergekommen.“<\/p>\n<p>Caspar drehte den Ball in den Händen.<\/p>\n<p>„Nie?“<\/p>\n<p>„Nie.“<\/p>\n<p>Eine Weile war es still. Carlo schrieb nichts auf. Glitzerstern klimperte nicht.<\/p>\n<p>„Aber Zigzachs leben hier viele“, sagte Lina. „Und Zigzachs sind neugierig. Neugierige Pokémon vergessen schnell, dass sie sich erschreckt haben. Es gibt eine zweite Chance. Vielleicht. Aber nicht heute.“<\/p>\n<p>„Wann?“, fragte Caspar.<\/p>\n<p>„Wenn du stillhalten kannst“, sagte Lina.<\/p>\n<p>Caspar nickte. Es sah aus, als würde er gleich weinen, und dann tat er es doch nicht.<\/p>\n<p>Am Nachmittag übten sie stillhalten.<\/p>\n<p>Lina erfand ein Spiel dafür. Alle lagen im Gras, und Lina legte jedem einen Apfel auf den Bauch, und dann sagte sie: „Wir zählen. Eins. Zwei. Drei.“ Und dann musste man still liegen, bis das junge Galar-Gallopa kam und sich den Apfel holte.<\/p>\n<p>Glitzerstern kicherte, und der Apfel fiel herunter. Rosalie lag so still, dass das Gallopa sie zuerst gar nicht fand. Carlo lag still, aber man sah, wie seine Lippen sich bewegten, und Lina sagte „Carlo“, und die Lippen hörten auf.<\/p>\n<p>Caspar lag still.<\/p>\n<p>Er lag so still, dass Felix zweimal hinschauen musste. Das Gallopa kam, schnupperte, nahm den Apfel vorsichtig mit den Lippen von seinem Bauch und ging. Und Caspar lag immer noch still, bis Lina sagte: „Fertig.“<\/p>\n<p>Erst dann setzte er sich auf.<\/p>\n<p>„Das war schwer“, sagte er.<\/p>\n<p>„Ich weiß“, sagte Felix.<\/p>\n<p>Auf dem Rückweg zum Bootshaus blieb Carlo plötzlich stehen und zeigte hinauf zur höchsten Düne.<\/p>\n<p>„Da hat was geglitzert“, sagte er.<\/p>\n<p>Alle schauten hin. Oben auf der Düne war nichts. Nur Gras und Himmel.<\/p>\n<p>„Das war nicht ich“, sagte Glitzerstern sofort. „Ich bin hier.“<\/p>\n<p>„Es hat zweimal geglitzert“, sagte Carlo. „Wie ein Fernglas.“<\/p>\n<p>Felix schaute lange hinauf. Dann schaute er zur Station, zum Fenster von Birks Arbeitszimmer.<\/p>\n<p>„Wahrscheinlich ein Vogelbeobachter“, sagte Lina. Aber sie sagte es so, wie man etwas sagt, das man selbst nicht ganz glaubt.<\/p>\n<p>Als es dunkel wurde, ging Caspar allein hinaus auf den Strand. Felix sah ihn vom Fenster aus. Er ging bis zum Fuß der Dünen und setzte sich dort in den Sand, den Ball auf der flachen Hand.<\/p>\n<p>Er saß da, bis Birk ihn zum Abendessen rief.<\/p>\n<p>Am Morgen lagen am Fuß der Dünen kleine Pfotenspuren im Sand. Sie liefen im Zickzack um die Stelle herum, wo Caspar gesessen hatte. Einmal ganz herum. Und dann wieder zurück ins Gras.<\/p>"}, {"num": "5", "label": "Kapitel 5", "title": "Ein Ballon über der Düne", "html": "<p>Am fünften Tag durften sie zum ersten Mal aufsitzen.<\/p>\n<p>Lina hatte es beim Frühstück gesagt, ganz nebenbei, zwischen zwei Bissen Brot, und Glitzerstern hatte vor Freude ihren Kakao umgestoßen.<\/p>\n<p>„Aber nur auf dem großen Galar-Gallopa“, sagte Lina. „Und nur im Schritt. Und ich halte es fest.“<\/p>\n<p>„Was heißt im Schritt?“, fragte Caspar.<\/p>\n<p>„Langsam“, sagte Lina.<\/p>\n<p>Caspar seufzte. Aber er sagte nichts mehr, und das war, wie Felix fand, schon ein großer Fortschritt.<\/p>\n<p>Das große Galar-Gallopa stand mitten auf der Weide, als hätte es gewusst, dass heute ein besonderer Tag war. Seine Mähne wehte im Wind, lila und türkis und rosa, und sie sah so weich aus, dass Rosalie die Hand ausstreckte, bevor sie es selbst merkte.<\/p>\n<p>„Darf ich?“<\/p>\n<p>„Frag es“, sagte Lina.<\/p>\n<p>Rosalie hielt die Hand ganz still in der Luft. Das Gallopa senkte den Kopf und legte die Nase in ihre Handfläche.<\/p>\n<p>„Das heißt ja“, sagte Lina.<\/p>\n<p>Lina erklärte das Aufsteigen. Man stellte sich an die linke Seite. Man legte eine Hand an den Hals, nicht an die Mähne. Lina machte eine Räuberleiter mit den Händen, man stieg hinein, und dann schwang man das Bein hinüber, und dann saß man.<\/p>\n<p>„Und dann?“, fragte Glitzerstern.<\/p>\n<p>„Und dann sitzt man“, sagte Lina. „Und atmet. Und merkt, wie es atmet.“<\/p>\n<p>Glitzerstern war die Erste.<\/p>\n<p>Felix hatte erwartet, dass sie sich in Pose setzen würde. Stattdessen saß sie ganz gerade, die Hände leicht auf dem Hals, und ihr Gesicht war vollkommen ernst. Das Gallopa ging einen Schritt. Glitzerstern wackelte nicht. Es ging zwei Schritte. Sie wackelte immer noch nicht.<\/p>\n<p>„Du sitzt gut“, sagte Lina überrascht.<\/p>\n<p>„Ich übe zu Hause“, sagte Glitzerstern. „Vor dem Spiegel. Wie man gerade sitzt. Damit man gut aussieht.“<\/p>\n<p>Lina lachte. „Dann hat das Gutaussehen endlich mal etwas genützt.“<\/p>\n<p>Glitzerstern strahlte so sehr, dass ihre Pailletten fast blass dagegen aussahen.<\/p>\n<p>Carlo saß steif wie ein Brett und fragte bei jedem Schritt, wie viele Schritte noch kämen. Rosalie saß ganz klein und hielt sich fest, aber sie lächelte, als das Gallopa einmal ganz langsam um die Weide ging. Und Caspar saß und atmete, so wie Lina gesagt hatte, und sagte die ganze Runde lang kein einziges Wort.<\/p>\n<p>Als er abstieg, schaute er zur Düne.<\/p>\n<p>„Glaubst du, das Zigzachs hat zugeschaut?“, fragte er.<\/p>\n<p>„Vielleicht“, sagte Lina.<\/p>\n<p>Am Nachmittag sah Rosalie den Ballon.<\/p>\n<p>Sie saß auf dem Zaun der Weide und schaute in den Himmel, weil sie gerade ein Wolkenschaf gefunden hatte. Und dann sagte sie: „Da ist eine Katze in der Luft.“<\/p>\n<p>Alle schauten hinauf.<\/p>\n<p>Über der höchsten Düne, hinter der Station, schwebte ein Heißluftballon. Er war groß und rund, und er hatte ein Gesicht. Zwei spitze Ohren. Schnurrhaare. Und vorne auf der Stirn ein goldenes Münzzeichen.<\/p>\n<p>„Das ist ein Mauzi“, sagte Carlo. „Ein Ballon, der aussieht wie ein Mauzi.“<\/p>\n<p>„Wie süß“, sagte Glitzerstern.<\/p>\n<p>Felix sagte gar nichts. Er schaute Lina an, und Lina schaute ihn an, und beide hatten denselben Gesichtsausdruck. Es war der Gesichtsausdruck von Leuten, die gerade eine sehr alte, sehr bekannte Nachricht bekommen haben.<\/p>\n<p>„Nicht schon wieder“, sagte Felix leise.<\/p>\n<p>„Doch“, sagte Lina. „Schon wieder.“<\/p>\n<p>„Kennt ihr den?“, fragte Caspar.<\/p>\n<p>„Wir kennen den“, sagte Felix. „Sehr gut sogar.“<\/p>\n<p>Der Ballon schwebte langsam über der Düne hin und her. Er kam nicht näher. Er schwebte nur dort oben, als würde er etwas suchen, und unter dem Korb blitzte zweimal etwas auf, kurz und hell.<\/p>\n<p>„Das Fernglas“, sagte Carlo. „Von gestern.“<\/p>\n<p>„Ja“, sagte Lina.<\/p>\n<p>Felix ging hinüber zur Station.<\/p>\n<p>Birk saß in seinem Arbeitszimmer am Schreibtisch und schrieb etwas in ein dickes Heft. Hinter ihm stand der Schrank mit den zwei Schlössern, dunkel und schwer und unverändert.<\/p>\n<p>„Professor“, sagte Felix. „Team Rocket ist da. Über der Düne.“<\/p>\n<p>Birk legte den Stift hin. Er drehte sich auf seinem Stuhl um und schaute den Schrank an. Dann stand er auf, holte den Schlüsselbund aus der Tasche und schloss beide Schlösser auf.<\/p>\n<p>Die Kiste war da. Er klappte den Deckel auf. Der rote Stein lag darin und der blaue Stein lag darin, auf blauem Samt, und sie schimmerten ein bisschen, auch ohne Licht.<\/p>\n<p>Birk schloss die Kiste wieder. Er schloss den Schrank wieder ab. Erst das obere Schloss, dann das untere.<\/p>\n<p>„Sie wissen, wo sie sind“, sagte er.<\/p>\n<p>„Woher?“<\/p>\n<p>„Ich weiß es nicht.“ Birk steckte den Schlüsselbund ein. „Aber man fliegt nicht mit einem Ballon über eine Düne, nur weil die Aussicht schön ist.“<\/p>\n<p>„Sollen wir die Sommerschule abbrechen?“, fragte Felix.<\/p>\n<p>Birk dachte nach. Draußen hörte man Glitzerstern lachen und Carlo, der etwas zählte.<\/p>\n<p>„Nein“, sagte er. „Die Kinder haben nichts damit zu tun. Und wenn wir jetzt alles abbrechen, haben die da oben schon gewonnen, ohne dass sie irgendetwas getan haben.“<\/p>\n<p>Er ging zum Fenster und schaute hinauf zur Düne.<\/p>\n<p>„Aber ihr passt auf.“<\/p>\n<p>Felix ging zurück zur Weide. Als er ankam, war der Ballon verschwunden. Der Himmel war leer und blau, und nur ein paar Wingull kreisten über der Düne.<\/p>\n<p>„Er ist weggeflogen“, sagte Rosalie. „Richtung Meer.“<\/p>\n<p>„Wer sind die?“, fragte Caspar.<\/p>\n<p>Felix und Lina schauten sich an.<\/p>\n<p>„Drei Leute und ein Mauzi“, sagte Lina schließlich. „Sie wollen immer Pokémon haben, die ihnen nicht gehören. Oder Dinge, die ihnen nicht gehören. Und meistens klappt es nicht.“<\/p>\n<p>„Meistens?“, fragte Carlo.<\/p>\n<p>„Immer“, sagte Felix. „Bis jetzt.“<\/p>\n<p>Am Abend, als die Kinder schon in ihren Schlafsäcken lagen, kam Glitzerstern noch einmal heraus. Sie hatte ihre Paillettenjacke über dem Schlafanzug an.<\/p>\n<p>„Lina?“<\/p>\n<p>„Hm?“<\/p>\n<p>„Wenn die Katzenleute wiederkommen“, sagte Glitzerstern, „dann sehe ich sie zuerst. Weil ich immer gucke, wer guckt.“<\/p>\n<p>Lina schaute sie lange an.<\/p>\n<p>„Das ist eine richtig gute Fähigkeit“, sagte sie. „Weißt du das?“<\/p>\n<p>Glitzerstern nickte, als hätte sie das schon immer gewusst. Dann ging sie wieder schlafen.<\/p>"}, {"num": "6", "label": "Kapitel 6", "title": "Carlo wartet", "html": "<p>Carlo stand am nächsten Morgen um halb sieben am Ufer.<\/p>\n<p>Felix fand ihn dort, als er zum Steg wollte. Carlo stand auf einem flachen Stein, die Hose bis zu den Knien hochgekrempelt, das Klemmbrett unter dem Arm, und schaute auf die Felsen, wo das Krebscorps wohnte.<\/p>\n<p>„Seit wann stehst du hier?“, fragte Felix.<\/p>\n<p>„Seit sechs“, sagte Carlo. „Um sechs Uhr vierzehn war es draußen. Um sechs Uhr einundzwanzig ist es wieder rein. Um sechs Uhr neunundzwanzig war es wieder draußen.“<\/p>\n<p>„Und was machst du jetzt?“<\/p>\n<p>Carlo schaute auf sein Klemmbrett. Er schaute lange darauf.<\/p>\n<p>„Ich weiß nicht“, sagte er. „Ich hab alles aufgeschrieben. Ich weiß, wann es rauskommt. Ich weiß, wohin es läuft. Ich weiß, wie viele Wellen es abwartet. Und ich weiß trotzdem nicht, wie man es fängt.“<\/p>\n<p>Felix setzte sich auf einen Stein daneben.<\/p>\n<p>„Weißt du, was vor dem Fangen kommt?“, fragte er.<\/p>\n<p>„Der Ball.“<\/p>\n<p>„Davor.“<\/p>\n<p>Carlo dachte nach. „Das Kennenlernen?“<\/p>\n<p>„Davor auch noch“, sagte Felix. „Ein Krebscorps ist ein stolzes Pokémon. Es lässt sich nicht von jemandem fangen, der nur zuschaut. Es will wissen, ob du etwas kannst. Es will einen Kampf.“<\/p>\n<p>Carlo wurde ein bisschen blass.<\/p>\n<p>„Ich hab doch gar kein Pokémon.“<\/p>\n<p>„Doch“, sagte Felix, und er hielt ihm einen Ball hin. „Für heute schon.“<\/p>\n<p>Um neun standen alle am Ufer. Die anderen drei Kinder saßen auf dem Steg und schauten zu, und Lina saß bei ihnen, und Rosalie hatte sich so hingesetzt, dass zwischen ihr und dem Wasser noch Glitzerstern war.<\/p>\n<p>Carlo hielt Felix' Ball in der Hand.<\/p>\n<p>„Golking“, sagte Felix. „Es ist schnell und es hat ein Horn. Es kennt diese Bucht noch nicht so gut wie Krebscorps. Aber es hört auf dich, wenn du ihm klar sagst, was es tun soll.“<\/p>\n<p>Carlo warf den Ball. Golking glitt ins Wasser, drehte eine Runde und schaute ihn erwartungsvoll an.<\/p>\n<p>Dann stand Carlo da und wusste nicht, was er sagen sollte.<\/p>\n<p>Das Krebscorps kam aus seiner Spalte. Es kletterte auf den vorderen Stein, schaute Golking an, schaute Carlo an und klapperte mit beiden Scheren. Es war ganz eindeutig eine Herausforderung.<\/p>\n<p>„Was soll ich machen?“, flüsterte Carlo.<\/p>\n<p>„Was weißt du über Krebscorps?“, fragte Felix zurück.<\/p>\n<p>Carlo schaute auf sein Klemmbrett. Und plötzlich änderte sich etwas in seinem Gesicht.<\/p>\n<p>„Es läuft, wenn die Welle zurückgeht“, sagte er. „Immer.“<\/p>\n<p>„Und?“<\/p>\n<p>„Und dann ist es nicht in der Spalte. Dann ist es draußen.“<\/p>\n<p>Carlo legte das Klemmbrett auf den Stein. Mit der beschriebenen Seite nach unten.<\/p>\n<p>Die erste Welle kam. Krebscorps blieb sitzen. Die Welle ging zurück. Krebscorps sprang.<\/p>\n<p>„Golking, jetzt! Zur zweiten Spalte!“<\/p>\n<p>Golking schoss los. Es war nicht dort, wo Krebscorps war. Es war dort, wo Krebscorps hinwollte. Und Krebscorps kam um den Stein herum und stand plötzlich Golking gegenüber, Horn gegen Schere, und blieb erschrocken stehen.<\/p>\n<p>Auf dem Steg sprang Caspar auf.<\/p>\n<p>Krebscorps fing sich schnell. Es riss die Scheren auseinander und aus seinem Maul kam ein Strahl aus Blasen, hart und schnell, mitten auf Golking zu.<\/p>\n<p>„Blubbstrahl“, rief Felix. „Golking ist ein Wasser-Pokémon, das tut ihm nicht viel. Aber pass auf die Scheren auf.“<\/p>\n<p>„Golking, tauch weg!“<\/p>\n<p>Golking tauchte. Die Blasen zischten über die Wasseroberfläche. Krebscorps machte einen Satz nach vorn, die große Schere offen, und schnappte ins Leere.<\/p>\n<p>Carlo atmete schnell. Aber er schaute nicht weg. Er schaute aufs Wasser.<\/p>\n<p>Die nächste Welle kam.<\/p>\n<p>„Golking, warte“, sagte Carlo. „Warte. Warte.“<\/p>\n<p>Die Welle ging zurück. Krebscorps wollte zurück zu seiner Spalte. Es wollte genau das tun, was es immer tat.<\/p>\n<p>„Hornattacke! Zur Spalte!“<\/p>\n<p>Golking kam aus dem Wasser, schnell wie ein Pfeil, und stellte sich zwischen Krebscorps und seine Spalte. Es berührte Krebscorps mit dem Horn, nicht hart, nur so, dass es auf den Rücken kippte und im flachen Wasser zappelte.<\/p>\n<p>Dann stand Krebscorps wieder auf. Es klapperte. Aber es klapperte jetzt anders. Langsamer.<\/p>\n<p>Es war müde.<\/p>\n<p>Und Carlo machte etwas, das Felix nicht erwartet hatte.<\/p>\n<p>„Golking, zurück“, sagte er. Er holte Golking in den Ball und gab ihn Felix. Und dann griff er in seine eigene Tasche und holte seinen eigenen Ball heraus. Den einzigen, den er hatte.<\/p>\n<p>Er warf ihn nicht.<\/p>\n<p>Er ging ins Wasser, bis zu den Knöcheln, dann bis zu den Waden. Er ging langsam. Er hockte sich hin, ganz nah bei dem Stein, auf dem Krebscorps saß. Und er legte den Ball auf seine flache, offene Hand.<\/p>\n<p>„Du musst nicht“, sagte er.<\/p>\n<p>Auf dem Steg war es so still, dass man die Wingull hörte.<\/p>\n<p>Krebscorps schaute den Ball an. Es schaute Carlo an. Es schaute zurück zu seiner Spalte, und dann wieder zu Carlo.<\/p>\n<p>Eine Welle kam. Sie war kalt, und sie ging Carlo bis über die Knie und machte seine hochgekrempelte Hose nass. Er bewegte sich nicht.<\/p>\n<p>Die Welle ging zurück.<\/p>\n<p>Krebscorps lief nicht weg.<\/p>\n<p>Es kletterte vom Stein herunter, auf Carlos Hand zu, und es hob eine Schere und tippte damit auf den Ball. Einmal. Ganz vorsichtig.<\/p>\n<p>Der Ball öffnete sich, Licht, und schloss sich wieder.<\/p>\n<p>Er wackelte einmal.<\/p>\n<p>Klick.<\/p>\n<p>Carlo hockte im Wasser und starrte auf den Ball in seiner Hand. Er sagte nichts. Er bewegte sich nicht. Er hockte da, bis die nächste Welle kam und ihm bis zum Bauch spritzte.<\/p>\n<p>Dann drückte er sofort auf den Knopf.<\/p>\n<p>Krebscorps kam heraus, auf den Stein, und schaute ihn an.<\/p>\n<p>„Du darfst wieder in deine Spalte“, sagte Carlo. „Wenn du willst. Ich wollte nur fragen.“<\/p>\n<p>Krebscorps klapperte. Es ging zu seiner Spalte. Es schaute hinein. Und dann kam es zurück und kletterte Carlo auf das nasse Knie.<\/p>\n<p>Auf dem Steg brach Jubel los. Glitzerstern schrie so laut, dass die Wingull aufflogen, Caspar sprang ins flache Wasser, mit Schuhen, und Rosalie klatschte mit beiden Händen, und Lina pfiff durch die Finger.<\/p>\n<p>Carlo watete zurück ans Ufer, Krebscorps auf der Schulter.<\/p>\n<p>Er hob sein Klemmbrett auf und drehte es um. Felix schaute ihm über die Schulter.<\/p>\n<p>Unter den vielen Zahlen, Strichen und Uhrzeiten zeichnete Carlo ein großes, sehr schiefes Krebscorps. Und daneben schrieb er nur ein Wort.<\/p>\n<p>Gewartet.<\/p>\n<p>„Wie lange hat es gedauert?“, fragte Glitzerstern.<\/p>\n<p>Carlo schaute auf seine Uhr. Dann schaute er Krebscorps an, das auf seiner Schulter saß und mit einer Schere an seinem Ohr herumzupfte.<\/p>\n<p>„Weiß ich nicht“, sagte er. „Ich hab nicht gezählt.“<\/p>\n<p>Am Abend schrieb Felix etwas in sein Notizbuch. Er brauchte lange dafür.<\/p>\n<p>Wer weiß, wie ein Pokémon lebt, muss nicht schneller sein. Er muss nur da sein, wenn es zurückkommt.<\/p>\n<p>Lina kam und setzte sich neben ihn und schaute hinauf zur Düne. Die Sonne ging unter, und der Himmel war rot und orange.<\/p>\n<p>„Kein Ballon“, sagte sie.<\/p>\n<p>„Heute nicht“, sagte Felix.<\/p>\n<p>Ganz oben auf der Düne, wo das Gras am höchsten stand, blitzte noch einmal etwas auf. Kurz. Dann war es dunkel.<\/p>"}, {"num": "7", "label": "Kapitel 7", "title": "Streit im Bootshaus", "html": "<p>Am siebten Tag regnete es.<\/p>\n<p>Es regnete nicht ein bisschen. Es regnete so, wie es nur an der Küste regnen kann, schräg und laut und von allen Seiten gleichzeitig, und die Bucht war grau, und die Dünen waren grau, und das Bootshaus war der einzige trockene Ort auf der ganzen Welt.<\/p>\n<p>Die drei Gallopa standen im Unterstand neben der Weide. Felix' Wasser-Pokémon fanden den Regen wunderbar und schwammen draußen in der Bucht herum. Nur die Menschen saßen drinnen.<\/p>\n<p>Und Krebscorps.<\/p>\n<p>Krebscorps saß auf Carlos Schulter, und es saß dort, seit Carlo am Morgen aufgewacht war. Es saß dort beim Frühstück. Es saß dort, als Carlo sich die Zähne putzte. Und jetzt saß es dort, während Carlo am Tisch seine Zahlen ordnete, und zwickte ihn ab und zu ins Ohrläppchen, ganz sanft.<\/p>\n<p>Caspar schaute es an.<\/p>\n<p>Er schaute es den ganzen Vormittag an. Er schaute es an, als Lina an der Tafel erklärte, welche Pokémon-Typen gegen welche gut sind. Er schaute es an, als Felix zeigte, wie man ein Pokémon nach einem Kampf versorgt. Er schaute es an, und sein Gesicht wurde dabei immer dunkler, so wie der Himmel draußen.<\/p>\n<p>„Es ist nicht fair“, sagte er schließlich.<\/p>\n<p>Alle schauten auf.<\/p>\n<p>„Carlo hat Golking bekommen“, sagte Caspar. „Felix hat ihm Golking gegeben. Mir hat keiner was gegeben. Ich hab nur mit einem Ball geworfen und dann war das Zigzachs weg, und dann hab ich die ganze Zeit nur stillgehalten.“<\/p>\n<p>„Du hast zu früh geworfen“, sagte Carlo. Er sagte es nicht böse. Er sagte es so, wie er Zahlen sagte. Einfach weil es stimmte.<\/p>\n<p>Caspar sprang auf.<\/p>\n<p>Niemand war schnell genug, um ihn aufzuhalten, und er selbst war nicht schnell genug, um es sich anders zu überlegen. Er schlug mit der Hand auf den Tisch, und Carlos Klemmbrett rutschte über die Kante und fiel genau in den Eimer mit Wasser, in dem Felix die Schwämme für die Pokémon auswusch.<\/p>\n<p>Es machte nur ein ganz kleines Platsch.<\/p>\n<p>Carlo starrte in den Eimer. Seine Blätter schwammen darin. Alle Zahlen, alle Uhrzeiten, alle Striche, alle Wellen. Das schiefe Krebscorps. Das Wort Gewartet. Die Tinte lief in blauen Wolken ins Wasser.<\/p>\n<p>Dann fing Carlo an zu weinen.<\/p>\n<p>Krebscorps sprang von seiner Schulter auf den Tisch und klapperte Caspar mit beiden Scheren an, wütend und laut.<\/p>\n<p>„Ich wollte das nicht!“, rief Caspar.<\/p>\n<p>„Doch, wolltest du!“, rief Glitzerstern. „Du bist nur neidisch!“<\/p>\n<p>„Bin ich nicht!“<\/p>\n<p>„Bist du doch! Und ich auch, aber ich mach wenigstens nichts kaputt!“<\/p>\n<p>Rosalie hielt sich die Ohren zu.<\/p>\n<p>Felix stand auf. Er wollte etwas sagen. Er wusste nicht was, aber er wollte etwas sagen, irgendetwas, was den Streit beenden würde. Lina hielt ihn am Arm fest und zog ihn mit in den kleinen Raum mit den Seilen. Sie machte die Tür hinter ihnen zu.<\/p>\n<p>„Was machst du?“, fragte Felix. „Wir müssen da rein!“<\/p>\n<p>„Nein“, sagte Lina. „Wir müssen ihnen Zeit geben.“<\/p>\n<p>„Zeit? Carlo weint! Caspar hat sein Klemmbrett in den Eimer geworfen!“<\/p>\n<p>„Ich weiß. Ich war dabei.“<\/p>\n<p>„Dann müssen wir Regeln machen! Eine Liste. Was man darf und was man nicht darf. Und dann muss Caspar sich entschuldigen, und dann …“<\/p>\n<p>„Felix“, sagte Lina. „Du machst schon wieder einen Plan.“<\/p>\n<p>„Na und? Pläne sind gut!“<\/p>\n<p>„Nicht für alles!“<\/p>\n<p>Sie waren jetzt beide laut. Lauter, als sie gewollt hatten. Draußen trommelte der Regen aufs Dach, und im Seilraum roch es nach Tang, und Felix und Lina standen sich gegenüber und hatten beide rote Gesichter.<\/p>\n<p>Und dann merkten sie, dass es nebenan ganz still geworden war.<\/p>\n<p>Sie schauten sich an. Dann schauten sie zur Wand. Die Wand des Seilraums war dünn. Sehr dünn. Man konnte durch sie hindurch jedes Wort hören.<\/p>\n<p>Lina machte langsam die Tür auf.<\/p>\n<p>Die vier Kinder saßen am Tisch. Carlo hatte aufgehört zu weinen. Caspar hatte aufgehört zu schreien. Glitzerstern hatte aufgehört, Caspar anzufunkeln. Alle vier schauten zur Tür, und Rosalie hatte die Hände von den Ohren genommen.<\/p>\n<p>„Ihr streitet ja auch“, sagte Rosalie.<\/p>\n<p>Felix wurde noch röter.<\/p>\n<p>„Ja“, sagte er. „Tun wir.“<\/p>\n<p>„Wer hat recht?“, fragte Carlo.<\/p>\n<p>Felix und Lina schauten sich an. Und dann fing Lina an zu lachen, und Felix musste auch lachen, ganz gegen seinen Willen.<\/p>\n<p>„Beide ein bisschen“, sagte Lina. „Felix hat recht, dass man manchmal Regeln braucht. Und ich hab recht, dass man manchmal erst mal still sein muss.“<\/p>\n<p>„Und dann?“, fragte Glitzerstern.<\/p>\n<p>„Dann sagt man Entschuldigung“, sagte Felix. Er drehte sich zu Lina. „Entschuldigung. Ich war zu laut.“<\/p>\n<p>„Ich auch“, sagte Lina. „Entschuldigung.“<\/p>\n<p>Es war einen Moment ganz still im Bootshaus.<\/p>\n<p>Dann stand Caspar auf. Er ging zum Eimer. Er griff hinein, mit beiden Händen, und holte Carlos Blätter heraus, eins nach dem anderen, ganz vorsichtig, damit sie nicht rissen. Er legte sie auf den Tisch. Er strich sie glatt.<\/p>\n<p>„Entschuldigung“, sagte er zu Carlo. Und dann, leiser: „Und zu Krebscorps auch.“<\/p>\n<p>Krebscorps klapperte. Es klang nicht mehr ganz so wütend.<\/p>\n<p>Den Rest des Nachmittags trockneten sie Carlos Blätter. Sie hängten sie an eine Schnur, die Felix quer durchs Bootshaus spannte, mit Wäscheklammern, und Birk brachte einen kleinen Heizlüfter aus der Station.<\/p>\n<p>Manche Zahlen konnte man noch lesen. Manche nicht mehr.<\/p>\n<p>Glitzerstern holte einen Stift aus ihrem Rucksack. Er war silbern und glitzerte natürlich. Und sie setzte sich zu Carlo, und Carlo sagte ihr die Zahlen, die er noch im Kopf hatte, und sie schrieb sie auf ein neues Blatt. Mit Glitzerstift.<\/p>\n<p>„Das sieht komisch aus“, sagte Carlo.<\/p>\n<p>„Das sieht schön aus“, sagte Glitzerstern.<\/p>\n<p>Carlo schaute das Blatt lange an. Die Zahlen funkelten.<\/p>\n<p>„Ein bisschen schön“, gab er zu.<\/p>\n<p>Rosalie hatte die ganze Zeit am Fenster gesessen und hinaus zum Unterstand geschaut, wo die drei Gallopa standen. Jetzt drehte sie sich um.<\/p>\n<p>„Carlo“, sagte sie. „Weißt du noch, am ersten Tag? Du hast gesagt, das geht nicht auf. Drei Pferde, vier Kinder.“<\/p>\n<p>„Ja.“<\/p>\n<p>„Es geht doch auf“, sagte Rosalie. „Wenn zwei auf einem reiten.“<\/p>\n<p>Carlo schaute sie an. Dann schaute er Caspar an. Dann schrieb er etwas auf das neue Blatt, unter Glitzersterns funkelnde Zahlen.<\/p>\n<p>Drei Pferde. Vier Kinder. Zwei teilen.<\/p>\n<p>Am Abend hörte der Regen auf. Felix ging hinaus auf den nassen Steg, und Lina kam mit, und eine Weile standen sie einfach da und schauten auf die Bucht.<\/p>\n<p>„Du hattest recht“, sagte Felix. „Mit dem Zeit geben.“<\/p>\n<p>„Du hattest auch recht“, sagte Lina. „Mit den Regeln. Morgen schreiben wir welche. Zusammen mit ihnen.“<\/p>\n<p>Felix nickte. Dann holte er sein Notizbuch heraus und schrieb einen Satz.<\/p>\n<p>Manchmal ist der beste Plan, keinen zu haben. Aber nur manchmal.<\/p>"}, {"num": "8", "label": "Kapitel 8", "title": "Glitzerstern verliert schön", "html": "<p>Die Regeln schrieben sie am nächsten Morgen zusammen auf die Tafel. Es waren fünf. Die Kinder hatten sie sich selbst ausgedacht, und Felix schrieb sie nur hin.<\/p>\n<p class=\"doc\">1. NICHTS KAPUTT MACHEN, WAS EINEM ANDEREN GEHÖRT.<\/p>\n<p class=\"doc\">2. NICHT ZU FRÜH WERFEN.<\/p>\n<p class=\"doc\">3. ZUERST FRAGEN.<\/p>\n<p class=\"doc\">4. WENN MAN STREITET, ERST MAL STILL SEIN.<\/p>\n<p class=\"doc\">5. GLITZERN IST ERLAUBT.<\/p>\n<p>Die fünfte Regel war von Glitzerstern. Niemand hatte widersprochen.<\/p>\n<p>Hinter den Dünen, ein Stück landeinwärts, lag ein kleiner Teich. Er war rund und still und am Rand voller Schilf, und auf dem Wasser schwammen große, flache, grüne Blätter. Dorthin gingen sie an diesem Tag, und Glitzerstern lief die ganze Zeit vorneweg.<\/p>\n<p>„Heute ist mein Tag“, sagte sie. „Ich weiß es.“<\/p>\n<p>„Woher?“, fragte Carlo.<\/p>\n<p>„Weil ich heute meine beste Spange habe.“<\/p>\n<p>Felix hatte gedacht, dass sie bei den großen Blättern stehen bleiben würden. Aber Lina hielt ihn zurück und zeigte auf eines der Blätter in der Mitte des Teichs.<\/p>\n<p>Es war kein Blatt.<\/p>\n<p>Es hatte einen kleinen blauen Körper unter dem grünen Blatt, und kleine gelbe Füße, und zwei kleine Augen, die verschlafen zum Ufer schauten.<\/p>\n<p>„Loturzel“, flüsterte Lina. „Wasser und Pflanze. Es lebt in Teichen und trägt das Blatt wie einen Hut. Es lässt sich gern treiben.“<\/p>\n<p>Glitzerstern drückte beide Hände an die Wangen.<\/p>\n<p>„Das ist das Schönste, was ich je gesehen habe“, sagte sie. „Es hat einen Hut!“<\/p>\n<p>Felix gab ihr einen Ball.<\/p>\n<p>„Milotic“, sagte er. „Es ist das schönste Pokémon, das ich habe. Und es ist stark. Aber Vorsicht: Loturzel ist auch ein Pflanzen-Pokémon. Pflanzenattacken treffen Wasser-Pokémon hart.“<\/p>\n<p>Glitzerstern hörte nur das Wort schön.<\/p>\n<p>Sie warf den Ball mit einer Drehung, und Milotic glitt in den Teich, lang und schimmernd, und das Licht brach sich in seinen Schuppen, und alle anderen hielten die Luft an, so schön sah es aus.<\/p>\n<p>Loturzel wachte auf. Es schaute Milotic an. Es schaute Glitzerstern an. Dann paddelte es mit seinen kleinen Füßen ein Stück nach vorne. Es wollte kämpfen.<\/p>\n<p>„Milotic“, rief Glitzerstern, „mach eine Drehung! Eine ganz große!“<\/p>\n<p>Milotic drehte sich. Es war eine wunderschöne Drehung. Das Wasser spritzte in einem Bogen hoch, und in dem Bogen erschien ein kleiner Regenbogen.<\/p>\n<p>Loturzel machte etwas anderes.<\/p>\n<p>Es streckte sein Blatt nach vorne, und aus dem Blatt kamen kleine grüne Lichter, und die Lichter flogen zu Milotic und saugten etwas aus ihm heraus. Milotic zuckte zusammen.<\/p>\n<p>„Absorber“, sagte Felix leise. „Eine Pflanzenattacke. Es nimmt Kraft weg.“<\/p>\n<p>„Milotic, noch eine Drehung!“, rief Glitzerstern. „Eine schönere!“<\/p>\n<p>„Glitzerstern“, sagte Lina. „Es geht nicht um schön.“<\/p>\n<p>Aber Glitzerstern hörte nicht. Milotic drehte sich noch einmal, langsamer jetzt. Loturzel schickte noch einmal grüne Lichter. Und noch einmal. Milotic sank tiefer ins Wasser.<\/p>\n<p>„Milotic, Aquaknarre!“, rief Felix plötzlich dazwischen. Dann biss er sich auf die Lippe. Es war nicht sein Kampf.<\/p>\n<p>Milotic spritzte einen Wasserstrahl. Loturzel nahm ihn einfach auf dem Blatt, als wäre es Regen, und schaute zufrieden. Wasser tat ihm überhaupt nichts.<\/p>\n<p>Glitzerstern starrte auf den Teich. Sie hatte keine Idee mehr. Sie hatte keine Drehung mehr.<\/p>\n<p>„Stopp“, sagte Felix ruhig. „Milotic, zurück.“<\/p>\n<p>Milotic glitt zurück zum Ufer und legte den Kopf auf Felix' Knie. Es war erschöpft. Felix strich ihm über den Kopf.<\/p>\n<p>Glitzerstern stand am Ufer. Ihre Unterlippe zitterte.<\/p>\n<p>„Ich hab verloren“, sagte sie.<\/p>\n<p>„Ja“, sagte Felix.<\/p>\n<p>„Vor allen.“<\/p>\n<p>„Ja.“<\/p>\n<p>Alle warteten. Caspar dachte an den Eimer gestern. Carlo dachte an seine nassen Blätter. Rosalie dachte, dass Glitzerstern gleich weinen würde, und sie rückte ein Stückchen näher an sie heran.<\/p>\n<p>Glitzerstern weinte nicht.<\/p>\n<p>Sie schaute auf Loturzel, das mitten im Teich schwamm und sie anschaute, und dann tat sie etwas, das niemand erwartet hatte. Sie stellte sich ganz gerade hin. Sie legte eine Hand aufs Herz. Und dann verbeugte sie sich, tief, wie auf einer Bühne.<\/p>\n<p>„Du warst besser als ich“, sagte sie zu Loturzel. „Du hast gewonnen. Herzlichen Glückwunsch.“<\/p>\n<p>Loturzel blinzelte.<\/p>\n<p>Glitzerstern zupfte eine Paillette von ihrer Jacke. Die schönste. Eine runde, goldene, die in der Sonne funkelte. Sie bückte sich und legte sie auf ein flaches Blatt am Ufer, ganz nah am Wasser.<\/p>\n<p>„Das ist für dich“, sagte sie. „Weil du so gut gekämpft hast.“<\/p>\n<p>Dann ging sie zurück zu den anderen und setzte sich ins Gras und schaute auf den Teich.<\/p>\n<p>Lina setzte sich neben sie.<\/p>\n<p>„Das war schön“, sagte Lina. „Wie du verloren hast.“<\/p>\n<p>„Das war nicht schön“, sagte Glitzerstern. „Das war blöd.“<\/p>\n<p>„Doch“, sagte Lina. „Es war schön. Die meisten Leute können gewinnen. Gut verlieren können nur wenige.“<\/p>\n<p>Loturzel paddelte ans Ufer.<\/p>\n<p>Es kam ganz langsam, mit seinen kleinen gelben Füßen. Es kletterte auf das Blatt, auf dem die Paillette lag. Es schaute sie an. Dann nahm es sie, irgendwie, keiner sah genau wie, und auf einmal steckte die goldene Paillette mitten auf seinem Blatthut.<\/p>\n<p>Sie funkelte.<\/p>\n<p>Loturzel drehte sich zu Glitzerstern um. Es watschelte durchs Gras. Es kam ganz nah.<\/p>\n<p>Glitzerstern bewegte sich nicht. Sie dachte an Regel Nummer zwei. Sie holte ganz langsam ihren Ball heraus und legte ihn auf ihre flache, offene Hand.<\/p>\n<p>„Du musst nicht“, sagte sie. „Wirklich nicht. Du hast ja gewonnen.“<\/p>\n<p>Loturzel schaute den Ball an. Es schaute Glitzerstern an, und die Paillette auf seinem Hut funkelte, und Glitzersterns Spange funkelte, und für einen Moment sahen sie sich ziemlich ähnlich.<\/p>\n<p>Dann tippte Loturzel mit seinem Blatt auf den Ball.<\/p>\n<p>Licht.<\/p>\n<p>Klick.<\/p>\n<p>Glitzerstern ließ es sofort wieder heraus. Loturzel saß in ihrem Schoß, ganz zufrieden, als hätte es dort schon immer gesessen.<\/p>\n<p>„Ich nenne es …“, fing sie an.<\/p>\n<p>„Glitzerstern zwei?“, fragte Caspar.<\/p>\n<p>„Nein“, sagte Glitzerstern würdevoll. „Ich nenne es Loturzel. Weil es so heißt. Man muss nicht immer alles umbenennen.“<\/p>\n<p>Felix und Lina schauten sich an und mussten sehr an sich halten, um nicht zu lachen.<\/p>\n<p>Auf dem Rückweg ging Glitzerstern ganz hinten, Loturzel auf dem Arm. Und auf einmal blieb sie stehen.<\/p>\n<p>„Da“, sagte sie leise.<\/p>\n<p>Alle drehten sich um.<\/p>\n<p>Auf dem schmalen Weg, der von der Straße zur Station führte, gingen zwei Leute. Sie trugen beide große Sonnenhüte und Sonnenbrillen und viel zu bunte Hemden, und einer von ihnen hatte einen Fotoapparat um den Hals, und der andere einen Picknickkorb. Der Picknickkorb wackelte. Ganz leicht. Als wäre etwas darin, das sich bewegte.<\/p>\n<p>„Touristen?“, fragte Carlo.<\/p>\n<p>„Die gucken nicht auf das Meer“, sagte Glitzerstern. „Touristen gucken immer auf das Meer. Die gucken auf die Station.“<\/p>\n<p>Felix schaute die beiden lange an. Einer von ihnen hatte unter dem Sonnenhut lange, rote Haare, die in einer großen Locke nach hinten standen.<\/p>\n<p>„Glitzerstern“, sagte Lina leise. „Du hast gerade etwas sehr Wichtiges gesehen.“<\/p>\n<p>„Ich weiß“, sagte Glitzerstern. „Ich gucke immer, wer guckt.“<\/p>"}, {"num": "9", "label": "Kapitel 9", "title": "Wer weiß, wo der Schrank steht", "html": "<p>Die beiden Touristen kamen am nächsten Vormittag zum Bootshaus.<\/p>\n<p>Felix war gerade mit Turtok und Tohaido draußen in der Bucht, um den Kindern zu zeigen, wie man im tiefen Wasser kämpft, und Lina war mit den drei Gallopa auf der Weide. Die Kinder saßen allein auf dem Steg und ließen die Beine baumeln.<\/p>\n<p>„Hallöchen!“, rief eine Stimme.<\/p>\n<p>Die beiden kamen über den Sand. Sie trugen immer noch die Sonnenhüte und die Sonnenbrillen und die bunten Hemden. Der eine trug den Picknickkorb, und der Picknickkorb wackelte immer noch.<\/p>\n<p>„Was für ein schöner Tag!“, sagte die mit den roten Haaren. Ihre Stimme war sehr hoch und sehr freundlich. Viel zu freundlich, dachte Glitzerstern. So freundlich war ihre Tante auch immer, kurz bevor sie fragte, ob man schon Hausaufgaben gemacht hatte.<\/p>\n<p>„Wir sind Feriengäste“, sagte der andere. Er hatte lila Haare, die unter seinem Hut herausschauten. „Ganz normale. Wir machen Urlaub. Wie alle normalen Leute.“<\/p>\n<p>„Möchtet ihr Eis?“, fragte die mit den roten Haaren und klappte den Picknickkorb auf.<\/p>\n<p>Darin lag tatsächlich Eis. Vier Stück, in buntem Papier. Und daneben, ganz zusammengerollt, lag etwas Cremefarbenes mit spitzen Ohren und einer goldenen Münze auf der Stirn, das sehr schnell die Augen zumachte.<\/p>\n<p>„Da ist eine Katze in eurem Korb“, sagte Carlo.<\/p>\n<p>„Was? Nein. Das ist ein Kissen“, sagte der mit den lila Haaren schnell.<\/p>\n<p>Das Kissen nieste.<\/p>\n<p>„Ein Kissen mit Schnupfen“, sagte die mit den roten Haaren.<\/p>\n<p>Caspar nahm sich ein Eis. Er riss das Papier ab. Er war ein bisschen beeindruckt, dass Feriengäste so großzügig waren.<\/p>\n<p>„Sagt mal“, sagte die mit den roten Haaren und setzte sich neben ihn auf den Steg. „Ihr seid doch hier jeden Tag. Ihr kennt euch doch bestimmt gut aus. Der nette alte Professor da oben. Der hat doch bestimmt ganz viele tolle Sachen in seinem Haus.“<\/p>\n<p>„Ganz, ganz tolle Sachen“, sagte der mit den lila Haaren.<\/p>\n<p>„Steine zum Beispiel“, sagte das Kissen im Korb.<\/p>\n<p>Alle schauten den Korb an.<\/p>\n<p>„Hat das Kissen gerade geredet?“, fragte Rosalie.<\/p>\n<p>„Nein“, sagten die beiden Feriengäste gleichzeitig.<\/p>\n<p>„Jedenfalls“, sagte die mit den roten Haaren und lächelte noch breiter, „wir wüssten so gerne, wo der Professor seine Schätze aufbewahrt. Nur aus Neugier. Weil wir Steine so mögen. In welchem Zimmer steht denn sein Schrank?“<\/p>\n<p>Caspar hatte den Mund voller Eis. Er schluckte. Er wollte gerade antworten. Er wusste es zwar nicht genau, aber er wusste, wo Birks Arbeitszimmer war, und er wollte so gern helfen, und die Leute waren so nett gewesen mit dem Eis …<\/p>\n<p>Glitzerstern stand auf.<\/p>\n<p>Sie stellte sich vor die beiden Feriengäste, stemmte die Hände in die Hüften, und ihre Pailletten blitzten.<\/p>\n<p>„Ihr seid keine Touristen“, sagte sie. „Touristen gucken auf das Meer. Ihr guckt nur auf die Station. Und euer Kissen redet.“<\/p>\n<p>„Und euer Fernglas glitzert“, sagte Carlo. „Ich hab es dreimal gesehen. Auf der Düne.“<\/p>\n<p>„Und euer Ballon sieht aus wie euer Kissen“, sagte Rosalie leise.<\/p>\n<p>Caspar schaute auf sein Eis. Dann legte er es ganz langsam zurück in den Korb.<\/p>\n<p>„Regel Nummer drei“, sagte er. „Zuerst fragen. Und ihr habt nicht gefragt, wer ihr seid. Ihr habt nur gefragt, wo der Schrank ist.“<\/p>\n<p>Es wurde sehr still auf dem Steg.<\/p>\n<p>Dann riss die mit den roten Haaren ihren Sonnenhut herunter. Der mit den lila Haaren riss seine Sonnenbrille herunter. Und das Kissen sprang aus dem Korb und landete auf beiden Hinterpfoten.<\/p>\n<p>„Wer schleicht sich an die Bucht heran?“<\/p>\n<p>„Wer fragt die Kinder freundlich an?“<\/p>\n<p>„Mauzi, genau! Mit Eis im Korb!“<\/p>\n<p>„Team Rocket“, sagte eine Stimme hinter ihnen.<\/p>\n<p>Felix stand bis zu den Knien im Wasser. Turtok stand neben ihm, mit beiden Kanonen ausgefahren, und hinter Turtok tauchte Tohaido auf und zeigte seine Zähne.<\/p>\n<p>„Ach, der schon wieder“, sagte Jessie.<\/p>\n<p>„Der ist ja gewachsen“, sagte James.<\/p>\n<p>„Ihr verschwindet jetzt“, sagte Felix. „Und ihr fragt nie wieder Kinder nach irgendetwas aus.“<\/p>\n<p>„Wir verschwinden“, sagte Mauzi und grinste breit. „Aber nicht ohne Steine.“<\/p>\n<p>Er drückte auf eine Fernbedienung.<\/p>\n<p>Über der Düne erschien der Mauzi-Ballon, und unter dem Ballon hing an einem langen Seil etwas Großes und Metallisches. Es sah aus wie ein Schrank mit Beinen. Und Armen. Und vorne an den Armen waren zwei riesige Schraubenzieher.<\/p>\n<p>„Der Schrankknacker dreitausend!“, rief James stolz. „Er findet jeden Schrank! Er öffnet jeden Schrank!“<\/p>\n<p>Der Schrankknacker landete vor der Station, stampfte auf die Tür zu und öffnete sie.<\/p>\n<p>Dann blieb er stehen.<\/p>\n<p>Hinter der Tür war ein Flur. Und in dem Flur standen sechs Schränke. Ein Schuhschrank. Ein Besenschrank. Ein Schrank mit Handtüchern. Ein Schrank mit Akten. Ein Schrank, in dem Birk seine Gummistiefel aufbewahrte. Und ganz hinten ein Kühlschrank.<\/p>\n<p>Der Schrankknacker drehte langsam den Kopf. Er schaute auf jeden einzelnen Schrank. Ein Lämpchen auf seinem Kopf fing an, gelb zu blinken.<\/p>\n<p>„Warum blinkt er gelb?“, fragte Jessie.<\/p>\n<p>„Er weiß nicht, welcher es ist“, sagte James und wurde blass.<\/p>\n<p>„Du hast ihm nicht gesagt, welcher es ist?!“<\/p>\n<p>„Ich dachte, er weiß das!“<\/p>\n<p>„Er heißt Schrankknacker, nicht Schrankfinder!“<\/p>\n<p>Der Schrankknacker entschied sich für den Kühlschrank.<\/p>\n<p>Er öffnete ihn mit beiden Schraubenziehern gleichzeitig, und heraus fielen ein Glas saure Gurken, eine Packung Butter und drei Joghurts, und der Schrankknacker hob einen Joghurt hoch und hielt ihn in die Luft, als wäre es ein kostbarer Edelstein.<\/p>\n<p>„Das ist kein Stein!“, schrie Mauzi.<\/p>\n<p>„Es ist Erdbeere“, sagte Professor Birk. Er stand in der Tür seines Arbeitszimmers, im Bademantel, eine Tasse Kaffee in der Hand. „Den hätte ich gerne zurück.“<\/p>\n<p>Jetzt kam Lina über die Weide, auf dem großen Galar-Gallopa, ohne Sattel, schnell. Sie sprang ab, bevor es ganz stehen geblieben war.<\/p>\n<p>„Galar-Gallopa“, sagte sie. „Psychokinese. Nur den Schrankknacker.“<\/p>\n<p>Das Horn des großen Galar-Gallopa leuchtete auf. Der Schrankknacker schwebte in die Luft, mitsamt Joghurt, drehte sich einmal langsam um sich selbst und wurde sanft aus der Tür hinausgetragen, über den Hof, bis zum Rand der Düne.<\/p>\n<p>„Felix?“, sagte Lina.<\/p>\n<p>„Wir zählen“, sagte Felix. „Eins. Zwei. Drei.“<\/p>\n<p>„Turtok, Hydropumpe!“<\/p>\n<p>Zwei gewaltige Wasserstrahlen schossen aus Turtoks Kanonen. Sie trafen den schwebenden Schrankknacker, und der Schrankknacker flog, und weil er noch an dem Seil des Ballons hing, flog der Ballon mit, und weil Jessie, James und Mauzi sich an dem Seil festhielten, um den Ballon zu retten, flogen sie mit.<\/p>\n<p>Sie flogen hoch über die Düne, über das Strandgras, über das Meer.<\/p>\n<p>Von ganz weit oben, sehr klein und sehr deutlich, hörte man Jessie.<\/p>\n<p>„Das war mal wieder ein Schuss in den Ofen!“<\/p>\n<p>Und dann, noch kleiner: „Ich will meinen Joghurt behalten!“<\/p>\n<p>Es war Mauzis Stimme.<\/p>\n<p>Am Nachmittag saß Birk mit Felix und Lina in seinem Arbeitszimmer. Die Kinder spielten draußen mit Krebscorps und Loturzel, und man hörte Glitzerstern lachen.<\/p>\n<p>„Sie wissen jetzt, dass es ein Schrank ist“, sagte Felix. „Und dass er in der Station steht.“<\/p>\n<p>„Aber nicht welcher“, sagte Lina.<\/p>\n<p>Birk schaute auf den Schrank mit den zwei Schlössern. Er sah aus wie die anderen Schränke im Flur. Ganz gewöhnlich. Nur ein bisschen schwerer.<\/p>\n<p>„Die Kinder“, sagte er, „haben heute etwas Wichtiges getan. Sie haben nicht verraten, was sie wussten.“<\/p>\n<p>„Sie wussten es gar nicht“, sagte Felix.<\/p>\n<p>„Doch“, sagte Birk. „Sie wussten, dass man Leuten nicht alles erzählt, nur weil sie einem Eis schenken. Das ist mehr wert als jedes Schloss.“<\/p>\n<p>Er nahm seinen Schlüsselbund aus der Tasche und schaute ihn lange an.<\/p>\n<p>„Sie kommen wieder“, sagte Lina.<\/p>\n<p>„Ja“, sagte Birk. „Sie kommen immer wieder.“<\/p>"}, {"num": "10", "label": "Kapitel 10", "title": "Rosalie und das Feuer", "html": "<p>Rosalie stand am nächsten Morgen um sieben Uhr an der Weide.<\/p>\n<p>Diesmal hatte sie keinen Eimer dabei, um sich darauf zu setzen. Sie stand einfach am Zaun, in ihrem gelben Regenmantel, und schaute das Feuer-Gallopa an.<\/p>\n<p>Lina kam mit zwei Tassen Kakao den Pfad herunter und stellte sich neben sie.<\/p>\n<p>„Wie weit?“, fragte Lina.<\/p>\n<p>„Drei Meter“, sagte Rosalie. „Gestern Abend. Ich bin genau bis zur Linie gegangen.“<\/p>\n<p>„Und heute?“<\/p>\n<p>Rosalie schaute das Feuer an. Die Mähne brannte orange und ruhig in der Morgenluft, und um das Gallopa herum war die Luft ein bisschen flimmerig, so wie über einer Straße im Sommer.<\/p>\n<p>„Heute will ich es anfassen“, sagte sie.<\/p>\n<p>Lina sagte nichts. Sie gab Rosalie eine der beiden Tassen und trank aus der anderen.<\/p>\n<p>Sie tranken beide ihren Kakao aus. Dann stellte Lina die Tassen auf den Zaunpfosten.<\/p>\n<p>„Ich gehe mit bis zur Linie“, sagte sie. „Danach gehst du allein.“<\/p>\n<p>Sie gingen bis zur Linie.<\/p>\n<p>Das Feuer-Gallopa hob den Kopf. Es schaute Rosalie an. Es kannte sie inzwischen. Es kannte das Mädchen im gelben Regenmantel, das jeden Abend auf einem Eimer gesessen hatte, zuerst zehn Meter entfernt, dann fünf, dann drei. Es hatte jeden Abend zurückgeschaut.<\/p>\n<p>Rosalie trat über die Linie.<\/p>\n<p>Sie ging einen Schritt. Und noch einen. Ihre Hände zitterten. Sie steckte sie in die Taschen des Regenmantels, damit man es nicht sah. Lina sah es trotzdem.<\/p>\n<p>Zwei Meter.<\/p>\n<p>Die Luft wurde wärmer. Rosalie roch das Feuer. Es roch nicht wie Omas Ofen. Es roch nach etwas anderem, nach Sommerwiese und ein bisschen nach Zimt.<\/p>\n<p>Ein Meter.<\/p>\n<p>Rosalie blieb stehen. Sie konnte nicht weiter. Ihre Füße wollten nicht.<\/p>\n<p>Sie stand da und atmete. So wie Lina es beim Reiten erklärt hatte. Einatmen. Ausatmen. Merken, wie das Gallopa atmet.<\/p>\n<p>Und dann machte das Gallopa den letzten Schritt.<\/p>\n<p>Es kam zu ihr. Ganz langsam. Es senkte den Kopf, bis seine Nase genau vor Rosalies Gesicht war, und die Mähne fiel nach vorne, und das Feuer war ganz nah.<\/p>\n<p>Rosalie nahm eine Hand aus der Tasche.<\/p>\n<p>Sie streckte sie aus. Sie zitterte immer noch. Sie berührte die Mähne.<\/p>\n<p>Das Feuer legte sich um ihre Finger wie ein warmer Handschuh. Es brannte nicht. Es kitzelte ein bisschen. Es war genauso, wie Lina gesagt hatte. Wie eine Decke. Wie eine warme Decke an einem kalten Abend.<\/p>\n<p>Rosalie fing an zu weinen. Aber sie lachte dabei.<\/p>\n<p>„Es brennt nicht“, sagte sie. „Lina, es brennt nicht.“<\/p>\n<p>„Ich weiß“, sagte Lina, und ihre Stimme klang ein bisschen komisch. „Es vertraut dir.“<\/p>\n<p>Hinter ihnen am Zaun standen plötzlich die anderen drei. Niemand hatte sie kommen hören. Carlo hatte sein Klemmbrett nicht dabei. Glitzerstern hatte die Hände vor dem Mund. Caspar stand ganz still.<\/p>\n<p>Am Nachmittag ritt Rosalie.<\/p>\n<p>Lina hob sie auf den Rücken des Feuer-Gallopa, und das Feuer der Mähne floss um Rosalies Beine und Hände, warm und weich, und Rosalie saß ganz gerade, so wie Glitzerstern es ihr gezeigt hatte.<\/p>\n<p>Zuerst führte Lina das Gallopa im Schritt. Eine Runde um die Weide. Dann noch eine.<\/p>\n<p>„Darf es schneller?“, fragte Rosalie.<\/p>\n<p>Lina schaute sie überrascht an.<\/p>\n<p>„Willst du das?“<\/p>\n<p>„Ja.“<\/p>\n<p>Lina ließ den Zügel los. „Dann sag es ihm. Nicht mit dem Mund. Mit den Beinen. Ganz leicht.“<\/p>\n<p>Rosalie drückte mit den Beinen. Ganz leicht.<\/p>\n<p>Das Gallopa trabte an. Es trabte über die Weide, und dann über das Gatter, das Lina geöffnet hatte, und hinunter auf den Strand, und dort, wo der Sand fest und nass war, galoppierte es. Nicht schnell. Nicht so schnell, wie es konnte. Nur so schnell, wie Rosalie es wollte.<\/p>\n<p>Die Mähne flatterte. Das Feuer zog einen langen orangefarbenen Streifen durch die Luft. Und mitten darin saß ein kleines Mädchen in einem gelben Regenmantel und schrie vor Freude.<\/p>\n<p>Felix stand auf dem Steg und schaute zu. Neben ihm stand Birk.<\/p>\n<p>„Vor zehn Tagen“, sagte Birk, „hat sie sich am Geländer festgehalten, weil Garados aus dem Wasser geschaut hat.“<\/p>\n<p>„Ja“, sagte Felix.<\/p>\n<p>„Und jetzt reitet sie auf einem Feuer.“<\/p>\n<p>Am Ende des Strandes, dort, wo die Dünen anfingen, wurde das Gallopa langsamer. Es blieb stehen. Es hob den Kopf und schaute ins Strandgras.<\/p>\n<p>Im Gras stand etwas Kleines.<\/p>\n<p>Es hatte vier dünne Beine und eine Mähne aus Feuer, die noch klein und flackernd war, wie eine Kerze im Wind. Es schaute das große Gallopa an, mit riesigen Augen. Und dann schaute es das Mädchen auf seinem Rücken an.<\/p>\n<p>„Ein Ponita“, flüsterte Rosalie.<\/p>\n<p>Das Ponita war dem Feuer-Gallopa gefolgt. Es musste es schon die ganze Zeit beobachtet haben, von den Hügeln hinter der Station aus, ein junges, wildes Ponita, das noch nie ein anderes Feuer-Pferd aus der Nähe gesehen hatte.<\/p>\n<p>Rosalie rutschte vom Rücken des Gallopa herunter. Sie landete im Sand.<\/p>\n<p>Das Ponita machte einen Schritt zurück. Seine kleine Mähne flackerte unruhig auf.<\/p>\n<p>Rosalie blieb stehen. Sie wusste genau, wie es sich fühlte. Sie hatte zehn Tage lang genau so gefühlt.<\/p>\n<p>Sie setzte sich in den Sand. Ganz langsam. Sie zog die Knie an.<\/p>\n<p>Und dann wartete sie.<\/p>\n<p>Lina kam am Strand entlanggelaufen und blieb in einiger Entfernung stehen. Felix kam vom Steg. Die anderen drei Kinder kamen. Alle blieben weit weg stehen. Niemand sagte etwas.<\/p>\n<p>Es dauerte lange. Die Sonne wanderte ein Stück am Himmel weiter. Ein Wingull landete im Sand und flog wieder weg.<\/p>\n<p>Das Ponita kam einen Schritt näher. Dann noch einen. Dann blieb es stehen und schaute.<\/p>\n<p>Rosalie holte ihren Ball heraus. Den einen, den sie hatte. Sie legte ihn auf ihre flache, offene Hand.<\/p>\n<p>„Du musst nicht“, sagte sie. „Ich hatte auch Angst. Ganz lange.“<\/p>\n<p>Das Ponita schaute den Ball an. Es schaute das große Gallopa an, das ruhig neben Rosalie stand. Und dann kam es die letzten Schritte, ganz schnell, als hätte es Angst, es sich sonst anders zu überlegen.<\/p>\n<p>Es stupste mit der Nase gegen den Ball.<\/p>\n<p>Licht.<\/p>\n<p>Klick.<\/p>\n<p>Rosalie öffnete den Ball sofort wieder. Das Ponita stand vor ihr, und seine kleine Mähne flackerte, und Rosalie streckte die Hand aus und legte sie hinein.<\/p>\n<p>Das Feuer brannte nicht.<\/p>\n<p>Am Abend schrieb Felix lange in sein Notizbuch. Dann zeigte er Lina den Satz.<\/p>\n<p>Angst geht nicht weg, wenn man wegläuft. Sie geht weg, wenn man jeden Tag einen Meter näher kommt.<\/p>\n<p>Lina nickte.<\/p>\n<p>Spät in der Nacht wachte Felix noch einmal auf. Er ging zum Fenster und schaute hinauf zur Station.<\/p>\n<p>In Birks Arbeitszimmer brannte kein Licht. Die Station lag dunkel und still im Mondschein.<\/p>\n<p>Dann bewegte sich hinter dem Fenster ein kleiner, runder Lichtfleck. Er wanderte über die Wand, zur Tür, zu dem Haken, an den Birk jeden Abend seinen Schlüsselbund hängte. Dort blieb er einen Moment stehen.<\/p>\n<p>Dann ging er aus.<\/p>\n<p>Felix stand noch lange am Fenster. Aber es blieb dunkel.<\/p>"}, {"num": "11", "label": "Kapitel 11", "title": "Die Nacht vor dem Abschluss", "html": "<p>Am Morgen lag Birks Schlüsselbund auf dem Fußboden.<\/p>\n<p>Birk fand ihn, als er Kaffee holen wollte, direkt unter dem Haken neben der Tür. Er hob ihn auf, schaute ihn an und hängte ihn wieder hin.<\/p>\n<p>„Runtergefallen“, sagte er. „Passiert.“<\/p>\n<p>Felix stand in der Tür und sagte nichts. Er hatte die halbe Nacht am Fenster gestanden. Er wusste, was er gesehen hatte.<\/p>\n<p>„Professor“, sagte er. „Ich glaube nicht, dass er runtergefallen ist.“<\/p>\n<p>Er erzählte von dem Lichtfleck. Birk hörte zu, ohne ihn zu unterbrechen. Dann ging er zum Schrank mit den zwei Schlössern, schloss beide auf und klappte die Kiste auf.<\/p>\n<p>Der rote Stein. Der blaue Stein. Beide da.<\/p>\n<p>„Sie haben nichts mitgenommen“, sagte Birk.<\/p>\n<p>„Noch nicht“, sagte Felix.<\/p>\n<p>Birk schaute sich die Schlüssel lange an. An einem der beiden Schrankschlüssel klebte, ganz winzig, im Bart, ein Krümel. Er war grau und ein bisschen weich. Birk rieb ihn zwischen den Fingern.<\/p>\n<p>„Knete“, sagte er langsam. „Jemand hat einen Abdruck gemacht.“<\/p>\n<p>Er setzte sich auf seinen Stuhl. Eine Weile sagte er nichts.<\/p>\n<p>„Morgen ist der Abschluss“, sagte er schließlich. „Um zehn kommen die Eltern. Die Kinder zeigen, was sie gelernt haben. Sie freuen sich seit zwei Wochen darauf.“<\/p>\n<p>„Ich weiß“, sagte Felix.<\/p>\n<p>„Ich werde die Kiste heute Nacht nicht aus den Augen lassen“, sagte Birk. „Ich setze mich davor. Und ihr erzählt den Kindern nichts. Sie sollen einen schönen letzten Tag haben.“<\/p>\n<p>Es wurde ein schöner letzter Tag.<\/p>\n<p>Sie übten alles noch einmal. Glitzerstern saß auf dem großen Galar-Gallopa und ritt eine perfekte Runde um die Weide, und Loturzel saß vor ihr auf dem Hals des Gallopa, mit der goldenen Paillette auf dem Hut, und beide funkelten. Carlo kämpfte mit Krebscorps gegen Felix' Golking, nur zur Übung, und Krebscorps wartete jede Welle ab und gewann zwei von drei Runden. Rosalie ritt auf dem Feuer-Gallopa am Strand entlang, und das kleine Ponita lief nebenher, und seine Mähne war schon ein bisschen größer geworden.<\/p>\n<p>Caspar ging in die Dünen.<\/p>\n<p>Er ging allein, und niemand ging ihm nach, weil Lina gesagt hatte, dass man ihn lassen solle. Er setzte sich an seine Stelle am Fuß der großen Düne und legte den Ball auf seine flache Hand. Und er saß.<\/p>\n<p>Felix sah ihn von Weitem. Er saß eine Stunde. Er saß zwei Stunden.<\/p>\n<p>Am Nachmittag kam das Zigzachs.<\/p>\n<p>Es kam aus dem Gras, lief seinen Zickzack, blieb stehen. Es schaute Caspar an. Es kam näher. Zwei Meter. Und dann blieb es stehen, schnupperte in die Luft, drehte sich um und lief zurück ins Gras.<\/p>\n<p>Caspar kam zum Abendessen zurück und setzte sich hin und aß, ohne etwas zu sagen.<\/p>\n<p>„Es war da“, sagte er dann. „Zwei Meter.“<\/p>\n<p>„Das ist viel“, sagte Lina.<\/p>\n<p>„Morgen ist der letzte Tag“, sagte Caspar. „Alle haben eins. Nur ich nicht.“<\/p>\n<p>Niemand wusste, was er darauf sagen sollte. Krebscorps kletterte von Carlos Schulter auf den Tisch, lief zu Caspar hinüber und zwickte ihn ganz vorsichtig in den Daumen.<\/p>\n<p>Caspar musste lachen. Ein bisschen.<\/p>\n<p>Am Abend machten sie ein Feuer am Strand.<\/p>\n<p>Es war ein richtiges Lagerfeuer, mit Treibholz, und Birk brachte Stockbrot. Rosalie saß ganz nah dran. So nah, dass ihre Wangen rot wurden. Das Ponita lag neben ihr im Sand und schaute in die Flammen, als würde es dort Verwandte sehen.<\/p>\n<p>„Vor zwei Wochen“, sagte Glitzerstern, „wärst du nicht so nah an ein Feuer gegangen.“<\/p>\n<p>„Nein“, sagte Rosalie. Sie drehte ihr Stockbrot. „Jetzt schon.“<\/p>\n<p>Um zehn schliefen die Kinder in ihren Schlafsäcken. Felix und Lina lagen im Seilraum und schliefen nicht. Oben in der Station brannte Licht in Birks Arbeitszimmer. Birk saß dort, wie er gesagt hatte, vor dem Schrank, mit einer Kanne Kaffee.<\/p>\n<p>Um Mitternacht brannte das Licht noch.<\/p>\n<p>Um eins brannte es noch.<\/p>\n<p>Um zwei ging die Tür vom Seilraum auf, und Glitzerstern stand darin, im Schlafanzug und mit Paillettenjacke.<\/p>\n<p>„Lina“, flüsterte sie. „Da guckt einer.“<\/p>\n<p>Lina war sofort wach. Felix auch.<\/p>\n<p>„Wo?“<\/p>\n<p>„Am Fenster von der Station. Von außen. Es hat Ohren.“<\/p>\n<p>Sie rannten hinaus, barfuß, den Pfad hinauf.<\/p>\n<p>Das Licht in Birks Zimmer brannte. Durch das Fenster sah man Birk. Er saß auf seinem Stuhl vor dem Schrank, den Kopf auf der Brust, die Kaffeetasse in der Hand, und schlief.<\/p>\n<p>Und neben ihm stand Mauzi und schloss mit einem Schlüssel aus grauer Knete gerade das zweite Schloss auf.<\/p>\n<p>„Professor!“, schrie Felix.<\/p>\n<p>Birk fuhr hoch. Die Tasse fiel herunter. Mauzi riss die Schranktür auf, packte die Holzkiste mit beiden Pfoten, sprang aufs Fensterbrett und
