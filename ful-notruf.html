  padding:0 8px;padding-top:env(safe-area-inset-top);font-family:system-ui,sans-serif;font-size:14px;

/* ---------- Panels ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}

#toc{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--chrome);z-index:21;

#set{position:fixed;left:50%;top:60px;width:min(340px,92vw);transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  background:var(--chrome);border:1px solid var(--line);border-radius:16px;padding:18px;z-index:21;
  box-shadow:0 12px 40px var(--shadow);font-family:system-ui,sans-serif;font-size:14px;transition:all .22s}

#set .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
#set .lbl{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;padding:9px 6px}
.seg button.on{background:var(--accent);color:#fff}

.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}

<script>
const CH = [{"num": "1", "label": "Kapitel 1", "title": "Gäste an Bord", "html": "<p>Das Erste, was Felix am Morgen hörte, war ein Brummen.<\/p>\n<p>Es war tief und gleichmäßig und kam von überall gleichzeitig, aus den Wänden, aus dem Boden, aus dem schmalen Bett, in dem er lag. Für einen Moment wusste er nicht, wo er war. Dann sah er das runde Fenster über sich. Und hinter dem Fenster sah er keine Häuser und keine Bäume.<\/p>\n<p>Er sah Wolken. Unter sich.<\/p>\n<p>Felix sprang so schnell aus dem Bett, dass er sich den Kopf an der niedrigen Decke stieß. Er drückte das Gesicht ans Fenster. Tief unten zog Paldea vorbei, grün und braun und gelb, mit kleinen Straßen wie Fäden und Seen wie Spiegelscherben. Die Tapfere Oliviana war in der Nacht abgehoben, und er hatte es verschlafen.<\/p>\n<p>Im Bett gegenüber saß Lina schon aufrecht, die Decke um die Schultern, und schaute aus ihrem eigenen Fenster.<\/p>\n<p>„Wir fliegen“, flüsterte sie.<\/p>\n<p>„Wir fliegen“, flüsterte Felix zurück.<\/p>\n<p>„Bzzt!“, rief Rotom von irgendwo unter Felix' Kopfkissen. „Höhe achthundertzwanzig Meter! Geschwindigkeit …“<\/p>\n<p>„Rotom“, sagten beide.<\/p>\n<p>„Bzzt. Ich bin schon still.“<\/p>\n<p>Beim Frühstück in der Messe saßen alle an einem langen Tisch. Friedel saß am Kopfende, Flugkapitän Pikachu auf seiner Schulter, mit der Pilotenbrille auf der Stirn. Daneben saß Orla, die Ingenieurin, mit Öl an den Fingern, obwohl es noch nicht einmal acht Uhr war. Daneben Mollie, die freundlich lächelte und Felix sofort fragte, ob er sich den Kopf gestoßen habe. Er hatte eine Beule. Mollie hatte das gesehen, bevor er sich überhaupt hingesetzt hatte.<\/p>\n<p>Liko, Rory und Dot saßen gegenüber. Rory hatte schon zwei Brötchen gegessen und griff nach dem dritten.<\/p>\n<p>Friedel klopfte mit dem Löffel an seine Tasse.<\/p>\n<p>„Willkommen an Bord“, sagte er zu Felix und Lina. „Eine Sache müsst ihr wissen. Auf der Oliviana hat jeder eine Aufgabe. Liko hält an der Beobachtungsstation Ausschau. Rory kümmert sich um die Flagge und hilft beim Navigieren. Dot macht alles, was mit Technik zu tun hat. Orla sorgt dafür, dass wir nicht vom Himmel fallen.“<\/p>\n<p>„Was sehr nett von mir ist“, sagte Orla.<\/p>\n<p>„Und Gäste?“, fragte Felix.<\/p>\n<p>„Auch Gäste“, sagte Friedel. Er lächelte. „Ihr sucht euch eine aus.“<\/p>\n<p>Felix holte sofort sein Notizbuch heraus. Lina nicht. Lina schaute zur Küchentür.<\/p>\n<p>Durch die Tür kam ein Geräusch. Ein Poltern. Dann ein lautes Schimpfen. Dann das Klappern von Blechen.<\/p>\n<p>„Murdock“, sagte Liko leise. „Er kocht für alle. Und heute Abend kommen Gäste aus dem Dorf, über dem wir gleich anhalten. Er hat zu wenig Zeit und zu viel Teig.“<\/p>\n<p>Lina stand auf.<\/p>\n<p>In der Küche war es heiß. Murdock stand am Tisch, groß und breit, mit einer Schürze, auf der schon drei verschiedene Saucenflecken waren, und knetete einen Berg aus Teig, der so groß war wie ein Kissen. Hinter ihm brummte der Ofen.<\/p>\n<p>„Kein Platz!“, sagte er, ohne aufzuschauen. „Keine Zeit! Raus!“<\/p>\n<p>Lina warf zwei Bälle.<\/p>\n<p>Backel landete mitten in der Küche, groß und goldbraun, und schnupperte sofort. Olivinio landete daneben, ein kleiner Olivenbaum auf zwei Beinen, und schaute sich mit großen Augen um.<\/p>\n<p>Murdock hörte auf zu kneten.<\/p>\n<p>Er erinnerte sich an Backel. Er hatte am Abend in der Akademie gesehen, was Backel konnte. Seine Augen wurden sehr groß.<\/p>\n<p>Backel tapste zum Teigberg. Es beugte sich darüber. Und dann hauchte es, langsam und warm, über den ganzen Berg.<\/p>\n<p>Der Teig ging auf. Er wurde größer und weicher und duftete so gut, dass Flugkapitän Pikachu draußen in der Messe die Ohren aufstellte.<\/p>\n<p>Murdock sagte nichts. Er legte nur ganz vorsichtig die Hand auf den Teig, als wäre er aus Glas.<\/p>\n<p>Dann teilte er ihn in Laibe. Viele Laibe. Und während er sie formte, ging Olivinio von Laib zu Laib und tropfte auf jeden ein bisschen Öl, genau in die Mitte. Murdock schaute ihm zu. Dann nickte er, ganz langsam, wie jemand, der gerade ein Geheimnis gelernt hat.<\/p>\n<p>„Das wird ein neues Brot“, sagte er. „Das Oliviana-Brot.“<\/p>\n<p>Die Laibe kamen in den Ofen. Murdock stellte die Uhr auf zwanzig Minuten.<\/p>\n<p>Backel schaute auf die Uhr. Dann schaute es Murdock an. Dann schüttelte es den Kopf.<\/p>\n<p>„Zwanzig Minuten“, sagte Murdock. „Das mache ich seit dreißig Jahren so.“<\/p>\n<p>Backel schnaubte. Es tippte mit der Pfote auf die Uhr. Zweimal.<\/p>\n<p>„Achtzehn?“, fragte Lina.<\/p>\n<p>Backel nickte.<\/p>\n<p>„Zwanzig“, sagte Murdock.<\/p>\n<p>„Achtzehn“, sagte Lina.<\/p>\n<p>Sie standen sich gegenüber, Murdock und Backel, und schauten sich an, und keiner gab nach. Olivinio stand dazwischen und schaute von einem zum anderen. Dann ging es zum Ofen, stellte sich davor und schnupperte an der Ofentür. Es schnupperte lange.<\/p>\n<p>Nach neunzehn Minuten klopfte Olivinio mit einem Zweig an die Ofentür.<\/p>\n<p>Murdock machte sie auf. Die Brote waren goldbraun. Die Kruste knackte, als er eines herausnahm. Er brach es auf. Innen war es weich und warm und glänzte vom Öl.<\/p>\n<p>Murdock aß ein Stück. Backel aß ein Stück. Sie kauten beide sehr langsam.<\/p>\n<p>„Neunzehn“, sagte Murdock schließlich.<\/p>\n<p>Backel nickte.<\/p>\n<p>„Neunzehn“, sagte Murdock noch einmal, als müsste er es sich merken. Dann schaute er Lina an. „Die beiden haben eine Aufgabe.“<\/p>\n<p>Felix hatte seine Aufgabe im Maschinenraum gefunden.<\/p>\n<p>Er war Orla nachgegangen, weil er gesehen hatte, dass sie einen Schraubenschlüssel in der Hosentasche trug, und weil er wissen wollte, wie ein Luftschiff fliegt. Orla hatte ihn erst angeschaut, als wollte sie ihn wieder hinausschicken. Dann hatte sie sein Notizbuch gesehen.<\/p>\n<p>„Schreibst du alles auf?“, fragte sie.<\/p>\n<p>„Ja.“<\/p>\n<p>„Dann schreib das auf.“<\/p>\n<p>Sie zeigte ihm alles. Den großen Ofen, der heiß brannte und Luft in den Ballon schickte. Die Rohre, die durch das ganze Schiff liefen. Und in der Mitte des Raumes ein großes Laufrad, in dem ein Pokémon lief und lief und lief und dabei Strom für das ganze Schiff machte.<\/p>\n<p>„Neue Lager“, sagte Orla stolz und klopfte auf das Rad. „Dreht sich viel leichter als früher.“<\/p>\n<p>Felix schrieb. Er zeichnete das Rad und den Ofen und die Rohre, mit Pfeilen, wohin die Luft ging und wohin der Strom. Orla schaute ihm über die Schulter.<\/p>\n<p>„Endlich mal jemand, der das praktisch aufschreibt“, sagte sie. „Rory schreibt nie etwas auf. Rory drückt nur auf Sachen.“<\/p>\n<p>Magnetilo war hinter Felix hereingeschwebt. Es blieb vor einem Schaltkasten stehen, in dem Kabel in allen Farben liefen, und schaute mit seinem einen großen Auge darauf, als hätte es das Paradies gefunden.<\/p>\n<p>„Dein Magnetilo“, sagte Orla. „Kann es Strom halten?“<\/p>\n<p>„Ein bisschen“, sagte Felix. „Es hat es geübt.“<\/p>\n<p>Orla dachte nach.<\/p>\n<p>„Gut zu wissen“, sagte sie. „Man weiß nie.“<\/p>\n<p>Am Nachmittag zeigte Dot den beiden ihren Arbeitsplatz. Er war eng und voller Bildschirme, und überall lagen Kabel und Werkzeuge und halb aufgegessene Brote. Rotom schwebte sofort hinein und blieb dort.<\/p>\n<p>„Wir bauen eine neue Antenne“, sagte Dot. „Die alte empfängt nur Signale in der Nähe. Mit Rotom können wir viel weiter hören. Bis aufs Meer.“<\/p>\n<p>„Bzzt!“, sagte Rotom stolz. „Ich bin jetzt Funker!“<\/p>\n<p>Dann führte Liko sie auf die Brücke. Dort stand ein großes, altes Steuerrad aus Holz, und davor ein Pult mit vielen Hebeln und Knöpfen. Durch die großen Fenster sah man den Himmel, weit und blau.<\/p>\n<p>Und auf dem Pult, ganz rechts, war ein roter Knopf. Größer als die anderen. Mit einer Klappe aus Glas darüber.<\/p>\n<p>Rory stand davor. Er hatte die Hände auf dem Rücken verschränkt, als müsste er sie festhalten.<\/p>\n<p>„Den darf ich nicht drücken“, sagte er, als er Felix' Blick sah. „Nie. Friedel hat es gesagt. Orla hat es gesagt. Flugkapitän Pikachu hat es gesagt.“<\/p>\n<p>„Was macht er?“, fragte Felix.<\/p>\n<p>„Weiß ich nicht“, sagte Rory unglücklich. „Das sagt mir ja keiner.“<\/p>\n<p>Felix schrieb es auf. Roter Knopf. Nicht drücken. Funktion unbekannt.<\/p>\n<p>Am Abend landete die Oliviana auf einer Wiese neben einem kleinen Bergdorf. Die Leute aus dem Dorf kamen und aßen mit der Crew. Murdock stellte das Oliviana-Brot auf den Tisch, und es war in zehn Minuten weg, und ein alter Mann aus dem Dorf fragte, ob er das Rezept haben könne, und Murdock sagte: „Das Rezept hat Fell und Zweige. Das kann man nicht aufschreiben.“<\/p>\n<p>Backel lag satt und zufrieden unter dem Tisch. Olivinio saß auf Linas Schoß.<\/p>\n<p>Felix saß neben Rory. Rory hatte die ganze Zeit mit dem Bein gewippt, und Felix wusste, warum.<\/p>\n<p>„Morgen“, sagte Rory schließlich. „Wenn wir auf der Hochebene landen. Da ist Platz. Doppelkampf. Zwei gegen zwei.“<\/p>\n<p>„Mit wem?“, fragte Felix.<\/p>\n<p>Rory grinste. Dann griff er in seine Tasche und zeigte Felix etwas. Ein Armband. Und darin, eingefasst, ein kleiner Stein, in dem es schimmerte, in allen Farben.<\/p>\n<p>Felix kannte diesen Stein. Er trug selbst einen.<\/p>\n<p>„Ein Schlüsselstein“, sagte er langsam.<\/p>\n<p>„Ich hab einen Partner, den du noch nicht kennst“, sagte Rory. „Der hat einen Megastein.“<\/p>\n<p>Felix schaute auf sein eigenes Armband. Dann auf den Ball an seinem Gürtel, in dem Aerodactyl seit Wochen ungeduldig darauf wartete, wieder einmal richtig fliegen zu dürfen.<\/p>\n<p>„Morgen“, sagte Felix.<\/p>\n<p>In der Nacht schrieb er in sein Notizbuch, beim Licht des kleinen runden Fensters, hinter dem jetzt die Sterne waren.<\/p>\n<p>Auf einem Schiff hat jeder eine Aufgabe. Auch die, die nur zu Besuch sind. Vielleicht besonders die.<\/p>\n<p>Er setzte keinen Punkt. Den sollte Lina setzen. Aber Lina schlief schon.<\/p>"}, {"num": "2", "label": "Kapitel 2", "title": "Zwei gegen zwei", "html": "<p>Die Hochebene lag hoch über dem Meer, flach und grün und so weit, dass man das Ende nicht sah. Der Wind blies hier immer. Er bog das Gras in langen Wellen, und am Rand, wo die Ebene in eine Steilküste abbrach, hörte man tief unten die Brandung.<\/p>\n<p>Die Oliviana landete am Morgen. Rory war als Erster draußen. Er hisste die Flagge auf dem Mast, wie jeden Morgen, und rannte dann über die Wiese und stellte mit Steinen ein Kampffeld ab, so groß, dass ein Garados darauf Platz hatte.<\/p>\n<p>Die ganze Crew kam heraus. Murdock brachte Brot. Mollie brachte ihren Koffer, für alle Fälle. Orla setzte sich auf eine Kiste und tat so, als würde sie nur zufällig zuschauen. Dot stand auf einem Felsen, das Handy in der Hand, und Rotom schwebte auf der anderen Seite.<\/p>\n<p>Friedel stand am Rand, Flugkapitän Pikachu auf der Schulter.<\/p>\n<p>„Ich bin Schiedsrichter“, sagte er. „Zwei gegen zwei. Bis einer aufgibt oder keiner mehr kämpfen kann. Und keiner fällt die Klippe hinunter.“<\/p>\n<p>Felix warf zuerst.<\/p>\n<p>Garados erschien mit einem Brüllen, das über die ganze Hochebene rollte. Es gab hier kein Wasser, aber Garados brauchte keins. Es lag im Gras, lang und blau, und hob den Kopf hoch über alle.<\/p>\n<p>Dann der zweite Ball. Aerodactyl kam heraus und war schon in der Luft, bevor das Licht ganz verschwunden war. Es kreiste einmal über dem Feld, groß und grau und mit weit ausgebreiteten Flügeln, und schrie, so laut und so alt, dass Rory einen Schritt zurück machte.<\/p>\n<p>Dann grinste er.<\/p>\n<p>„Lokroko!“<\/p>\n<p>Lokroko stapfte aufs Feld, das glühende Ei auf dem Kopf, und lachte schon, bevor irgendetwas passiert war.<\/p>\n<p>Dann warf Rory den zweiten Ball. Und Felix hielt die Luft an.<\/p>\n<p>Das Pokémon, das herauskam, stand auf zwei Beinen und war schlank und aufrecht, mit langen Ohren und einem Stachel auf jeder Hand und einem auf der Brust. Es sah aus wie ein Lucario. Aber es war nicht blau.<\/p>\n<p>Es war gelb. Goldgelb, wie Weizen in der Sonne.<\/p>\n<p>„Bzzt!“, rief Rotom so laut, dass es selbst erschrak. „Ein schillerndes Lucario! Das ist selten! Sehr selten! Bzzt!“<\/p>\n<p>Lucario öffnete die Augen. Es schaute nicht auf Garados. Es schaute nicht auf Aerodactyl. Es schaute Felix an. Lange. Und Felix hatte das seltsame Gefühl, dass es nicht seine Augen anschaute, sondern irgendetwas hinter seinen Augen.<\/p>\n<p>„Lucario spürt die Aura“, sagte Rory. „Von allen. Was sie fühlen. Was sie vorhaben.“<\/p>\n<p>Felix schluckte.<\/p>\n<p>„Fangt an“, sagte Friedel.<\/p>\n<p>„Garados, Hydropumpe! Auf Lokroko!“<\/p>\n<p>Lucario bewegte sich, bevor Felix den Satz zu Ende gesagt hatte. Es sprang vor Lokroko und hob die Hände, und zwischen seinen Händen leuchtete eine blaue Kugel auf. Der Wasserstrahl traf die Kugel und spritzte in alle Richtungen auseinander.<\/p>\n<p>„Aerodactyl, Steinhagel!“<\/p>\n<p>Aerodactyl stieg auf und ließ Steine regnen. Lucario sprang zur Seite, noch bevor der erste Stein fiel, und zog Lokroko mit sich.<\/p>\n<p>Felix stand ganz still.<\/p>\n<p>Lucario wusste es. Jedes Mal. Es wusste, was Felix sagen würde, bevor er es sagte. Es spürte es, irgendwo in seiner Aura, in der Art, wie er atmete oder die Hand hob.<\/p>\n<p>„Lokroko, Glut! Auf Aerodactyl!“<\/p>\n<p>Die Flamme traf Aerodactyl am Flügel. Es schrie wütend auf, aber es hielt sich in der Luft, denn Feuer tat einem Pokémon aus Stein nicht viel.<\/p>\n<p>Felix dachte nach. So schnell er konnte.<\/p>\n<p>Wenn Lucario seine Befehle spürte, dann durfte er keine Befehle geben. Nicht laut. Nicht vorher.<\/p>\n<p>Er schaute Garados an. Er schaute Aerodactyl an. Und dann tat er etwas, das ihm sehr schwerfiel.<\/p>\n<p>„Ihr zwei“, sagte er. „Ihr entscheidet selbst.“<\/p>\n<p>Rory starrte ihn an. Dot ließ fast das Handy fallen.<\/p>\n<p>Garados schaute zu Felix zurück, nur einen Moment. Dann drehte es den Kopf zu Aerodactyl. Die beiden schauten sich an, das große Wasser-Pokémon am Boden und das uralte Stein-Pokémon in der Luft. Sie hatten noch nie zusammen gekämpft.<\/p>\n<p>Dann schoss Aerodactyl los. Nicht auf Lucario. Auf Lokroko. Und Garados hatte im selben Moment den Kopf gesenkt, weil es genau wusste, wohin Aerodactyl fliegen würde.<\/p>\n<p>Aerodactyl kam von oben, Garados kam von vorn. Lucario spürte es, aber diesmal zu spät, denn es waren nicht Felix' Gedanken, die es lesen musste, sondern zwei andere auf einmal, die sich in der Luft trafen.<\/p>\n<p>Der Wasserstrahl traf Lokroko. Lokroko rollte über das Gras, rappelte sich auf, schüttelte sich und lachte. Aber es war langsamer geworden.<\/p>\n<p>„Gut“, flüsterte Rory. Er klang nicht ärgerlich. Er klang beeindruckt. Dann hob er das Handgelenk mit dem Armband.<\/p>\n<p>„Lucario“, sagte er. „Jetzt.“<\/p>\n<p>Er berührte den Schlüsselstein.<\/p>\n<p>Ein Faden aus Licht spannte sich zwischen Rorys Armband und Lucario, hell und bunt, mitten über die Hochebene. Lucario wurde von Licht umhüllt. Als es verschwand, war Lucario größer geworden, mit längeren Stacheln an Händen und Füßen und roten Zeichen auf dem goldgelben Fell, und um seinen ganzen Körper flackerte eine Aura, die man jetzt mit den Augen sehen konnte, wie eine Flamme aus Licht.<\/p>\n<p>Mega-Lucario.<\/p>\n<p>Felix hob sein eigenes Handgelenk.<\/p>\n<p>„Wir zählen“, sagte er leise zu Aerodactyl. „Eins. Zwei. Drei.“<\/p>\n<p>Er berührte seinen Schlüsselstein.<\/p>\n<p>Aerodactyl schrie, als das Licht es traf. Es wurde größer und schwerer, und aus seinem Körper wuchsen Stacheln aus Stein, an den Flügeln, am Rücken, am Kopf, wie bei einem uralten Felsen, aus dem Kristalle wachsen. Als das Licht verlosch, hing Mega-Aerodactyl über dem Feld, und sein Schatten war so groß, dass er die halbe Wiese bedeckte.<\/p>\n<p>Am Rand sagte niemand mehr etwas. Murdock hatte aufgehört zu kauen.<\/p>\n<p>Was dann kam, ging schnell.<\/p>\n<p>Mega-Aerodactyl stürzte sich auf Lokroko, und Lokroko, schon müde vom Wasser, konnte nicht mehr ausweichen. Der Steinhagel traf, Stein gegen Feuer, und Lokroko setzte sich ins Gras und blieb dort sitzen, lachend, aber fertig.<\/p>\n<p>„Lokroko kann nicht mehr“, sagte Friedel.<\/p>\n<p>Jetzt stand Mega-Lucario allein gegen zwei.<\/p>\n<p>Und Felix merkte zu spät, was das hieß.<\/p>\n<p>Mega-Lucario schloss die Augen. Die Aura um seinen Körper wurde heller. Und als es die Augen wieder öffnete, bewegte es sich, als wüsste es nicht nur, was Felix dachte, sondern auch, was Garados und Aerodactyl dachten. Alle auf einmal.<\/p>\n<p>Mega-Aerodactyl stürzte herab. Mega-Lucario wich aus, einen halben Schritt, nicht mehr, und schlug zu, mit einer Hand, die glänzte wie Stahl. Stahl gegen Stein. Mega-Aerodactyl wurde zur Seite geschleudert und landete schwer im Gras.<\/p>\n<p>Dann formte Mega-Lucario zwischen seinen Händen eine Kugel aus blauem Licht. Sie wurde größer und größer.<\/p>\n<p>„Aurasphäre“, flüsterte Rotom. „Bzzt. Die trifft immer. Man kann nicht ausweichen.“<\/p>\n<p>Die Kugel flog. Mega-Aerodactyl versuchte aufzusteigen. Die Kugel folgte ihm, in einer Kurve, und traf. Aerodactyl leuchtete auf, das Mega-Licht verschwand, und es lag im Gras, wieder klein und grau, und schnaufte.<\/p>\n<p>„Aerodactyl kann nicht mehr“, sagte Friedel.<\/p>\n<p>Jetzt stand nur noch Garados. Gegen Mega-Lucario.<\/p>\n<p>Felix wusste, was Garados am besten konnte. Er hatte es in Hoenn trainiert, wochenlang, am Wasserbecken. Er öffnete den Mund.<\/p>\n<p>Dann schloss er ihn wieder.<\/p>\n<p>Nein. Er hatte gesagt, sie entscheiden selbst.<\/p>\n<p>Garados entschied. Es riss das Maul auf, und ein gewaltiger Strahl aus Licht schoss heraus, gerade auf Mega-Lucario zu. Hyperstrahl. Der stärkste Angriff, den es hatte.<\/p>\n<p>Mega-Lucario hob die Arme vor die Brust und nahm den Strahl einfach auf. Es rutschte zurück, eine Armlänge, zwei, mit den Füßen im Gras. Dann stand es still. Die Aura flackerte. Aber es stand.<\/p>\n<p>„Bzzt“, sagte Rotom ganz leise. „Hyperstrahl ist eine Normal-Attacke. Gegen Stahl ist sie nicht sehr effektiv.“<\/p>\n<p>Felix schloss die Augen. Er hatte es gewusst. Er hatte es nur in diesem Moment vergessen.<\/p>\n<p>Garados lag im Gras und atmete schwer. Nach einem Hyperstrahl musste man sich ausruhen, und das wusste Mega-Lucario auch. Es ging langsam auf Garados zu. Es hob die Hand.<\/p>\n<p>„Wir geben auf“, sagte Felix.<\/p>\n<p>Mega-Lucario blieb stehen. Es ließ die Hand sinken. Dann leuchtete es, und das Mega-Licht verschwand, und es war wieder ein goldgelbes Lucario, das sich leicht vor Garados verbeugte.<\/p>\n<p>„Rory gewinnt“, sagte Friedel.<\/p>\n<p>Rory rannte nicht los. Er blieb stehen, wo er war, und schaute auf das Feld, auf Lokroko, das im Gras saß und lachte, und auf sein Lucario, das sich vor Garados verbeugt hatte. Dann ging er langsam zu Felix hinüber.<\/p>\n<p>„Das war knapp“, sagte er. „So knapp war es noch nie.“<\/p>\n<p>„Du hast gewonnen“, sagte Felix.<\/p>\n<p>„Weil du die zwei hast entscheiden lassen“, sagte Rory. „Lucario konnte dich lesen. Aber nicht die beiden zusammen. Fast nicht. Wenn Garados statt Hyperstrahl Hydropumpe genommen hätte …“<\/p>\n<p>„Ich weiß“, sagte Felix.<\/p>\n<p>Er ging zu Garados. Er legte die Hand auf seinen großen, warmen Kopf.<\/p>\n<p>„Das nächste Mal“, sagte er leise, „sage ich dir, was ich weiß. Und du entscheidest trotzdem selbst.“<\/p>\n<p>Garados schnaubte. Es klang wie ein Ja.<\/p>\n<p>Mollie kam mit ihrem Koffer, kniete sich neben Aerodactyl und Lokroko und Garados und kümmerte sich um alle drei, nacheinander, ohne zu fragen, wem welches Pokémon gehörte. Murdock verteilte Brot. Lucario setzte sich neben Aerodactyl ins Gras. Die beiden schauten sich an, das goldgelbe und das graue, und Aerodactyl schnaubte, aber nicht unfreundlich.<\/p>\n<p>Lina setzte sich neben Felix.<\/p>\n<p>„Du hast verloren“, sagte sie.<\/p>\n<p>„Ja.“<\/p>\n<p>„Bist du traurig?“<\/p>\n<p>Felix dachte nach.<\/p>\n<p>„Nein“, sagte er. „Ich glaube, ich habe heute mehr gelernt als bei den letzten drei Siegen zusammen.“<\/p>\n<p>Am Abend saßen sie alle auf dem Flügeldeck. Der Wind war schwächer geworden. Unten rauschte das Meer.<\/p>\n<p>Liko kam zu Lina und setzte sich neben sie. Sie hatte die Hand an ihrem Anhänger.<\/p>\n<p>„Morgen“, sagte Liko. „Wir beide. Einer gegen einen. Mit Orb.“<\/p>\n<p>Lina schaute sie überrascht an.<\/p>\n<p>„Du fragst mich?“<\/p>\n<p>„Ja“, sagte Liko. Sie lächelte, ein bisschen schüchtern. „Ich hab von euch gelernt, dass man fragt.“<\/p>\n<p>Felix schrieb in sein Notizbuch.<\/p>\n<p>Lucario liest, was man denkt. Aber wenn zwei zusammen entscheiden, ist es schwerer zu lesen. Und das Wichtigste weiß man manchmal nur, und man sagt es trotzdem nicht rechtzeitig.<\/p>\n<p>Diesmal war Lina noch wach. Sie nahm ihm den Stift aus der Hand. Sie setzte einen Punkt dahinter. Einen viel zu großen Punkt.<\/p>\n<p>„So“, sagte sie. „Jetzt gilt er.“<\/p>\n<p>„Und der von gestern?“, fragte Felix und blätterte eine Seite zurück. „Der hat noch keinen.“<\/p>\n<p>Lina beugte sich darüber, las den Satz über die Gäste und die Aufgaben, und setzte auch dort einen Punkt. Noch größer.<\/p>"}, {"num": "3", "label": "Kapitel 3", "title": "Kristall gegen Kristall", "html": "<p>Lina schlief schlecht.<\/p>\n<p>Nicht, weil sie Angst hatte. Sondern weil sie die ganze Nacht an den Orb dachte. Er lag auf dem kleinen Regal über ihrem Bett, und durch das runde Fenster fiel Mondlicht darauf, und in seinem Inneren funkelte es in allen Farben.<\/p>\n<p>Sie hatte ihn noch nie benutzt.<\/p>\n<p>Felix hatte ihn benutzt, an der Akademie, und er hatte genau gewusst, warum. Lina wusste es nicht. Sie wusste nicht einmal, welchen Tera-Typ ihre Pokémon hatten.<\/p>\n<p>Am Morgen fragte sie Rotom.<\/p>\n<p>„Bzzt! Ich kann sie scannen!“ Rotom schwebte über Backel, das noch schlief. „Backel: Tera-Typ Fee. Wie sein normaler Typ.“ Dann über Olivinio, das am Fenster stand und die Zweige in die Sonne hielt. „Olivinio … bzzt … auch Fee!“<\/p>\n<p>„Olivinio ist doch Pflanze und Normal“, sagte Lina.<\/p>\n<p>„Bzzt. Ja. Aber sein Tera-Typ ist Fee. Das ist so. Ich weiß nicht warum.“<\/p>\n<p>Lina schaute Olivinio an. Olivinio schaute zurück und raschelte ein bisschen mit den Blättern.<\/p>\n<p>„Dann probieren wir das heute aus“, sagte Lina. „Zusammen.“<\/p>\n<p>Das Kampffeld vom Vortag war noch da, mit den Steinen am Rand. Die Crew kam wieder heraus, und diesmal brachte Murdock noch mehr Brot mit, weil er gelernt hatte, dass Zuschauen hungrig macht.<\/p>\n<p>Liko stand auf der einen Seite. Lina auf der anderen.<\/p>\n<p>Felix setzte sich neben Rory auf eine Kiste. Rory beugte sich vor.<\/p>\n<p>„Wer gewinnt?“, flüsterte er.<\/p>\n<p>„Weiß ich nicht“, sagte Felix. „Beide sind sehr geduldig.“<\/p>\n<p>„Dann dauert es ewig“, sagte Rory und seufzte.<\/p>\n<p>Liko warf ihren Ball. Brimano erschien, klein und rosa, mit seinem großen runden Hut und den zwei langen Zöpfen, die unter dem Hut heraushingen. Es setzte sich ins Gras und schaute Lina ruhig an. Es spürte, was andere fühlten. Lina wusste das.<\/p>\n<p>Lina warf ihren Ball. Olivinio landete im Gras und raschelte einmal mit allen Zweigen, wie jemand, der sich die Ärmel hochkrempelt.<\/p>\n<p>„Fangt an“, sagte Friedel.<\/p>\n<p>Keine fing an.<\/p>\n<p>Brimano saß im Gras. Olivinio stand im Gras. Liko wartete. Lina wartete.<\/p>\n<p>Rory stöhnte leise.<\/p>\n<p>Nach einer Minute bewegte sich Brimano. Nicht schnell. Es hob nur einen seiner Zöpfe und ließ ihn durch die Luft schwingen, wie ein Seil. Dann schlug der Zopf zu, und er war viel länger, als Lina gedacht hatte. Er traf Olivinio am Stamm.<\/p>\n<p>Olivinio wackelte. Ein paar Blätter fielen herunter.<\/p>\n<p>„Olivinio“, sagte Lina. „Rasierblatt.“<\/p>\n<p>Olivinio schüttelte seine Zweige, und aus den Zweigen flogen Blätter, scharf und schnell, quer über das Feld. Brimano hob die Augen, und die Blätter blieben in der Luft stehen, mitten im Flug, wie festgefroren. Psychokinese. Dann fielen sie ins Gras.<\/p>\n<p>„Brimano spürt, was Olivinio tun will“, sagte Liko. Sie sagte es nicht stolz. Sie erklärte es nur, so wie Lina es auch erklärt hätte.<\/p>\n<p>Lina nickte. Sie hatte es sich gedacht.<\/p>\n<p>Der Kampf ging hin und her, ganz ruhig. Brimanos Zöpfe trafen. Olivinios Blätter wurden in der Luft angehalten. Dann versuchte Olivinio etwas anderes und spritzte Öl, aber Brimano hob sich einfach ein paar Zentimeter in die Luft, und das Öl lief unter ihm durch.<\/p>\n<p>Nach fünf Minuten atmete Olivinio schwer. Brimano nicht.<\/p>\n<p>Liko schaute Lina an. Dann holte sie ihren Orb heraus.<\/p>\n<p>Er war genauso wie Linas, rund und durchsichtig, mit funkelnden Farben darin. Liko hielt ihn einen Moment in der Hand. Dann hob sie ihn hoch.<\/p>\n<p>„Brimano. Terakristallisierung.“<\/p>\n<p>Ein Strahl aus Licht fiel auf Brimano, und Brimano wurde zu Kristall. Rosa und violett, wie Amethyst, und auf seinem Hut wuchs eine Krone, die aussah wie ein Auge aus Edelstein.<\/p>\n<p>„Bzzt! Tera-Typ Psycho! Seine Psycho-Attacken sind jetzt viel stärker!“<\/p>\n<p>Brimanos Augen leuchteten auf. Olivinio wurde hochgehoben, ein Stück über den Boden, und schwebte, und konnte sich nicht mehr wehren. Brimano ließ es kreisen. Einmal. Zweimal. Dann setzte es Olivinio wieder ab, ganz vorsichtig, fast freundlich. Aber Olivinio taumelte.<\/p>\n<p>Lina hielt ihren Orb in der Hand. Er war warm.<\/p>\n<p>Sie dachte an Felix, an der Akademie. Er hatte gewusst, wofür. Und Lina wusste es jetzt auch. Nicht, um zu gewinnen. Sondern weil Olivinio nicht aufgeben wollte. Sie sah es an seinen Zweigen, die sich wieder aufrichteten. Es wollte weitermachen, und es brauchte etwas, das ihm half.<\/p>\n<p>Sie hob den Orb.<\/p>\n<p>„Olivinio. Terakristallisierung.“<\/p>\n<p>Das Licht fiel auf Olivinio. Und Olivinio wurde zu Kristall.<\/p>\n<p>Es glänzte rosa und weiß, wie Perlmutt, wie die Innenseite einer Muschel. Die kleinen Oliven an seinen Zweigen wurden zu funkelnden Perlen. Und auf seinem Kopf wuchs eine Krone aus Kristall, die aussah wie eine Blüte, mit fünf Blättern, die sich langsam öffneten.<\/p>\n<p>Am Rand hielt Dot den Atem an. Rotom vergaß, etwas zu sagen.<\/p>\n<p>„Tera-Typ Fee“, flüsterte Lina.<\/p>\n<p>Brimanos Augen leuchteten wieder auf. Psychokinese. Olivinio wurde wieder hochgehoben.<\/p>\n<p>Aber diesmal war es anders. Diesmal ließ Olivinio sich nicht einfach hochheben. Es leuchtete. Ein helles, weiches Licht kam aus seiner Krone, aus seinen Perlen, aus jedem einzelnen Blatt, und das Licht wurde heller und heller, bis man kaum noch hinschauen konnte.<\/p>\n<p>„Zauberschein“, sagte Lina.<\/p>\n<p>Das Licht breitete sich über das ganze Feld aus, wie Sonnenschein durch Nebel. Es traf Brimano. Und Brimano, das sonst immer spürte, was kommen würde, konnte diesmal nichts tun, denn dieses Licht kam nicht von einer Seite. Es kam von überall.<\/p>\n<p>Olivinio fiel ins Gras, weil die Psychokinese aufgehört hatte. Es landete auf seinen Wurzeln und stand.<\/p>\n<p>Brimano saß im Gras. Seine Kristallkrone hatte einen Riss. Es schüttelte den Kopf, als hätte es zu lange in die Sonne geschaut.<\/p>\n<p>Liko schaute auf Brimano. Dann auf Olivinio, das immer noch leuchtete. Dann auf Lina.<\/p>\n<p>„Noch einmal?“, fragte sie leise.<\/p>\n<p>Lina nickte.<\/p>\n<p>„Brimano, Psychokinese!“<\/p>\n<p>„Olivinio, Zauberschein!“<\/p>\n<p>Beide leuchteten gleichzeitig. Das violette Licht und das rosa Licht trafen sich in der Mitte des Feldes, und für einen Moment sah es aus, als würde dort ein kleiner Stern stehen. Dann zersprangen beide Kronen gleichzeitig, und tausend Splitter flogen durch die Luft, rosa und violett, und glitzerten im Wind, bevor sie verschwanden.<\/p>\n<p>Brimano saß im Gras und stand nicht wieder auf.<\/p>\n<p>Olivinio stand. Es wackelte. Aber es stand.<\/p>\n<p>„Lina gewinnt“, sagte Friedel.<\/p>\n<p>Am Rand war es kurz still. Dann sprang Rory von der Kiste und jubelte, obwohl er gar nicht gewonnen hatte. Murdock klatschte. Mollie lief schon mit ihrem Koffer los.<\/p>\n<p>Liko ging zu Brimano und hob es hoch. Lina ging zu Olivinio und legte die Hand auf seinen Stamm. Dann trafen sie sich in der Mitte des Feldes.<\/p>\n<p>„Das war schön“, sagte Liko. „Das Licht.“<\/p>\n<p>„Deins auch“, sagte Lina.<\/p>\n<p>Sie setzten sich zusammen ins Gras. Brimano lag auf Likos Schoß, Olivinio stand hinter Lina und ließ ein paar Blätter auf sie herunterrieseln.<\/p>\n<p>„Warum hast du ihn benutzt?“, fragte Liko. „Den Orb.“<\/p>\n<p>Lina dachte nach.<\/p>\n<p>„Weil Olivinio nicht aufhören wollte“, sagte sie. „Und ich wollte, dass es nicht aufhören muss.“<\/p>\n<p>Liko nickte langsam. Sie schaute auf ihren Anhänger.<\/p>\n<p>„Ich hab ihn benutzt, weil ich dachte, ich muss“, sagte sie. „Weil Brimano so gut war. Ich wollte, dass es noch besser ist.“ Sie strich Brimano über den Hut. „Das nächste Mal frage ich es vorher.“<\/p>\n<p>Am Abend landete die Oliviana nicht. Sie flog über das Meer, nach Westen, dem Sonnenuntergang hinterher. Die Hochebene war schon lange nicht mehr zu sehen. Unter ihnen war nur Wasser, dunkelblau und glitzernd.<\/p>\n<p>Lina und Felix saßen bei Dot. Dot hatte die neue Antenne fertig. Sie ragte jetzt oben aus dem Ballon heraus, lang und dünn, und Rotom hing an einem Kabel daran und summte leise.<\/p>\n<p>„Bzzt. Ich höre alles“, sagte es. „Ein Fischerboot. Bzzt. Noch ein Fischerboot. Bzzt. Einen Wetterbericht. Es zieht ein Sturm auf. Im Norden.“<\/p>\n<p>„Wie stark?“, fragte Felix.<\/p>\n<p>„Bzzt. Stark.“<\/p>\n<p>Dot schaute auf ihre Bildschirme. Eine Linie zuckte auf und ab.<\/p>\n<p>Dann knackte es.<\/p>\n<p>Aus Dots Lautsprechern kam ein Rauschen. Und mitten im Rauschen, ganz leise, eine Stimme. Eine Frauenstimme. Sie klang weit weg und atemlos.<\/p>\n<p>„… hier ist der Leuchtturm … Klippenhafen … das Licht ist aus … zwei Boote sind noch draußen … bitte … wer das hört …“<\/p>\n<p>Dann nur noch Rauschen.<\/p>\n<p>Dot drehte an einem Knopf. Rotom summte lauter. Nichts.<\/p>\n<p>Es war ganz still in dem kleinen Raum.<\/p>\n<p>Dann stand Dot auf. Sie zog die Kapuze nicht über den Kopf. Sie ging zur Tür und rief, so laut, dass Felix sie noch nie so laut gehört hatte:<\/p>\n<p>„Friedel!“<\/p>\n<p>Friedel stand nach zehn Sekunden in der Tür, Flugkapitän Pikachu auf der Schulter. Dot spielte ihm die Aufnahme vor. Rotom hatte sie gespeichert.<\/p>\n<p>Friedel hörte sie einmal. Dann drehte er sich um.<\/p>\n<p>„Alle auf die Brücke“, sagte er.<\/p>"}, {"num": "4", "label": "Kapitel 4", "title": "In den Sturm", "html": "<p>Auf der Brücke war es eng.<\/p>\n<p>Alle waren da. Friedel am Steuerrad. Flugkapitän Pikachu auf dem Pult, mit der Pilotenbrille über den Augen. Orla mit dem Schraubenschlüssel in der Hand. Mollie. Murdock, der noch eine Schürze trug. Liko, Rory, Dot. Und Felix und Lina, ganz hinten an der Tür.<\/p>\n<p>„Bzzt“, sagte Rotom. Es hing an Dots Laptop. „Ich habe das Signal. Es kam aus dem Norden. Bzzt. Dort gibt es einen Ort. Klippenhafen. Ein Fischerdorf an einer Steilküste. Mit einem Leuchtturm.“<\/p>\n<p>„Wie weit?“, fragte Friedel.<\/p>\n<p>„Zwei Stunden. Bzzt. Wenn der Wind nicht dreht.“<\/p>\n<p>„Und der Sturm?“<\/p>\n<p>„Bzzt. Der ist auch dort.“<\/p>\n<p>Friedel schaute aus dem großen Fenster. Im Norden, über dem Meer, war der Himmel nicht mehr blau. Er war grau. Und darunter, ganz tief, hing eine Wand aus dunklen Wolken.<\/p>\n<p>Niemand sagte etwas.<\/p>\n<p>Dann drehte Friedel das Steuerrad. Die Oliviana neigte sich, ganz langsam, und ihre Nase zeigte nach Norden.<\/p>\n<p>„Orla“, sagte er. „Alles, was der Ofen hergibt.“<\/p>\n<p>„Schon unterwegs“, sagte Orla und war weg.<\/p>\n<p>„Liko, Beobachtungsstation. Dot, Rotom, ihr bleibt an dem Signal. Wenn sie noch einmal sendet, will ich es hören. Rory, du bist hier bei mir.“<\/p>\n<p>„Und wir?“, fragte Felix.<\/p>\n<p>Friedel schaute ihn an. Dann Lina.<\/p>\n<p>„Ihr bereitet euch vor“, sagte er. „Wenn wir dort sind, brauchen wir jedes Pokémon, das schwimmen kann, und jedes, das fliegen kann. Und jedes, das Licht machen kann. Überlegt, wer was kann.“<\/p>\n<p>Felix holte sein Notizbuch heraus. Er schrieb, und Lina schaute ihm über die Schulter und sagte Namen, und er schrieb sie auf.<\/p>\n<p>Garados. Schwimmt. Stark. Kann Boote ziehen.<\/p>\n<p>Aerodactyl. Fliegt. Kann etwas tragen.<\/p>\n<p>Voltrean. Fliegt im Sturm. Findet Blitze.<\/p>\n<p>Pikachu. Strom.<\/p>\n<p>Magnetilo. Kann Strom halten. Orla hat gefragt.<\/p>\n<p>Backel. Steht fest. Wird nicht umgeweht.<\/p>\n<p>Olivinio. Öl. Brot. Und es ist noch müde vom Kampf.<\/p>\n<p>Lina nahm Olivinios Ball in die Hand.<\/p>\n<p>„Du bleibst heute bei Murdock“, sagte sie. „Wenn wir zurückkommen, haben alle Hunger.“<\/p>\n<p>Die erste Stunde war ruhig.<\/p>\n<p>Die zweite nicht.<\/p>\n<p>Es fing mit Wind an. Die Oliviana schaukelte, erst ein bisschen, dann mehr. Die Seile am Ballon knarrten. In der Küche fiel ein Topf vom Haken, und man hörte Murdock schimpfen. Dann kam der Regen. Er peitschte gegen die Fenster der Brücke, so laut, dass man sich anschreien musste.<\/p>\n<p>Felix stand an der Tür und hielt sich am Rahmen fest. Lina stand neben ihm. Pikachu saß in ihrer Jacke und hatte die Ohren angelegt.<\/p>\n<p>Auf dem Pult saß Flugkapitän Pikachu und schaute nach vorne. Es hatte die Pfoten flach auf das Holz gelegt und bewegte sich nicht, egal wie sehr das Schiff schaukelte.<\/p>\n<p>„Bzzt!“, rief Rotom. „Nasgnet zeigt Norden! Wir sind richtig!“<\/p>\n<p>Aus der Beobachtungsstation kam Likos Stimme durch ein Rohr in der Wand.<\/p>\n<p>„Noctuh sieht etwas! Da vorne! Felsen! Eine Küste!“<\/p>\n<p>Durch den Regen sah man es jetzt auch von der Brücke aus. Eine dunkle Wand, hoch und steil, gegen die das Meer schlug, so hoch, dass die Gischt bis zur Hälfte der Klippen spritzte. Und oben auf den Klippen ein schmaler Turm.<\/p>\n<p>Er war dunkel.<\/p>\n<p>„Der Leuchtturm“, sagte Lina.<\/p>\n<p>Dann traf eine Böe das Schiff.<\/p>\n<p>Sie kam von der Seite, so stark, dass die ganze Oliviana sich neigte. Felix wurde gegen die Wand gedrückt. Lina hielt sich an ihm fest. Draußen auf dem Flügeldeck flog eine Kiste über das Geländer und verschwand im Sturm.<\/p>\n<p>„Das Deck!“, rief Orla, die gerade aus dem Maschinenraum kam. „Wenn noch so eine kommt, reißt es uns die Planen vom Deck! Und dann den Ballon!“<\/p>\n<p>Friedel hielt das Steuerrad mit beiden Händen. Die Knöchel waren weiß.<\/p>\n<p>Dann schaute er Rory an.<\/p>\n<p>„Rory“, sagte er. „Der rote Knopf.“<\/p>\n<p>Rory starrte ihn an.<\/p>\n<p>„Aber du hast gesagt …“<\/p>\n<p>„Ich weiß, was ich gesagt habe“, sagte Friedel. „Jetzt sage ich: Drück ihn.“<\/p>\n<p>Rory schaute auf den Knopf. Unter der Glasklappe, rot und groß. Er hatte ihn so lange nicht drücken dürfen. Er hatte so oft davorgestanden und die Hände auf dem Rücken verschränkt.<\/p>\n<p>Jetzt stand er davor und konnte sich nicht bewegen.<\/p>\n<p>Lina sah es. Sie ging zu ihm. Sie legte ihm die Hand auf die Schulter.<\/p>\n<p>„Wir zählen“, sagte sie. „Eins. Zwei. Drei.“<\/p>\n<p>Rory klappte die Glasklappe hoch. Und drückte.<\/p>\n<p>Erst passierte nichts. Dann summte es. Ein tiefes Summen, irgendwo im Bauch des Schiffs. Aus dem Maschinenraum hörte man, wie das Laufrad schneller lief. Und draußen auf dem Flügeldeck flackerte etwas auf, ein schwaches, bläuliches Licht. Es spannte sich wie eine Kuppel über das ganze Deck, von einer Seite zur anderen.<\/p>\n<p>Die nächste Böe kam. Sie traf die Kuppel. Und prallte ab.<\/p>\n<p>Der Regen lief an der Kuppel herunter wie an einer Glasglocke. Auf dem Deck darunter war es plötzlich still. Die Planen lagen ruhig. Die Seile hörten auf zu knarren.<\/p>\n<p>„Der Schild“, flüsterte Rory. „Das ist ein Schild.“<\/p>\n<p>„Den hat Orla gebaut“, sagte Friedel. Er atmete aus. „Für den Fall, dass wir ihn wirklich brauchen. Und er braucht so viel Kraft, dass man ihn nur einschaltet, wenn es nicht anders geht.“<\/p>\n<p>Rory schaute auf seine Hand. Dann auf den Knopf. Dann auf Lina.<\/p>\n<p>„Danke“, sagte er leise.<\/p>\n<p>Die Oliviana landete auf einem flachen Stück Wiese neben dem Leuchtturm. Es war so stürmisch, dass sie mit vier Ankern festgemacht werden musste. Felix half Orla dabei, und der Regen lief ihm in den Kragen und die Ärmel hinauf, und er merkte es kaum.<\/p>\n<p>Am Fuß des Leuchtturms stand eine Frau. Sie war älter als Mollie, mit grauen Haaren, die ihr nass ins Gesicht hingen, und einem Ölmantel, und sie hielt eine kleine Taschenlampe in der Hand. Als sie das Luftschiff sah, ließ sie die Taschenlampe fast fallen.<\/p>\n<p>„Ihr habt es gehört“, sagte sie. „Ihr habt mich gehört.“<\/p>\n<p>„Wir haben es gehört“, sagte Friedel.<\/p>\n<p>Sie hieß Marisol, und sie war die Leuchtturmwärterin von Klippenhafen. Sie führte sie in den Turm, wo es trocken war, und erzählte schnell, mit zitternder Stimme.<\/p>\n<p>Das Licht im Leuchtturm war kein normales Licht. Es kam von einem Pokémon. Von ihrem Lanturn, einem Wasser-Elektro-Pokémon mit zwei leuchtenden Kugeln auf dem Kopf. Seit vierzig Jahren saß ein Lanturn oben in der Laterne und leuchtete jede Nacht, wenn Sturm war, damit die Boote den Weg in den Hafen fanden. Erst ihre Mutter, dann sie.<\/p>\n<p>„Aber heute Nacht ist es zu viel“, sagte Marisol. „Der Sturm kam so schnell. Lanturn hat geleuchtet, stundenlang, so hell es konnte. Und dann …“<\/p>\n<p>Sie zeigte nach oben, die Wendeltreppe hinauf.<\/p>\n<p>Oben in der Laterne, auf einem Kissen, lag ein Lanturn. Es war blau und gelb, und die beiden Kugeln auf seinem Kopf waren dunkel. Es atmete. Aber es leuchtete nicht mehr.<\/p>\n<p>Mollie war sofort neben ihm. Sie kniete sich hin und legte die Hand auf seinen Kopf.<\/p>\n<p>„Erschöpft“, sagte sie. „Ganz und gar. Es braucht Ruhe. Viele Stunden.“<\/p>\n<p>„Und die Boote?“, fragte Lina.<\/p>\n<p>Marisol zeigte aus dem großen Fenster der Laterne, hinaus auf das Meer. Es war schwarz und wild. Man sah nichts. Nur Wellen und Gischt und Regen.<\/p>\n<p>„Zwei“, sagte sie. „Die Morgenstern und die kleine Möwe. Die Morgenstern ist groß, aber ihr Motor ist ausgefallen. Sie treibt irgendwo da draußen. Die Möwe ist klein. Ein Vater und sein Sohn. Die Möwe hat zuletzt gefunkt, dass sie die Klippen nicht mehr sieht.“<\/p>\n<p>Sie schaute Friedel an.<\/p>\n<p>„Ohne das Licht finden sie den Weg nicht“, sagte sie. „Und mit dem Motor ausgefallen kommt die Morgenstern nicht von selbst zurück.“<\/p>\n<p>Friedel nickte. Er drehte sich um. Er schaute die Crew an, einen nach dem anderen.<\/p>\n<p>Felix schlug sein Notizbuch auf. Die Seite war nass. Aber man konnte noch alles lesen.<\/p>\n<p>„Garados kann die Morgenstern ziehen“, sagte er. „Aber es muss sie erst finden.“<\/p>\n<p>„Voltrean“, sagte Lina. „Es fliegt im Sturm. Es sieht von oben, was wir nicht sehen.“<\/p>\n<p>„Aerodactyl kann ein Seil zur Möwe bringen“, sagte Felix. „Wenn wir wissen, wo sie ist.“<\/p>\n<p>„Lucario spürt die Aura“, sagte Rory. „Von Menschen. Auch von weit weg. Auch im Dunkeln.“<\/p>\n<p>„Und das Licht?“, fragte Liko leise.<\/p>\n<p>Alle schauten auf Lanturn, das auf seinem Kissen lag und schlief.<\/p>\n<p>Dann schaute Felix auf Lina. Lina schaute auf Pikachu. Und von irgendwo hinter Felix schwebte Magnetilo heran, mit seinem einen großen Auge, und blieb vor der dunklen Laterne stehen.<\/p>\n<p>„Orla hat gefragt, ob Magnetilo Strom halten kann“, sagte Felix langsam.<\/p>\n<p>„Bzzt“, sagte Rotom. „Und ich bin auch ein Elektro-Pokémon. Bzzt. Ich vergesse das manchmal.“<\/p>\n<p>Friedel schaute sie alle an. Dann nickte er, ein einziges Mal, so wie Flugkapitän Pikachu genickt hatte, als er Felix und Lina an Bord eingeladen hatte.<\/p>\n<p>„Dann haben alle eine Aufgabe“, sagte er.<\/p>\n<p>Draußen heulte der Sturm. Irgendwo auf dem schwarzen Meer trieben zwei Boote.<\/p>\n<p>Und die Crew der Tapferen Oliviana ging hinaus in den Regen.<\/p>"}, {"num": "5", "label": "Kapitel 5", "title": "Die lange Nacht", "html": "<p>Oben in der Laterne war es eng und dunkel.<\/p>\n<p>In der Mitte stand die große Lampe. Sie war rund und aus Messing, und um sie herum drehte sich eine riesige Linse aus Glas, mit vielen Ringen, wie die Augen eines Insekts. Unten am Sockel war eine kleine Klappe, und darin lagen zwei Kupferplatten. Dort hatte Lanturn jede Nacht seine Flossen hingelegt und Strom in die Lampe geschickt.<\/p>\n<p>Jetzt lag Lanturn auf seinem Kissen in der Ecke, und Mollie saß neben ihm.<\/p>\n<p>Lina kniete vor der Klappe. Pikachu saß auf ihrer Schulter. Magnetilo schwebte neben ihr, Rotom auf der anderen Seite. Hinter ihnen stand Rory mit Lokroko, und draußen, auf dem schmalen Umgang rund um die Laterne, stand Lucario im Regen und schaute aufs Meer.<\/p>\n<p>„Pikachu“, sagte Lina. „Auf die Platten. Ganz ruhig.“<\/p>\n<p>Pikachu sprang hinunter und legte beide Pfoten auf das Kupfer. Seine Backen knisterten. Ein Funke sprang.<\/p>\n<p>Die Lampe flackerte. Einmal, hell. Dann wieder dunkel. Dann wieder hell. Wie ein Herz, das nicht weiß, in welchem Takt es schlagen soll.<\/p>\n<p>„Zu unruhig“, sagte Marisol leise. „So erkennen die Boote es nicht.“<\/p>\n<p>Lina schaute Magnetilo an. Magnetilo hatte mit Blitza geübt, auf der Lichtung in Johto, neun Versuche lang, bis die Luft zwischen ihnen gleichmäßig gesummt hatte.<\/p>\n<p>„Magnetilo“, sagte sie. „Nimm Pikachus Strom. Und gib ihn weiter. Gleichmäßig. So wie du es geübt hast.“<\/p>\n<p>Magnetilo schwebte zwischen Pikachu und die Platten. Seine Magnete fingen an zu summen. Pikachu gab Strom, in Stößen, so wie Pikachu es eben tat. Und Magnetilo nahm die Stöße auf und glättete sie und gab sie weiter, ruhig und gleichmäßig, wie Wasser, das aus einem Wasserfall in einen See fließt.<\/p>\n<p>Die Lampe hörte auf zu flackern.<\/p>\n<p>Sie leuchtete. Gelb und warm und gleichmäßig. Das Licht fiel in die große Linse, und die Linse fing es auf und machte es größer und größer, bis ein breiter Strahl aus der Laterne schoss, hinaus in den Regen.<\/p>\n<p>Aber er reichte nicht weit. Nach ein paar Metern verschwamm er.<\/p>\n<p>„Die Linse ist beschlagen“, sagte Marisol. „Es ist zu kalt hier oben. Und zu nass.“<\/p>\n<p>Rory trat vor.<\/p>\n<p>„Lokroko“, sagte er. „Nicht Glut. Nur warm. Ganz leicht warm.“<\/p>\n<p>Lokroko stellte sich vor die Linse. Es schloss die Augen. Das glühende Ei auf seinem Kopf wurde heller, und um Lokroko herum wurde die Luft warm, so wie die Luft über einem Lagerfeuer, wenn das Holz schon fast heruntergebrannt ist. Die Wärme stieg an der Linse hinauf. Der Beschlag verschwand, Ring für Ring, von unten nach oben.<\/p>\n<p>Und der Strahl wurde klar.<\/p>\n<p>Er schoss hinaus aufs Meer, weit, weiter, durch den Regen, durch die Gischt, und wo er auf die Wellen fiel, wurden sie silbern.<\/p>\n<p>„Bzzt!“, sagte Rotom. „Das Signal! Klippenhafen blinkt immer gleich! Marisol, wie?“<\/p>\n<p>„Zweimal kurz“, sagte Marisol. „Einmal lang. Dann Pause.“<\/p>\n<p>„Bzzt! Ich mache das!“<\/p>\n<p>Rotom schwebte an die Lampe und schaltete. Kurz. Kurz. Lang. Pause. Kurz. Kurz. Lang. Pause.<\/p>\n<p>Draußen auf dem Meer, irgendwo im Dunkeln, wusste jetzt jedes Boot, wo Klippenhafen war.<\/p>\n<p>Draußen auf dem Meer war Felix.<\/p>\n<p>Er saß auf Garados' Kopf, beide Hände an den Hörnern, und das Wasser schlug ihm ins Gesicht. Die Wellen waren riesig. Garados schwamm, aber jede Welle drückte es zurück, und die nächste drückte es unter Wasser, und Felix hielt die Luft an und wartete und kam wieder hoch.<\/p>\n<p>Er hatte es gewusst. Er hatte es in Hoenn erlebt, im Sturm über Xeneroville.<\/p>\n<p>„Garados“, sagte er. „Wie damals.“<\/p>\n<p>Er berührte den Schlüsselstein. Der Faden aus Licht spannte sich durch den Regen. Und Mega-Garados brüllte, so laut, dass das Brüllen über die Wellen rollte, und schwamm durch die nächste Welle hindurch, als wäre sie gar nicht da.<\/p>\n<p>Über ihm flog Voltrean.<\/p>\n<p>Lina hatte es ihm mitgegeben, am Fuß des Leuchtturms. „Es reitet auf Stürmen“, hatte sie gesagt. „Es sieht, wo die Blitze einschlagen. Und Boote haben Masten aus Metall.“<\/p>\n<p>Voltrean flog hoch über den Wellen, mit Funken an den Flügeln, und suchte. Es flog einen Kreis. Noch einen. Dann blitzte es, ganz in der Nähe, ein greller Strahl aus den Wolken. Und Voltrean schrie und flog auf die Stelle zu, wo der Blitz eingeschlagen hatte.<\/p>\n<p>Dort trieb ein Boot.<\/p>\n<p>Es war groß, mit einem hohen Mast, und auf dem Bug stand in weißen Buchstaben <b>MORGENSTERN<\/b>. Es schaukelte hilflos in den Wellen, quer zum Wind, und an der Reling standen vier Leute und hielten sich fest. Einer von ihnen schwenkte eine Taschenlampe.<\/p>\n<p>Felix sah sie. Sie sahen ihn. Einen Jungen auf einem riesigen schwarzen Mega-Garados, mitten im Sturm.<\/p>\n<p>Einer der Männer warf ein Seil.<\/p>\n<p>Mega-Garados fing es mit dem Maul. Es drehte sich um. Und dann zog es. Es schwamm gegen den Wind, gegen die Wellen, mit dem Seil zwischen den Zähnen, und hinter ihm drehte sich die Morgenstern langsam, langsam, bis ihr Bug in die richtige Richtung zeigte.<\/p>\n<p>Zum Licht. Kurz. Kurz. Lang.<\/p>\n<p>Auf dem Umgang des Leuchtturms stand Lucario im Regen und hatte die Augen geschlossen.<\/p>\n<p>Rory stand hinter ihm in der Tür. Er sagte nichts. Er wusste, dass Lucario jetzt Ruhe brauchte.<\/p>\n<p>Lucario spürte. Es spürte die Aura von Rory hinter sich. Von Lina und Pikachu und Marisol und Mollie. Von Lanturn, schwach, auf dem Kissen. Es spürte weiter hinaus. Über die Klippen. Über das Wasser. Zu Felix, weit draußen, und zu Garados, stark und wild, und zu vier Menschen auf einem großen Boot.<\/p>\n<p>Und dann spürte es noch zwei.<\/p>\n<p>Weiter links. Viel weiter. Zwei Herzen, ein großes und ein kleines. Sie schlugen schnell. Sehr schnell.<\/p>\n<p>Lucario öffnete die Augen und zeigte mit der Hand. Nach links, in die Dunkelheit, dorthin, wo der Lichtstrahl nicht hinkam.<\/p>\n<p>„Da“, sagte Rory. „Die Möwe. Sie ist da draußen.“<\/p>\n<p>„Rotom“, sagte Lina. „Kannst du den Strahl anhalten? Ihn dahin drehen?“<\/p>\n<p>„Bzzt! Ja!“<\/p>\n<p>Die große Linse hörte auf, sich zu drehen. Langsam schwenkte der Strahl nach links, über das schwarze Wasser, über die Gischt, bis dorthin, wohin Lucario zeigte. Und dort, im Licht, ganz klein, tauchte ein Boot auf. Ein winziges Fischerboot mit einem roten Segel, das in Fetzen hing. Es trieb direkt auf die Klippen zu.<\/p>\n<p>Im Boot saßen zwei. Ein Mann und ein Junge.<\/p>\n<p>Und vor den Klippen, auf der kleinen Hafenmauer, stand der Rest der Crew. Friedel. Murdock. Orla. Dot. Liko mit Brimano. Und Backel, das Lina dort hingestellt hatte, weil Backel fest stand und nicht umfiel, egal wie stark der Wind blies.<\/p>\n<p>Sie hatten ein Seil. Ein langes, dickes Seil von der Oliviana. Aber die Möwe war viel zu weit weg.<\/p>\n<p>Dann kam ein Schatten über die Klippen.<\/p>\n<p>Aerodactyl.<\/p>\n<p>Felix hatte es vor dem Aufbruch losgelassen. Er hatte nicht gesagt, was es tun sollte. Er hatte nur gesagt: „Du siehst, was gebraucht wird. Du entscheidest.“ Und Aerodactyl hatte die ganze Zeit über dem Hafen gekreist und gewartet.<\/p>\n<p>Jetzt stürzte es herab, packte das Ende des Seils mit den Krallen und flog hinaus. Gegen den Wind. Durch den Regen. Am Lichtstrahl entlang, wie an einer Straße aus Licht.<\/p>\n<p>Es erreichte die Möwe. Es ließ das Seil fallen, genau in das kleine Boot. Der Mann fing es auf und band es fest, am Mast, mit zitternden Händen.<\/p>\n<p>„Ziehen!“, rief Friedel.<\/p>\n<p>Sie zogen. Murdock vorne, mit seinen breiten Armen. Dahinter Orla, Friedel, Dot, Liko. Und ganz hinten Backel, das sich das Seilende um den Körper gewickelt hatte und sich mit allen vier Pfoten gegen den Boden stemmte. Wie ein Baumstamm. Wie ein Anker aus Brot.<\/p>\n<p>Die Möwe kam langsam näher. Eine Welle hob sie hoch, und für einen schrecklichen Moment sah es so aus, als würde sie gegen die Hafenmauer schlagen.<\/p>\n<p>„Brimano!“, rief Liko. „Psychokinese!“<\/p>\n<p>Brimanos Augen leuchteten auf. Die Welle hob die Möwe, aber die Möwe schlug nicht auf. Sie schwebte, nur einen Moment, wenige Zentimeter über dem Wasser, gehalten von Brimanos Kraft. Dann setzte Brimano sie ab, ganz sanft, auf der anderen Seite der Mauer. Im ruhigen Wasser des Hafens.<\/p>\n<p>Der Mann sprang heraus. Er hob den Jungen aus dem Boot und hielt ihn fest, so fest, dass der Junge sich beschwerte. Dann sahen beide nach oben, zum Leuchtturm. Zum Licht.<\/p>\n<p>Eine halbe Stunde später kam Mega-Garados in den Hafen geschwommen, mit dem Seil zwischen den Zähnen. Hinter ihm glitt die Morgenstern durch die Hafeneinfahrt, schwer und langsam und heil.<\/p>\n<p>Auf Garados' Kopf saß Felix. Er war so nass, dass er nicht mehr wusste, wo er aufhörte und das Meer anfing. Über ihm flog Voltrean einen letzten Kreis und landete dann auf dem Dach des Hafenhauses.<\/p>\n<p>Garados ließ das Seil los. Das Licht um ihn flackerte, und es war wieder ein blaues, ganz normales Garados, das sehr müde war.<\/p>\n<p>Felix rutschte herunter auf die Hafenmauer. Lina war da, bevor seine Füße den Boden berührten. Sie sagte nichts. Sie umarmte ihn nur, nass, wie er war.<\/p>\n<p>Kurz vor Morgengrauen hörte der Regen auf.<\/p>\n<p>Ganz plötzlich, so wie er gekommen war. Der Wind wurde schwächer und dann still. Über dem Meer rissen die Wolken auf, und dahinter war ein Streifen Himmel, ganz blass, schon fast hell.<\/p>\n<p>Oben im Leuchtturm saß Pikachu neben Magnetilo vor den Kupferplatten. Beide waren erschöpft. Lokroko war im Sitzen eingeschlafen, das Ei auf seinem Kopf glühte nur noch ganz schwach. Rotom schwebte vor der Lampe und blinkte immer noch, kurz, kurz, lang, obwohl es niemand mehr brauchte.<\/p>\n<p>„Bzzt“, sagte es leise. „Ich höre erst auf, wenn es ganz hell ist.“<\/p>\n<p>In der Ecke, auf seinem Kissen, öffnete Lanturn die Augen.<\/p>\n<p>Es schaute auf die Lampe, die leuchtete. Es schaute auf das kleine gelbe Pokémon und das graue Metall-Pokémon, die vor den Platten saßen. Es schaute lange.<\/p>\n<p>Dann leuchteten die beiden Kugeln auf seinem Kopf. Ganz schwach. Nur für einen Moment.<\/p>\n<p>Wie ein Dank.<\/p>"}, {"num": "6", "label": "Kapitel 6", "title": "Licht für das Dorf", "html": "<p>Am Morgen roch das ganze Dorf nach Brot.<\/p>\n<p>Murdock hatte nicht geschlafen. Niemand hatte geschlafen. Aber Murdock hatte als Erster aufgehört, müde zu sein, als er die Halle am Hafen gesehen hatte. Die Leute aus dem Dorf hatten dort die Nacht verbracht, auf Decken und Stühlen, und jetzt saßen sie da, nass und grau im Gesicht, und keiner hatte etwas gegessen.<\/p>\n<p>Murdock hatte nur ein Wort gesagt: „Küche.“<\/p>\n<p>Die Küche der Oliviana war zu klein für ein ganzes Dorf. Also holten sie den großen Ofen aus dem Gasthaus. Orla schloss ihn an das Strom-Rad der Oliviana an. Backel stand daneben und hauchte auf Teig, so viel Teig, wie Lina noch nie gesehen hatte. Olivinio ging von Laib zu Laib und tropfte Öl darauf.<\/p>\n<p>Und Murdock buk.<\/p>\n<p>Neunzehn Minuten. Jedes Blech. Olivinio klopfte jedes Mal mit dem Zweig an die Ofentür, und jedes Mal öffnete Murdock sie, ohne auf die Uhr zu schauen.<\/p>\n<p>Als die ersten Brote in die Halle kamen, hörte man es durch die ganze Hafenstraße. Ein Seufzen, von vielen Leuten gleichzeitig. Dann wurde es sehr still, weil alle aßen.<\/p>\n<p>Der Junge von der Möwe hieß Tomás. Er war ungefähr so alt wie Rory und saß mit seinem Vater ganz vorne. Er aß drei Brote hintereinander. Dann schaute er Backel an, das in der Tür der Halle stand.<\/p>\n<p>„Hat das Pokémon das gemacht?“, fragte er.<\/p>\n<p>„Zusammen mit dem Koch“, sagte Lina. „Und mit dem Bäumchen.“<\/p>\n<p>Tomás stand auf, ging zu Backel und legte ihm die Hand auf die warme Kruste.<\/p>\n<p>„Danke“, sagte er.<\/p>\n<p>Backel wedelte.<\/p>\n<p>Oben im Leuchtturm saß Mollie bei Lanturn. Lina brachte Brot und Wasser und blieb dann.<\/p>\n<p>Lanturn ging es besser. Es konnte den Kopf heben. Die Kugeln auf seinem Kopf leuchteten wieder, schwach, aber stetig, wie zwei kleine Nachtlichter.<\/p>\n<p>„Es braucht noch ein paar Tage“, sagte Mollie. „Dann kann es wieder leuchten. Aber nicht mehr jede Nacht allein. Es ist nicht mehr jung.“<\/p>\n<p>Marisol saß auf der Treppe. Sie schaute Lanturn an, und man sah, dass sie das schon lange gewusst hatte.<\/p>\n<p>„Was machen wir dann im nächsten Sturm?“, fragte sie leise.<\/p>\n<p>Felix kam die Treppe herauf, Orla hinter ihm. Orla hatte einen Schraubenschlüssel in der Hand, und Felix sein Notizbuch, und auf der aufgeschlagenen Seite war eine Zeichnung. Eine Lampe. Kupferplatten. Ein Kasten mit Kabeln.<\/p>\n<p>„Ein Speicher“, sagte Orla. „Wie auf der Oliviana. Lanturn leuchtet an ruhigen Abenden ein bisschen in den Kasten hinein, und der Kasten hebt den Strom auf. Und im Sturm leuchtet die Lampe aus dem Kasten. Dann muss Lanturn nicht die ganze Nacht allein durchhalten. Felix hat es aufgezeichnet. Ich baue es nur.“<\/p>\n<p>Marisol schaute auf die Zeichnung. Dann auf Felix. Ihre Augen waren nass.<\/p>\n<p>„Wie lange dauert das?“, fragte sie.<\/p>\n<p>„Bis heute Abend“, sagte Orla. „Wenn mir einer hilft, der Metall formen kann.“<\/p>\n<p>Felix lächelte. Er warf einen Ball.<\/p>\n<p>Tafforgita landete auf der Treppe, den großen Hammer über der Schulter, und schaute die Kupferplatten an, und man sah, dass es sich sehr freute.<\/p>\n<p>Unten am Hafen war die Mauer an einer Stelle eingestürzt. Die Wellen hatten Steine herausgerissen, und der Steg, an dem die Boote festmachten, hing schief im Wasser.<\/p>\n<p>Felix ließ Stahlos heraus. Stahlos hob die schweren Steine mit seinem Schwanz und setzte sie zurück in die Mauer, einen nach dem anderen. Garados schob den Steg von unten wieder gerade. Lucario und Rory trugen Bretter. Lokroko wärmte den Teer, mit dem die Fugen abgedichtet wurden, und lachte dabei, weil der Teer so lustig blubberte.<\/p>\n<p>Die Dorfkinder halfen mit. Tomás trug Nägel. Ein kleines Mädchen mit Zöpfen trug gar nichts, ging aber die ganze Zeit hinter Lokroko her und schaute auf das glühende Ei.<\/p>\n<p>Liko und Brimano gingen am Strand entlang. Dort hatte der Sturm Netze angespült, ein ganzes Gewirr aus Seilen und Schwimmern und Tang. Und in den Netzen bewegte sich etwas.<\/p>\n<p>Wingull. Drei Stück. Sie hatten sich in der Nacht in den Netzen verfangen, und eins von ihnen hatte einen verletzten Flügel.<\/p>\n<p>Brimano hob die Netze mit Psychokinese hoch, ganz vorsichtig, und Liko löste die Wingull heraus, einen nach dem anderen. Zwei flogen sofort davon. Das dritte blieb sitzen und schaute Liko an.<\/p>\n<p>Liko trug es zu Mollie.<\/p>\n<p>Am Abend leuchtete der Leuchtturm wieder.<\/p>\n<p>Nicht von Pikachu. Nicht von Magnetilo. Sondern aus einem kleinen Kasten aus Kupfer und Messing, den Orla gebaut und Tafforgita geschmiedet und Felix aufgezeichnet hatte. In dem Kasten war der Strom, den Lanturn am Nachmittag hineingeleuchtet hatte, ganz langsam, ohne sich anzustrengen.<\/p>\n<p>Kurz. Kurz. Lang. Pause.<\/p>\n<p>Lanturn lag auf seinem Kissen und schaute zu, wie das Licht über das ruhige Meer wanderte. Und es sah zufrieden aus.<\/p>\n<p>Das ganze Dorf stand unten am Hafen. Als die Tapfere Oliviana die Anker löste, kam Marisol zur Rampe. Sie hatte etwas in der Hand. Eine kleine Laterne aus Messing, alt und blank geputzt, mit einer winzigen Linse vorne, genau wie die große oben im Turm.<\/p>\n<p>„Das war die erste Lampe des Leuchtturms“, sagte sie. „Von meiner Großmutter. Bevor es Lanturn gab.“<\/p>\n<p>Sie gab sie nicht Friedel. Sie gab sie Felix und Lina.<\/p>\n<p>„Für das Schiff“, sagte sie. „Damit ihr immer ein Licht habt. Und damit ihr wiederkommt.“<\/p>\n<p>Lina nahm die Laterne. Felix hielt sie mit fest. Beide sagten nichts, weil man manchmal nichts sagen kann.<\/p>\n<p>Dann stieg die Oliviana auf. Langsam, über den Hafen, über den Leuchtturm, über die Klippen. Unten winkte das ganze Dorf. Tomás rannte bis ans Ende der neuen Hafenmauer und winkte mit beiden Armen.<\/p>\n<p>Auf dem Flügeldeck stand die Crew. Alle zusammen. Rory hisste die Flagge, die im Sturm ein Loch bekommen hatte, und versprach, sie morgen zu flicken.<\/p>\n<p>Friedel stellte sich neben Felix und Lina. Flugkapitän Pikachu saß auf seiner Schulter.<\/p>\n<p>„Ich habe euch an Bord geholt als Gäste“, sagte Friedel. „Das war vor vier Tagen.“<\/p>\n<p>Er schaute auf die Laterne in Linas Händen.<\/p>\n<p>„Ihr seid keine Gäste mehr.“<\/p>\n<p>Flugkapitän Pikachu streckte die Pfote aus. Lina schaute sie an. Dann gab sie ihm die Hand, so wie man einem Kapitän die Hand gibt. Felix auch. Flugkapitän Pikachu nickte. Einmal. Kurz und deutlich.<\/p>\n<p>Rory jubelte so laut, dass Noctuh auf dem Geländer aufflog.<\/p>\n<p>Später, als es dunkel war, hängten sie die kleine Laterne an das Geländer des Flügeldecks. Ihr Licht war winzig. Aber man sah es von überall.<\/p>\n<p>Felix setzte sich darunter und schlug sein Notizbuch auf. Die letzten Seiten waren gewellt vom Regen. Die Zeichnung vom Speicherkasten war ein bisschen verschwommen. Aber man konnte alles noch lesen.<\/p>\n<p>Er schrieb lange. Dann zeigte er Lina den Satz.<\/p>\n<p>Kämpfen lernt man gegeneinander. Helfen lernt man nur miteinander. Und eine Crew ist, wenn jeder weiß, was er kann, und keiner fragt, wem das Seil gehört.<\/p>\n<p>Lina las ihn. Liko las ihn über ihre Schulter. Rory und Dot beugten sich auch darüber, und Rotom schwebte ganz nah heran.<\/p>\n<p>Lina nahm Felix den Stift aus der Hand. Sie setzte einen Punkt dahinter. Einen viel zu großen Punkt.<\/p>\n<p>„So“, sagte sie. „Jetzt gilt er.“<\/p>\n<p>„Für alle?“, fragte Rory.<\/p>\n<p>„Für alle“, sagte Lina.<\/p>\n<p>Über ihnen leuchtete die kleine Laterne. Kurz. Kurz. Lang. Rotom hatte heimlich einen Schalter eingebaut.<\/p>\n<p class=\"ende\">✦ Ende ✦<\/p>"}];
const NUMBERED = CH.filter(c=>c.num).length;
const KEY = "ebook_Felix_und_Lina_Notruf_über_dem_Meer";
const $ = s => document.querySelector(s);
const vp = $("#viewport"), ct = $("#content");
let state = {ch:0, frac:0, fs:null, theme:"light", font:"serif"};
let page = 0, pages = 1, GAP = 0;

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s) Object.assign(state,s); return !!s; }catch(e){ return false; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function applyPrefs(){
  const r = document.documentElement;
  r.dataset.theme = state.theme; r.dataset.font = state.font;
  if(state.fs) r.style.setProperty("--fs", state.fs+"px"); else r.style.removeProperty("--fs");
  $("#fsv").textContent = Math.round(parseFloat(getComputedStyle(r).getPropertyValue("--fs")))+" px";
  document.querySelectorAll("[data-font]").forEach(b=>b.classList.toggle("on", b.dataset.font===state.font));
  document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("on", b.dataset.theme===state.theme));
}

function layout(){
  const w = vp.clientWidth;
  const side = Math.max(20, Math.min(64, w*0.07));
  const pad = Math.floor((w - Math.min(w - 2*side, 720))/2);
  const colW = w - 2*pad;
  GAP = pad*2;
  ct.style.padding = "0 " + pad + "px";
  ct.style.columnWidth = colW + "px";
  ct.style.columnGap = GAP + "px";
  ct.style.columnFill = "auto";
  ct.style.width = w + "px";
  ct.style.transform = "none";
  pages = Math.max(1, Math.round((vp.scrollWidth + pad) / w));
}

function render(ch, frac){
  state.ch = ch;
  const c = CH[ch];
  let h = (c.label ? `<p class="kap">${c.label}</p>` : "") + `<h2>${c.title}</h2>` + c.html;
  if(ch < CH.length-1) h += `<p class="next"><button class="btn" onclick="go(${ch+1},0)">Weiter: ${CH[ch+1].label||CH[ch+1].title}</button></p>`;
  ct.innerHTML = h;
  $("#chTitle").textContent = (c.num ? c.num + " · " : (c.label ? c.label + " · " : "")) + c.title;
  document.querySelectorAll("#tocList li").forEach((li,i)=>li.classList.toggle("cur", i===ch));
  layout();
  show(Math.min(pages-1, Math.round((frac||0)*(pages-1))));
}

function show(p){
  page = Math.max(0, Math.min(pages-1, p));
  vp.scrollLeft = 0; ct.style.transform = `translateX(${-page * vp.clientWidth}px)`;
  state.frac = pages>1 ? page/(pages-1) : 0;
  $("#pg").textContent = `Seite ${page+1} von ${pages}`;
  const total = (state.ch + (pages>1? page/(pages-1)*0.999 : 0)) / CH.length;
  $("#pct").textContent = `${CH[state.ch].num ? "Kapitel "+CH[state.ch].num+" von "+NUMBERED : CH[state.ch].label} · ${Math.round(total*100)} %`;
  $("#prog").style.width = (total*100) + "%";
  save();
}

function go(ch, frac){ render(ch, frac); }
function next(){ if(page < pages-1) show(page+1); else if(state.ch < CH.length-1) render(state.ch+1, 0); }
function prev(){ if(page > 0) show(page-1); else if(state.ch > 0) render(state.ch-1, 1); }

/* Bedienung */
$("#tapR").onclick = next; $("#tapL").onclick = prev;
$("#tapM").onclick = () => $("#bar").style.transform = $("#bar").style.transform ? "" : "translateY(-100%)";
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  if(e.key==="Escape") closeAll();
});
let tx=null, ty=null;
document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && !document.querySelector(".open")){ dx<0?next():prev(); }
  tx=null;
}, {passive:true});
vp.addEventListener("wheel", e=>{ e.preventDefault(); if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<8) return;
  clearTimeout(vp._w); vp._w=setTimeout(()=>{ (e.deltaY+e.deltaX>0)?next():prev(); }, 40); }, {passive:false});

/* Inhaltsverzeichnis & Einstellungen */
const list = $("#tocList");
CH.forEach((c,i)=>{ const li=document.createElement("li");
  li.innerHTML=`<button><span class="n">${c.num||"✦"}</span><span>${c.title}</span></button>`;
  li.firstChild.onclick=()=>{ closeAll(); go(i,0); }; list.appendChild(li); });
function closeAll(){ ["#toc","#set","#scrim"].forEach(s=>$(s).classList.remove("open")); }
$("#tocBtn").onclick=()=>{ $("#toc").classList.add("open"); $("#scrim").classList.add("open"); };
$("#setBtn").onclick=()=>{ const o=$("#set").classList.toggle("open"); $("#scrim").classList.toggle("open",o); };
$("#scrim").onclick=closeAll;
function relayout(){ const f=state.frac; layout(); show(Math.round(f*(pages-1))); }
function setFs(d){ const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"));
  state.fs=Math.max(14,Math.min(34,cur+d)); applyPrefs(); relayout(); }
$("#fsUp").onclick=()=>setFs(2); $("#fsDown").onclick=()=>setFs(-2);
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{ state.font=b.dataset.font; applyPrefs(); relayout(); });
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ state.theme=b.dataset.theme; applyPrefs(); save(); });
let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(relayout,120); });

/* Start */
const had = load();
applyPrefs();
if(had && (state.ch>0 || state.frac>0)){ $("#contBtn").hidden=false;
  $("#contBtn").textContent = "Weiterlesen · " + (CH[state.ch].label || ("Kapitel " + (state.ch+1))); }
function open_(ch,frac){ $("#cover").classList.add("hidden"); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>render(ch,frac)); }
$("#startBtn").onclick=()=>open_(0,0);
$("#contBtn").onclick=()=>open_(state.ch,state.frac);
</script>
</body>
</html>
