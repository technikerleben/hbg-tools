<title>Wortspur – deutsches Wordle</title>
<style>
:root{--ink:#21313b;--muted:#6c787e;--paper:#f7f5ef;--card:#fffefa;--line:#d8d7d0;--green:#5f8f62;--yellow:#c99b38;--gray:#778187;--accent:#d97a4a}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(95,143,98,.1),transparent 34rem),var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100svh;overscroll-behavior:none}button{color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid rgba(217,122,74,.55);outline-offset:2px}
.app{width:min(100%,520px);min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:0 max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom))}
header{height:76px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line)}.brand{text-align:center}.brand h1{margin:0;font-size:clamp(1.35rem,7vw,2rem);letter-spacing:.16em;line-height:1;font-weight:850}.brand span{display:block;margin-top:5px;color:var(--muted);font-size:.67rem;letter-spacing:.09em;text-transform:uppercase}
.icon,.close{border:1px solid var(--line);background:rgba(255,254,250,.7);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:1.25rem;font-weight:750;cursor:pointer}.statsIcon{display:flex;justify-content:center;align-items:end;gap:3px;padding-bottom:10px}.statsIcon i{display:block;width:4px;background:var(--ink);border-radius:2px 2px 0 0}.statsIcon i:nth-child(1){height:9px}.statsIcon i:nth-child(2){height:16px}.statsIcon i:nth-child(3){height:12px}
.modes{align-self:center;display:grid;grid-template-columns:1fr 1fr;width:min(100%,350px);margin:12px auto 8px;padding:3px;background:#e8e7e1;border-radius:999px}.modes button{border:0;background:transparent;border-radius:999px;padding:8px 10px;font-size:.78rem;font-weight:750;cursor:pointer}.modes button.active{background:var(--card);box-shadow:0 2px 8px rgba(33,49,59,.1)}
.game{flex:1;min-height:315px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 0}.board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(74vw,330px);aspect-ratio:5/6}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{min-width:0;display:grid;place-items:center;background:rgba(255,254,250,.68);border:2px solid var(--line);border-radius:7px;font-size:clamp(1.45rem,7vw,2.1rem);font-weight:850;text-transform:uppercase;line-height:1}.tile.filled:not(.correct):not(.present):not(.absent){border-color:#8f989d;animation:pop .1s ease-out}.tile.correct,.tile.present,.tile.absent{color:#fff;border-color:transparent}.tile.reveal.correct,.tile.reveal.present,.tile.reveal.absent{animation:reveal .52s ease both;animation-delay:var(--delay)}.correct{background:var(--green)!important}.present{background:var(--yellow)!important}.absent{background:var(--gray)!important}
.actions{display:flex;gap:8px;margin-top:10px}.primary,.secondary{border-radius:999px;min-height:42px;padding:0 18px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid var(--line);background:var(--card)}
.keyboard{width:100%;padding:8px 0 5px;user-select:none}.keyrow{display:flex;justify-content:center;gap:4px;margin:0 auto 5px}.key{flex:1 1 0;max-width:42px;min-width:0;height:clamp(43px,7.2vh,55px);padding:0;border:0;border-radius:6px;background:#d9dad5;font-size:clamp(.7rem,3.1vw,.9rem);font-weight:800;text-transform:uppercase;cursor:pointer}.key.wide{flex-grow:1.55;max-width:63px;font-size:.65rem}.key.correct,.key.present,.key.absent{color:#fff}
footer{min-height:22px;color:var(--muted);text-align:center;font-size:.7rem}.toast{position:fixed;z-index:20;top:86px;left:50%;translate:-50% 0;max-width:calc(100vw - 28px);padding:10px 14px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:0 10px 28px rgba(33,49,59,.24);text-align:center;font-size:.84rem;font-weight:700;animation:toastin .16s ease-out}
.backdrop{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:18px;background:rgba(24,34,39,.5);backdrop-filter:blur(5px)}.modal{position:relative;width:min(100%,440px);max-height:min(720px,calc(100svh - 36px));overflow:auto;padding:30px;border-radius:22px;background:var(--card);box-shadow:0 28px 90px rgba(24,34,39,.25)}.close{position:absolute;top:16px;right:16px;font-size:1.55rem;line-height:1}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:.74rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.modal h2{max-width:330px;margin:0 35px 18px 0;font-size:1.65rem;line-height:1.12}.modal h3{margin:25px 0 10px;font-size:.9rem;text-transform:uppercase;letter-spacing:.08em}.modal p{color:#536169;font-size:.88rem;line-height:1.55}.example{display:flex;gap:4px;margin:18px 0 8px}.example span{width:38px;aspect-ratio:1;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:5px;font-weight:850}.example .correct,.example .present,.example .absent{color:#fff;border-color:transparent}

const ROWS=[["q","w","e","r","t","z","u","i","o","p","ü"],["a","s","d","f","g","h","j","k","l","ö","ä"],["ENTER","y","x","c","v","b","n","m","⌫"]];
const EMPTY={played:0,won:0,streak:0,bestStreak:0,distribution:[0,0,0,0,0,0],lastDailyWin:null};
const DAY=86400000,EPOCH=Date.UTC(2026,0,1);
let mode=getStore("wortspur-mode")||"daily",answer="",guesses=[],current="",state="playing",revealRow=-1;
let stats={...EMPTY,...safeParse(getStore("wortspur-stats"),{})};
function getStore(k){try{return localStorage.getItem(k)}catch{return null}}
function safeParse(s,f){try{return s?JSON.parse(s):f}catch{return f}}
function dateKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayNo(){return Math.floor((Date.now()-EPOCH)/DAY)}
function dailyWord(){const n=dayNo(),mixed=Math.imul(n^0x9e3779b9,2654435761)>>>0;return WORDS[mixed%WORDS.length]}
function randomWord(old){let w=WORDS[Math.floor(Math.random()*WORDS.length)];while(w===old)w=WORDS[Math.floor(Math.random()*WORDS.length)];return w}
function key(){return mode==="daily"?"wortspur-daily-"+dateKey():"wortspur-free"}
function load(){const saved=safeParse(getStore(key()),null);if(saved){answer=saved.answer;guesses=saved.guesses||[];state=saved.state||"playing"}else{answer=mode==="daily"?dailyWord():randomWord();guesses=[];state="playing"}render()}
function save(){try{localStorage.setItem("wortspur-mode",mode);localStorage.setItem(key(),JSON.stringify({answer,guesses,state}))}catch{}}
function evaluate(guess){const marks=Array(5).fill("absent"),left={};for(let i=0;i<5;i++){if(guess[i]===answer[i])marks[i]="correct";else left[answer[i]]=(left[answer[i]]||0)+1}for(let i=0;i<5;i++)if(marks[i]!=="correct"&&left[guess[i]]>0){marks[i]="present";left[guess[i]]--}return marks}
function toast(text){const el=document.getElementById("toast");el.className="toast";el.textContent=text;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.className="";el.textContent=""},1800)}
function press(k){if(k==="ENTER")submit();else if(k==="⌫"||k==="BACKSPACE"){current=current.slice(0,-1);render()}else if(/^[a-zäöü]$/.test(k)&&state==="playing"&&current.length<5){current+=k;render()}}
function submit(){if(state!=="playing")return toast("Diese Runde ist beendet.");if(current.length!==5){shake();return toast("Noch nicht genug Buchstaben.")}if(!VALID_GUESSES.has(current)){shake();return toast("Dieses Wort ist nicht in der Liste.")}guesses.push(current);revealRow=guesses.length-1;current="";if(guesses.at(-1)===answer){state="won";finish(true,guesses.length);toast("Richtig!");setTimeout(()=>openModal("stats"),1200)}else if(guesses.length===6){state="lost";finish(false,6);toast("Gesucht war "+answer.toUpperCase()+".")}save();render()}
function shake(){const b=document.getElementById("board");b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),450)}
function finish(won,attempt){const today=dateKey(),yesterday=dateKey(new Date(Date.now()-DAY));let streak=stats.streak,last=stats.lastDailyWin;if(won&&mode==="daily"){if(last!==today)streak=last===yesterday?stats.streak+1:1;last=today}else if(!won&&mode==="daily")streak=0;const dist=[...stats.distribution];if(won)dist[attempt-1]++;stats={played:stats.played+1,won:stats.won+(won?1:0),streak,bestStreak:Math.max(stats.bestStreak,streak),distribution:dist,lastDailyWin:last};try{localStorage.setItem("wortspur-stats",JSON.stringify(stats))}catch{}}
function boardHTML(){let out="";for(let r=0;r<6;r++){const word=guesses[r]||(r===guesses.length?current:""),marks=guesses[r]?evaluate(guesses[r]):[];out+='<div class="row">';for(let c=0;c<5;c++){const letter=word[c]||"",mark=marks[c]||"";out+=`<div class="tile ${letter?"filled":""} ${mark} ${r===revealRow&&mark?"reveal":""}" style="--delay:${c*90}ms" aria-label="${letter||"leer"}">${letter}</div>`}out+="</div>"}return out}
function render(){document.getElementById("board").innerHTML=boardHTML();revealRow=-1;document.getElementById("dailyBtn").classList.toggle("active",mode==="daily");document.getElementById("freeBtn").classList.toggle("active",mode==="free");document.getElementById("footer").textContent=mode==="daily"?"Jeden Tag ein neues Wort.":"Spiele so viele abgeschlossene Runden, wie du möchtest.";const km={};guesses.forEach(g=>evaluate(g).forEach((m,i)=>{const p={absent:1,present:2,correct:3};if(!km[g[i]]||p[m]>p[km[g[i]]])km[g[i]]=m}));document.querySelectorAll(".key").forEach(el=>{el.classList.remove("correct","present","absent");if(km[el.dataset.key])el.classList.add(km[el.dataset.key])});document.getElementById("actions").innerHTML=state==="playing"?"":`<button class="primary" id="shareBtn">Ergebnis teilen</button>${mode==="free"?'<button class="secondary" id="newBtn">Neues Wort</button>':""}`;document.getElementById("shareBtn")?.addEventListener("click",share);document.getElementById("newBtn")?.addEventListener("click",newFree)}
function newFree(){answer=randomWord(answer);guesses=[];current="";state="playing";save();render()}
async function share(){const icon={correct:"🟩",present:"🟨",absent:"⬛"},title=mode==="daily"?`Wortspur #${dayNo()} ${state==="won"?guesses.length:"X"}/6`:`Wortspur ${state==="won"?guesses.length:"X"}/6`,text=title+"\n\n"+guesses.map(g=>evaluate(g).map(m=>icon[m]).join("")).join("\n");try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text);toast(navigator.share?"Ergebnis geteilt.":"Ergebnis kopiert.")}catch{}}
function openModal(type){const winrate=stats.played?Math.round(stats.won/stats.played*100):0,max=Math.max(1,...stats.distribution);const help=`<p class="eyebrow">So geht's</p><h2 id="modalTitle">Finde das Wort in sechs Versuchen.</h2><p>Jeder Versuch muss ein bekanntes deutsches Wort mit fünf Buchstaben sein. Das Lösungswort stammt aus einem ausgewählten Pool von 200 Wörtern. Nach der Eingabe zeigen dir die Farben, wie nah du am Ziel bist.</p><div class="example"><span class="correct">A</span><span>P</span><span>F</span><span>E</span><span>L</span></div><p><b>Grün:</b> Der Buchstabe steht an der richtigen Stelle.</p><div class="example"><span>B</span><span class="present">I</span><span>E</span><span>N</span><span>E</span></div><p><b>Gelb:</b> Der Buchstabe kommt vor, steht aber woanders.</p><div class="example"><span>T</span><span>I</span><span class="absent">G</span><span>E</span><span>R</span></div><p><b>Grau:</b> Der Buchstabe kommt im gesuchten Wort nicht vor.</p>`;const stat=`<p class="eyebrow">Deine Bilanz</p><h2 id="modalTitle">Statistik</h2><div class="stats"><div><strong>${stats.played}</strong><span>gespielt</span></div><div><strong>${winrate}</strong><span>% gewonnen</span></div><div><strong>${stats.streak}</strong><span>Serie</span></div><div><strong>${stats.bestStreak}</strong><span>beste Serie</span></div></div><h3>Versuche</h3><div class="distribution">${stats.distribution.map((v,i)=>`<div class="distrow"><span>${i+1}</span><div style="width:${Math.max(9,v/max*100)}%">${v}</div></div>`).join("")}</div>${state!=="playing"?'<button class="primary modalShare" id="modalShare">Ergebnis teilen</button>':""}`;document.getElementById("overlay").innerHTML=`<div class="backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeBtn" aria-label="Schließen">×</button>${type==="help"?help:stat}</section></div>`;document.getElementById("closeBtn").onclick=closeModal;document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};document.getElementById("modalShare")?.addEventListener("click",share)}
function closeModal(){document.getElementById("overlay").innerHTML=""}
document.getElementById("keyboard").innerHTML=ROWS.map(row=>`<div class="keyrow">${row.map(k=>`<button class="key ${k.length>1?"wide":""}" data-key="${k}" aria-label="${k==="⌫"?"Löschen":k==="ENTER"?"Eingabe":k}">${k}</button>`).join("")}</div>`).join("");
document.querySelectorAll(".key").forEach(k=>k.onclick=()=>press(k.dataset.key.toLowerCase()==="enter"?"ENTER":k.dataset.key));
document.getElementById("helpBtn").onclick=()=>openModal("help");document.getElementById("statsBtn").onclick=()=>openModal("stats");document.getElementById("dailyBtn").onclick=()=>{mode="daily";current="";load();save()};document.getElementById("freeBtn").onclick=()=>{mode="free";current="";load();save()};
addEventListener("keydown",e=>{if(document.querySelector(".modal")){if(e.key==="Escape")closeModal();return}if(e.key==="Enter")press("ENTER");else if(e.key==="Backspace")press("BACKSPACE");else if(/^[a-zäöü]$/i.test(e.key))press(e.key.toLowerCase())});
load();save();
</script>
