<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buchstaben-Zug – Alphabet-Spiel</title>
<style>
:root{--bg:#fff8e8;--ink:#25324a;--accent:#5e8fe6;--good:#38a169;--bad:#e76f51;--soft:#eaf2ff;--yellow:#ffd86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff1ad 0 8%,transparent 9%),radial-gradient(circle at 90% 20%,#dff3ff 0 9%,transparent 10%),var(--bg)}
button{font:inherit}.app{max-width:820px;margin:auto;padding:18px}header{text-align:center;margin-bottom:12px}
h1{font-size:clamp(30px,7vw,52px);margin:4px 0}.sub{font-size:clamp(16px,4vw,21px);margin:0}
.panel{background:rgba(255,255,255,.94);border:3px solid #fff;box-shadow:0 8px 24px rgba(40,70,110,.12);border-radius:24px;padding:16px}
.topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.mode{border:0;border-radius:16px;padding:10px 15px;font-weight:800;background:var(--soft);color:var(--ink);cursor:pointer}
.mode.active{background:var(--accent);color:white}.instruction{text-align:center;font-size:20px;font-weight:750;margin:10px 0 14px}
.progress{display:flex;justify-content:center;gap:7px;margin-bottom:10px}.dot{width:13px;height:13px;border-radius:50%;background:#d6deea}.dot.done{background:var(--good)}
.train{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;min-height:115px;padding:12px 4px}
.engine{width:88px;height:72px;border-radius:18px 22px 16px 16px;background:var(--accent);position:relative;display:grid;place-items:center;font-size:40px;box-shadow:0 6px 0 #3767bc}
.engine:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#283a59;bottom:-12px;left:13px;box-shadow:38px 0 0 #283a59}
.slot{width:78px;height:78px;border-radius:18px;border:4px dashed #b8c5d8;background:#f8fbff;display:grid;place-items:center;font-size:42px;font-weight:900;position:relative;transition:.15s}
.slot::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#33445f;bottom:-10px;left:10px;box-shadow:42px 0 0 #33445f}
.slot.filled{border-style:solid;border-color:var(--accent);background:white}.slot.bad{animation:shake .25s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:25px 0 18px;min-height:88px}
.letter{width:76px;height:76px;border-radius:18px;border:0;background:white;color:var(--ink);font-size:44px;font-weight:900;box-shadow:0 5px 0 #c9d4e5,0 8px 16px rgba(30,60,100,.10);cursor:pointer;touch-action:manipulation}
.letter:active{transform:translateY(3px);box-shadow:0 2px 0 #c9d4e5}.letter.used{visibility:hidden}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.big{border:0;border-radius:18px;padding:13px 20px;font-size:19px;font-weight:900;cursor:pointer}
#check{background:var(--good);color:white}#reset{background:#edf1f6;color:var(--ink)}#sound{background:var(--yellow);color:#4b3b00}
.message{min-height:44px;text-align:center;font-size:22px;font-weight:900;padding:8px 0 2px}.stars{text-align:center;font-size:28px;letter-spacing:4px;margin:3px 0 10px}
.help{text-align:center;font-size:14px;opacity:.78;margin-top:10px}.celebrate{animation:pop .45s}@keyframes pop{50%{transform:scale(1.07)}}
@media(max-width:560px){.app{padding:10px}.panel{padding:12px}.engine{width:70px;height:62px;font-size:34px}.slot,.letter{width:61px;height:61px;font-size:36px;border-radius:15px}.slot::after{box-shadow:31px 0 0 #33445f;width:13px;height:13px}}
</style>
</head>
<body>
<main class="app">
<header><h1>🚂 Buchstaben-Zug</h1><p class="sub">Bring die Buchstaben in die richtige Reihenfolge!</p></header>
<section class="panel">
<div class="topbar" aria-label="Spielstufe">
<button class="mode active" data-mode="upper">A B C</button>
<button class="mode" data-mode="lower">a b c</button>
<button class="mode" data-mode="mixed">A b C</button>
</div>
<div class="progress" id="progress" aria-label="Fortschritt"></div>
<div class="stars" id="stars">☆☆☆☆☆</div>
<div class="instruction">Tippe die Buchstaben in alphabetischer Reihenfolge an.</div>
<div class="train" id="train"><div class="engine" aria-hidden="true">🚂</div></div>
<div class="cards" id="cards"></div>
<div class="actions">
<button class="big" id="sound">🔊 Hören</button>
<button class="big" id="reset">↩️ Neu ordnen</button>
<button class="big" id="check">✓ Prüfen</button>
</div>
<div class="message" id="message" aria-live="polite"></div>
<div class="help">Tipp: Du kannst einen gesetzten Buchstaben antippen, um ihn wieder zurückzunehmen.</div>
</section>
</main>
<script>
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let mode="upper",target=[],placed=[],round=0,stars=0;
const roundsTotal=5,train=document.getElementById("train"),cards=document.getElementById("cards"),message=document.getElementById("message"),starsEl=document.getElementById("stars"),progress=document.getElementById("progress");
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function visibleLetter(letter,index){if(mode==="upper")return letter;if(mode==="lower")return letter.toLowerCase();return index%2?letter.toLowerCase():letter}
function newRound(){if(round>=roundsTotal){finishGame();return}placed=[];message.textContent="";const count=round<2?4:5;const start=Math.floor(Math.random()*(alphabet.length-count+1));target=alphabet.slice(start,start+count);renderProgress();render()}
function renderProgress(){progress.innerHTML="";for(let i=0;i<roundsTotal;i++){const d=document.createElement("span");d.className="dot"+(i<round?" done":"");progress.appendChild(d)}starsEl.textContent="★".repeat(stars)+"☆".repeat(roundsTotal-stars)}
function render(){train.innerHTML='<div class="engine" aria-hidden="true">🚂</div>';target.forEach((_,i)=>{const s=document.createElement("button");s.className="slot"+(placed[i]?" filled":"");s.dataset.index=i;s.textContent=placed[i]||"";s.setAttribute("aria-label",placed[i]?"Buchstabe "+placed[i]+" zurücknehmen":"Freier Platz");if(placed[i])s.onclick=()=>{placed.splice(i,1);render()};train.appendChild(s)});
const options=shuffle(target.map((l,i)=>({base:l,show:visibleLetter(l,i)})));if(!window.currentOptions||window.currentTargetKey!==target.join("")+"-"+mode){window.currentOptions=options;window.currentTargetKey=target.join("")+"-"+mode}
cards.innerHTML="";window.currentOptions.forEach(obj=>{const b=document.createElement("button");b.className="letter";b.textContent=obj.show;b.dataset.base=obj.base;if(placed.some(x=>x===obj.show))b.classList.add("used");b.onclick=()=>{if(placed.length<target.length){placed.push(obj.show);render()}};cards.appendChild(b)})}
function normalize(ch){return ch.toUpperCase()}
function check(){if(placed.length!==target.length){message.textContent="Noch nicht fertig 🙂";speak("Es fehlen noch Buchstaben.");return}
const ok=placed.every((ch,i)=>normalize(ch)===target[i]);if(ok){stars++;round++;message.textContent="Super! Der Zug fährt los! ⭐";document.querySelector(".panel").classList.add("celebrate");speak("Super! Das ist richtig.");setTimeout(()=>{document.querySelector(".panel").classList.remove("celebrate");window.currentOptions=null;newRound()},1100)}else{message.textContent="Fast! Schau noch einmal genau hin.";[...document.querySelectorAll(".slot")].forEach(x=>x.classList.add("bad"));speak("Fast. Versuch es noch einmal.");setTimeout(()=>[...document.querySelectorAll(".slot")].forEach(x=>x.classList.remove("bad")),400)}}
function resetPlaced(){placed=[];message.textContent="";render()}
function speak(text){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}
function speakLetters(){speak("Sortiere diese Buchstaben: "+target.map((l,i)=>visibleLetter(l,i)).join(", "))}
function finishGame(){renderProgress();train.innerHTML='<div style="text-align:center;font-size:70px;width:100%">🏁🚂🎉</div>';cards.innerHTML="";message.innerHTML="Geschafft! Du bist ein Alphabet-Profi! 🌟";speak("Geschafft! Du bist ein Alphabet Profi!")}
document.getElementById("check").onclick=check;document.getElementById("reset").onclick=resetPlaced;document.getElementById("sound").onclick=speakLetters;
document.querySelectorAll(".mode").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));btn.classList.add("active");mode=btn.dataset.mode;round=0;stars=0;window.currentOptions=null;newRound()}});
newRound();
</script>
</body>
</html>
