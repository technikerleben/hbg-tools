<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Groß &amp; klein – Buchstaben-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          ui: ['Fredoka', 'ui-rounded', 'system-ui', 'sans-serif'],
          letter: ['Andika', 'Fredoka', 'system-ui', 'sans-serif']
        },
        colors: {
          slateblue: { dark: '#2C3D4C', DEFAULT: '#3E5668', mid: '#6A8599', pale: '#D0DCE6', ghost: '#EEF3F7' },
          sage: { dark: '#4D8B3F', DEFAULT: '#7DBB6F', pale: '#DDF0D8' },
          sun: { DEFAULT: '#F2B705', pale: '#FFF3CC' }
        }
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --col-slate-dark: #2C3D4C;
    --col-slate: #3E5668;
    --col-slate-mid: #6A8599;
    --col-slate-pale: #D0DCE6;
    --col-slate-ghost: #EEF3F7;
    --col-sage-dark: #4D8B3F;
    --col-sage: #7DBB6F;
    --col-sage-pale: #DDF0D8;
    --col-error: #C0392B;
    --col-error-pale: #FDECEA;
    --col-sun: #F2B705;
    --col-sun-dark: #C99600;
    --col-text: #1E2A35;
    --col-shadow: rgba(62, 86, 104, 0.16);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
    color: var(--col-text);
    background: linear-gradient(175deg, #CFE8F8 0%, #E6F3FC 45%, #F6FBFE 100%);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 4px solid var(--col-slate); outline-offset: 3px; border-radius: 12px; }
  .letter { font-family: 'Andika', 'Fredoka', system-ui, sans-serif; font-weight: 700; line-height: 1; }

  #bg3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #fx3d { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
  #app {
    position: relative; z-index: 10; height: 100%;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .screen { display: none; }
  .screen.active { display: flex; }

  /* Runde Knöpfe in der Kopfzeile */
  .btn-round {
    width: 58px; height: 58px; border-radius: 999px; border: 0;
    background: #fff; font-size: 28px; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 5px 0 var(--col-slate-pale), 0 10px 20px var(--col-shadow);
    transition: transform .12s, box-shadow .12s;
  }
  .btn-round:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--col-slate-pale), 0 4px 10px var(--col-shadow); }

  /* Fortschritt */
  .dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 60vw; }
  .dot { width: 18px; height: 18px; border-radius: 999px; background: rgba(255,255,255,.8); border: 3px solid var(--col-slate-pale); transition: background .3s, border-color .3s, transform .3s; }
  .dot.on { background: var(--col-sage-dark); border-color: var(--col-sage-dark); transform: scale(1.1); }
  .tries { font-size: 22px; font-weight: 600; color: var(--col-slate-dark); background: rgba(255,255,255,.85); border-radius: 999px; padding: 2px 14px; }

  /* Menü */
  .block-tile {
    display: grid; place-items: center; border-radius: 22px;
    font-size: 64px; width: 104px; height: 104px;
  }
  .block-up { background: var(--col-slate); color: #fff; box-shadow: 0 8px 0 var(--col-slate-dark); }
  .block-low { background: #fff; color: var(--col-slate-dark); box-shadow: 0 8px 0 var(--col-sun); border: 4px solid var(--col-sun); }
  .mode-card {
    border: 0; cursor: pointer; text-align: center;
    background: #fff; border-radius: 34px; padding: 28px 22px 24px;
    box-shadow: 0 8px 0 var(--col-slate-pale), 0 18px 30px var(--col-shadow);
    transition: transform .15s, box-shadow .15s;
  }
  .mode-card:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--col-slate-pale), 0 8px 14px var(--col-shadow); }
  .illu { width: 70px; height: 70px; border-radius: 16px; display: grid; place-items: center; font-size: 44px; }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(44, 61, 76, .38);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  .panel { background: #fff; border-radius: 36px; box-shadow: 0 10px 0 var(--col-slate-pale), 0 30px 60px rgba(30,42,53,.25); animation: panelIn .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes panelIn { from { transform: scale(.7) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .count-btn {
    border: 0; cursor: pointer; background: var(--col-slate-ghost);
    border-radius: 28px; padding: 18px 10px 20px; min-width: 150px;
    box-shadow: 0 7px 0 var(--col-slate-pale);
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .count-btn:hover { background: #fff; }
  .count-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--col-slate-pale); }
  .count-num { font-size: 68px; font-weight: 700; color: var(--col-slate-dark); line-height: 1; }
  .count-dots { display: grid; grid-template-columns: repeat(5, 12px); gap: 5px; justify-content: center; margin-top: 12px; }
  .count-dots i { width: 12px; height: 12px; border-radius: 999px; background: var(--col-sun); display: block; }
  .toggle { border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; background: transparent; font: inherit; font-size: 22px; color: var(--col-slate-dark); padding: 8px 12px; border-radius: 16px; }
  .toggle .track { width: 62px; height: 36px; border-radius: 999px; background: var(--col-slate-pale); position: relative; transition: background .2s; }
  .toggle .knob { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 999px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .toggle[aria-pressed="true"] .track { background: var(--col-sage-dark); }
  .toggle[aria-pressed="true"] .knob { transform: translateX(26px); }
  .wstar { display: inline-block; font-size: 76px; color: var(--col-slate-pale); animation: starIn .55s cubic-bezier(.34,1.56,.64,1) backwards; }
  .wstar.on { color: var(--col-sun); text-shadow: 0 5px 0 var(--col-sun-dark); }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); } to { transform: none; } }
  .btn-main {
    border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 26px;
    border-radius: 24px; padding: 14px 30px; min-height: 64px;
    transition: transform .12s, box-shadow .12s;
  }
  .btn-main:active { transform: translateY(5px); }
  .btn-go { background: var(--col-sage-dark); color: #fff; box-shadow: 0 6px 0 #356029; }
  .btn-go:active { box-shadow: 0 1px 0 #356029; }
  .btn-soft { background: var(--col-slate-ghost); color: var(--col-slate-dark); box-shadow: 0 6px 0 var(--col-slate-pale); }
  .btn-soft:active { box-shadow: 0 1px 0 var(--col-slate-pale); }

  /* ---------- Zuordnen ---------- */
  #match-board { position: relative; flex: 1; touch-action: none; overflow: hidden; }
  .mid-zone { position: absolute; border: 4px dashed rgba(106,133,153,.35); border-radius: 34px; background: rgba(255,255,255,.28); pointer-events: none; }
  .slot {
    --tile: 80px;
    position: absolute; display: flex; align-items: center; gap: 6px; padding: 6px;
    border-radius: 22px; background: rgba(255,255,255,.82);
    border: 3px solid var(--col-slate-pale);
    box-shadow: 0 6px 14px var(--col-shadow);
    transition: background .25s, border-color .25s, transform .2s;
    cursor: pointer;
  }
  .slot.right { flex-direction: row-reverse; }
  .slot .up { display: grid; place-items: center; border-radius: 16px; background: var(--col-slate); color: #fff; box-shadow: inset 0 -5px 0 var(--col-slate-dark); transition: background .3s, border-radius .3s, box-shadow .3s; }
  .slot .spot { border-radius: 16px; border: 3px dashed var(--col-slate-mid); background: var(--col-slate-ghost); opacity: .7; }
  .slot.hover { transform: scale(1.06); border-color: var(--col-sun); background: #fff; }
  .slot.hover .spot { border-color: var(--col-sun-dark); background: var(--col-sun); opacity: .35; }
  .slot.wrong { animation: shake .5s; border-color: var(--col-error); background: var(--col-error-pale); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-11px); } 40% { transform: translateX(11px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(7px); } }
  .slot.matched { background: var(--col-sage-pale); border-color: var(--col-sage-dark); animation: pop .55s cubic-bezier(.34,1.56,.64,1); }
  .slot.matched .up { background: var(--col-sage-dark); box-shadow: inset 0 -5px 0 #356029; }
  .slot.left.matched .up { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
  .slot.right.matched .up { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
  .slot .link {
    position: absolute; top: 50%; left: calc(6px + var(--tile) + 3px);
    width: 22px; height: 38%; border-radius: 4px; background: var(--col-sage-dark);
    transform: translate(-50%, -50%) scaleX(0); transition: transform .35s cubic-bezier(.34,1.56,.64,1) .05s;
    z-index: 3; pointer-events: none;
  }
  .slot.matched .link { transform: translate(-50%, -50%) scaleX(1); }
  .slot .badge {
    position: absolute; top: -12px; width: 30px; height: 30px; border-radius: 999px;
    background: var(--col-sage-dark); color: #fff; font-size: 18px; font-weight: 700;
    display: grid; place-items: center; border: 3px solid #fff;
    transform: scale(0); transition: transform .35s cubic-bezier(.34,1.56,.64,1) .15s; z-index: 4;
  }
  .slot.left .badge { right: -12px; }
  .slot.right .badge { left: -12px; }
  .slot.matched .badge { transform: scale(1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }

  .lcard {
    position: absolute; left: 0; top: 0; z-index: 5;
    display: grid; place-items: center;
    background: #fff; color: var(--col-slate-dark);
    border: 4px solid var(--col-sun); border-radius: 16px;
    box-shadow: 0 6px 0 var(--col-sun-dark), 0 10px 18px var(--col-shadow);
    cursor: grab; touch-action: none; will-change: transform;
  }
  .lcard.dragging { cursor: grabbing; box-shadow: 0 6px 0 var(--col-sun-dark), 0 26px 34px rgba(30,42,53,.28); }
  .lcard.docked {
    position: relative; left: auto; top: auto; transform: none !important; z-index: 1;
    background: var(--col-sage-dark); color: #fff; border-color: var(--col-sage-dark);
    box-shadow: inset 0 -5px 0 #356029; cursor: pointer;
  }
  .slot.left .lcard.docked { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
  .slot.right .lcard.docked { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

  /* ---------- Memory ---------- */
  #mem-board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #mem-grid { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; }
  .mcard { border: 0; padding: 0; background: none; cursor: pointer; perspective: 900px; position: relative; }
  .mcard .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.34,1.4,.64,1); }
  .mcard.open .inner { transform: rotateY(180deg); }
  .mcard .face {
    position: absolute; inset: 0; border-radius: 20px;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: grid; place-items: center;
  }
  .mcard .back {
    background-color: var(--col-slate);
    background-image: radial-gradient(rgba(255,255,255,.17) 2.5px, transparent 3px);
    background-size: 20px 20px;
    border: 5px solid #fff;
    box-shadow: 0 6px 0 var(--col-slate-dark), 0 12px 20px var(--col-shadow);
    color: rgba(255,255,255,.92); font-weight: 700;
  }
  .mcard .back span { font-size: .62em; }
  .mcard .front {
    transform: rotateY(180deg);
    background: var(--pale); color: var(--dark);
    border: 6px solid var(--base);
    box-shadow: 0 6px 0 var(--base), 0 12px 20px var(--col-shadow);
  }
  .mcard .badge {
    position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; border-radius: 999px;
    background: var(--col-sage-dark); color: #fff; font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 700;
    display: grid; place-items: center; border: 3px solid #fff;
    transform: scale(0); transition: transform .35s cubic-bezier(.34,1.56,.64,1) .1s;
  }
  .mcard.matched { animation: pop .55s cubic-bezier(.34,1.56,.64,1); cursor: default; }
  .mcard.matched .front { box-shadow: 0 6px 0 var(--base), 0 0 0 6px #FFD54F, 0 14px 24px var(--col-shadow); }
  .mcard.matched .badge { transform: scale(1); }

  /* Hinweis bei Handys im Hochformat */
  #rotate { display: none; }
  @media (max-width: 600px) and (orientation: portrait) {
    #rotate { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="bg3d" aria-hidden="true"></canvas>

<div id="app">
  <header class="flex items-center justify-between gap-4 px-4 sm:px-6 pt-3 pb-2">
    <button id="btn-home" class="btn-round" aria-label="Zurück zum Menü" hidden>🏠</button>
    <div id="hud-spacer" class="w-[58px]"></div>
    <div id="hud" class="flex-1 flex items-center justify-center gap-4" role="status" aria-live="polite"></div>
    <button id="btn-sound" class="btn-round" aria-label="Ton an oder aus">🔊</button>
  </header>

  <!-- Menü -->
  <section id="screen-menu" class="screen active flex-1 min-h-0 flex-col items-center justify-center gap-6 px-6 pb-6">
    <div class="flex items-end gap-4" aria-hidden="true">
      <div class="block-tile block-up letter" style="transform: rotate(-6deg)">A</div>
      <div class="block-tile block-low letter" style="transform: rotate(5deg) translateY(6px)">a</div>
    </div>
    <h1 class="font-ui font-bold text-5xl sm:text-6xl text-slateblue-dark text-center">Groß &amp; klein</h1>
    <p class="font-ui text-2xl text-slateblue text-center -mt-2">Welche Buchstaben gehören zusammen?</p>

    <div class="grid grid-cols-2 gap-6 w-full max-w-3xl mt-2">
      <button class="mode-card" data-mode="match" aria-label="Spiel Zuordnen">
        <div class="flex items-center justify-center gap-3 h-24" aria-hidden="true">
          <div class="illu letter" style="background:#3E5668;color:#fff;box-shadow:0 5px 0 #2C3D4C">B</div>
          <svg width="54" height="30" viewBox="0 0 54 30"><path d="M50 15 H8 M18 5 L6 15 L18 25" fill="none" stroke="#6A8599" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/></svg>
          <div class="illu letter" style="background:#fff;color:#2C3D4C;border:4px solid #F2B705;box-shadow:0 5px 0 #C99600">b</div>
        </div>
        <div class="font-ui font-bold text-3xl text-slateblue-dark mt-3">Zuordnen</div>
        <div class="font-ui text-xl text-slateblue mt-1">Schieb klein zu groß</div>
      </button>
      <button class="mode-card" data-mode="memory" aria-label="Spiel Memory">
        <div class="flex items-center justify-center gap-3 h-24" aria-hidden="true">
          <div class="illu letter" style="background:#FDE2E1;color:#9B1C1A;border:4px solid #E53935;transform:rotate(-7deg)">M</div>
          <div class="illu letter" style="background:#FDE2E1;color:#9B1C1A;border:4px solid #E53935;transform:rotate(4deg)">m</div>
          <div class="illu font-ui font-bold" style="background:#3E5668;color:#fff;border:4px solid #fff;box-shadow:0 5px 0 #2C3D4C;font-size:34px;transform:rotate(8deg)">?</div>
        </div>
        <div class="font-ui font-bold text-3xl text-slateblue-dark mt-3">Memory</div>
        <div class="font-ui text-xl text-slateblue mt-1">Finde die Paare</div>
      </button>
    </div>
  </section>

  <!-- Zuordnen -->
  <section id="screen-match" class="screen flex-1 min-h-0 px-2 pb-2">
    <div id="match-board"></div>
  </section>

  <!-- Memory -->
  <section id="screen-memory" class="screen flex-1 min-h-0 px-4 pb-4 pt-1">
    <div id="mem-board"><div id="mem-grid"></div></div>
  </section>
</div>

<!-- Auswahl: Anzahl Buchstaben -->
<div id="count-modal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="count-title">
  <div class="panel relative w-full max-w-2xl px-8 py-8 text-center">
    <button id="count-close" class="btn-round absolute top-4 right-4" style="width:48px;height:48px;font-size:22px" aria-label="Schließen">✕</button>
    <div id="count-mode" class="font-ui text-2xl text-slateblue">Zuordnen</div>
    <h2 id="count-title" class="font-ui font-bold text-4xl text-slateblue-dark mt-1">Wie viele Buchstaben?</h2>
    <div class="flex flex-wrap justify-center gap-5 mt-7">
      <button class="count-btn" data-n="5" aria-label="5 Buchstaben"><div class="count-num">5</div><div class="count-dots"></div></button>
      <button class="count-btn" data-n="10" aria-label="10 Buchstaben"><div class="count-num">10</div><div class="count-dots"></div></button>
      <button class="count-btn" data-n="15" aria-label="15 Buchstaben"><div class="count-num">15</div><div class="count-dots"></div></button>
    </div>
    <div class="mt-6">
      <button id="toggle-uml" class="toggle" aria-pressed="false">
        <span class="track"><span class="knob"></span></span>
        <span>mit <span class="letter">Ä Ö Ü</span></span>
      </button>
    </div>
  </div>
</div>

<!-- Gewonnen -->
<div id="win" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
  <div class="panel w-full max-w-xl px-8 py-9 text-center">
    <div id="win-stars" class="flex justify-center gap-3" aria-hidden="true"></div>
    <h2 id="win-title" class="font-ui font-bold text-5xl text-slateblue-dark mt-3">Super gemacht!</h2>
    <p id="win-text" class="font-ui text-2xl text-slateblue mt-3"></p>
    <div class="flex flex-wrap justify-center gap-4 mt-8">
      <button id="win-again" class="btn-main btn-go">🔁 Nochmal</button>
      <button id="win-menu" class="btn-main btn-soft">🏠 Anderes Spiel</button>
    </div>
  </div>
</div>

<!-- Hochformat-Hinweis -->
<div id="rotate" class="overlay flex-col gap-4 text-center" style="z-index:80">
  <div class="panel px-8 py-8">
    <div style="font-size:64px">🔄</div>
    <p class="font-ui text-2xl text-slateblue-dark mt-2">Bitte dreh das Gerät quer.</p>
  </div>
</div>

<canvas id="fx3d" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  /* ================= Grunddaten ================= */
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const UML = ['Ä', 'Ö', 'Ü'];
  const NAMES = {
    A:'A', B:'Be', C:'Ze', D:'De', E:'E', F:'Eff', G:'Ge', H:'Ha', I:'I', J:'Jott', K:'Ka', L:'Ell', M:'Emm',
    N:'Enn', O:'O', P:'Pe', Q:'Ku', R:'Err', S:'Ess', T:'Te', U:'U', V:'Fau', W:'We', X:'Ix', Y:'Ypsilon',
    Z:'Zett', 'Ä':'Ä', 'Ö':'Ö', 'Ü':'Ü'
  };
  // 15 gut unterscheidbare Paarfarben: Rand (base), Fläche (pale), Buchstabe (dark)
  const PALETTE = [
    { base:'#E53935', pale:'#FDE2E1', dark:'#9B1C1A' },
    { base:'#FB8C00', pale:'#FFE8CC', dark:'#9A4F00' },
    { base:'#F2C200', pale:'#FFF6CC', dark:'#6E5600' },
    { base:'#7CB342', pale:'#EAF5DC', dark:'#3F6A16' },
    { base:'#00A896', pale:'#D5F5F1', dark:'#00635A' },
    { base:'#29B6F6', pale:'#DDF3FD', dark:'#01579B' },
    { base:'#1E5BD8', pale:'#DCE6FB', dark:'#12378A' },
    { base:'#8E24AA', pale:'#F1DDF6', dark:'#5A1470' },
    { base:'#EC407A', pale:'#FCE0EA', dark:'#9C1347' },
    { base:'#8D6E63', pale:'#EFE6E2', dark:'#4E342E' },
    { base:'#2E7D32', pale:'#DCEFDD', dark:'#1B4D1E' },
    { base:'#9575CD', pale:'#ECE6F7', dark:'#4A2E85' },
    { base:'#FF7043', pale:'#FFE5DC', dark:'#A63A14' },
    { base:'#9E9D24', pale:'#F2F2D2', dark:'#55540C' },
    { base:'#607D8B', pale:'#E3EAED', dark:'#2F444F' }
  ];

  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const hexNum = h => parseInt(h.slice(1), 16);

  /* ================= Speicher ================= */
  const LS_KEY = 'buchstaben-spiel-v1';
  const settings = Object.assign({ sound: true, umlaut: false, stars: 0 }, (() => {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  })());
  const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(settings)); } catch (e) {} };

  function pickLetters(n) {
    const pool = settings.umlaut ? ALPHA.concat(UML) : ALPHA;
    return shuffle(pool).slice(0, n);
  }

  /* ================= Ton & Sprache ================= */
  let actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f, d = .15, type = 'sine', v = .15, delay = 0, slideTo = 0) {
    if (!settings.sound) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + .05);
  }
  const sfx = {
    pick: () => tone(520, .09, 'triangle', .12, 0, 760),
    good: () => { tone(660, .16, 'triangle', .16); tone(880, .2, 'triangle', .16, .1); tone(1320, .35, 'sine', .1, .2); },
    bad:  () => { tone(330, .18, 'sine', .14, 0, 220); tone(220, .25, 'sine', .1, .14, 150); },
    flip: () => tone(420, .07, 'triangle', .09, 0, 640),
    win:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .32, 'triangle', .15, i * .13)); tone(1568, .7, 'sine', .08, .55); }
  };

  let deVoice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    deVoice = vs.find(v => v.lang === 'de-DE') || vs.find(v => v.lang && v.lang.toLowerCase().startsWith('de')) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (!settings.sound || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; if (deVoice) u.voice = deVoice;
      u.rate = .9; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ================= Tween ================= */
  const ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  };
  // fn(k, p) gibt false zurück, um abzubrechen
  function tween(dur, fn, easeFn = ease.outCubic) {
    return new Promise(res => {
      const t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        if (fn(easeFn(p), p) === false) return res(false);
        if (p < 1) requestAnimationFrame(step); else res(true);
      }
      requestAnimationFrame(step);
    });
  }

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= three.js: Hintergrund ================= */
  const BG = (() => {
    const noop = { cheer() {} };
    if (!window.THREE) return noop;
    let r;
    try { r = new THREE.WebGLRenderer({ canvas: $('#bg3d'), alpha: true, antialias: true }); } catch (e) { return noop; }
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    r.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50, 1, .1, 100);
    cam.position.z = 14;
    scene.add(new THREE.AmbientLight(0xffffff, .72));
    const dl = new THREE.DirectionalLight(0xffffff, .65); dl.position.set(3, 6, 8); scene.add(dl);

    // schwebende Spielklötze
    const geos = [
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.CylinderGeometry(.5, .5, .9, 24),
      new THREE.ConeGeometry(.6, 1, 4),
      new THREE.SphereGeometry(.55, 20, 14),
      new THREE.TorusGeometry(.48, .18, 12, 32)
    ];
    const cols = [0xF5DDD1, 0xFFE9A8, 0xDDF0D8, 0xD0DCE6, 0xECE6F7, 0xFFD3C2, 0xC9E8F5];
    const objs = [];
    for (let i = 0; i < 18; i++) {
      const m = new THREE.Mesh(geos[i % geos.length], new THREE.MeshStandardMaterial({ color: cols[i % cols.length], flatShading: true, roughness: .55, transparent: true, opacity: .8 }));
      const side = i % 2 ? 1 : -1;
      m.userData = {
        bx: side * (4 + Math.random() * 7), by: (Math.random() - .5) * 11, z: -2 - Math.random() * 8,
        ph: Math.random() * 6.28, sp: .25 + Math.random() * .35, rs: (Math.random() - .5) * .8
      };
      m.scale.setScalar(.6 + Math.random() * .8);
      m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      scene.add(m); objs.push(m);
    }
    function resize() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
    resize(); addEventListener('resize', resize);
    let excite = 0;
    function frame(t) {
      const s = t / 1000;
      objs.forEach(m => {
        const u = m.userData;
        m.position.set(u.bx + Math.sin(s * u.sp + u.ph) * .8, u.by + Math.cos(s * u.sp * .8 + u.ph) * .6 + excite * Math.sin(s * 9 + u.ph) * .5, u.z);
        m.rotation.x += u.rs * .01 * (1 + excite * 6);
        m.rotation.y += u.rs * .013 * (1 + excite * 6);
      });
      excite *= .985;
      r.render(scene, cam);
      if (!reduceMotion) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return { cheer() { excite = 1; } };
  })();

  /* ================= three.js: Effekte (Konfetti, Sterne, Ringe) ================= */
  const FX = (() => {
    const noop = { burst() {}, ring() {}, confetti() {}, resize() {} };
    if (!window.THREE) return noop;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: $('#fx3d'), alpha: true, antialias: true }); } catch (e) { return noop; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    const cam = new THREE.OrthographicCamera(0, 1, 0, -1, -100, 100);

    const plane = new THREE.PlaneGeometry(1, 1);
    const circle = new THREE.CircleGeometry(.5, 18);
    const ringGeo = new THREE.RingGeometry(.84, 1, 56);
    const star = (() => {
      const s = new THREE.Shape();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? .22 : .5, a = i / 10 * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        i ? s.lineTo(x, y) : s.moveTo(x, y);
      }
      s.closePath();
      return new THREE.ShapeGeometry(s);
    })();

    const DEF = [0xF2B705, 0x7DBB6F, 0x4D8B3F, 0x3E5668, 0xEC407A, 0x29B6F6, 0xFF7043];
    const parts = [];
    let running = false, last = 0;

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      cam.right = innerWidth; cam.bottom = -innerHeight; cam.updateProjectionMatrix();
    }
    resize();

    function add(geo, color, x, y, size, o) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, depthTest: false }));
      m.position.set(x, -y, 0);
      m.scale.set(size, size * (o.aspect || 1), 1);
      m.rotation.z = Math.random() * 6.28;
      scene.add(m);
      parts.push(Object.assign({ m, life: 0, max: 1, vx: 0, vy: 0, g: 0, vr: 0, vflip: 0, drag: .985, grow: 0, size, fadeAll: false }, o));
      start();
    }
    function start() {
      if (running) return;
      running = true; last = performance.now();
      requestAnimationFrame(loop);
    }
    function loop(t) {
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life += dt;
        const k = p.life / p.max;
        if (k >= 1) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); continue; }
        const d = Math.pow(p.drag, dt * 60);
        p.vx *= d; p.vy = p.vy * d + p.g * dt;
        p.m.position.x += p.vx * dt;
        p.m.position.y -= p.vy * dt;
        p.m.rotation.z += p.vr * dt;
        p.m.rotation.x += p.vflip * dt;
        if (p.grow) { const e = 1 - Math.pow(1 - k, 3); const s = p.size + (p.grow - p.size) * e; p.m.scale.set(s, s, 1); }
        p.m.material.opacity = p.fadeAll ? 1 - k : (k < .7 ? 1 : 1 - (k - .7) / .3);
      }
      renderer.render(scene, cam);
      if (parts.length) requestAnimationFrame(loop); else { running = false; renderer.render(scene, cam); }
    }

    function burst(x, y, opt = {}) {
      const colors = opt.colors || DEF;
      let count = opt.count || 24;
      if (reduceMotion) count = Math.ceil(count / 3);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, v = 220 + Math.random() * 380;
        const r = Math.random();
        const geo = r < .4 ? star : r < .75 ? plane : circle;
        const size = geo === star ? 16 + Math.random() * 14 : 8 + Math.random() * 8;
        add(geo, colors[i % colors.length], x, y, size, {
          aspect: geo === plane ? .6 : 1,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, g: 900,
          max: .8 + Math.random() * .6, vr: (Math.random() - .5) * 10, vflip: (Math.random() - .5) * 12
        });
      }
    }
    function ring(x, y, color = 0x4D8B3F) {
      add(ringGeo, color, x, y, 24, { grow: 130, max: .6, fadeAll: true });
    }
    function confetti() {
      const W = innerWidth, H = innerHeight, n = reduceMotion ? 50 : 180;
      for (let i = 0; i < n; i++) {
        const isStar = Math.random() < .25;
        add(isStar ? star : plane, DEF[i % DEF.length], Math.random() * W, -20 - Math.random() * H * .6, isStar ? 18 + Math.random() * 10 : 10 + Math.random() * 8, {
          aspect: isStar ? 1 : .55, vx: (Math.random() - .5) * 180, vy: 60 + Math.random() * 200, g: 240,
          drag: .995, max: 3 + Math.random() * 2, vr: (Math.random() - .5) * 6, vflip: 4 + Math.random() * 10
        });
      }
      [[.2, .35], [.8, .3], [.5, .2]].forEach(([fx, fy], i) =>
        setTimeout(() => burst(W * fx, H * fy, { count: 30 }), 250 + i * 280));
    }
    return { burst, ring, confetti, resize };
  })();

  /* ================= Kopfzeile ================= */
  function setHudMenu() {
    $('#hud').innerHTML = `<div class="tries" aria-label="Gesammelte Sterne">⭐ ${settings.stars}</div>`;
  }
  function setProgress(done, n, tries) {
    let html = '<div class="dots" aria-label="' + done + ' von ' + n + ' geschafft">' +
      Array.from({ length: n }, (_, i) => `<span class="dot ${i < done ? 'on' : ''}"></span>`).join('') + '</div>';
    if (tries !== undefined) html += `<div class="tries" aria-label="${tries} Versuche">👆 ${tries}</div>`;
    $('#hud').innerHTML = html;
  }
  function updateSoundBtn() {
    $('#btn-sound').textContent = settings.sound ? '🔊' : '🔇';
    $('#btn-sound').setAttribute('aria-pressed', String(settings.sound));
  }

  const App = {
    screen: 'menu', mode: 'match',
    show(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
      this.screen = name;
      $('#btn-home').hidden = name === 'menu';
      $('#hud-spacer').hidden = name !== 'menu';
      if (name === 'menu') setHudMenu();
    }
  };

  /* ================= Spiel 1: Zuordnen ================= */
  const Match = {
    board: null, midEl: null, n: 0, slots: [], cards: [], L: null, drag: null, z: 10,
    done: 0, mistakes: 0, round: 0,

    start(n) {
      this.round++;
      const round = this.round;
      this.board = $('#match-board');
      this.board.innerHTML = '';
      this.n = n; this.done = 0; this.mistakes = 0; this.drag = null; this.z = 10;

      const letters = pickLetters(n);
      const sorted = letters.slice().sort((a, b) => a.localeCompare(b, 'de'));
      const leftCount = Math.ceil(n / 2);

      this.midEl = document.createElement('div');
      this.midEl.className = 'mid-zone';
      this.board.appendChild(this.midEl);

      this.slots = sorted.map((L, i) => {
        const side = i < leftCount ? 'left' : 'right';
        const el = document.createElement('div');
        el.className = 'slot ' + side;
        el.innerHTML = `<div class="up letter">${L}</div><div class="spot"></div><i class="link"></i><span class="badge" aria-hidden="true">✓</span>`;
        el.setAttribute('aria-label', 'großes ' + L);
        const s = { L, side, el, up: el.querySelector('.up'), spot: el.querySelector('.spot'), matched: false, idx: side === 'left' ? i : i - leftCount };
        el.addEventListener('click', () => {
          if (this.drag) return;
          say(s.matched ? `großes ${NAMES[L]} und kleines ${NAMES[L]}` : `großes ${NAMES[L]}`);
        });
        this.board.appendChild(el);
        return s;
      });

      this.cards = shuffle(letters).map(L => {
        const el = document.createElement('div');
        el.className = 'lcard letter';
        el.textContent = L.toLowerCase();
        el.setAttribute('aria-label', 'kleines ' + L);
        const rot = Math.random() * 24 - 12;
        const c = { L, el, x: 0, y: 0, nx: 0, ny: 0, homeNx: 0, homeNy: 0, rot, homeRot: rot, scale: 0, docked: false, ptok: 0, stok: 0 };
        el.addEventListener('pointerdown', e => this.down(e, c));
        el.addEventListener('pointermove', e => this.move(e, c));
        el.addEventListener('pointerup', e => this.up(e, c, false));
        el.addEventListener('pointercancel', e => this.up(e, c, true));
        this.board.appendChild(el);
        return c;
      });

      App.show('match');
      setProgress(0, n);

      requestAnimationFrame(() => {
        if (round !== this.round) return;
        this.measure(); this.scatter(); this.apply();
        this.cards.forEach((c, i) => {
          setTimeout(() => {
            if (round !== this.round) return;
            const tok = ++c.stok;
            tween(480, k => { if (c.stok !== tok) return false; c.scale = k; this.setT(c); }, ease.outBack);
          }, 150 + i * 50);
        });
      });
      say('Schieb jeden kleinen Buchstaben zu seinem großen Buchstaben.');
    },

    measure() {
      const W = this.board.clientWidth, H = this.board.clientHeight, n = this.n;
      const rowsL = Math.ceil(n / 2), rowsR = Math.floor(n / 2);
      const pad = 10, gap = clamp(H * .012, 6, 12);
      let tile = Math.floor((H - 2 * pad - (rowsL - 1) * gap) / rowsL) - 18;
      tile = Math.min(tile, 112, Math.floor((W - 2 * pad - 90) / 7));
      tile = Math.max(tile, 34);
      const slotW = 2 * tile + 24, slotH = tile + 18;
      const colY = rows => (H - (rows * slotH + (rows - 1) * gap)) / 2;
      const yl = colY(rowsL), yr = colY(rowsR);
      this.slots.forEach(s => {
        s.w = slotW; s.h = slotH;
        s.x = s.side === 'left' ? pad : W - pad - slotW;
        s.y = (s.side === 'left' ? yl : yr) + s.idx * (slotH + gap);
      });
      const m = 22;
      const mid = { x0: pad + slotW + m, x1: W - pad - slotW - m, y0: pad + 6, y1: H - pad - 6 };
      mid.w = mid.x1 - mid.x0; mid.h = mid.y1 - mid.y0;
      this.L = { W, H, tile, mid };
    },

    apply() {
      const { tile, mid } = this.L;
      const fs = Math.round(tile * .68) + 'px';
      Object.assign(this.midEl.style, { left: (mid.x0 - 10) + 'px', top: mid.y0 + 'px', width: (mid.w + 20) + 'px', height: mid.h + 'px' });
      this.slots.forEach(s => {
        s.el.style.left = s.x + 'px'; s.el.style.top = s.y + 'px';
        s.el.style.setProperty('--tile', tile + 'px');
        [s.up, s.spot].forEach(t => { t.style.width = t.style.height = tile + 'px'; t.style.fontSize = fs; });
      });
      const rw = Math.max(1, mid.w - tile), rh = Math.max(1, mid.h - tile);
      this.cards.forEach(c => {
        c.el.style.width = c.el.style.height = tile + 'px';
        c.el.style.fontSize = fs;
        if (!c.docked) { c.x = mid.x0 + c.nx * rw; c.y = mid.y0 + c.ny * rh; this.setT(c); }
      });
    },

    scatter() {
      const { tile, mid } = this.L, n = this.n;
      let f = 1.5, cols, rows;
      do {
        const cell = tile * f;
        cols = Math.max(1, Math.floor(mid.w / cell));
        rows = Math.max(1, Math.floor(mid.h / cell));
        f -= .05;
      } while (cols * rows < n && f > 1);
      const cw = mid.w / cols, ch = mid.h / rows;
      const cells = shuffle([...Array(cols * rows).keys()]);
      const rw = Math.max(1, mid.w - tile), rh = Math.max(1, mid.h - tile);
      this.cards.forEach((c, i) => {
        const k = cells[i % cells.length];
        const cx = k % cols, cy = Math.floor(k / cols);
        const x = mid.x0 + cx * cw + Math.random() * Math.max(0, cw - tile);
        const y = mid.y0 + cy * ch + Math.random() * Math.max(0, ch - tile);
        c.nx = c.homeNx = clamp((x - mid.x0) / rw, 0, 1);
        c.ny = c.homeNy = clamp((y - mid.y0) / rh, 0, 1);
      });
    },

    setT(c) {
      c.el.style.transform = `translate3d(${c.x}px, ${c.y}px, 0) rotate(${c.rot}deg) scale(${c.scale})`;
    },

    hit(c) {
      const t = this.L.tile, cx = c.x + t / 2, cy = c.y + t / 2;
      let best = null, bd = Infinity;
      this.slots.forEach(s => {
        if (s.matched) return;
        if (cx > s.x - 14 && cx < s.x + s.w + 14 && cy > s.y - 8 && cy < s.y + s.h + 8) {
          const d = Math.hypot(cx - (s.x + s.w / 2), cy - (s.y + s.h / 2));
          if (d < bd) { bd = d; best = s; }
        }
      });
      return best;
    },

    down(e, c) {
      if (c.docked || this.drag) return;
      e.preventDefault(); ac();
      const br = this.board.getBoundingClientRect();
      this.drag = { c, id: e.pointerId, br, ox: e.clientX - br.left - c.x, oy: e.clientY - br.top - c.y, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
      try { c.el.setPointerCapture(e.pointerId); } catch (_) {}
      c.ptok++;
      c.el.classList.add('dragging');
      c.el.style.zIndex = ++this.z;
      const tok = ++c.stok, r0 = c.rot, s0 = c.scale;
      tween(160, k => { if (c.stok !== tok) return false; c.rot = r0 * (1 - k); c.scale = s0 + (1.15 - s0) * k; this.setT(c); });
      sfx.pick();
    },

    move(e, c) {
      const d = this.drag;
      if (!d || d.c !== c || e.pointerId !== d.id) return;
      const { W, H, tile } = this.L;
      c.x = clamp(e.clientX - d.br.left - d.ox, -tile * .3, W - tile * .7);
      c.y = clamp(e.clientY - d.br.top - d.oy, -tile * .3, H - tile * .7);
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8) d.moved = true;
      this.setT(c);
      const s = this.hit(c);
      this.slots.forEach(o => o.el.classList.toggle('hover', o === s));
    },

    up(e, c, cancelled) {
      const d = this.drag;
      if (!d || d.c !== c) return;
      this.drag = null;
      c.el.classList.remove('dragging');
      this.slots.forEach(o => o.el.classList.remove('hover'));

      const tap = !d.moved && performance.now() - d.t < 450;
      if (tap || cancelled) {
        if (tap) say('kleines ' + NAMES[c.L]);
        this.flyTo(c, c.x, c.y, c.homeRot, 220);
        return;
      }
      const s = this.hit(c);
      if (s) { s.L === c.L ? this.dock(c, s) : this.reject(c, s); return; }

      const { tile, mid } = this.L;
      const cx = c.x + tile / 2, cy = c.y + tile / 2;
      if (cx > mid.x0 && cx < mid.x1 && cy > mid.y0 && cy < mid.y1) {
        // In der Mitte abgelegt: Karte bleibt dort liegen
        const rw = Math.max(1, mid.w - tile), rh = Math.max(1, mid.h - tile);
        const tx = clamp(c.x, mid.x0, mid.x0 + rw), ty = clamp(c.y, mid.y0, mid.y0 + rh);
        c.nx = c.homeNx = (tx - mid.x0) / rw;
        c.ny = c.homeNy = (ty - mid.y0) / rh;
        c.homeRot = Math.random() * 16 - 8;
        this.flyTo(c, tx, ty, c.homeRot, 260);
      } else {
        this.flyHome(c);
      }
    },

    flyTo(c, tx, ty, rot, dur, arc = 0, spin = 0) {
      const x0 = c.x, y0 = c.y, r0 = c.rot, s0 = c.scale;
      const tok = ++c.ptok; c.stok++;
      return tween(dur, (k, p) => {
        if (c.ptok !== tok) return false;
        c.x = x0 + (tx - x0) * k;
        c.y = y0 + (ty - y0) * k - Math.sin(p * Math.PI) * arc;
        c.rot = r0 + (rot + spin - r0) * k;
        c.scale = s0 + (1 - s0) * k;
        this.setT(c);
      }, ease.outBack).then(ok => { if (ok) { c.rot = rot; this.setT(c); } return ok; });
    },

    flyHome(c) {
      const { tile, mid } = this.L;
      const tx = mid.x0 + c.homeNx * Math.max(1, mid.w - tile);
      const ty = mid.y0 + c.homeNy * Math.max(1, mid.h - tile);
      c.nx = c.homeNx; c.ny = c.homeNy;
      this.flyTo(c, tx, ty, c.homeRot, 700, 90, c.x < tx ? 360 : -360);
    },

    reject(c, s) {
      this.mistakes++;
      s.el.classList.remove('wrong'); void s.el.offsetWidth; s.el.classList.add('wrong');
      setTimeout(() => s.el.classList.remove('wrong'), 600);
      sfx.bad();
      this.flyHome(c);
    },

    dock(c, s) {
      const round = this.round;
      c.docked = true; s.matched = true;
      const { tile } = this.L;
      const tx = s.side === 'left' ? s.x + 3 + 6 + tile + 6 : s.x + 3 + 6;
      const ty = s.y + 3 + 6;
      this.flyTo(c, tx, ty, 0, 280).then(() => {
        if (round !== this.round) return;
        c.el.classList.add('docked');
        c.el.style.transform = ''; c.el.style.zIndex = '';
        s.spot.replaceWith(c.el);
        s.el.classList.add('matched');
        const r = s.el.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        FX.ring(cx, cy, 0x4D8B3F);
        FX.burst(cx, cy, { count: 26 });
        sfx.good();
        say(NAMES[c.L]);
        this.done++;
        setProgress(this.done, this.n);
        if (this.done === this.n) setTimeout(() => { if (round === this.round) showWin('match', { n: this.n, mistakes: this.mistakes }); }, 900);
      });
    },

    relayout() {
      if (!this.L) return;
      this.measure(); this.apply();
    }
  };

  /* ================= Spiel 2: Memory ================= */
  const Memory = {
    n: 0, cards: [], first: null, lock: false, tries: 0, found: 0, round: 0,

    start(n) {
      this.round++;
      const round = this.round;
      const grid = $('#mem-grid');
      grid.innerHTML = '';
      this.n = n; this.first = null; this.lock = false; this.tries = 0; this.found = 0;

      const letters = pickLetters(n);
      const pal = shuffle(PALETTE);
      let items = [];
      letters.forEach((L, i) => {
        const col = pal[i % pal.length];
        items.push({ L, upper: true, col }, { L, upper: false, col });
      });
      items = shuffle(items);

      this.cards = items.map((it, i) => {
        const el = document.createElement('button');
        el.className = 'mcard';
        el.setAttribute('aria-label', 'Karte ' + (i + 1));
        el.style.setProperty('--base', it.col.base);
        el.style.setProperty('--pale', it.col.pale);
        el.style.setProperty('--dark', it.col.dark);
        el.innerHTML = `<div class="inner"><div class="face back font-ui"><span>?</span></div><div class="face front"><span class="letter">${it.upper ? it.L : it.L.toLowerCase()}</span></div></div><span class="badge" aria-hidden="true">✓</span>`;
        const c = Object.assign({ el, open: false, matched: false }, it);
        el.addEventListener('click', () => this.flip(c));
        grid.appendChild(el);
        return c;
      });

      App.show('memory');
      setProgress(0, n, 0);
      requestAnimationFrame(() => {
        if (round !== this.round) return;
        this.layout();
        if (!reduceMotion) this.cards.forEach((c, i) => {
          c.el.animate(
            [{ transform: 'scale(0) rotate(-25deg)', opacity: 0 }, { transform: 'none', opacity: 1 }],
            { duration: 420, delay: i * 28, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }
          );
        });
      });
      say('Finde die Paare. Ein großer und ein kleiner Buchstabe gehören zusammen.');
    },

    layout() {
      const box = $('#mem-board');
      const W = box.clientWidth, H = box.clientHeight, total = this.cards.length;
      const g = clamp(W * .012, 8, 16), ar = .8;
      let best = { w: 0, cols: 2 };
      for (let cols = 2; cols <= total; cols++) {
        const rows = Math.ceil(total / cols);
        const cw = (W - (cols - 1) * g) / cols;
        const chh = (H - (rows - 1) * g - 12) / rows;
        let w = Math.min(cw, chh * ar);
        if (total % cols) w *= .96; // volle Reihen bevorzugen
        if (w > best.w) best = { w, cols };
      }
      const w = Math.floor(Math.min(best.w, 190)), h = Math.floor(w / ar);
      const grid = $('#mem-grid');
      grid.style.gap = g + 'px';
      grid.style.width = (best.cols * w + (best.cols - 1) * g) + 'px';
      this.cards.forEach(c => {
        c.el.style.width = w + 'px'; c.el.style.height = h + 'px';
        c.el.style.fontSize = Math.round(h * .5) + 'px';
      });
    },

    flip(c) {
      if (this.lock || c.open || c.matched) return;
      ac();
      const round = this.round;
      c.open = true; c.el.classList.add('open');
      sfx.flip();
      say((c.upper ? 'großes ' : 'kleines ') + NAMES[c.L]);
      if (!this.first) { this.first = c; return; }

      const a = this.first, b = c;
      this.first = null;
      this.tries++;
      setProgress(this.found, this.n, this.tries);

      if (a.L === b.L) {
        a.matched = b.matched = true;
        setTimeout(() => {
          if (round !== this.round) return;
          [a, b].forEach(x => {
            x.el.classList.add('matched');
            const r = x.el.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            FX.ring(cx, cy, hexNum(x.col.base));
            FX.burst(cx, cy, { count: 20, colors: [hexNum(x.col.base), 0xFFD54F, 0xFFFFFF, hexNum(x.col.dark)] });
          });
          sfx.good();
          this.found++;
          setProgress(this.found, this.n, this.tries);
          if (this.found === this.n) setTimeout(() => { if (round === this.round) showWin('memory', { n: this.n, tries: this.tries }); }, 1000);
        }, 560);
      } else {
        this.lock = true;
        setTimeout(() => {
          if (round !== this.round) return;
          [a, b].forEach(x => { x.open = false; x.el.classList.remove('open'); });
          this.lock = false;
        }, 1300);
      }
    }
  };

  /* ================= Auswahl & Gewinn ================= */
  document.querySelectorAll('.count-dots').forEach(el => {
    const n = +el.parentElement.dataset.n;
    el.innerHTML = '<i></i>'.repeat(n);
  });

  function openCount(mode) {
    App.mode = mode;
    $('#count-mode').textContent = mode === 'match' ? 'Zuordnen' : 'Memory';
    $('#win').hidden = true;
    $('#count-modal').hidden = false;
    say('Wie viele Buchstaben möchtest du spielen?');
  }
  function updateUmlToggle() { $('#toggle-uml').setAttribute('aria-pressed', String(settings.umlaut)); }

  function showWin(mode, data) {
    let stars, text;
    if (mode === 'match') {
      const r = data.mistakes / data.n;
      stars = r <= .2 ? 3 : r <= .6 ? 2 : 1;
      text = data.mistakes === 0 ? 'Alles beim ersten Versuch – stark!' : `Alle ${data.n} Buchstaben haben ihren Partner gefunden!`;
    } else {
      const r = (data.tries - data.n) / data.n;
      stars = r <= .8 ? 3 : r <= 1.6 ? 2 : 1;
      text = `Du hast ${data.n} Paare in ${data.tries} Versuchen gefunden!`;
    }
    settings.stars += stars; save();
    $('#win-text').textContent = text;
    $('#win-stars').innerHTML = [0, 1, 2].map(i => `<span class="wstar ${i < stars ? 'on' : ''}" style="animation-delay:${.25 + i * .18}s">★</span>`).join('');
    $('#win').hidden = false;
    FX.confetti(); BG.cheer(); sfx.win();
    setTimeout(() => say('Super gemacht!'), 350);
  }

  /* ================= Ereignisse ================= */
  document.querySelectorAll('.mode-card').forEach(b => b.addEventListener('click', () => { ac(); openCount(b.dataset.mode); }));
  document.querySelectorAll('.count-btn').forEach(b => b.addEventListener('click', () => {
    $('#count-modal').hidden = true;
    const n = +b.dataset.n;
    (App.mode === 'match' ? Match : Memory).start(n);
  }));
  $('#count-close').addEventListener('click', () => { $('#count-modal').hidden = true; });
  $('#toggle-uml').addEventListener('click', () => { settings.umlaut = !settings.umlaut; save(); updateUmlToggle(); });
  $('#win-again').addEventListener('click', () => openCount(App.mode));
  $('#win-menu').addEventListener('click', () => { $('#win').hidden = true; App.show('menu'); });
  $('#btn-home').addEventListener('click', () => {
    Match.round++; Memory.round++;
    $('#win').hidden = true; $('#count-modal').hidden = true;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    App.show('menu');
  });
  $('#btn-sound').addEventListener('click', () => {
    settings.sound = !settings.sound; save(); updateSoundBtn();
    if (!settings.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
    else sfx.pick();
  });

  let rz = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => {
      FX.resize();
      if (App.screen === 'match') Match.relayout();
      if (App.screen === 'memory') Memory.layout();
    });
  });

  updateSoundBtn();
  updateUmlToggle();
  App.show('menu');
})();
</script>
</body>
