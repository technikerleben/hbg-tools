<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hai-Rallye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: fröhlich, klar, ermutigend – ein Unterwasser-Lernspiel für Drittklässler
   IDEA: ein Würfel-Brettspiel aus Pappe: Spielplan, Würfel, Aufgabenkarte
   PICTURE: Spielplan im Meer mit Hai-Figur, Blasenfeldern und Seesternen, daneben der große Würfel
   COLOUR and TYPE: Tiefseeblau, Lagunentürkis, Korallenorange; Fredoka + Andika (Schulschrift-nah)
   LAYOUT: Spielplan links, Aufgabenkarte rechts; schmal: Aufgabe zuerst, Spielplan darunter */
:root{color-scheme:light;
--slate:#3E5668;--slate-d:#2C3D4C;--slate-p:#D0DCE6;--slate-g:#EEF3F7;
--rust:#D97A4A;--rust-d:#9E4E22;--rust-p:#F5DDD1;
--sage:#7DBB6F;--sage-d:#4D8B3F;--sage-p:#DDF0D8;--sage-t:#2D5C25;
--gold:#C17B00;--gold-p:#FFF3CC;--gold-t:#5C4400;
--err:#C0392B;--err-p:#FDECEA;--err-t:#7A1B14;
--bg:#EAF6FB;--ink:#1E2A35;--muted:#5A6A78;
--shadow:0 3px 0 rgba(44,61,76,.16),0 10px 24px rgba(44,61,76,.10)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Andika,"Trebuchet MS",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Andika,system-ui,sans-serif;font-weight:600}
:focus-visible{outline:3px solid var(--slate);outline-offset:3px;border-radius:6px}
button{font:inherit}
header{background:#0B3B5C;color:#fff;border-bottom:6px solid #2BA3C7}
.hin{max-width:1180px;margin:0 auto;padding:14px max(4vw,16px);display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:52px;height:52px;flex:none}
header h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.05;font-weight:700}
header p{margin:2px 0 0;color:var(--slate-p);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.13);border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.chip b{font-family:Fredoka;font-size:19px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:22px max(4vw,16px) 44px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:clamp(14px,2vw,22px)}
.meadow{background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.16) 0 5px,transparent 6px),radial-gradient(circle at 88% 4%,rgba(255,255,255,.14) 0 8px,transparent 9px),radial-gradient(circle at 93% 14%,rgba(255,255,255,.12) 0 4px,transparent 5px),linear-gradient(180deg,#126A96,#0B3B5C)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px;color:#fff}
.ph span{color:#CDEFFA;font-size:15px}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}#playP{order:-1}}
/* Spielplan */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.f{aspect-ratio:1;border-radius:50%;background:#F2FBFF;display:grid;place-items:center;position:relative;font-family:Fredoka;font-weight:600;color:var(--muted);font-size:clamp(14px,1.7vw,19px);box-shadow:0 3px 0 rgba(44,61,76,.14)}
.f.done{background:#9ADCEB;color:#0B3B5C}
.f.star{background:#FFE3D3;color:#E0603A}
.f.start,.f.ziel{background:#2BA3C7;color:#062a40;font-size:clamp(12px,1.4vw,16px)}
.f.ziel{background:#F2B13A;color:#4a2c00;border-radius:14px}
.f .ic{width:58%;height:58%}
.token{position:absolute;inset:-4% -10%;animation:hop .3s ease-out;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.token svg{width:100%;height:100%}
@keyframes hop{0%{transform:translateY(0) scale(.85)}45%{transform:translateY(-34%) scale(1.05)}100%{transform:none}}
.hint{font-size:15px;color:#CDEFFA;margin:16px 0 8px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.lr{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;color:inherit;box-shadow:0 2px 0 rgba(44,61,76,.12);min-height:44px}
.lr:hover{border-color:var(--slate-p)}
.lt{display:grid;gap:3px;flex:1}
.lt b{font-family:Fredoka;font-weight:600;font-size:17px;line-height:1.2}
.lt small{font-size:14px;color:var(--muted);line-height:1.3}
.bar{height:8px;background:var(--slate-p);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:#2BA3C7;border-radius:4px;transition:width .4s}
/* Würfel */
.die{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);background:#fff;border:3px solid var(--slate-d);border-radius:22%;padding:12%;flex:none}
.die i{width:72%;aspect-ratio:1;border-radius:50%;place-self:center;background:var(--slate-d);opacity:0}
.die i.on{opacity:1}
.die.big{width:128px;height:128px;box-shadow:0 6px 0 var(--slate-p)}
.die.mini{width:40px;height:40px;border:0;padding:7px;border-radius:10px}
.die.mini i{background:#fff}
.rolling{animation:spin .22s linear infinite}
@keyframes spin{25%{transform:rotate(-14deg) scale(1.05)}75%{transform:rotate(14deg) scale(1.05)}}
/* Spielbereich */
.idle{display:grid;justify-items:center;text-align:center;gap:14px;padding:10px 0}
.idle h2{margin:6px 0 0;font-size:clamp(28px,3.4vw,38px);line-height:1.1}
.idle p{margin:0;color:var(--muted);max-width:30em}
.btn{min-height:54px;padding:10px 30px;border:0;border-radius:16px;font-family:Fredoka;font-weight:600;font-size:21px;color:#fff;background:#C2410C;box-shadow:0 5px 0 #8A2E08;cursor:pointer}
.btn:hover{background:#A8380A}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8A2E08}
.btn:disabled{background:#EBEBEA;color:#7A7672;box-shadow:none;cursor:default}
.btn.g{background:#0F766E;box-shadow:0 5px 0 #0A524C}
.btn.g:hover{background:#0C5F58}
.btn.s{background:#fff;color:var(--slate);border:2px solid var(--slate);box-shadow:none;font-size:17px;min-height:46px}
.btn.s:hover{background:var(--slate-g)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tname{font-family:Fredoka;font-weight:600;font-size:20px}
.steps{background:var(--slate-g);color:var(--slate);border-radius:999px;padding:2px 12px;font-size:15px;white-space:nowrap}
.speak{margin-left:auto;display:inline-flex;gap:6px;align-items:center;background:var(--slate-g);color:var(--slate);border:0;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-size:15px}
.speak svg{width:20px;height:20px}
.prompt{font-size:clamp(21px,2.4vw,25px);line-height:1.25;margin:16px 0 12px}
.word{font-family:Fredoka;font-weight:600;font-size:clamp(34px,5vw,50px);text-align:center;padding:18px;background:var(--slate-g);border-radius:18px;color:var(--slate-d)}
.sent{font-size:clamp(21px,2.4vw,25px);line-height:1.9;margin:0;padding:14px 18px;background:var(--slate-g);border-radius:18px}
mark{background:var(--gold-p);color:inherit;padding:1px 6px;border-radius:8px;box-shadow:inset 0 -4px 0 #F0C84A}
.gap{display:inline-block;width:3.4em;border-bottom:3px solid var(--slate);margin:0 4px;vertical-align:-2px}
.pieces{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px;background:var(--slate-g);border-radius:18px}
.piece{background:#fff;border:3px solid var(--slate);border-radius:14px;padding:8px 16px;font-family:Fredoka;font-weight:600;font-size:clamp(22px,3vw,28px);white-space:nowrap}
.plus{font-family:Fredoka;font-size:32px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:16px}
.opt{min-height:62px;font-weight:700;font-size:22px;background:#fff;border:3px solid var(--slate-p);border-radius:16px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--slate-p);padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.opt svg{width:28px;height:28px;flex:none}
.opt:hover:not(:disabled){border-color:var(--slate)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--slate-p)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--sage-p);border-color:var(--sage-d);color:var(--sage-t);box-shadow:0 4px 0 var(--sage)}
.opt.ok::before{content:"✓"}
.opt.no{background:var(--err-p);border-color:var(--err);color:var(--err-t);box-shadow:0 4px 0 #f2b8b1}
.opt.no::before{content:"✗"}
.opt.dim{opacity:.5}
.fb{margin-top:16px;border-radius:0 16px 16px 0;padding:12px 16px;font-size:18px}
.fb:empty{display:none}
.fb.r{background:var(--sage-p);border-left:6px solid var(--sage-d);color:var(--sage-t)}
.fb.f{background:var(--err-p);border-left:6px solid var(--err);color:var(--err-t)}
.fb b{font-family:Fredoka;font-weight:600}
.starmsg{margin-top:8px;display:flex;gap:8px;align-items:center;color:var(--gold-t);font-weight:700}
.starmsg .ic{width:26px;height:26px;color:#E0603A}
.next{display:flex;justify-content:flex-end;margin-top:16px}
.pracBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.link{background:none;border:0;color:var(--slate);text-decoration:underline;cursor:pointer;min-height:44px;font-size:16px}
.bar.big{height:10px;margin:6px 0 14px}
.bar.big i{background:#F2B13A}
.goal svg.trophy{width:130px;height:130px}
.stars{display:flex;gap:6px}
.stars span{color:var(--slate-p)}
.stars span.on{color:#E0603A}
.stars .ic{width:56px;height:56px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Aufgaben-Generatoren ---------- */
const recent={};
function pk(id,arr){const r=recent[id]||(recent[id]=[]);let i,t=0;do{i=Math.floor(Math.random()*arr.length)}while(r.includes(i)&&++t<30);r.push(i);if(r.length>Math.min(6,arr.length-1))r.shift();return arr[i]}
const mk=(right,wrong)=>shuffle([{t:right,ok:true},...wrong.map(t=>({t,ok:false}))]);
const und=l=>l.slice(0,-1).join(', ')+' und '+l[l.length-1];

const TOPICS=[
{id:'pro',name:'Pronomen',sub:'er, sie, es, wir, ihr',col:'#3E5668',gen(){
  const [s,w,a,e]=pk('pro',PRO),rest=s.slice(w.length);
  return {prompt:'Welches Pronomen passt für das gelbe Wort?',disp:`<p class="sent"><mark>${w}</mark>${rest}</p>`,
  opts:['Er','Sie','Es','Wir','Ihr'].map(t=>({t,ok:t===a})),
  expl:`${e||low1(w)+' → '+a.toLowerCase()}. So heißt der Satz: <b>${a}${rest}</b>`}}},
{id:'end',name:'Nomen mit -ung und -heit',sub:'Aus Wörtern Nomen bauen',col:'#9E4E22',gen(){
  const [b,r,w1,w2,k]=pk('end',END);
  return {prompt:'Mach aus dem Wort ein Nomen. Was ist richtig?',disp:`<div class="word">${b}</div>`,opts:mk(r,[w1,w2]),
  expl:`${k==='v'?'Aus dem Verb (Tunwort)':'Aus dem Adjektiv (Wiewort)'} <b>${b}</b> wird mit <b>${k==='v'?'-ung':'-heit'}</b> das Nomen <b>${r}</b>. Nomen schreibt man groß. Wörter mit -ung und -heit haben immer den Artikel <b>die</b>.`}}},
{id:'zg',name:'Uhr oder Herz?',sub:'Zeitbegriffe und Gefühle',col:'#4D8B3F',gen(){
  const isT=Math.random()<.5,w=isT?pk('zt',ZEIT):pk('gf',GEF);
  return {prompt:'Ist das ein Zeitbegriff oder ein Gefühl/Zustand?',disp:`<div class="word">${w}</div>`,
  opts:[{t:CLOCK+' Zeitbegriff',ok:isT},{t:HEART+' Gefühl oder Zustand',ok:!isT}],
  expl:isT?`<b>${w}</b> ist ein Zeitbegriff. Er sagt, wann etwas ist oder wie lange es dauert.`:`<b>${w}</b> ist ein Gefühl oder Zustand. Man kann es spüren, aber nicht anfassen.`}}},
{id:'ob',name:'Oberbegriffe',sub:'Was gehört zusammen?',col:'#A86A00',gen(){
  const names=Object.keys(OB);
  if(Math.random()<.6){const n=pk('ob',names),ws=shuffle(OB[n]).slice(0,3);
    return {prompt:'Wie heißt der Oberbegriff für diese Wörter?',disp:`<div class="pieces">${ws.map(w=>`<span class="piece">${w}</span>`).join('')}</div>`,
    opts:mk(n,shuffle(names.filter(x=>x!==n)).slice(0,3)),expl:`${und(ws)} gehören zum Oberbegriff <b>${n}</b>.`}}
  const n=pk('ob2',names),ws=shuffle(OB[n]).slice(0,3);
  const other=pick(names.filter(x=>x!==n&&!(ZF.includes(x)&&ZF.includes(n)))),odd=pick(OB[other]);
  return {prompt:'Drei Wörter gehören zusammen. Welches Wort passt nicht dazu?',disp:'',opts:mk(odd,ws),
  expl:`${und(ws)} gehören zum Oberbegriff <b>${n}</b>. <b>${odd}</b> gehört zum Oberbegriff ${other}.`}}},
{id:'art',name:'ein oder der?',sub:'unbestimmte und bestimmte Artikel',col:'#6B4C8A',gen(){
  const [s1,s2,u,b,wu,wb]=pk('art',ART),G='<span class="gap"></span>',f=(x,y)=>`${x} … ${y}`;
  return {prompt:'Welche Artikel passen in die Lücken?',disp:`<p class="sent">${s1.replace('___',G)}<br>${s2.replace('___',G)}</p>`,
  opts:mk(f(u,b),[f(b.toLowerCase(),cap(u)),f(wu,wb)]),
  expl:`Beim ersten Mal ist es neu: <b>${u}</b> (unbestimmter Artikel). Danach kennen wir es schon: <b>${b}</b> (bestimmter Artikel).<br>${s1.replace('___','<b>'+u+'</b>')} ${s2.replace('___','<b>'+b+'</b>')}`}}},
{id:'zus',name:'Wort-Puzzle',sub:'zusammengesetzte Nomen',col:'#1F6F7C',gen(){
  const [a,b,res]=pk('zus',ZUS),[aA,aN]=a.split(' '),[bA,bN]=b.split(' '),rw=res.split(' ')[1];
  const others=['der','die','das'].filter(x=>x!==bA),wA=others.includes(aA)?aA:pick(others),first=rw.slice(0,rw.length-bN.length);
  return {prompt:'Setz die beiden Nomen zusammen. Was ist richtig?',disp:`<div class="pieces"><span class="piece">${a}</span><span class="plus">+</span><span class="piece">${b}</span></div>`,
  opts:mk(res,[`${wA} ${rw}`,`${aA} ${bN}${aN.toLowerCase()}`]),
  expl:`Das letzte Wort bestimmt den Artikel: <b>${b}</b> → <b>${res}</b>.${first!==aN?` Schau genau: Aus <b>${aN}</b> wird <b>${first}-</b>.`:''}`}}}];

/* ---------- Zustand ---------- */
let S={pos:0,rolls:0,best:null,stats:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let mode='rallye',cur=null,prac=null,busy=false,lastRoll=5;
const RIGHT=['Super!','Klasse!','Richtig!','Toll gemacht!','Genau!','Prima!'],WRONG=['Fast!','Nicht ganz.','Knapp daneben.'];

const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML=(n,cls,col)=>`<span class="die ${cls}" role="img" aria-label="Würfel ${n}"${col?` style="background:${col}"`:''}>${[...Array(9)].map((_,k)=>`<i class="${FACES[n].includes(k)?'on':''}"></i>`).join('')}</span>`;
const setPips=(d,n)=>{d.querySelectorAll('i').forEach((p,k)=>p.classList.toggle('on',FACES[n].includes(k)));d.setAttribute('aria-label','Würfel '+n)};

function renderBoard(){
  let h='';
  for(let i=0;i<=GOAL;i++){
    const r=Math.floor(i/6),c=r%2?5-i%6:i%6,cl=['f'];
    if(i===0)cl.push('start');else if(i===GOAL)cl.push('ziel');else if(STARS.includes(i))cl.push('star');
    if(i>0&&i<S.pos&&!STARS.includes(i))cl.push('done');
    const lab=i===0?'Start':i===GOAL?'Schatz':STARS.includes(i)?STAR:i;
    h+=`<div class="${cl.join(' ')}" style="grid-row:${r+1};grid-column:${c+1}"><span>${lab}</span>${i===S.pos?`<div class="token">${SHARK}</div>`:''}</div>`;
  }
  $('#board').innerHTML=h;
  $('#cPos').textContent=S.pos;$('#cRolls').textContent=S.rolls;$('#cBest').textContent=S.best??'–';
}
function renderLegend(){
  $('#legend').innerHTML=TOPICS.map((t,i)=>{const st=S.stats[t.id]||{r:0,n:0},p=st.n?Math.round(st.r/st.n*100):0;
    return `<button class="lr" data-t="${i}">${dieHTML(i+1,'mini',t.col)}<span class="lt"><b>${t.name}</b><small>${t.sub}</small><span class="bar"><i style="width:${p}%"></i></span><small>${st.n?`${st.r} von ${st.n} richtig`:'noch nicht geübt'}</small></span></button>`}).join('');
}

function viewIdle(){
  cur=null;
  $('#play').innerHTML=`<div class="idle">${dieHTML(lastRoll,'big')}
  <h2>${S.pos===0?'Los geht’s!':'Würfle weiter!'}</h2>
  <p>Der Würfel bestimmt das Thema. Löst du die Aufgabe richtig, darf Flosse so viele Felder weiterschwimmen, wie der Würfel zeigt. Auf den Seestern-Feldern gibt es 2 Felder extra.</p>
  <button class="btn" id="roll">Würfeln!</button>
  ${S.pos>0?'<button class="btn s" id="reset">Neues Spiel</button>':''}</div>`;
  $('#roll').onclick=roll;
  const rs=$('#reset');
  if(rs)rs.onclick=()=>{if(rs.dataset.sure){S.pos=0;S.rolls=0;save();renderBoard();viewIdle()}else{rs.dataset.sure=1;rs.textContent='Wirklich neu anfangen? Nochmal tippen'}};
}
async function roll(){
  if(busy)return;busy=true;$('#roll').disabled=true;
  const d=$('.die.big');d.classList.add('rolling');let n=1;
  for(let k=0;k<10;k++){n=1+Math.floor(Math.random()*6);setPips(d,n);await sleep(70+k*14)}
  d.classList.remove('rolling');lastRoll=n;S.rolls++;save();renderBoard();
  await sleep(500);busy=false;
  cur={ti:n-1,steps:n,q:TOPICS[n-1].gen()};renderQ();
}
function renderQ(){
  const t=TOPICS[cur.ti],q=cur.q;
  const head=mode==='prac'?`<div class="pracBar"><span>Übung: <b>${t.name}</b> · Aufgabe ${prac.n+1} von ${prac.total}</span><button class="link" id="back">Zur Rallye</button></div><div class="bar big"><i style="width:${prac.n/prac.total*100}%"></i></div>`:'';
  $('#play').innerHTML=`${head}<div class="qhead">${dieHTML(cur.ti+1,'mini',t.col)}<span class="tname" style="color:${t.col}">${t.name}</span>${cur.steps?`<span class="steps">um ${cur.steps} ${cur.steps===1?'Feld':'Felder'}</span>`:''}<button class="speak" id="speak">${SPEAK} Vorlesen</button></div>
  <h2 class="prompt">${q.prompt}</h2>${q.disp}
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join('')}</div>
  <div class="fb" id="fb" role="status" aria-live="polite"></div>
  <div class="next"><button class="btn g" id="next" hidden>Weiter</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#speak').onclick=speak;
  const bk=$('#back');if(bk)bk.onclick=toRallye;
}
async function answer(i){
  if(cur.done)return;cur.done=true;
  const q=cur.q,ok=q.opts[i].ok,t=TOPICS[cur.ti];
  const st=S.stats[t.id]||(S.stats[t.id]={r:0,n:0});st.n++;if(ok)st.r++;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.add(q.opts[k].ok?'ok':k===i?'no':'dim')});
  let head;
  if(mode==='prac'){if(ok)prac.r++;head=ok?pick(RIGHT):pick(WRONG)+' Schau mal:'}
  else head=ok?`${pick(RIGHT)} Flosse schwimmt ${cur.steps} ${cur.steps===1?'Feld':'Felder'} weiter.`:`${pick(WRONG)} Diesmal bleibt Flosse stehen.`;
  const fb=$('#fb');fb.className='fb '+(ok?'r':'f');fb.innerHTML=`<b>${head}</b><br>${q.expl}`;
  save();renderLegend();
  const nx=$('#next');nx.hidden=false;nx.onclick=next;
  if(mode==='rallye'&&ok){nx.disabled=true;await move(cur.steps);nx.disabled=false}
  nx.focus({preventScroll:true});
}
async function move(n){
  for(let k=0;k<n&&S.pos<GOAL;k++){S.pos++;renderBoard();await sleep(320)}
  if(STARS.includes(S.pos)){
    await sleep(250);$('#fb').insertAdjacentHTML('beforeend',`<div class="starmsg">${STAR} Seestern-Feld! Flosse schwimmt 2 Felder extra.</div>`);
    for(let k=0;k<2&&S.pos<GOAL;k++){S.pos++;renderBoard();await sleep(320)}
  }
  save();
}
function next(){
  if(mode==='prac'){prac.n++;if(prac.n>=prac.total)return viewPracEnd();cur={ti:prac.ti,q:TOPICS[prac.ti].gen()};return renderQ()}
  S.pos>=GOAL?viewGoal():viewIdle();
}
function viewGoal(){
  const r=S.rolls,neu=S.best===null||r<S.best;if(neu)S.best=r;save();renderBoard();
  $('#play').innerHTML=`<div class="idle goal">${TROPHY}<h2>Schatz gefunden!</h2><p>Flosse hat den Schatz erreicht. Du hast <b>${r}</b> Würfe gebraucht.${neu?' Das ist dein neuer Rekord!':` Dein Rekord sind ${S.best} Würfe.`}</p><button class="btn" id="again">Noch eine Runde</button></div>`;
  $('#again').onclick=()=>{S.pos=0;S.rolls=0;save();renderBoard();viewIdle()};
}
function startPractice(ti){
  mode='prac';prac={ti,n:0,r:0,total:8};cur={ti,q:TOPICS[ti].gen()};renderQ();
  if(window.innerWidth<860)$('#playP').scrollIntoView({behavior:'smooth',block:'start'});
}
function viewPracEnd(){
  const t=TOPICS[prac.ti],p=prac.r/prac.total,s=p>=.9?3:p>=.7?2:p>=.5?1:0;
  $('#play').innerHTML=`<div class="idle goal"><div class="stars">${[0,1,2].map(k=>`<span class="${k<s?'on':''}">${STAR}</span>`).join('')}</div>
  <h2>${['Übung macht den Meister!','Weiter so!','Gut gemacht!','Ausgezeichnet!'][s]}</h2>
  <p><b>${prac.r} von ${prac.total}</b> Aufgaben richtig bei „${t.name}“.</p>
  <div class="row"><button class="btn" id="again">Nochmal üben</button><button class="btn s" id="back">Zur Rallye</button></div></div>`;
  $('#again').onclick=()=>startPractice(prac.ti);$('#back').onclick=toRallye;
}
function toRallye(){mode='rallye';prac=null;S.pos>=GOAL?viewGoal():viewIdle()}
function speak(){
  try{const el=document.createElement('div');el.innerHTML=cur.q.prompt+' '+cur.q.disp;
    el.querySelectorAll('.gap').forEach(g=>g.textContent=' Lücke ');el.querySelectorAll('.piece').forEach(g=>g.textContent+=', ');
    const txt=el.textContent+' Antworten: '+cur.q.opts.map(o=>o.t.replace(/<[^>]+>/g,'').replace('…','und')).join('. ');
    const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
$('#legend').addEventListener('click',e=>{const b=e.target.closest('.lr');if(b&&!busy)startPractice(+b.dataset.t)});
renderBoard();renderLegend();
S.pos>=GOAL?viewGoal():viewIdle();
}
</script>
</body>
</html>
