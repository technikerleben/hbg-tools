    <button class="btn wide" style="margin-top:10px" data-a="fAtk" data-i="">🎲 Zufällige Attacke</button></div>` : ''}
  <div class="card"><h2>Runde ${b.round}</h2>
    <div class="row"><button class="btn ghost" style="flex:1" data-a="tie">⚖️ Gleichstand INI</button><button class="btn ghost" style="flex:1" data-a="roundEnd">🔚 Rundenende</button></div>
    ${b.kind === 'wild' ? `<p style="margin:12px 0 4px"><b>Fangen:</b> ${cl} (${cm > 0 ? '+' + cm : cm || '±0'})${f.status === 'schlaf' || f.status === 'laehmung' ? ', schläft/gelähmt +2' : ''}. Das sagen die Kinder im Tablet an.</p>
    <div class="row"><button class="btn ghost" style="flex:1" data-a="caught">✔️ Gefangen</button><button class="btn ghost" style="flex:1" data-a="fleeFail">🏃 Flucht misslungen</button></div>` : ''}
    <div class="row" style="margin-top:10px"><button class="btn ghost" style="flex:1" data-a="kidFx" data-k="shield">🛡️ Kind: Härtner</button><button class="btn ghost" style="flex:1" data-a="foeFx" data-k="weak">😨 Kind: Heuler</button><button class="btn ghost" style="flex:1" data-a="foeFx" data-k="expose">🎯 Kind: Silberblick</button></div>
    <button class="btn ghost wide" style="margin-top:10px" data-a="endFight">Kampf beenden</button></div>`;
}
let routeSel = null;
function vWeg(){
  const routes = Object.keys(D.enc);
  const r = S.route;
  return `<div class="card"><h2>🗺️ Wo seid ihr?</h2><div class="chips">${routes.map(x => `<button class="chip ${r === x ? 'on' : ''}" data-a="route" data-k="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
    <div class="card"><h2>🎲 Begegnung</h2><p class="muted" style="margin-top:0">1–3 wildes Pokémon · 4–5 Hindernis · 6 etwas Nettes</p><button class="btn red wide" style="min-height:64px;font-size:20px" data-a="encounter">Begegnung würfeln</button>
      <table class="rt" style="margin-top:12px">${D.enc[r].map((p,i) => `<tr><td>${i + 1}</td><td>${esc(p)}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>🧺 Unterwegs</h2><div class="row"><button class="btn ghost" style="flex:1" data-a="obstacle">Hindernis</button><button class="btn ghost" style="flex:1" data-a="nice">Etwas Nettes</button><button class="btn ghost" style="flex:1" data-a="picnic">Picknick</button></div></div>`;
}
function vRead(){
  const p = TX[S.part] || TX[0];
  const item = it => {
    if(it.k === 'h3') return `<div class="h3">${rich(it.t)}</div>`;
    if(it.k === 'read' || it.k === 'kids') return `<div class="box ${it.k}" style="--rs:${S.rs}px"><div class="bt">${esc((it.title || (it.k === 'kids' ? 'Den Kindern erklären' : 'Zum Vorlesen')).replace(/^Zum Vorlesen: ?/, '📖 ').replace(/^Zum Vorlesen$/, '📖 Zum Vorlesen'))}</div>${it.t.split('\n\n').map(x => `<p>${rich(x)}</p>`).join('')}</div>`;
    return `<div class="box tip"><div class="bt">💡 ${esc(it.title)}</div>${it.t.map(x => `<p>${rich(x)}</p>`).join('')}</div>`;
  };
  return `<div class="parts">${TX.map((x,i) => `<button class="chip ${i === S.part ? 'on' : ''}" data-a="part" data-v="${i}">${esc(x.title.replace(/^Teil [IV]+ · /, ''))}</button>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-bottom:8px"><span class="muted small">Schrift</span><button class="btn sm ghost" data-a="rs" data-v="-1">A−</button><button class="btn sm ghost" data-a="rs" data-v="1">A+</button></div>
    ${p.secs.map((s,i) => `<details class="sec" ${i === 0 && p.secs.length < 3 ? 'open' : ''}><summary>${esc(s.title)}</summary><div class="sbody">${s.items.map(item).join('')}</div></details>`).join('')}`;
}
function vDice(){
  return `<div class="card"><h2>🎲 Würfeln</h2><div class="dgrid">
    <button class="dbtn" data-a="free" data-k="w20">${dieSVG(20, 20)}W20</button>
    <button class="dbtn" data-a="free" data-k="w6">${dieSVG(6, 6, '#2F5D8C')}W6</button>
    <button class="dbtn" data-a="free" data-k="w61">${dieSVG(6, 5, '#E2872A')}W6+1</button>
    <button class="dbtn" data-a="free" data-k="probe10">${dieSVG(20, 10, '#22313F')}Probe gegen 10<small>wildes Pokémon</small></button>
  </div></div>
  <div class="card"><h2>📒 Protokoll</h2>${S.log.length ? `<ul class="hist">${S.log.slice(0, 40).map(l => `<li><time>${new Date(l.t).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</time><span>${esc(l.x)}</span></li>`).join('')}</ul>` : '<p class="muted">Noch leer.</p>'}</div>`;
}
let typeSel = 'Wasser';
const RULES = [
  ['Probe', 'W20 ≤ Wert = geschafft. 1 = Super-Erfolg, 20 = Patzer. ±2 / ±4'],
  ['Helfen', '1× pro Runde: passende Probe → +2 auf die nächste Probe'],
  ['Initiative', 'Höhere INI zuerst. Gleichstand: beide W6, sonst Kinder zuerst'],
  ['Befehl (CH)', 'Gelungen: voll · misslungen: halb (aufrunden) · 1: doppelt · 20: nichts'],
  ['Schaden', 'W6 (stark: W6+1), +2 Typ-Vorteil, 0 bei „Kein Effekt“'],
  ['Zusatzeffekt', 'Schadenswürfel zeigt die Zahl → Effekt tritt ein'],
  ['Zustände', 'Schlaf: 1 Runde aussetzen · Gift/Brennt: −2 KP am Rundenende · Gelähmt: INI 1'],
  ['Wilde Pokémon', 'Befehl gegen 10'],
  ['Fangen (GE)', 'Voll −4 · mehr als Hälfte −2 · ≤ Hälfte ±0 · 1–3 KP +4 · Schlaf/Lähmung +2 · Superball +2'],
  ['Flucht', 'MU oder GE. Fehlschlag: freier Angriff. Nie vor Trainern.'],
  ['Item im Kampf', 'Gelingt immer, kostet den Angriff'],
  ['K.O.', '0 KP = erschöpft · alle erschöpft = Pokémon-Center, keine Strafe'],
  ['Reisen', 'W6: 1–3 wildes Pokémon · 4–5 Hindernis · 6 Nettes · Picknick 1× pro Route: +10 KP'],
  ['Belohnung', 'Wild: 1W6 Fundsuche · Trainer: meist 50 ₽ · Arena: 500 ₽ je Kind, Orden, TM'],
  ['Orden', '+1 Level · +1 auf eine Eigenschaft (max. 17) · +2 Bonus-KP je Pokémon'],
  ['Mondstein', 'Piepi, Pummeluff, Nidorina, Nidorino entwickeln sich sofort'],
  ['Freundschaft', 'Pokémon schließt sich ohne Ball an: CH-Probe, wenn SL es erlaubt'],
  ['Dunkelheit', 'GE und WI −2, außer mit Taschenlampe oder Feuer-Pokémon'],
  ['Preise', 'Pokéball 50 · Superball 150 · Trank 50 · Beleber 150 · Beere 20 · Taschenlampe 100']];
function vRules(){
  const strong = D.adv[typeSel] || [], none = D.noeff[typeSel] || [];
  const weakTo = D.order.filter(t => (D.adv[t] || []).includes(typeSel));
  return `<div class="card"><h2>🔥💧🌿 Typen</h2><p class="muted small" style="margin-top:0">Tippe einen Typ an.</p><div class="tgrid">${D.order.map(t => `<button class="tbtn ${t === typeSel ? 'on' : ''}" style="background:${TC[t]}" data-a="type" data-k="${t}"><span class="e">${TE[t]}</span>${t}</button>`).join('')}</div>
    <div class="tres"><p>${TE[typeSel]} <b>${typeSel}</b> ist stark gegen (+2): ${strong.length ? strong.map(typePill).join(' ') : '<span class="muted">nichts</span>'}</p>
    ${none.length ? `<p>wirkt gar nicht gegen: ${none.map(typePill).join(' ')}</p>` : ''}
    <p>Aufpassen vor: ${weakTo.length ? weakTo.map(typePill).join(' ') : '<span class="muted">niemandem</span>'}</p></div></div>
    <div class="card"><h2>📋 Spickzettel</h2><table class="rt">${RULES.map(([a,b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div>`;
}

/* Pokémon-Auswahl */
let pickCb = null, pickQ = '';
function openPick(title, cb){ pickCb = cb; pickQ = ''; openModal(() => `${mhead(title)}<input class="search" id="pq" type="search" placeholder="Name eintippen …" aria-label="Pokémon suchen"><div class="pgrid" id="pgrid">${pickGrid()}</div>`); setTimeout(() => { const i = $('#pq'); i && i.focus(); }, 50); }
const pickGrid = () => D.pokemon.filter(p => !pickQ || p.name.toLowerCase().includes(pickQ.toLowerCase())).map(p => { const c = TC[p.types[0]]; return `<button class="pbtn" style="--tc:${c};--tcl:${tint(c, .16)}" data-a="pickSp" data-k="${esc(p.name)}"><b>${esc(p.name)}</b><span>${p.types.map(t => TE[t]).join(' ')} ${p.types.join('/')} · ${p.kp} KP</span></button>`; }).join('');
let custom = null;
function customView(){
  return `${mhead('Eigener Gegner')}
    <input class="search" id="cn" value="${esc(custom.name)}" placeholder="Name, z. B. Wanderer Theo" aria-label="Name">
    <div class="row" style="margin-bottom:10px"><b>CH</b><button class="step" data-a="cCh" data-v="-1">−</button><b style="font-size:24px;min-width:30px;text-align:center">${custom.ch}</b><button class="step" data-a="cCh" data-v="1">＋</button><span class="muted small">9 leicht · 10 normal · 12–13 Arena</span></div>
    <div class="row" style="margin-bottom:10px">${custom.mons.map((m,i) => `<button class="chip on" data-a="cDel" data-v="${i}">${esc(m)} ✕</button>`).join('')}<button class="chip" data-a="cAdd">＋ Pokémon</button></div>
    <button class="btn red wide" data-a="cStart" ${custom.mons.length ? '' : 'disabled'}>Kampf starten</button>`;
}
function menuView(){
  return `${mhead('⚙️ Einstellungen')}<div class="row" style="margin-bottom:14px"><button class="btn ${S.sound ? 'green' : 'ghost'}" data-a="sound">${S.sound ? '🔊 Ton an' : '🔇 Ton aus'}</button><button class="btn ghost" data-a="clearLog">Protokoll leeren</button></div>
    <p class="muted small">Pokémon Pen &amp; Paper · Spielleitung · Regelwerk Version ${esc(D.version)}. Die Kinder spielen mit der Tablet-Ansicht (kanto-abenteuer.html).<br>Fan-Projekt für den privaten Spieltisch. Pokémon ist eine Marke von Nintendo, Creatures Inc. und GAME FREAK.</p>`;
}

/* Begegnungen */
const OBST = [['Ein dicker Baum liegt quer über dem Weg. Der Stamm ist so hoch wie euer Bauch. Klettert ihr drüber? Kriecht ihr drunter durch? Oder sucht ihr einen anderen Weg?', 'GE (klettern) oder MU'], ['Vor euch plätschert ein Bach. Das Wasser ist klar und kalt. Ein paar flache Steine liegen darin. Wollt ihr von Stein zu Stein hüpfen?', 'GE'], ['Eine Hecke voller Dornen versperrt den Weg. Dahinter seht ihr den Pfad weitergehen. Wie kommt ihr hindurch, ohne euch zu pieksen?', 'GE oder WI (Umweg finden)'], ['Der Weg teilt sich. Links und rechts sieht alles gleich aus. Welcher Weg ist der richtige?', 'WI']];
const NICE = ['Am Wegrand steht ein Strauch voller bunter Beeren. Sie leuchten rot und blau. Mmh, die duften lecker! Ihr dürft ein paar pflücken.', 'Ein freundlicher Wanderer mit großem Rucksack kommt euch entgegen. Er lächelt und erzählt euch, was er unterwegs gesehen hat.'];
function wildFromTable(route){
  const r2 = rnd(6); let sp = D.enc[route][r2 - 1]; const rolls = [{sides:6, val:r2, cap:'Welches?', color:'#4E9A4A'}];
  if(sp.startsWith('Nidoran')){ const r3 = rnd(6); rolls.push({sides:6, val:r3, cap:r3 % 2 ? '♀' : '♂', color:'#A33EA1'}); sp = r3 % 2 ? 'Nidoran ♀' : 'Nidoran ♂'; }
  return {sp, rolls};
}

/* Aktionen */
const A = {
  tab: d => { S.tab = d.k; save(); render(); window.scrollTo(0, 0); },
  close: () => closeModal(),
  menu: () => openModal(menuView),
  sound: () => { S.sound = !S.sound; commit(); },
  clearLog: () => { S.log = []; commit(); },
  preset: d => { const p = D.presets.find(x => x.id === d.k); startFight({title:p.name + (d.easy ? ' (leicht)' : ''), kind:'trainer', ch:p.ch, mons:p.mons, reward:p.reward, arena:p.arena, note:p.note, easy:d.easy ? p.easy : null}); },
  wildPick: () => openPick('Wildes Pokémon', sp => startFight({title:'Wildes ' + sp, kind:'wild', ch:10, mons:[sp]})),
  pickSp: d => { const cb = pickCb; closeModal(); cb && cb(d.k); },
  custom: () => { custom = {name:'', ch:10, mons:[]}; openModal(customView); },
  cCh: d => { custom.ch = Math.max(5, Math.min(16, custom.ch + +d.v)); refreshModal(); },
  cDel: d => { custom.mons.splice(+d.v, 1); refreshModal(); },
  cAdd: () => { const keep = custom; openPick('Pokémon für den Gegner', sp => { custom = keep; custom.mons.push(sp); openModal(customView); }); },
  cStart: () => startFight({title:custom.name.trim() || 'Trainer', kind:'trainer', ch:custom.ch, mons:custom.mons, reward:50}),
  fAtk: d => foeAttack(d.i === '' ? null : +d.i),
  fKp: d => { const f = curFoe(); f.kp = Math.max(0, Math.min(f.max, f.kp + +d.v)); if(f.kp === 0){ save(); render(); koFlow(); } else commit(); },
  hit: d => hitFoe(+d.v),
  ko: () => koFlow(),
  fSt: d => { curFoe().status = d.k || null; commit(); },
  target: () => openPick('Welches Pokémon der Kinder kämpft?', sp => { S.fight.target = SP[sp].types; S.fight.targetName = sp; commit(); }),
  tie: () => { const a = rnd(6), b = rnd(6); showRoll([{sides:6, val:a, cap:'Kinder', color:'#2F5D8C'}, {sides:6, val:b, cap:'Gegner', color:'#22313F'}], {head: a > b ? 'Die Kinder fangen an!' : b > a ? 'Der Gegner fängt an!' : 'Wieder gleich: Die Kinder fangen an!', cls:'info'}); },
  roundEnd: () => { const b = S.fight, f = curFoe(); const lines = []; if(f.kp > 0 && (f.status === 'gift' || f.status === 'brennt')){ f.kp = Math.max(0, f.kp - 2); lines.push({say:`${cap(foeName(f))} verliert 2 KP (${STATUS[f.status].n}).`}); }
    lines.push('Kinder: Ist euer Pokémon vergiftet oder brennt es? Dann im Tablet „Rundenende: −2 KP“ tippen.');
    b.round++; log(`Runde ${b.round}`); save(); showMsg({head:`Runde ${b.round}`, cls:'info', lines}, () => { commit(); if(f.kp === 0) koFlow(); }); },
  caught: () => { const b = S.fight; log(`${curFoe().sp} wurde gefangen!`); S.fight = null; save(); showMsg({head:'Gefangen! 🎉', cls:'crit', lines:['Die Kinder tragen das Pokémon im Tablet mit den aktuellen KP ein.', 'Fundsuche: 1W6 „Im Gras suchen“. Mitkämpfende Pokémon bekommen +1 Sieg.']}, () => commit()); },
  fleeFail: () => foeAttack(null),
  kidFx: d => { S.fight.kid.shield = 3; commit(); toast('Härtner: Der nächste Treffer des Gegners macht 3 weniger.'); },
  foeFx: d => { const f = curFoe(); if(d.k === 'weak') f.fx.weak = 2; else f.fx.expose = 2; commit(); },
  endFight: () => showMsg({head:'Kampf beenden?', cls:'info', lines:['Der Kampf wird ohne Belohnung beendet.'], buttons:[{t:'Weiterkämpfen', v:0}, {t:'Beenden', v:1}]}, v => { if(v){ log(`Kampf beendet: ${S.fight.title}`); S.fight = null; commit(); } }),
  route: d => { S.route = d.k; commit(); },
  encounter: () => {
    const r1 = rnd(6), route = S.route;
    if(r1 <= 3){ const {sp, rolls} = wildFromTable(route); log(`${route}: wildes ${sp}`); save();
      showRoll([{sides:6, val:r1, cap:'Begegnung', color:'#2F5D8C'}, ...rolls], {head:`Ein wildes ${sp}!`, cls:'info', lines:[{say:pickOne(WILD_TXT).replaceAll('[P]', sp)}], buttons:[{t:'Ausweichen', v:0}, {t:'Kampf!', v:1}]}, v => { if(v) startFight({title:'Wildes ' + sp, kind:'wild', ch:10, mons:[sp]}); else commit(); }); }
    else if(r1 <= 5){ const [t, p] = pickOne(OBST); log(`${route}: Hindernis`); save(); showRoll([{sides:6, val:r1, cap:'Begegnung', color:'#2F5D8C'}], {head:'Ein Hindernis!', cls:'info', lines:[{say:t}, `Probe: ${p}. Ohne Erfolg: Umweg und ein Begegnungswurf mehr.`]}, () => commit()); }
    else { const t = pickOne(NICE); const n = Math.ceil(rnd(6) / 2); log(`${route}: etwas Nettes`); save(); showRoll([{sides:6, val:r1, cap:'Begegnung', color:'#2F5D8C'}], {head:'Etwas Nettes!', cls:'good', lines:[{say:t}, t.startsWith('Am Wegrand') ? `${n} Beere${n > 1 ? 'n' : ''} für die Gruppe.` : 'Vielleicht verrät der Wanderer einen Tipp für das Abenteuer.']}, () => commit()); }
  },
  obstacle: () => { const [t, p] = pickOne(OBST); showMsg({head:'Hindernis', cls:'info', lines:[{say:t}, `Probe: ${p}`]}); },
  nice: () => { const t = pickOne(NICE); showMsg({head:'Etwas Nettes', cls:'good', lines:[{say:t}]}); },
  picnic: () => showMsg({head:'🧺 Picknick', cls:'good', lines:[{say:'Ihr setzt euch ins weiche Gras und packt eure Snacks aus. Eure Pokémon kuscheln sich an euch. Alle essen, trinken und ruhen sich aus.'}, 'Jedes Pokémon heilt 10 KP (im Tablet „+5“ zweimal tippen). Nur einmal pro Route!']}),
  part: d => { S.part = +d.v; commit(); window.scrollTo(0, 0); },
  rs: d => { S.rs = Math.max(15, Math.min(26, S.rs + +d.v * 2)); save(); document.querySelectorAll('.box.read,.box.kids').forEach(b => b.style.setProperty('--rs', S.rs + 'px')); },
  free: d => {
    if(d.k === 'w20'){ const r = rnd(20); log(`W20: ${r}`); save(); showRoll([{sides:20, val:r, cap:'W20'}], {head:String(r), cls:r === 1 ? 'crit' : r === 20 ? 'patzer' : 'info'}, () => commit()); }
    else if(d.k === 'w6'){ const r = rnd(6); log(`W6: ${r}`); save(); showRoll([{sides:6, val:r, cap:'W6', color:'#2F5D8C'}], {head:String(r), cls:'info'}, () => commit()); }
    else if(d.k === 'w61'){ const r = rnd(6); log(`W6+1: ${r + 1}`); save(); showRoll([{sides:6, val:r, cap:'W6', color:'#E2872A', plus:'+1'}], {head:`${r} + 1 = ${r + 1}`, cls:'info'}, () => commit()); }
    else { const r = rnd(20); const ok = r === 1 || (r !== 20 && r <= 10); log(`Probe gegen 10: ${r}`); save(); showRoll([{sides:20, val:r, cap:'gegen 10', color:'#22313F'}], {head: r === 1 ? 'Super-Erfolg' : r === 20 ? 'Patzer' : ok ? 'Geschafft' : 'Nicht geschafft', cls: ok ? 'good' : 'bad'}, () => commit()); }
  },
  type: d => { typeSel = d.k; render(); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if(!el || el.disabled) return; const fn = A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset, el); } });
document.addEventListener('input', e => {
  if(e.target.id === 'pq'){ pickQ = e.target.value.trim(); $('#pgrid').innerHTML = pickGrid(); }
  if(e.target.id === 'cn' && custom) custom.name = e.target.value;
});
document.addEventListener('keydown', e => { if(e.key !== 'Escape') return; if(!$('#dice').classList.contains('hidden')){ const b = $('#dres .btn.red') || $('#dres .btn'); b && b.click(); } else if(modalView) closeModal(); });
render();
</script>
</body>
</html>
