<title>Kanto-Abenteuer · Spielleitung</title>
<style>
:root{--red:#D63A2F;--dark:#22313F;--blue:#2F5D8C;--grey:#6B7480;--line:#DDE2E7;--bg:#EEF1F5;--gold:#B8921A;--green:#4E9A4A;--purple:#8E44AD;--good:#2E8B57;--bad:#C0504D;--read:#FFF6DD;--readb:#E3B341;--kids:#EAF5E4;--kidsb:#5BA35B;--tip:#E8F2FB;--tipb:#5B8FC7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--dark);font-size:17px;line-height:1.4;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.hidden{display:none!important}
#top{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
#top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .badge{background:var(--red);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
nav#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav#bar .in{display:flex;max-width:640px;width:100%}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;border-radius:14px;font-size:12px;font-weight:800;color:var(--grey)}
.nb .i{font-size:22px;line-height:1}
.nb.on{color:var(--red);background:#FCEBEA}
.nb .dot{width:8px;height:8px;border-radius:50%;background:var(--red);position:absolute;margin:-2px 0 0 24px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--grey)}
.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:50px;padding:8px 16px;border-radius:15px;font-weight:800;background:var(--dark);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--dark);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:5px 12px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.4}
.btn:active,.chip:active,.abtn:active,.hit:active{transform:scale(.97)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:42px;padding:5px 13px;border-radius:999px;border:2px solid var(--cc,#CDD3D9);background:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--cc,var(--dark));color:#fff}
.tp{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:800;font-size:13px}
.search{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);padding:8px 14px;font-size:18px;margin-bottom:10px}
/* Gegner */
.foe{border:4px solid var(--tc);border-radius:20px;background:#fff;padding:14px;margin-bottom:14px}
.foehead{display:flex;align-items:flex-start;gap:10px}
.foehead .nm{flex:1}
.foehead .nm b{font-size:24px;display:block;line-height:1.1}
.ini{width:50px;height:50px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1;flex:none}
.ini small{font-size:9px;display:block;text-align:center;margin-bottom:-6px}
.kpbox{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.kpbig{font-size:44px;font-weight:900;line-height:1;min-width:110px}
.kpbig span{font-size:22px;color:var(--grey)}
.hp{height:14px;border-radius:7px;background:#E6E9EC;overflow:hidden;margin-bottom:10px}
.hp i{display:block;height:100%;border-radius:7px;transition:width .4s}
.step{min-width:52px;min-height:52px;border-radius:14px;background:#F2F4F6;border:2px solid var(--line);font-weight:900;font-size:18px}
.hits{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hit{min-height:50px;border-radius:13px;background:#FCEBEA;border:2px solid #F2B8B3;font-weight:900;font-size:20px;color:var(--red)}
.queue{display:flex;gap:6px;align-items:center;margin-top:4px}
.queue span{width:20px;height:20px;border-radius:50%;border:2px solid var(--dark);background:linear-gradient(var(--red) 50%,#fff 50%)}
.queue span.ko{background:#C9CED3;border-color:#A5ACB3}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn{position:relative;min-height:66px;border-radius:15px;border:3px solid var(--tc);background:var(--tcl);padding:7px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center}
.abtn b{font-size:17px}
.abtn span{font-size:13px;color:#4A5560;font-weight:700}
.abtn em{font-style:normal;font-weight:900;font-size:17px;grid-row:1/3;grid-column:2}
.abtn .bd{position:absolute;top:-9px;right:8px;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;color:#fff}
.flag{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#FFF2C6;font-weight:700;margin:6px 0;font-size:15px}
.ko{color:var(--bad);font-weight:900;font-size:20px;margin:6px 0}
.preset{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.preset:first-of-type{border-top:0}
.preset b{font-size:17px}
.preset .m{font-size:14px;color:var(--grey)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{border:3px solid var(--tc);background:var(--tcl);border-radius:14px;padding:8px 10px;text-align:left;min-height:62px}
.pbtn b{display:block;font-size:16px}
.pbtn span{font-size:13px;color:#4A5560;font-weight:700}
/* Texte */
details.sec{background:#fff;border-radius:18px;margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;padding:14px 16px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;min-height:56px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"›";margin-left:auto;font-size:26px;color:var(--grey);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(90deg)}
.sbody{padding:0 14px 14px}
.box{border-left:5px solid var(--b);background:var(--bgc);border-radius:12px;padding:10px 14px;margin:10px 0}
.box .bt{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);margin-bottom:4px}
.box p{margin:6px 0}
.box.read{--b:var(--readb);--bgc:var(--read)}
.box.read p{font-size:var(--rs,19px);line-height:1.5}
.box.kids{--b:var(--kidsb);--bgc:var(--kids)}
.box.kids p{font-size:var(--rs,19px);line-height:1.5}
.box.tip{--b:var(--tipb);--bgc:var(--tip)}
.box.tip p{font-size:15px}
.h3{font-weight:900;font-size:15px;margin:14px 0 2px;color:var(--blue)}
.parts{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.parts .chip{white-space:nowrap}
/* Würfel */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbtn{min-height:120px;border-radius:20px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:19px}
.dbtn svg{width:58px;height:58px}
.dbtn small{font-size:13px;color:var(--grey);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-top:1px solid var(--line);font-size:15px;display:flex;gap:8px}
.hist li:first-child{border-top:0}
.hist time{color:var(--grey);font-size:12px;min-width:38px;padding-top:2px}
/* Regeln */
table.rt{width:100%;border-collapse:collapse;font-size:15px}
table.rt td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.rt td:first-child{font-weight:800;white-space:nowrap;padding-right:10px}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tbtn{border-radius:12px;min-height:54px;color:#fff;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;opacity:.9}
.tbtn.on{outline:4px solid var(--dark);opacity:1}
.tbtn .e{font-size:20px}
.tres{margin-top:12px;font-size:16px}
.tres p{margin:6px 0}
/* Overlay */
.overlay,.modal{position:fixed;inset:0;z-index:80;background:rgba(15,22,30,.72);display:flex;align-items:flex-end;justify-content:center}
.modal{z-index:60;align-items:flex-end}
.dbox,.mbox{background:#fff;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:92vh;overflow:auto;text-align:center}
.mbox{text-align:left}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h1{flex:1;margin:0;font-size:21px}
.xbtn{width:48px;height:48px;border-radius:50%;background:#EEF1F5;font-size:24px;font-weight:800;flex:none}
.drow{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.dslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.dwrap{width:100px;height:100px;position:relative}
.dwrap svg{width:100%;height:100%}
.dwrap .dplus{position:absolute;right:-20px;bottom:2px;font-size:24px;font-weight:900}
.dcap{font-weight:800;color:var(--grey);font-size:14px}
.rolling{animation:shake .14s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(-4px)}50%{transform:rotate(10deg) translateY(3px)}100%{transform:rotate(-12deg) translateY(-4px)}}
.landed{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.dhead{font-size:28px;font-weight:900;margin:14px 0 4px}
.dhead.good{color:var(--good)}.dhead.bad{color:var(--bad)}.dhead.crit{color:#C98A00}.dhead.patzer{color:var(--purple)}.dhead.info{color:var(--blue)}
.dbig{display:inline-block;margin:8px 0 2px;padding:8px 18px;border-radius:16px;background:#FFF2C6;font-size:22px;font-weight:900}
.dlines p{font-size:18px;margin:8px 0}
.dlines p.say{background:var(--read);border-left:5px solid var(--readb);border-radius:10px;padding:8px 12px;text-align:left}
.dmath{font-size:14px;color:var(--grey);margin-top:6px}
.dbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dbtns .btn{min-width:140px;min-height:54px;flex:1}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.overlay,.modal{align-items:center}.dbox,.mbox{border-radius:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const TX = [{"title": "Teil III · Abenteuer 1: Das verschwundene Paket", "secs": [{"title": "Worum es geht", "items": [{"k": "tip", "title": "So nutzt du die Vorlesetexte", "t": ["Die gelben Kästen sind zum Vorlesen gedacht. Lies langsam und mach nach jedem Absatz eine kleine Pause. Die Kinder dürfen jederzeit dazwischenrufen, was ihre Trainer tun wollen.", "Für Situationen, die in jedem Abenteuer vorkommen (wildes Pokémon, Fangen, Entwicklung …), gibt es fertige Vorlesetexte in Teil IV."]}]}, {"title": "Szene 1 · Alabastia: Im Labor von Professor Eich", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Heute ist ein ganz besonderer Tag. Ihr wohnt in Alabastia, einem kleinen Ort mit bunten Gärten. Und heute bekommt ihr euer erstes eigenes Pokémon!\n\nIhr steht vor einem großen weißen Haus. Das ist das Labor von Professor Eich. Die Tür geht auf. Ein freundlicher Mann mit grauen Haaren und weißem Kittel lächelt euch an.\n\n„Da seid ihr ja! Kommt rein, kommt rein!“"}, {"k": "read", "title": "Zum Vorlesen: Die Starter", "t": "Auf einem Tisch liegen vier rot-weiße Bälle. „In jedem Ball wartet ein Pokémon“, sagt Professor Eich.\n\n„Bisasam ist ein Pflanzen-Pokémon. Glumanda ist ein Feuer-Pokémon. Schiggy ist ein Wasser-Pokémon. Und Pikachu ist ein Elektro-Pokémon. Sucht euch eines aus. Es wird euer bester Freund.“"}, {"k": "h3", "t": "Eichs Frage"}, {"k": "read", "title": "Zum Vorlesen", "t": "„Bevor ihr losgeht, habe ich noch eine Frage an jeden von euch“, sagt Professor Eich. „Ein guter Trainer kennt sich nämlich mit Typen aus!“"}, {"k": "read", "title": "Zum Vorlesen: Der Auftrag", "t": "Professor Eich gibt jedem von euch eine kleine Tasche. Darin sind fünf Pokébälle, zwei Tränke und eine Beere.\n\n„Und jetzt habe ich einen Auftrag für euch“, sagt er. „Im Pokémarkt in Vertania City liegt ein Paket für euch. Darin ist etwas, das jeder Trainer braucht. Lauft über Route 1 nach Norden. Und passt gut auf eure Pokémon auf!“"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Nutze den ersten Kampf auf Route 1 als Übungskampf. Erkläre jeden Schritt, lass alle Kinder einmal würfeln und fang das Rattfratz notfalls mit etwas „Anfängerglück“ ein."]}]}, {"title": "Szene 2 · Route 1: Erste Schritte im hohen Gras", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Hinter Alabastia wird der Weg schmal. Rechts und links wächst hohes Gras. Es reicht euch bis zu den Knien. Der Wind rauscht. Ein Vogel zwitschert.\n\nPlötzlich raschelt es direkt vor euch. Das Gras wackelt hin und her. Ein kleines lila Pokémon springt heraus! Es hat lange Vorderzähne und einen geringelten Schwanz. Es ist ein Rattfratz! Es faucht euch an."}, {"k": "h3", "t": "Was passiert"}, {"k": "read", "title": "Zum Vorlesen: Hindernis", "t": "Der Weg endet plötzlich an einer Felskante. Sie ist so hoch wie ein Tisch. Unten geht der Weg weiter. Wollt ihr hinunterklettern? Oder sucht ihr einen anderen Weg?"}, {"k": "read", "title": "Zum Vorlesen: Die Frau mit der Gießkanne (bei einer 6)", "t": "Am Wegrand sitzt eine alte Frau mit einer Gießkanne. Sie gießt einen Beerenstrauch.\n\n„Oh, junge Trainer!“, sagt sie und lächelt. „Hier, nehmt jeder eine Beere. Und passt im Vertania-Wald gut auf. Dort laufen seit ein paar Tagen zwei laute Kerle herum.“"}]}, {"title": "Szene 3 · Vertania City: Ein Paket fehlt", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Vor euch liegt Vertania City. Die Stadt ist viel größer als Alabastia. Ein Haus mit rotem Dach fällt euch sofort auf. Das ist das Pokémon-Center. Dort werden kranke und müde Pokémon wieder gesund. Gleich daneben steht ein Haus mit blauem Dach. Das ist der Pokémarkt."}, {"k": "read", "title": "Zum Vorlesen: Im Pokémarkt", "t": "Im Pokémarkt klingelt eine kleine Glocke über der Tür. Hinter der Theke steht ein Verkäufer mit Schnurrbart. „Willkommen! Was kann ich für euch tun?“\n\nIhr fragt nach eurem Paket. Der Verkäufer kratzt sich am Kopf.\n\n„Euer Paket? Das hat Benni gestern abgeholt. Benni ist mein Botenjunge. Er wollte es euch nach Alabastia bringen. Aber er ist nie angekommen. Dabei nimmt er immer die Abkürzung durch den Vertania-Wald …“"}, {"k": "h3", "t": "Hinweise sammeln"}, {"k": "read", "title": "Zum Vorlesen: Ende der 1. Spielrunde", "t": "Die Sonne geht langsam unter. Der Himmel wird orange und dann lila. Ihr übernachtet im Pokémon-Center. Morgen früh wollt ihr in den Vertania-Wald. Was wohl mit Benni passiert ist?\n\nFortsetzung folgt!"}]}, {"title": "Szene 4 · Route 2 und der Vertania-Wald", "items": [{"k": "read", "title": "Zum Vorlesen: Beginn der 2. Spielrunde", "t": "Was bisher geschah: Ihr habt euer erstes Pokémon bekommen. Ihr seid nach Vertania City gelaufen, um ein Paket abzuholen. Aber Benni, der Botenjunge, ist mit dem Paket verschwunden. Vielleicht ist er im Vertania-Wald!\n\nAm Morgen lauft ihr aus der Stadt hinaus. Der Weg führt nach Norden. Bald seht ihr vor euch eine dunkle Wand aus Bäumen. Das ist der Vertania-Wald."}, {"k": "read", "title": "Zum Vorlesen: Im Wald", "t": "Im Wald ist es dunkel und kühl. Die Bäume stehen ganz dicht. Nur ein paar Sonnenstrahlen kommen durch die Blätter. Überall summt und brummt es. Ein Ast knackt. Wo geht es hier lang?"}, {"k": "read", "title": "Zum Vorlesen: Verlaufen (WI-Probe misslungen, ein Begegnungswurf mehr)", "t": "Hmm. Diesen Baum mit dem großen Loch habt ihr doch schon einmal gesehen. Oh nein, ihr lauft im Kreis!"}, {"k": "h3", "t": "Käfersammler Timo"}, {"k": "read", "title": "Zum Vorlesen", "t": "Ein Junge mit Strohhut springt hinter einem Busch hervor. Er hat einen riesigen Kescher in der Hand.\n\n„Halt! Ich bin Timo, der Käfersammler! Wer durch meinen Wald will, muss erst gegen meine Käfer kämpfen!“"}, {"k": "read", "title": "Zum Vorlesen: Timo ist besiegt", "t": "Timo lässt den Kescher sinken. „Wow, ihr seid echt gut!“ Er gibt euch 50 Pokédollar.\n\n„Sucht ihr vielleicht Benni? Ich habe vorhin jemanden rufen hören. Da hinten, bei der großen Eiche!“"}, {"k": "h3", "t": "Benni im Baum"}, {"k": "read", "title": "Zum Vorlesen", "t": "„Hallo? Ist da jemand? Hilfe!“\n\nDie Stimme kommt von oben. Ihr schaut hoch. Ganz oben in der großen Eiche sitzt ein Junge mit blauer Mütze. Er klammert sich an einem Ast fest. Er sieht sehr ängstlich aus.\n\n„Ich trau mich nicht mehr runter!“"}, {"k": "read", "title": "Zum Vorlesen: Benni erzählt", "t": "Endlich steht Benni wieder auf dem Boden. Er zittert noch ein bisschen.\n\n„Danke! Zwei Männer haben mich erschreckt. Sie hatten ein freches Mauzi dabei. Sie haben mir meine Tasche weggenommen. Mit eurem Paket! Da bin ich schnell auf den Baum geklettert. Die beiden sind dort entlang gegangen.“\n\nEr zeigt tiefer in den Wald hinein."}, {"k": "read", "title": "Zum Vorlesen: Spuren", "t": "Auf dem Waldboden seht ihr Fußspuren. Große und kleine. Und hier liegt eine zertretene Beere. Und da noch eine. Wollt ihr den Spuren folgen?"}]}, {"title": "Szene 5 · Das Lager der Grummel-Brüder", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Ihr schleicht durch die Büsche. Vor euch liegt eine kleine Lichtung. In der Mitte brennt ein Lagerfeuer. Davor sitzen zwei Männer. Der eine ist lang und dünn. Der andere ist klein und rund. Beide tragen viel zu große Mäntel.\n\nNeben ihnen liegt ein Haufen Sachen: Beeren, Kronkorken, eine alte Taschenlampe. Und eine Tasche mit Sternen!\n\n„Hihi, Kalle“, kichert der Runde. „Mit dem Zeug werden wir reich!“\n\n„Psst, Knut! Nicht so laut!“, zischt der Dünne."}, {"k": "h3", "t": "Zwei Wege zum Ziel"}, {"k": "read", "title": "Zum Vorlesen: Anschleichen klappt", "t": "Ganz leise greift ihr nach der Tasche. Geschafft! Doch dann tritt jemand auf einen Ast. Knack!\n\nDie beiden Männer springen auf. „He! Das ist unsere Tasche!“, ruft Kalle. „Los, Knut! Pokémon raus!“"}, {"k": "read", "title": "Zum Vorlesen: Anschleichen klappt nicht", "t": "Knack! Ein Ast bricht unter eurem Fuß. Kalle und Knut drehen sich um. „Wer ist da?“ Ihr seid entdeckt!"}, {"k": "read", "title": "Zum Vorlesen: Herausfordern", "t": "Ihr tretet mutig auf die Lichtung. Knut erschrickt so sehr, dass er rückwärts von seinem Baumstamm plumpst. Dann lachen die beiden laut.\n\n„Ihr Knirpse wollt gegen uns kämpfen?“, ruft Kalle. „Los, Pokémon!“"}, {"k": "read", "title": "Zum Vorlesen: Die Brüder fliehen", "t": "„Das wird euch noch leidtun!“, ruft Kalle. Er stolpert über einen Ast. Knut rennt hinterher. Bei jedem Schritt fällt eine Beere aus seinen Taschen. Dann sind die beiden zwischen den Bäumen verschwunden."}, {"k": "h3", "t": "Belohnung"}, {"k": "read", "title": "Zum Vorlesen: Das Paket", "t": "Ihr öffnet das Paket ganz vorsichtig. Darin liegt ein kleines Kästchen aus rotem Leder. Innen sind acht leere Plätze. Daneben steckt ein Zettel. Darauf steht in krakeliger Schrift:\n\n„Für meine neuen Trainer. Füllt dieses Kästchen mit Orden! Der erste Orden wartet in Marmoria City. Euer Professor Eich.“\n\nBenni strahlt. „Ihr seid echte Helden! Hier, für jeden von euch ein Pokéball.“"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Ist die Gruppe nach dem Kampf sehr erschöpft, zeigt Benni ihr eine Lichtung mit Beerensträuchern: Picknick, und jedes Pokémon heilt 10 KP. Hier endet gut die 2. Spielrunde."]}]}, {"title": "Szene 6 · Route 2 Nord und Marmoria City", "items": [{"k": "read", "title": "Zum Vorlesen: Beginn der 3. Spielrunde", "t": "Was bisher geschah: Ihr habt Benni aus dem Baum gerettet. Ihr habt Kalle und Knut besiegt und euer Paket zurückgeholt. Darin war ein Kästchen für Orden. Der erste Orden wartet in Marmoria City!\n\nEndlich wird der Wald heller. Die Bäume stehen nicht mehr so dicht. Vor euch liegt ein steiniger Weg. Dahinter seht ihr eine Stadt. Die Häuser sind grau. Sie sehen aus, als wären sie aus Felsen gebaut. Das ist Marmoria City!"}, {"k": "h3", "t": "Das Museum"}, {"k": "read", "title": "Zum Vorlesen", "t": "Das Museum ist ein großes Haus mit hohen Säulen. Drinnen ist es ganz still. In Glaskästen liegen versteinerte Muscheln und uralte Knochen.\n\nEin alter Mann mit Brille kommt auf euch zu. „Ich bin der Museumswärter. Wer meine Frage beantworten kann, bekommt ein kleines Geschenk! Also: Was waren diese Steine hier, bevor sie zu Stein wurden?“"}, {"k": "read", "title": "Zum Vorlesen: Vor der Arena", "t": "Vor einem großen Gebäude aus Stein steht ein Junge. „Wollt ihr etwa gegen Rocko kämpfen? Rocko ist hart wie Stein! Seine Pokémon mögen kein Wasser. Und Pflanzen mögen sie auch nicht.“"}]}, {"title": "Szene 7 · Die Arena von Marmoria City", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Ihr drückt die schwere Tür der Arena auf. Drinnen ist eine große Halle voller Felsen. Eure Schritte hallen laut.\n\nDa springt ein Junge mit Rucksack auf einen Felsen. „Ich bin Jonas! Wer zu Rocko will, muss erst an mir vorbei!“"}, {"k": "read", "title": "Zum Vorlesen: Rocko", "t": "Ganz hinten in der Halle steht ein junger Mann. Er hat die Arme verschränkt.\n\n„Ich bin Rocko“, sagt er mit tiefer Stimme. „Ich bin der Arenaleiter von Marmoria City. Meine Pokémon sind hart wie Stein. Wollt ihr wirklich gegen mich kämpfen?“"}, {"k": "read", "title": "Zum Vorlesen: Der Kampf beginnt", "t": "Rocko wirft einen Pokéball. Ein Pokémon aus Stein kullert heraus. Es hat zwei kräftige Arme. Es ist Kleinstein!\n\n„Zeigt mir, was ihr könnt!“"}, {"k": "read", "title": "Zum Vorlesen: Onix kommt", "t": "Kleinstein ist erschöpft. Rocko nickt. „Nicht schlecht. Aber jetzt wird es ernst!“\n\nEr wirft seinen zweiten Pokéball. Der Boden bebt. Ein riesiges Pokémon schlängelt sich aus dem Ball. Es ist lang wie ein Bus und besteht aus großen Felsbrocken. Es ist Onix!"}, {"k": "read", "title": "Zum Vorlesen: Sieg!", "t": "Onix sinkt mit einem lauten Grollen zu Boden. In der Halle ist es ganz still. Dann lächelt Rocko zum ersten Mal.\n\n„Ihr seid stärker, als ihr ausseht. Das habt ihr euch verdient.“\n\nEr gibt jedem von euch einen kleinen grauen Orden. Er sieht aus wie ein Felsen. Das ist der Felsorden! Ihr legt ihn in euer rotes Kästchen. Ein Platz ist jetzt voll. Sieben sind noch leer."}, {"k": "read", "title": "Zum Vorlesen: Falls die Gruppe verliert", "t": "Eure Pokémon sind erschöpft. Rocko nickt euch freundlich zu.\n\n„Ihr habt gut gekämpft. Trainiert noch ein bisschen. Dann kommt wieder.“\n\nIm Pokémon-Center werden eure Pokémon wieder gesund. Ihr könnt es noch einmal versuchen!"}, {"k": "h3", "t": "Ausblick"}, {"k": "read", "title": "Zum Vorlesen: Ende des Abenteuers", "t": "Im Pokémon-Center klingelt das Bildtelefon. Auf dem Bildschirm erscheint Professor Eich.\n\n„Der Felsorden! Großartig! Ich bin so stolz auf euch!“\n\nDann wird sein Gesicht ernst. „Aber hört zu. Man hat Kalle und Knut am Mondberg gesehen. Sie suchen dort nach seltenen Steinen. Ich glaube, das gibt Ärger …“\n\nFortsetzung folgt!"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Wenn eure Gruppe nur Glumanda und Pikachu hat: Leichter Modus verwenden und auf Sandan aus Route 2 Nord hinweisen."]}]}]}, {"title": "Teil III · Abenteuer 2: Ärger am Mondberg", "secs": [{"title": "Szene 1 · Marmoria City: Neuigkeiten im Museum", "items": [{"k": "read", "title": "Zum Vorlesen: Beginn der 1. Spielrunde", "t": "Was bisher geschah: Ihr habt euer erstes Abenteuer bestanden. Ihr habt Benni gerettet, Kalle und Knut verjagt und den Felsorden gewonnen. Am Ende hat Professor Eich angerufen. Kalle und Knut sind am Mondberg gesehen worden!\n\nAm Morgen ist es in Marmoria City noch ganz ruhig. Nur vor dem Museum steht der alte Museumswärter. Er winkt euch aufgeregt zu."}, {"k": "read", "title": "Zum Vorlesen: Der Museumswärter", "t": "„Gut, dass ihr da seid! Gestern waren zwei komische Kerle hier. Ein Langer und ein Runder. Sie wollten alles über Mondsteine wissen.“\n\nEr zeigt auf einen Glaskasten. Darin liegt ein grauer Stein. Er glitzert ein bisschen, als wäre Sternenstaub darin.\n\n„Das ist ein Mondstein. Vor langer Zeit ist er vom Himmel gefallen. Mitten in den Mondberg. Manche Pokémon verwandeln sich, wenn sie so einen Stein berühren. Und tief im Berg soll ein riesiger Mondstein liegen. Ich fürchte, die beiden wollen ihn holen!“"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Erwähne die Taschenlampe nicht direkt. Lass die Kinder überlegen, was man in einer dunklen Höhle braucht. Kommt jemand auf die Idee, dass Glumandas Schwanzflamme leuchtet, ist das genauso gut."]}]}, {"title": "Szene 2 · Route 3: Der Weg zum Berg", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Hinter Marmoria City führt ein staubiger Weg nach Osten. Links und rechts liegen große Felsbrocken. In der Ferne seht ihr einen grauen Berg. Seine Spitze ist ganz rund, fast wie ein Mond. Das ist der Mondberg."}, {"k": "h3", "t": "Picknickerin Lea"}, {"k": "read", "title": "Zum Vorlesen", "t": "Auf einer Decke am Wegrand sitzt ein Mädchen mit Sonnenhut. Neben ihr steht ein Korb voller Brote. Sie springt auf.\n\n„Hallo! Ich bin Lea. Ich mache hier Picknick und warte auf gute Trainer. Habt ihr Lust auf einen Kampf? Wer gewinnt, kriegt ein Brot!“"}, {"k": "read", "title": "Zum Vorlesen: Lea ist besiegt", "t": "Lea lacht. „Ihr seid stark! Hier, nehmt euch ein Brot. Und eure Pokémon bekommen auch etwas.“ Sie wird ein bisschen leiser. „Am Mondberg waren heute Morgen zwei Männer mit Spitzhacken. Die sahen gar nicht nett aus.“"}]}, {"title": "Szene 3 · Am Fuß des Mondbergs", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Vor euch ragt der Mondberg in den Himmel. Am Fuß des Berges steht ein kleines Pokémon-Center. Daneben ist ein dunkles Loch im Felsen. Das ist der Eingang zur Höhle. Kalte Luft weht heraus."}, {"k": "read", "title": "Zum Vorlesen: Der Karpador-Verkäufer", "t": "Im Pokémon-Center sitzt ein Mann mit glänzendem Anzug. Er hält einen Pokéball hoch und lächelt breit.\n\n„Psst! Ihr da! Wollt ihr ein ganz seltenes Pokémon kaufen? Ein Karpador! Nur 500 Pokédollar! Das ist ein echtes Schnäppchen!“"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Lass die Kinder selbst entscheiden. Manche finden den Verkäufer verdächtig, andere wollen das Abenteuer. Beides ist richtig.", "Wer handelt (CH-Probe), bekommt Karpador für 300 Pokédollar. Bei einer 1 legt der Verkäufer noch einen Trank dazu."]}, {"k": "read", "title": "Zum Vorlesen: Ende der 1. Spielrunde", "t": "Die Sonne geht unter. Der Mondberg wirft einen langen Schatten. Morgen früh geht es in die Höhle. Ob Kalle und Knut schon drin sind?\n\nFortsetzung folgt!"}]}, {"title": "Szene 4 · In der Höhle", "items": [{"k": "read", "title": "Zum Vorlesen: Beginn der 2. Spielrunde", "t": "Was bisher geschah: Kalle und Knut wollen im Mondberg einen riesigen Mondstein holen. Ihr habt Lea besiegt und seid am Fuß des Berges angekommen.\n\nIhr betretet die Höhle. Hinter euch wird das Tageslicht immer kleiner. Dann ist es fast ganz dunkel. Von der Decke tropft Wasser. Plitsch. Platsch. Eure Schritte hallen von den Wänden. Und von irgendwo kommt ein leises Flattern …"}, {"k": "read", "title": "Zum Vorlesen: Zubat-Schwarm (bei einer 1–3)", "t": "Der Gang wird breiter. Plötzlich hört ihr ein Flattern über euch. Viele kleine Flügel! Ein Schwarm Zubat fliegt kreischend durch die Höhle. Eines davon kommt direkt auf euch zu!"}, {"k": "h3", "t": "Hindernis: Die Felsspalte"}, {"k": "read", "title": "Zum Vorlesen", "t": "Vor euch klafft eine Spalte im Boden. Sie ist so breit wie ein großer Schritt. Unten ist es pechschwarz. Ein Steinchen fällt hinein. Ihr hört es erst nach einer ganzen Weile aufschlagen. Klack.\n\nWie kommt ihr hinüber?"}, {"k": "h3", "t": "Forscher Fridolin"}, {"k": "read", "title": "Zum Vorlesen", "t": "Hinter einer Ecke flackert eine kleine Laterne. Ein junger Mann mit dicker Brille sitzt zusammengekauert hinter einem Felsen. Er presst zwei runde Steine an seine Brust.\n\n„Oh! Ihr seid keine Gauner, oder? Puh. Ich bin Fridolin. Ich bin Forscher. Ich habe hier zwei Fossilien gefunden. Das sind uralte Pokémon aus Stein! Aber zwei Männer wollen sie mir wegnehmen. Und jetzt sind sie weiter hinten in der Höhle. Sie hämmern an irgendwas herum …“"}, {"k": "read", "title": "Zum Vorlesen: Spuren der Brüder", "t": "Aus der Tiefe der Höhle hört ihr ein Geräusch. Klong! Klong! Klong! Jemand schlägt mit einem Hammer auf Stein. Und dazwischen hört ihr eine Stimme kichern."}]}, {"title": "Szene 5 · Der Saal der Piepi", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Der Gang führt in einen riesigen runden Saal. Ganz oben in der Decke ist ein Loch. Silbernes Mondlicht fällt herein.\n\nIn der Mitte liegt ein Stein, so groß wie ein Auto. Er glitzert wie tausend kleine Sterne. Das ist der große Mondstein!\n\nUm ihn herum stehen kleine rosa Pokémon mit runden Ohren. Sie halten sich an den Händen. Sie zittern vor Angst. Denn neben dem Stein stehen zwei Männer mit Spitzhacken. Kalle und Knut!"}, {"k": "read", "title": "Zum Vorlesen: Kalle und Knut", "t": "„Hihi, Kalle, gleich haben wir ihn!“, ruft Knut und holt mit der Spitzhacke aus.\n\n„Moment!“, zischt Kalle. Er dreht sich um und sieht euch. „Nicht ihr schon wieder! Diesmal sind wir besser vorbereitet. Wir haben neue Pokémon!“"}, {"k": "read", "title": "Zum Vorlesen: Die Brüder fliehen", "t": "Kalle schaut auf seine erschöpften Pokémon. Dann auf euch. Dann auf die vielen Piepi, die ihn böse anschauen.\n\n„Rückzug, Knut!“, ruft er. Die beiden lassen die Spitzhacken fallen und rennen aus dem Saal. Knut stolpert dabei über seinen eigenen Mantel. Aus seiner Tasche kullern zwei glitzernde Steine."}, {"k": "read", "title": "Zum Vorlesen: Die Piepi bedanken sich", "t": "Im Saal wird es ganz still. Dann fangen die Piepi an zu hüpfen. Sie klatschen in die Hände und singen ein fröhliches Lied. Pi! Pi! Piepi!\n\nEin kleines Piepi kommt zu euch. Es legt euch ein glitzerndes Steinchen vor die Füße. Ein Mondstein! Es schaut euch mit großen Augen an."}, {"k": "h3", "t": "Belohnung"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Wird ein Mondstein benutzt, lies den Entwicklungstext aus Teil IV vor. Es ist der große Moment dieses Abenteuers.", "Hier endet gut die 2. Spielrunde."]}]}, {"title": "Szene 6 · Route 4 und Azuria City", "items": [{"k": "read", "title": "Zum Vorlesen: Beginn der 3. Spielrunde", "t": "Was bisher geschah: Ihr habt die Piepi beschützt und Kalle und Knut aus dem Mondberg verjagt. Dafür habt ihr Mondsteine geschenkt bekommen.\n\nAm anderen Ende der Höhle wird es endlich wieder hell. Ihr blinzelt in die Sonne. Vor euch geht es einen Hang hinunter. Unten seht ihr eine Stadt mit blauen Dächern. Ein Fluss glitzert zwischen den Häusern. Das ist Azuria City!"}, {"k": "read", "title": "Zum Vorlesen: In der Stadt", "t": "Azuria City ist eine Stadt am Wasser. Überall gibt es kleine Brücken und Brunnen. Das größte Gebäude hat ein Dach in Form einer Welle. Das ist die Arena. Ein Schild hängt an der Tür: „Arenaleiterin Misty. Die Meerjungfrau von Azuria.“"}]}, {"title": "Szene 7 · Die Arena von Azuria", "items": [{"k": "read", "title": "Zum Vorlesen", "t": "Drinnen ist es warm und feucht. In der Mitte der Halle liegt ein riesiges Schwimmbecken. Darin schwimmen kleine Plattformen aus Holz. Es riecht nach Wasser und Sonnencreme.\n\nEin Mädchen mit Badekappe taucht aus dem Becken auf. „Ich bin Ina! Wer gegen Misty kämpfen will, muss erst an mir vorbei!“"}, {"k": "read", "title": "Zum Vorlesen: Misty", "t": "Auf dem Sprungbrett über dem Becken steht ein Mädchen mit orangen Haaren und einem Zopf an der Seite. Sie springt mit einem eleganten Salto herunter und landet direkt vor euch.\n\n„Ich bin Misty! Arenaleiterin von Azuria City. Meine Pokémon sind so wild wie das Meer. Seid ihr bereit, nass zu werden?“"}, {"k": "read", "title": "Zum Vorlesen: Der Kampf beginnt", "t": "Misty schnippt mit den Fingern. „Los, Sterndu!“ Ein Pokémon in Form eines Sterns wirbelt aus dem Ball. In seiner Mitte leuchtet ein roter Edelstein."}, {"k": "read", "title": "Zum Vorlesen: Starmie kommt", "t": "Sterndu ist erschöpft. Misty nickt anerkennend. „Nicht schlecht! Aber jetzt kommt mein Liebling!“\n\nEin lila Pokémon mit zwei Sternen übereinander dreht sich aus dem Ball. Sein Edelstein funkelt in allen Farben. Es ist Starmie! Das Wasser im Becken fängt an zu wirbeln."}, {"k": "read", "title": "Zum Vorlesen: Sieg!", "t": "Starmie dreht sich ein letztes Mal und sinkt dann langsam ins Becken. Misty schaut ganz verdutzt. Dann lacht sie.\n\n„Wow! Ihr seid ja richtig gut! Okay, okay. Den habt ihr euch verdient.“\n\nSie gibt jedem von euch einen kleinen blauen Orden. Er sieht aus wie ein Wassertropfen. Das ist der Quellorden! Ihr legt ihn in euer Kästchen. Jetzt sind schon zwei Plätze voll."}, {"k": "read", "title": "Zum Vorlesen: Falls die Gruppe verliert", "t": "Mistys Pokémon sind zu stark gewesen. Sie reicht euch die Hand. „Ihr wart super! Ich war am Anfang auch nicht besser. Ruht euch aus und kommt wieder!“"}, {"k": "h3", "t": "Ausblick"}, {"k": "read", "title": "Zum Vorlesen: Ende des Abenteuers", "t": "Als ihr aus der Arena kommt, rennt ein Junge auf euch zu. Er ist ganz außer Atem.\n\n„Seid ihr Trainer? Bitte helft! Oben am Kap wohnt Bill, der große Pokémon-Forscher. Er hat einen Hilferuf geschickt. Er schreibt, er hat sich aus Versehen in ein Pokémon verwandelt!“\n\nIhr schaut euch an. Ein Mensch, der zum Pokémon geworden ist? Das klingt nach eurem nächsten Abenteuer!\n\nFortsetzung folgt!"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Hat die Gruppe weder Pflanzen- noch Elektro-Pokémon, nutze den leichten Modus. Ein Pikachu oder Bisaknosp aus Abenteuer 1 macht den Kampf deutlich leichter.", "Ein entwickeltes Knuddeluff oder Nidoking ist für Misty ein guter Gegner, aber kein sicherer Sieg. Genau so soll es sein."]}]}]}, {"title": "Teil IV · Vorlesetexte für jede Situation", "secs": [{"title": "Wilde Pokémon und Unterwegs", "items": [{"k": "h3", "t": "Wildes Pokémon im Gras"}, {"k": "read", "title": null, "t": "Es raschelt im hohen Gras. Etwas kommt näher. Das Gras teilt sich, und ein wildes [Pokémon] springt heraus! Es schaut euch neugierig an."}, {"k": "h3", "t": "Wildes Pokémon im Baum"}, {"k": "read", "title": null, "t": "Über euch knackt ein Ast. Ein paar Blätter fallen herunter. Ihr schaut nach oben. Ein wildes [Pokémon] sitzt im Baum und lässt euch nicht aus den Augen!"}, {"k": "h3", "t": "Wildes Pokémon auf dem Weg"}, {"k": "read", "title": null, "t": "Mitten auf dem Weg sitzt ein wildes [Pokémon]. Es denkt gar nicht daran, Platz zu machen. Es plustert sich auf und will kämpfen!"}, {"k": "h3", "t": "Hindernis: umgestürzter Baum"}, {"k": "read", "title": null, "t": "Ein dicker Baum liegt quer über dem Weg. Der Stamm ist so hoch wie euer Bauch. Klettert ihr drüber? Kriecht ihr drunter durch? Oder sucht ihr einen anderen Weg?"}, {"k": "h3", "t": "Hindernis: Bach"}, {"k": "read", "title": null, "t": "Vor euch plätschert ein Bach. Das Wasser ist klar und kalt. Ein paar flache Steine liegen darin. Wollt ihr von Stein zu Stein hüpfen?"}, {"k": "h3", "t": "Hindernis: Dornenhecke"}, {"k": "read", "title": null, "t": "Eine Hecke voller Dornen versperrt den Weg. Dahinter seht ihr den Pfad weitergehen. Wie kommt ihr hindurch, ohne euch zu pieksen?"}, {"k": "h3", "t": "Etwas Nettes: Beerenstrauch"}, {"k": "read", "title": null, "t": "Am Wegrand steht ein Strauch voller bunter Beeren. Sie leuchten rot und blau. Mmh, die duften lecker! Ihr dürft ein paar pflücken."}, {"k": "h3", "t": "Picknick"}, {"k": "read", "title": null, "t": "Ihr setzt euch ins weiche Gras und packt eure Snacks aus. Eure Pokémon kuscheln sich an euch. Alle essen, trinken und ruhen sich aus. Eure Pokémon fühlen sich gleich viel besser."}]}, {"title": "Im Kampf", "items": [{"k": "h3", "t": "Ein Trainer fordert euch heraus"}, {"k": "read", "title": null, "t": "„He, du da! Unsere Blicke haben sich getroffen. Das heißt: Kampf!“ [Name des Trainers] wirft einen Pokéball. Ein [Pokémon] erscheint!"}, {"k": "h3", "t": "Attacke klappt"}, {"k": "read", "title": null, "t": "„[Pokémon], [Attacke]!“ Dein Pokémon hört genau auf dich. Es springt nach vorne und trifft!"}, {"k": "h3", "t": "Kritischer Erfolg (1)"}, {"k": "read", "title": null, "t": "Wow! Dein [Pokémon] gibt alles! Es ist so schnell, dass man es kaum sehen kann. Das war ein Volltreffer! Doppelter Schaden!"}, {"k": "h3", "t": "Befehl klappt nicht ganz"}, {"k": "read", "title": null, "t": "Dein [Pokémon] zögert einen Moment. Hat es dich nicht richtig gehört? Es greift an, aber nur halb so stark."}, {"k": "h3", "t": "Typ-Vorteil"}, {"k": "read", "title": null, "t": "Volltreffer! Das war sehr effektiv! Der Gegner wackelt richtig. 2 Schaden extra!"}, {"k": "h3", "t": "Kein Effekt"}, {"k": "read", "title": null, "t": "Die Attacke trifft … aber nichts passiert. Der Gegner schaut verdutzt. Das hat überhaupt nicht gewirkt!"}, {"k": "h3", "t": "Schlaf"}, {"k": "read", "title": null, "t": "[Pokémon] fallen die Augen zu. Es gähnt, rollt sich zusammen und schnarcht leise. Zzz …"}, {"k": "h3", "t": "Vergiftet"}, {"k": "read", "title": null, "t": "[Pokémon] wird ganz blass. Ihm ist übel. Das Gift macht ihm zu schaffen."}, {"k": "h3", "t": "Brennt"}, {"k": "read", "title": null, "t": "Autsch! Eine kleine Flamme brennt an [Pokémon]. Es pustet und hüpft herum."}, {"k": "h3", "t": "Gelähmt"}, {"k": "read", "title": null, "t": "Es knistert und zuckt. [Pokémon] kann sich kaum noch bewegen. Seine Beine fühlen sich an wie Pudding."}, {"k": "h3", "t": "Ein Pokémon ist erschöpft"}, {"k": "read", "title": null, "t": "[Pokémon] sinkt zu Boden. Es hat keine Kraft mehr. Es ist erschöpft. Hol es zurück in seinen Ball. Dort kann es sich ausruhen."}, {"k": "h3", "t": "Gewonnen"}, {"k": "read", "title": null, "t": "Das gegnerische [Pokémon] ist erschöpft. Ihr habt gewonnen! Euer Pokémon dreht sich zu euch um und strahlt. Gut gemacht, ihr zwei!"}, {"k": "h3", "t": "Alle Pokémon sind erschöpft"}, {"k": "read", "title": null, "t": "Alle deine Pokémon sind erschöpft. Dir wird ein bisschen schwindelig. Als du die Augen wieder aufmachst, bist du im Pokémon-Center. Schwester Joy lächelt dich an. „Keine Sorge. Deinen Pokémon geht es schon wieder gut.“"}]}, {"title": "Fangen und Flüchten", "items": [{"k": "h3", "t": "Pokéball werfen"}, {"k": "read", "title": null, "t": "Du holst aus und wirfst! Der Pokéball fliegt durch die Luft und trifft. Das wilde [Pokémon] verschwindet in einem roten Lichtstrahl. Der Ball fällt ins Gras. Er wackelt. Einmal … zweimal … dreimal …"}, {"k": "h3", "t": "Gefangen!"}, {"k": "read", "title": null, "t": "Klick! Der Ball hört auf zu wackeln. Du hast ein [Pokémon] gefangen! Es gehört jetzt zu deinem Team."}, {"k": "h3", "t": "Ausgebrochen"}, {"k": "read", "title": null, "t": "Plopp! Der Ball springt auf. Das [Pokémon] ist wieder draußen und schüttelt sich. Fast hättest du es gehabt!"}, {"k": "h3", "t": "Super-Wurf (1)"}, {"k": "read", "title": null, "t": "Was für ein Wurf! Der Ball fliegt in einem perfekten Bogen. Er wackelt nicht einmal. Klick! Sofort gefangen!"}, {"k": "h3", "t": "Patzer beim Werfen (20)"}, {"k": "read", "title": null, "t": "Hoppla! Der Pokéball rutscht dir aus der Hand. Er kullert ins Gebüsch und ist weg. Das wilde [Pokémon] schaut verdutzt."}, {"k": "h3", "t": "Flucht klappt"}, {"k": "read", "title": null, "t": "„Schnell, weg hier!“ Ihr rennt so schnell ihr könnt. Hinter euch wird es leiser. Ihr seid entkommen!"}, {"k": "h3", "t": "Flucht klappt nicht"}, {"k": "read", "title": null, "t": "Ihr wollt wegrennen. Aber das wilde [Pokémon] ist schneller! Es springt euch in den Weg und greift noch einmal an."}]}, {"title": "In der Stadt", "items": [{"k": "h3", "t": "Pokémon-Center"}, {"k": "read", "title": null, "t": "Die Glastür gleitet zur Seite. Drinnen ist es hell und freundlich. Hinter der Theke steht Schwester Joy mit rosa Haaren. „Willkommen im Pokémon-Center! Soll ich mich um eure Pokémon kümmern?“ Sie legt eure Pokébälle in eine Maschine. Es piept fröhlich. Fertig! Eure Pokémon sind wieder ganz gesund."}, {"k": "h3", "t": "Pokémarkt"}, {"k": "read", "title": null, "t": "Über der Tür klingelt eine Glocke. In den Regalen liegen Pokébälle, Tränke und Beeren. Der Verkäufer lächelt. „Willkommen! Was darf es sein?“"}]}, {"title": "Große Momente", "items": [{"k": "h3", "t": "Entwicklung"}, {"k": "read", "title": null, "t": "Moment! Mit [Pokémon] passiert etwas! Es fängt an zu leuchten. Das Licht wird heller und heller. Ihr müsst die Augen zukneifen. [Pokémon] wird größer und größer …\n\nDann wird das Licht schwächer. Vor euch steht ein neues Pokémon. [Pokémon] hat sich zu [neues Pokémon] entwickelt! Es schaut dich an, als wollte es sagen: Wir sind ein starkes Team!"}, {"k": "h3", "t": "Einen Orden bekommen"}, {"k": "read", "title": null, "t": "Der Arenaleiter legt euch einen glänzenden Orden in die Hand. Er ist ein bisschen kühl und ganz schön schwer. Ihr habt ihn euch hart erkämpft. Ihr steckt ihn in euer Kästchen. Ihr fühlt euch ein ganzes Stück stärker!"}, {"k": "h3", "t": "Ende des Spielabends"}, {"k": "read", "title": null, "t": "Für heute ist euer Abenteuer zu Ende. Eure Pokémon kuscheln sich in ihre Bälle. Ihr legt euch schlafen und träumt von den nächsten Abenteuern. Was wohl als Nächstes passiert? Fortsetzung folgt!"}]}]}, {"title": "Teil I · Die Regeln", "secs": [{"title": "1. Was ihr zum Spielen braucht", "items": [{"k": "h3", "t": "Die farbigen Kästen in diesem Heft"}, {"k": "kids", "title": "Den Kindern erklären (vorlesen): Was ist ein Rollenspiel?", "t": "Heute spielen wir ein besonderes Spiel. Ihr seid Pokémon-Trainerinnen und Pokémon-Trainer! Es gibt kein Spielbrett. Die Welt entsteht in unseren Köpfen.\n\nIch erzähle euch, was passiert. Ihr sagt mir, was eure Trainer tun. Wenn etwas schwierig ist, würfeln wir, ob es klappt.\n\nBei diesem Spiel gibt es kein Gewinnen und kein Verlieren. Wir erleben zusammen ein Abenteuer. Ihr seid ein Team und helft euch gegenseitig."}]}, {"title": "2. Trainerinnen und Trainer erschaffen", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Jeder Trainer kann etwas besonders gut. Dafür gibt es vier Zahlen auf eurem Ausweis.\n\n<b>Mut</b> zeigt, wie tapfer ihr seid. <b>Geschick</b> zeigt, wie gut ihr werfen und klettern könnt. <b>Wissen</b> zeigt, wie viel ihr über Pokémon wisst. <b>Charisma</b> zeigt, wie gut euer Pokémon auf euch hört.\n\nIhr bekommt die Zahlen 13, 12, 11 und 10. Die 13 schreibt ihr dahin, wo euer Trainer am besten sein soll."}]}, {"title": "3. Proben: Der W20 entscheidet", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Wenn etwas schiefgehen kann, würfelt ihr mit dem großen Würfel. Er hat 20 Seiten und heißt W20.\n\nSchaut auf die passende Zahl auf eurem Ausweis. Ist euer Wurf <b>gleich oder kleiner</b>, klappt es! Ist er größer, klappt es diesmal nicht. Kleine Zahlen sind also gut!\n\nEine <b>1</b> ist super: Dann klappt es ganz besonders gut. Eine <b>20</b> ist ein Patzer: Dann passiert etwas Lustiges.\n\nIhr dürft euch helfen! Sagt, wie ihr helft, und würfelt. Klappt es, wird es für euren Freund leichter."}, {"k": "h3", "t": "Erleichtert und erschwert"}, {"k": "h3", "t": "Helfen"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Lass die Kinder selbst vorschlagen, welche Eigenschaft passt. „Ich will über den Bach balancieren“ ist GE, „Ich frage den Wanderer nach dem Weg“ ist CH. Bei guten Ideen ruhig +2 geben."]}]}, {"title": "4. Der Kampf", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Im Kampf ist immer abwechselnd jemand dran. Wer zuerst dran ist, steht auf der Karte bei <b>INI</b>. Die höhere Zahl fängt an.\n\nBist du dran, rufst du deinem Pokémon eine Attacke zu. Dann würfelst du mit dem W20 auf Charisma. Klappt es, hört dein Pokémon genau zu. Klappt es nicht, greift es nur halb so stark an.\n\nDanach würfelst du den Schaden mit dem kleinen Würfel, dem W6. Steht bei der Attacke „W6+1“, ist sie besonders stark: Dann zählst du 1 dazu. Die Zahl ziehst du von den <b>KP</b> des Gegners ab. KP sind die Kraftpunkte. Hat ein Pokémon keine KP mehr, ist es erschöpft und muss sich ausruhen.\n\nStatt anzugreifen, kannst du auch einen Trank geben, ein anderes Pokémon rufen, einen Pokéball werfen oder weglaufen."}, {"k": "h3", "t": "Ablauf einer Runde"}, {"k": "h3", "t": "Was die CH-Probe bewirkt"}, {"k": "h3", "t": "Mögliche Aktionen"}, {"k": "h3", "t": "Typ-Vorteil und „Kein Effekt“"}, {"k": "h3", "t": "Status-Attacken und Zusatzeffekte"}, {"k": "h3", "t": "Kampfunfähig"}, {"k": "h3", "t": "Gegner der Spielleitung"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Kampfrunden sollten flott laufen. Lass das Kind den Schaden selbst ausrechnen und laut sagen, wie die Attacke aussieht („Glumanda spuckt eine kleine Flamme!“).", "Wird ein Kampf zu schwer, darf der Gegner ruhig vorsichtiger werden oder flüchten. Wird er zu leicht, kommt ein zweites wildes Pokémon dazu."]}]}, {"title": "5. Typentabelle", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Jedes Pokémon hat einen Typ, zum Beispiel Feuer oder Wasser. Manche Typen sind stark gegen andere. Wasser löscht Feuer. Feuer verbrennt Pflanzen. Pflanzen trinken Wasser.\n\nTrifft eine starke Attacke, gibt es <b>2 Schaden extra</b>. Und manchmal passiert gar nichts: Strom verschwindet einfach im Boden. In der Tabelle könnt ihr nachschauen."}]}, {"title": "6. Wilde Pokémon fangen", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Ein wildes Pokémon könnt ihr mit einem Pokéball fangen. Dafür würfelt ihr auf Geschick.\n\nEin frisches, starkes Pokémon ist schwer zu fangen. Ein müdes Pokémon ist viel leichter. Also: Erst ein bisschen kämpfen, dann werfen!\n\nKlappt es nicht, springt das Pokémon wieder heraus. Der Ball ist dann leider weg. Pokémon von anderen Trainern darf man nicht fangen."}]}, {"title": "7. Reisen durch Kanto", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Zwischen den Städten gibt es Wege. Dort wächst hohes Gras, und darin leben wilde Pokémon. Ich würfle, was euch unterwegs begegnet: vielleicht ein Pokémon, vielleicht ein Hindernis, vielleicht etwas Nettes.\n\nEinmal auf jedem Weg dürft ihr ein Picknick machen. Dann erholen sich eure Pokémon.\n\nWird es zu gefährlich, könnt ihr vor wilden Pokémon weglaufen. Vor anderen Trainern läuft man aber nicht weg. Das ist Trainer-Ehre!"}, {"k": "h3", "t": "Begegnungstabellen Abenteuer 1"}, {"k": "h3", "t": "Begegnungstabellen Abenteuer 2"}, {"k": "h3", "t": "Flucht vor wilden Pokémon"}, {"k": "h3", "t": "Picknick"}]}, {"title": "8. Heilen, Items und Einkaufen", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "In jeder Stadt gibt es ein Pokémon-Center mit rotem Dach. Dort werden eure Pokémon ganz gesund. Das kostet nichts.\n\nIm Pokémarkt könnt ihr mit Pokédollar einkaufen: Pokébälle, Tränke und Beeren. Ein Trank heilt 10 KP. Eine Beere heilt 5 KP oder macht Schlaf, Gift und andere Probleme weg."}, {"k": "h3", "t": "Pokémarkt (Preise in Pokédollar)"}, {"k": "h3", "t": "Besondere Gegenstände"}]}, {"title": "9. Stärker werden", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Wenn ihr einen Arenaleiter besiegt, bekommt ihr einen Orden. Mit jedem Orden werdet ihr stärker: Ihr dürft eine Zahl auf eurem Ausweis um 1 erhöhen. Auch eure Pokémon bekommen mehr KP.\n\nUnd manchmal passiert etwas ganz Besonderes: Ein Pokémon entwickelt sich! Es wird größer und stärker und bekommt eine neue Karte. Wann das passiert, steht unten auf der Karte."}, {"k": "h3", "t": "Orden"}, {"k": "h3", "t": "Entwicklung"}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Eine Entwicklung ist ein großer Moment. Mach eine kleine Show daraus: Licht aus, Taschenlampe an, alle zählen gemeinsam bis drei, dann wird die neue Karte aufgedeckt."]}]}, {"title": "10. Belohnungen", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Nach einem Kampf lohnt es sich, im Gras zu suchen. Vielleicht findet ihr eine Beere oder sogar einen Pokéball. Besiegte Trainer geben euch Pokédollar. Und wer eine richtig gute Idee hat, bekommt von mir manchmal eine Beere geschenkt."}]}, {"title": "11. Mit dem Tablet spielen", "items": [{"k": "kids", "title": "Den Kindern erklären (vorlesen)", "t": "Der Würfel auf dem Tablet ist genauso fair wie ein echter Würfel. Wenn ihr dran seid, tippt ihr selbst. Den Schaden, den euer Pokémon macht, sagt ihr laut der Spielleitung. Wenn euer Pokémon getroffen wird, zieht ihr die KP selbst ab."}, {"k": "tip", "title": "Tipp für die Spielleitung", "t": ["Die Gegner führt weiterhin die Spielleitung, mit Papier oder später mit der Spielleitungs-App fürs Handy.", "Bei „Orden bekommen!“ im Ausweis (Stift-Symbol) gibt die App automatisch 500 Pokédollar, +1 auf eine Eigenschaft und +2 Bonus-KP. Starter entwickeln sich danach direkt.", "Vor jedem Spielabend im Menü (Zahnrad) eine Sicherung speichern. Die Daten liegen nur auf diesem einen Tablet."]}]}]}];
const SP = Object.fromEntries(D.pokemon.map(p => [p.name, p]));
const TC = D.colors;
const TE = {Normal:'⚪',Feuer:'🔥',Wasser:'💧',Pflanze:'🌿',Elektro:'⚡',Flug:'🪶',Käfer:'🐛',Gift:'🧪',Gestein:'🪨',Boden:'⛰️'};
const STATUS = {schlaf:{n:'Schlaf',i:'💤',c:'#5B7FD1'}, gift:{n:'Vergiftet',i:'🧪',c:'#A33EA1'}, brennt:{n:'Brennt',i:'🔥',c:'#E2672A'}, laehmung:{n:'Gelähmt',i:'⚡',c:'#C9A00C'}};
const ORDEN = ['Fels','Quell','Donner','Farb','Seelen','Sumpf','Vulkan','Erd'];
const KEY = 'kanto-spielleitung-v1';
function fresh(){ return {v:1, tab:'kampf', fight:null, log:[], route:'Route 1', sound:true, part:0, rs:19}; }
function load(){ try{ const s = localStorage.getItem(KEY); if(s) return Object.assign(fresh(), JSON.parse(s)); }catch(e){} return null; }
let S = load() || fresh();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % n); }
const pickOne = arr => arr[rnd(arr.length) - 1];
function tint(hex, f = .2){ const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = c => Math.round(255 - (255 - c) * f); return `rgb(${m(r)},${m(g)},${m(b)})`; }
const hpCol = p => p > 50 ? '#4CAF50' : p > 20 ? '#E8B500' : '#D9443A';
const noEff = (at, def) => def.some(t => (D.noeff[at] || []).includes(t));
const hasAdv = (at, def) => def.some(t => (D.adv[at] || []).includes(t));
const dieLbl = a => a.plus === null ? 'Status' : (a.plus ? 'W6+' + a.plus : 'W6');
const typePill = t => `<span class="tp" style="background:${TC[t]}">${TE[t]} ${t}</span>`;
function log(x){ S.log.unshift({t:Date.now(), x}); if(S.log.length > 80) S.log.length = 80; }
let toastT; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
// Absätze der Vorlesetexte aus der Anleitung: einfache Formatierung (b, i, br) erlaubt
const rich = s => esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, '<$1$2>').replace(/&lt;br\/?&gt;/g, '<br>');

/* Ton */
let AC = null;
function sfx(kind){ if(!S.sound) return; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime;
  const tone = (f, st, d, type = 'sine', v = .12) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t0 + st); g.gain.exponentialRampToValueAtTime(.001, t0 + st + d); o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + d + .03); };
  if(kind === 'roll') for(let i = 0; i < 7; i++) tone(160 + Math.random() * 260, i * .09, .05, 'square', .035);
  else if(kind === 'good') [523,659,784].forEach((f,i) => tone(f, i * .1, .2, 'triangle'));
  else if(kind === 'great') [523,659,784,1047].forEach((f,i) => tone(f, i * .08, .25, 'triangle'));
  else if(kind === 'bad') { tone(220, 0, .25, 'sawtooth', .045); tone(160, .16, .3, 'sawtooth', .045); }
}catch(e){} }

/* Würfel */
const PIPS = {1:[[50,50]],2:[[29,29],[71,71]],3:[[27,27],[50,50],[73,73]],4:[[29,29],[71,29],[29,71],[71,71]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[29,25],[71,25],[29,50],[71,50],[29,75],[71,75]]};
function dieSVG(sides, v, col = '#D63A2F'){
  if(sides === 20) return `<svg viewBox="0 0 100 100"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="${col}" stroke="#22313F" stroke-width="3.5" stroke-linejoin="round"/><polygon points="50,18 80,68 20,68" fill="rgba(255,255,255,.2)" stroke="rgba(0,0,0,.22)" stroke-width="2"/><text x="50" y="60" text-anchor="middle" font-size="${v > 9 ? 27 : 31}" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">${v}</text></svg>`;
  return `<svg viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="20" fill="#fff" stroke="#22313F" stroke-width="3.5"/>${PIPS[v].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="9.5" fill="${col}"/>`).join('')}</svg>`;
}
function showRoll(rolls, res, done){
  const ov = $('#dice'); ov.classList.remove('hidden');
  ov.innerHTML = `<div class="dbox" role="dialog" aria-modal="true"><div class="drow">${rolls.map((r,i) => `<div class="dslot"><div class="dwrap" id="dw${i}"></div><div class="dcap">${esc(r.cap || '')}</div></div>`).join('')}</div><div id="dres"></div></div>`;
  const dur = rolls.length && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 0;
  if(rolls.length) sfx('roll');
  const t0 = performance.now(); let last = 0;
  const draw = fin => rolls.forEach((r,i) => { const el = $('#dw' + i); if(!el) return; el.innerHTML = dieSVG(r.sides, fin ? r.val : rnd(r.sides), r.color) + (r.plus ? `<span class="dplus">${esc(r.plus)}</span>` : ''); el.className = 'dwrap ' + (fin ? 'landed' : 'rolling'); });
  function frame(now){ if(now - t0 >= dur){ draw(true); finish(); return; } if(now - last > 75){ draw(false); last = now; } requestAnimationFrame(frame); }
  function finish(){
    const btns = res.buttons || [{t:'Weiter', v:'ok'}];
    $('#dres').innerHTML = `${res.head ? `<div class="dhead ${res.cls || 'info'}">${esc(res.head)}</div>` : ''}${res.big ? `<div class="dbig">${esc(res.big)}</div>` : ''}<div class="dlines">${(res.lines || []).map(l => typeof l === 'string' ? `<p>${esc(l)}</p>` : `<p class="say">${esc(l.say)}</p>`).join('')}</div>${res.math ? `<div class="dmath">${esc(res.math)}</div>` : ''}<div class="dbtns">${btns.map((b,i) => `<button class="btn ${b.cls || (i === btns.length - 1 ? 'red' : 'ghost')}" data-v="${i}">${esc(b.t)}</button>`).join('')}</div>`;
    $('#dres').querySelectorAll('[data-v]').forEach(el => el.onclick = () => { ov.classList.add('hidden'); ov.innerHTML = ''; done && done(btns[+el.dataset.v].v); });
    sfx({good:'good', crit:'great', bad:'bad', patzer:'bad'}[res.cls] || '');
  }
  if(rolls.length) draw(false);
  requestAnimationFrame(frame);
}
const showMsg = (res, done) => showRoll([], res, done);

/* Modal */
let modalView = null;
function openModal(view){ modalView = view; const m = $('#modal'); m.className = 'modal'; m.innerHTML = '<div class="mbox" role="dialog" aria-modal="true"></div>'; m.onclick = e => { if(e.target === m) closeModal(); }; refreshModal(); }
function refreshModal(){ if(!modalView) return; const b = $('#modal .mbox'); if(!b) return; const st = b.scrollTop; b.innerHTML = modalView(); b.scrollTop = st; }
function closeModal(){ modalView = null; const m = $('#modal'); m.className = 'modal hidden'; m.innerHTML = ''; }
const mhead = t => `<div class="mhead"><h1>${t}</h1><button class="xbtn" data-a="close" aria-label="Schließen">×</button></div>`;
function commit(){ save(); render(); refreshModal(); }

/* ---------- Kampf ---------- */
function mkFoe(sp, easy){
  const o = (easy && easy[sp]) || {};
  const max = o.kp || SP[sp].kp;
  return {sp, kp:max, max, status:null, no:o.no || [], fx:{}, once:{}};
}
function startFight(cfg){
  S.fight = {title:cfg.title, kind:cfg.kind, ch:cfg.ch, foes:cfg.mons.map(sp => mkFoe(sp, cfg.easy)), fi:0, reward:cfg.reward || 0, arena:cfg.arena ?? null, note:cfg.note || '', target:[], targetName:'', kid:{}, round:1, zahltag:false};
  log(`Kampf: ${cfg.title}`);
  S.tab = 'kampf'; closeModal(); commit(); window.scrollTo(0, 0);
  const f = S.fight.foes[0];
  showMsg({head:cfg.kind === 'wild' ? 'Ein wildes Pokémon!' : 'Kampf!', cls:'info', lines:[{say: cfg.kind === 'wild' ? pickOne(WILD_TXT).replaceAll('[P]', f.sp) : `„He, du da! Unsere Blicke haben sich getroffen. Das heißt: Kampf!“ ${cfg.title.replace(/ \(.*\)/, '')} wirft einen Pokéball. Ein ${f.sp} erscheint!`}]});
}
const WILD_TXT = ['Es raschelt im hohen Gras. Etwas kommt näher. Das Gras teilt sich, und ein wildes [P] springt heraus! Es schaut euch neugierig an.',
  'Über euch knackt ein Ast. Ein paar Blätter fallen herunter. Ihr schaut nach oben. Ein wildes [P] sitzt im Baum und lässt euch nicht aus den Augen!',
  'Mitten auf dem Weg sitzt ein wildes [P]. Es denkt gar nicht daran, Platz zu machen. Es plustert sich auf und will kämpfen!'];
const curFoe = () => S.fight.foes[S.fight.fi];
const foeAtks = f => SP[f.sp].atk.filter(a => !f.no.includes(a.name));
const foeName = f => S.fight.kind === 'wild' ? 'das wilde ' + f.sp : f.sp;
function catchInfo(f){
  if(f.kp >= f.max) return ['volle KP', -4];
  if(f.kp <= 3) return ['nur noch 1–3 KP', 4];
  if(f.kp <= f.max / 2) return ['höchstens die Hälfte', 0];
  return ['mehr als die Hälfte', -2];
}
function foeAttack(i){
  const b = S.fight, f = curFoe();
  if(f.kp <= 0) return toast(`${f.sp} ist erschöpft.`);
  if(f.status === 'schlaf'){
    showMsg({head:'💤 Zzz …', cls:'info', lines:[{say:`${cap(foeName(f))} schläft tief und fest und setzt diese Runde aus.`}], buttons:[{t:'Aufwachen lassen', v:1}]}, () => { f.status = null; log(`${f.sp} wacht auf.`); commit(); });
    return;
  }
  const list = foeAtks(f);
  let a = i == null ? pickOne(list) : list[i];
  const n = foeName(f), target = b.targetName || 'euer Pokémon', tt = b.target;
  const rolls = [], lines = [], math = [];
  const r20 = rnd(20); rolls.push({sides:20, val:r20, cap:`Befehl · ${b.ch}`, color:'#22313F'});
  if(a.fx && a.fx.metronom){ const r = rnd(6); a = D.metronom[r - 1]; rolls.push({sides:6, val:r, cap:'Metronom', color:'#8E44AD'}); lines.push(`Metronom: ${a.name}!`); }
  const out = r20 === 1 ? 'crit' : r20 === 20 ? 'patzer' : r20 <= b.ch ? 'ok' : 'half';
  let head, cls, big = '';
  if(out === 'patzer'){ head = 'Patzer'; cls = 'patzer'; lines.push({say:`${cap(n)} ${pickOne(['stolpert über die eigenen Füße und plumpst hin.','gähnt ganz laut und schaut einem Schmetterling hinterher.','niest so laut, dass es sich selbst erschreckt.','dreht sich im Kreis und ist ganz verwirrt.'])}`}); lines.push('Kein Schaden.'); }
  else if(a.plus === null){
    if(out === 'half'){ head = 'Klappt nicht'; cls = 'good'; lines.push({say:`${cap(n)} versucht ${a.name} … aber es klappt nicht.`}); }
    else {
      head = a.name + '!'; cls = 'bad'; const x = a.fx || {};
      if(x.st){ lines.push({say:{schlaf:`${cap(target)} fallen die Augen zu. Zzz …`, gift:`${cap(target)} wird ganz blass. Es ist vergiftet!`, laehmung:`Es knistert und zuckt. ${cap(target)} ist gelähmt!`}[x.st]}); lines.push(`Kinder: Zustand „${STATUS[x.st].n}“ setzen.`); }
      if(x.shield){ f.fx.shield = x.shield; lines.push({say:`${cap(n)} macht sich ganz hart.`}); lines.push('Der nächste Treffer gegen den Gegner macht 3 weniger (wird automatisch abgezogen).'); }
      if(x.weaken){ lines.push({say:`${cap(n)} heult laut. ${cap(target)} erschrickt.`}); lines.push('Kinder: Die nächste Attacke ihres Pokémon macht 2 Schaden weniger.'); }
      if(x.expose){ b.kid.expose = x.expose; lines.push({say:`${cap(n)} starrt ${target} an. Es wird ganz unsicher.`}); lines.push('Der nächste Treffer des Gegners macht 2 mehr (wird automatisch addiert).'); }
      if(x.heal){ if(f.once[a.name]){ head = 'Schon benutzt'; cls = 'info'; lines.push('Das geht nur einmal pro Kampf. Würfle eine andere Attacke.'); } else { f.once[a.name] = 1; const h = Math.min(x.heal, f.max - f.kp); f.kp += h; lines.push({say:`${cap(n)} leuchtet sanft und heilt ${h} KP.`}); } }
      if(x.nothing){ head = 'Platsch!'; cls = 'good'; lines.push({say:`${cap(n)} zappelt und platscht. Es passiert … gar nichts!`}); }
    }
  } else {
    const d6 = rnd(6); rolls.push({sides:6, val:d6, cap:'Schaden', color:TC[a.type], plus:a.plus ? '+' + a.plus : ''});
    const ne = tt.length && noEff(a.type, tt), ad = tt.length && !ne && hasAdv(a.type, tt);
    let dmg = d6 + a.plus; math.push(`W6 ${d6}${a.plus ? ' + ' + a.plus : ''}`);
    if(ad){ dmg += 2; math.push('+2 Typ'); }
    if(ne){ dmg = 0; math.push('kein Effekt'); }
    if(out === 'crit' && !ne){ dmg *= 2; math.push('×2'); }
    if(out === 'half' && !ne){ dmg = Math.ceil(dmg / 2); math.push('halbiert'); }
    if(!ne){
      if(f.fx.weak){ dmg -= f.fx.weak; math.push(`−${f.fx.weak} Heuler`); delete f.fx.weak; }
      if(b.kid.shield){ dmg -= b.kid.shield; math.push(`−${b.kid.shield} Härtner`); delete b.kid.shield; }
      if(b.kid.expose){ dmg += b.kid.expose; math.push(`+${b.kid.expose} Silberblick`); delete b.kid.expose; }
    }
    dmg = Math.max(0, dmg);
    head = out === 'crit' ? 'Volltreffer!' : out === 'ok' ? 'Treffer!' : 'Nur halb so stark';
    cls = out === 'half' ? 'good' : 'bad';
    big = `${dmg} Schaden für ${target}`;
    lines.push({say: out === 'crit' ? `${cap(n)} gibt alles! ${a.name} trifft mit voller Wucht!` : out === 'ok' ? `${cap(n)} setzt ${a.name} ein und trifft!` : `${cap(n)} zögert … ${a.name} trifft nur halb so stark.`});
    if(ne) lines.push({say:'Die Attacke trifft … aber nichts passiert. Das hat überhaupt nicht gewirkt!'});
    else if(ad) lines.push({say:'Das war sehr effektiv!'});
    if(!ne && a.fx){
      if(a.fx.on && d6 === a.fx.on){ lines.push(`Zusatzeffekt: Kinder setzen „${STATUS[a.fx.onSt].n}“.`); }
      if(a.fx.drain){ const h = Math.min(a.fx.drain, f.max - f.kp); if(h > 0){ f.kp += h; lines.push(`${f.sp} heilt sich um ${h} KP.`); } }
      if(a.fx.zahltag){ b.zahltag = true; lines.push('Zahltag: Die Münzen bekommen die Kinder nach dem Kampf (1W6 × 10 ₽).'); }
    }
    if(!tt.length) math.push('Ziel-Typ nicht gesetzt');
  }
  log(`${f.sp}: ${a.name} – ${head}${big ? ' · ' + big : ''}`);
  save();
  showRoll(rolls, {head, cls, big, lines, math:math.join(' · ')}, () => commit());
}
function hitFoe(n){
  const b = S.fight, f = curFoe(); let dmg = n; const notes = [];
  if(dmg > 0 && f.fx.shield){ dmg -= f.fx.shield; notes.push(`−${f.fx.shield} Härtner`); delete f.fx.shield; }
  if(dmg > 0 && f.fx.expose){ dmg += f.fx.expose; notes.push(`+${f.fx.expose} Silberblick`); delete f.fx.expose; }
  dmg = Math.max(0, dmg);
  f.kp = Math.max(0, f.kp - dmg);
  log(`${f.sp} bekommt ${dmg} Schaden${notes.length ? ' (' + notes.join(', ') + ')' : ''}.`);
  if(notes.length) toast(`${n} ${notes.join(' ')} = ${dmg} Schaden`);
  if(f.kp === 0){ f.status = null; save(); render(); koFlow(); return; }
  commit();
}
function koFlow(){
  const b = S.fight, f = curFoe(), more = b.fi < b.foes.length - 1;
  showMsg({head:`${f.sp} ist erschöpft!`, cls:'good', lines:[{say:`${cap(foeName(f))} sinkt zu Boden. Es hat keine Kraft mehr.`}, ...(more ? [b.arena != null ? 'Verschnaufpause: Die Kinder dürfen jetzt Items benutzen, ohne dass der Gegner angreift.' : 'Der Gegner schickt sein nächstes Pokémon.'] : [])],
    buttons: more ? [{t:'Nächstes Pokémon', v:'next'}] : [{t:'Sieg!', v:'win', cls:'gold'}]}, v => { if(v === 'next') nextFoe(); else victory(); });
}
function nextFoe(){
  const b = S.fight; b.fi++; const f = curFoe(); log(`Nächstes Pokémon: ${f.sp}`); commit();
  showMsg({head:`${f.sp}!`, cls:'info', lines:[{say: b.arena != null && b.fi === b.foes.length - 1 ? `„Jetzt wird es ernst!“ Ein ${f.sp} kommt aus dem Ball!` : `Der Gegner wirft seinen nächsten Pokéball. Ein ${f.sp} erscheint!`}]});
}
function victory(){
  const b = S.fight, lines = [];
  if(b.kind === 'wild') lines.push('Fundsuche: Ein Kind würfelt im Tablet „Im Gras suchen“ (1W6).');
  if(b.reward) lines.push(`Belohnung: ${b.reward} Pokédollar für die Gruppe.`);
  if(b.zahltag) lines.push('Zahltag: 1W6 × 10 Pokédollar extra.');
  if(b.note) lines.push(b.note);
  if(b.arena != null){ lines.push(`Arenasieg! Im Tablet bei jedem Kind: Stift → „Orden bekommen!“ → ${ORDEN[b.arena]}orden.`); const tm = D.tms[b.arena]; if(tm) lines.push(`TM ${tm.name}: Ein Kind darf sie einem Pokémon beibringen (Pokémon-Blatt → TM lernen).`); }
  lines.push('Siege: Jedes Kinder-Pokémon, das mitgekämpft hat, bekommt +1 Sieg.');
  const rolls = b.zahltag ? (() => { const r = rnd(6); lines.splice(lines.findIndex(l => l.startsWith('Zahltag')), 1, `Zahltag: ${r} × 10 = ${r * 10} Pokédollar extra!`); return [{sides:6, val:r, cap:'Zahltag', color:'#B8921A'}]; })() : [];
  log(`Sieg gegen ${b.title}!`);
  S.fight = null; save();
  showRoll(rolls, {head:'Gewonnen! 🎉', cls:'crit', lines:[{say:'Ihr habt gewonnen! Eure Pokémon drehen sich zu euch um und strahlen. Gut gemacht!'}, ...lines], buttons:[{t:'Fertig', v:1}]}, () => commit());
}
