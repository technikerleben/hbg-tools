<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1640">
<title>Der Zauberstall – Einhorn-Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
/* ===================== Farben ===================== */
:root{
  --night:#1c1640; --night2:#2b2160; --paper:#fffaf3; --ink:#2b2245; --soft:#6f6890;
  --gold:#f5c542; --pink:#ff8fc8; --lila:#a98bff; --mint:#7fe0c6; --sky:#8fc9ff;
  --ok:#2fae6f; --okbg:#e3f8ec; --warn:#ff9f43; --warnbg:#fff1df; --line:#e6def5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);
  font-family:Andika,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
body.no3d #scene{display:none}
body.no3d{background:radial-gradient(circle at 50% 40%,#4a3a8a,#1c1640 70%)}
#no3dArt{display:none}
body.no3d #no3dArt{display:block;position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(40vh,360px);opacity:.9}

/* ===================== HUD ===================== */
#hud{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:linear-gradient(#1c1640ee,#1c164000);z-index:5;color:#fff}
#hud .name{font-family:Fredoka;font-weight:700;font-size:24px;letter-spacing:.3px;white-space:nowrap;
  background:linear-gradient(90deg,#ffb3dc,#d5c4ff,#a8e3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#parts{display:flex;gap:6px;margin-left:10px;padding:4px 8px;background:#ffffff1a;border-radius:30px}
#parts .pi{width:36px;height:36px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;transition:.4s}
#parts .pi svg{width:26px;height:26px;filter:grayscale(1) brightness(1.6);opacity:.35;transition:.4s}
#parts .pi.on{background:#ffffff30;box-shadow:0 0 12px #ffd6f2}
#parts .pi.on svg{filter:none;opacity:1}
#hud .sp{flex:1}
.hb{height:42px;min-width:42px;padding:0 12px;border-radius:21px;background:#ffffff1f;color:#fff;font-family:Fredoka;font-size:16px;
  display:flex;align-items:center;gap:6px}
.hb .ic{font-size:20px}
.hb.off{opacity:.45}
.hb:active{transform:scale(.95)}
@media (max-width:1150px){ .hb .lbl{display:none} #hud .name{font-size:20px} }

/* ===================== Fini (Maskottchen) ===================== */
#kiki{position:fixed;left:14px;bottom:10px;z-index:6;display:flex;align-items:flex-end;gap:6px;pointer-events:none;transition:.4s}
#kiki svg{width:clamp(96px,15vh,150px);height:auto;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 4px 10px #0007);animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
#kiki .bub{max-width:min(40vw,420px);background:var(--paper);border-radius:22px 22px 22px 6px;padding:12px 16px;margin-bottom:clamp(60px,10vh,100px);
  font-size:clamp(17px,2.6vh,22px);line-height:1.35;box-shadow:0 6px 20px #0006;pointer-events:auto;opacity:0;transform:translateY(8px);transition:.3s}
#kiki .bub.show{opacity:1;transform:none}
body.panel #kiki .bub{opacity:0}
body.panel #kiki{transform:scale(.8);transform-origin:left bottom}

/* ===================== Stationsknöpfe ===================== */
#chips{position:fixed;right:14px;bottom:14px;z-index:5;display:flex;gap:10px;transition:.3s}
body.panel #chips{opacity:0;pointer-events:none;transform:translateY(20px)}
body.no3d #chips{right:50%;transform:translateX(50%);bottom:18vh}
.chip{width:clamp(86px,13vh,120px);height:clamp(86px,13vh,120px);border-radius:24px;background:var(--paper);box-shadow:0 6px 18px #0007;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-family:Fredoka;font-weight:600;font-size:clamp(12px,1.7vh,15px);color:var(--ink);
  border:4px solid var(--c)}
.chip .e{font-size:clamp(34px,5.5vh,50px);line-height:1}
.chip:active{transform:scale(.94)}
.chip.done{opacity:.7}
.chip.done::after{content:'✓';position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;
  display:grid;place-items:center;font-size:20px;box-shadow:0 2px 6px #0005}
.chip:not(.done){animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffffff40,0 6px 18px #0007}}

/* ===================== Aufgaben-Panel ===================== */
#panel{position:fixed;right:1.2vw;top:62px;width:min(50vw,660px);max-height:calc(100vh - 72px);z-index:7;background:var(--paper);
  border-radius:28px;box-shadow:0 14px 40px #000a;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
body.no3d #panel{right:50%;transform:translateX(150%)}
body.no3d #panel.open{transform:translateX(50%)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px 8px 18px;background:linear-gradient(90deg,var(--c,#ffd6ea),#fff0)}
.ph .e{font-size:clamp(26px,4vh,36px)}
.ph h2{margin:0;font-family:Fredoka;font-weight:700;font-size:clamp(20px,3vh,28px);flex:1}
.pb{width:clamp(46px,6.5vh,58px);height:clamp(46px,6.5vh,58px);border-radius:50%;background:#fff;box-shadow:0 2px 8px #0002;font-size:clamp(22px,3.3vh,28px);display:grid;place-items:center}
.pb:active{transform:scale(.92)}
.prog{display:flex;gap:8px;justify-content:center;padding:4px 16px 10px}
.prog i{width:clamp(14px,2.2vh,20px);height:clamp(14px,2.2vh,20px);border-radius:50%;background:var(--line);transition:.3s}
.prog i.d{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.prog i.c{background:#fff;border:3px solid var(--gold);transform:scale(1.2)}
#task{padding:0 18px 16px;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px)}
.intro{font-family:Fredoka;font-weight:600;color:var(--soft);font-size:clamp(15px,2.2vh,19px);text-align:center}
.q{display:flex;justify-content:center;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vh,14px)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opts.five{grid-template-columns:repeat(6,1fr)}
.opts.five .opt{grid-column:span 2}
.opts.five .opt:nth-child(4){grid-column:2/span 2}
.opt{background:#fff;border:4px solid var(--line);border-radius:22px;height:clamp(92px,19vh,170px);padding:8px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 var(--line);transition:transform .1s,border-color .2s,background .2s}
.opt svg{height:100%;max-width:100%}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.bad{border-color:#ffc9a3;background:#fff6ef;opacity:.45;animation:shake .4s}
.opt.good{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok)}
.opt.sol{border-color:var(--ok);background:var(--okbg);animation:solp 1s ease-in-out infinite}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes solp{50%{transform:scale(1.06);box-shadow:0 0 0 6px #2fae6f44}}
.msg{display:none;border-radius:18px;padding:10px 14px;font-size:clamp(17px,2.5vh,22px);line-height:1.35;text-align:center}
.msg.show{display:block;background:var(--warnbg);border:3px solid #ffd2a3}
.msg.ok{display:block;background:var(--okbg);border:3px solid #a7e3c3}
.msg b{font-family:Fredoka}

/* Aufgabenbilder */
.obj{height:clamp(120px,27vh,240px);aspect-ratio:1;background:#fff;border-radius:26px;border:4px dashed var(--line);padding:10px;display:grid;place-items:center}
.obj svg{width:100%;height:100%}
.grey *{fill:#f5f2fb!important;stroke:#7d7896!important;stroke-width:2.5px!important}
.sil *{fill:#3a2f63!important;stroke:#3a2f63!important}
.hear{display:flex;align-items:center;gap:18px;background:#f3eeff;border-radius:26px;padding:12px 22px}
.hear svg.f{height:clamp(100px,20vh,170px);width:auto}
.bigspeak{width:clamp(90px,15vh,130px);height:clamp(90px,15vh,130px);border-radius:50%;background:var(--lila);color:#fff;font-size:clamp(44px,7vh,64px);
  box-shadow:0 6px 0 #7b5fd6;animation:pulse 2s infinite}
.bigspeak:active{transform:translateY(4px);box-shadow:0 2px 0 #7b5fd6}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,.8vw,10px);width:100%;background:#f6f1ff;border-radius:24px;padding:12px;position:relative}
.row::before{content:'';position:absolute;left:16px;right:16px;top:50%;height:4px;background:#d8ccf5;border-radius:2px}
.bead{aspect-ratio:1;background:#fff;border-radius:50%;padding:8%;box-shadow:0 2px 6px #0002;position:relative;max-height:13vh;justify-self:center;width:100%}
.bead svg{width:100%;height:100%}
.bead.q{display:grid;place-items:center;border:4px dashed var(--lila);background:#fff;font-family:Fredoka;font-weight:700;color:var(--lila);font-size:clamp(28px,5vh,46px);animation:pulse 1.6s infinite}
.mirror{height:clamp(130px,27vh,240px);aspect-ratio:.82;border-radius:50%;border:clamp(8px,1.4vh,14px) solid var(--gold);
  background:radial-gradient(circle at 35% 30%,#ffffff,#dcecff 60%,#bcd6ff);box-shadow:0 0 0 4px #c99a1a,0 0 24px #ffe7a0;display:flex;align-items:center;justify-content:center}
.mirror svg{width:62%;height:62%}
.shp{overflow:visible}
.pot svg{height:92%}
.fin{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px;text-align:center}
.fin .big{width:clamp(110px,22vh,190px);height:clamp(110px,22vh,190px);border-radius:50%;background:radial-gradient(#fff,#ffe9f7);display:grid;place-items:center;box-shadow:0 0 30px #ffc4e8}
.fin .big svg{width:70%;height:70%}
.fin h3{margin:0;font-family:Fredoka;font-size:clamp(22px,3.4vh,30px)}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:clamp(38px,6vh,56px);height:clamp(38px,6vh,56px)}
.btnBig{background:var(--lila);color:#fff;font-family:Fredoka;font-weight:700;font-size:clamp(20px,3vh,26px);border-radius:40px;padding:14px 30px;
  box-shadow:0 6px 0 #7b5fd6;display:inline-flex;align-items:center;gap:10px}
.btnBig:active{transform:translateY(4px);box-shadow:0 2px 0 #7b5fd6}
.btnBig.pink{background:#ff6fb1;box-shadow:0 6px 0 #d84f91}
.btnBig.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}

/* ===================== Overlays ===================== */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#140f30cc;backdrop-filter:blur(4px)}
.ov.show{display:flex}
.card{background:var(--paper);border-radius:32px;padding:clamp(18px,3.5vh,34px) clamp(20px,3vw,40px);max-width:min(760px,92vw);max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000b;text-align:center}
.card h1{font-family:Fredoka;font-weight:700;margin:4px 0 8px;font-size:clamp(28px,5vh,46px);
  background:linear-gradient(90deg,#ff6fb1,#9b5de5,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{font-size:clamp(17px,2.6vh,22px);line-height:1.45;margin:8px 0}
#start .uni{width:clamp(120px,22vh,200px)}
.field{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0 18px;font-size:15px;color:var(--soft)}
.field input{font:inherit;font-size:22px;padding:10px 18px;border-radius:18px;border:3px solid var(--line);text-align:center;width:min(320px,70vw);user-select:text;-webkit-user-select:text}
.row2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tog{display:inline-flex;align-items:center;gap:8px;font-family:Fredoka;font-size:17px;color:var(--soft);margin-top:12px}
/* Urkunde */
#urk .card{border:10px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#ff8fc8,#a98bff,#8fc9ff,#7fe0c6,#ffd23f) border-box}
.urk-sub{font-family:Fredoka;font-size:clamp(18px,2.8vh,24px)}
.urk-list{display:flex;flex-direction:column;gap:8px;margin:14px auto;max-width:560px;text-align:left}
.urk-list .r{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 14px}
.urk-list .r svg.pic{width:40px;height:40px;flex:none}
.urk-list .r span{flex:1;font-size:clamp(17px,2.5vh,21px)}
.urk-list .stars svg{width:28px;height:28px}
.newcard{display:inline-flex;align-items:center;gap:12px;background:#fff6fb;border:3px dashed var(--pink);border-radius:20px;padding:8px 16px;margin:4px 0 6px}
.newcard svg{width:56px;height:56px}
.urk-date{color:var(--soft);font-size:15px}
/* Sammlung */
.coll{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}
.uc{background:#fff;border:3px solid var(--line);border-radius:20px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:Fredoka;font-weight:600;font-size:15px}
.uc svg{width:100%;max-width:90px;aspect-ratio:1}
.uc.no{opacity:.5}
.uc.no svg{filter:grayscale(1) brightness(.4)}
/* Hochformat */
#rot{z-index:50;background:var(--night);color:#fff;flex-direction:column;gap:16px;font-family:Fredoka;font-size:26px;text-align:center}
#rot .ph2{font-size:80px;animation:rot 2s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}

@media print{
  body{background:#fff!important;overflow:visible}
  body>*:not(#urk){display:none!important}
  #urk{display:flex!important;position:static;background:#fff;backdrop-filter:none}
  #urk .card{box-shadow:none;max-height:none}
  #urk .noprint{display:none!important}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<svg id="no3dArt" viewBox="0 0 100 100"><use href="#uni" style="color:#fff6fb"/></svg>

<div id="hud">
  <div class="name">🦄 Der Zauberstall</div>
  <div id="parts"></div>
  <div class="sp"></div>
  <button class="hb" id="bVoice"><span class="ic">🗣️</span><span class="lbl">Vorlesen</span></button>
  <button class="hb" id="bSound"><span class="ic">🎵</span><span class="lbl">Töne</span></button>
  <button class="hb" id="bFull"><span class="ic">⛶</span><span class="lbl">Vollbild</span></button>
  <button class="hb" id="bColl"><span class="ic">🦄</span><span class="lbl">Sammlung</span></button>
</div>

<div id="kiki"><svg viewBox="0 0 120 100" id="finiSvg"><use href="#dinoKiki"/></svg><div class="bub" id="bub"></div></div>
<div id="chips"></div>

<div id="panel">
  <div class="ph"><span class="e" id="pE"></span><h2 id="pT"></h2>
    <button class="pb" id="bTip" aria-label="Tipp">💡</button>
    <button class="pb" id="bSay" aria-label="Vorlesen">🔊</button>
    <button class="pb" id="bClose" aria-label="Schließen">✕</button>
  </div>
  <div class="prog" id="prog"></div>
  <div id="task"></div>
</div>

<!-- Start -->
<div class="ov show" id="start"><div class="card">
  <svg class="uni" viewBox="0 0 100 100"><use href="#uni" style="color:#fff0fa"/></svg>
  <h1>Der Zauberstall</h1>
  <p id="story">Psst … es ist Nacht im Zauberstall. Das Einhorn <b>Luna</b> hat seine Farben verloren: Mähne, Schweif, Flügel und Horn sind ganz blass.<br>Löse die vier Zauber-Aufgaben. Dann öffnet sich das Regenbogentor!</p>
  <div class="field"><label for="nm">Name für die Urkunde (für Erwachsene)</label><input id="nm" maxlength="24" autocomplete="off"></div>
  <div class="row2">
    <button class="btnBig ghost" id="bStory">🔊 Anhören</button>
    <button class="btnBig pink" id="bStart">▶ Los geht's</button>
  </div>
  <label class="tog"><input type="checkbox" id="cVoice"> Alles automatisch vorlesen</label>
</div></div>

<!-- Urkunde -->
<div class="ov" id="urk"><div class="card">
  <svg viewBox="0 0 100 100" style="width:90px"><use href="#uni" style="color:#fff0fa"/></svg>
  <h1>Zauber-Urkunde</h1>
  <div class="urk-sub" id="urkName"></div>
  <div class="urk-list" id="urkList"></div>
  <div id="urkCard"></div>
  <div class="urk-date" id="urkDate"></div>
  <div class="row2 noprint">
    <button class="btnBig ghost" id="bPrint">🖨️ Drucken</button>
    <button class="btnBig ghost" id="bUrkColl">🦄 Sammlung</button>
    <button class="btnBig pink" id="bAgain">↻ Nochmal</button>
  </div>
</div></div>

<!-- Sammlung -->
<div class="ov" id="coll"><div class="card" style="max-width:min(820px,94vw)">
  <h1>Meine Einhörner</h1>
  <div class="coll" id="collGrid"></div>
  <button class="btnBig" id="bCollClose">✓ Fertig</button>
</div></div>

<div class="ov" id="rot"><div class="ph2">📱</div>Bitte Tablet quer halten</div>

<!-- Wiederverwendbare SVG-Formen -->
<svg width="0" height="0" style="position:absolute">
 <defs>
  <mask id="moonMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="68" cy="36" r="33" fill="#000"/></mask>
  <linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff6fb1"/><stop offset=".33" stop-color="#ffd23f"/><stop offset=".66" stop-color="#7fe0c6"/><stop offset="1" stop-color="#8fa6ff"/></linearGradient>
  <!-- Maskottchen: Fee Fini (viewBox 0 0 120 100) -->
  <g id="dinoKiki">
    <ellipse cx="38" cy="44" rx="22" ry="14" fill="#cfeaff" opacity=".85" transform="rotate(-25 38 44)"/>
    <ellipse cx="82" cy="44" rx="22" ry="14" fill="#cfeaff" opacity=".85" transform="rotate(25 82 44)"/>
    <ellipse cx="42" cy="62" rx="14" ry="9" fill="#e6d6ff" opacity=".85" transform="rotate(-35 42 62)"/>
    <ellipse cx="78" cy="62" rx="14" ry="9" fill="#e6d6ff" opacity=".85" transform="rotate(35 78 62)"/>
    <path d="M60 46 L82 96 L38 96 Z" fill="#ff8fc8"/>
    <path d="M44 90 Q60 84 76 90 L82 96 L38 96Z" fill="#ff6fb1"/>
    <circle cx="60" cy="32" r="18" fill="#ffe1cb"/>
    <path d="M42 30 C40 12 60 6 72 12 C80 16 80 26 78 32 C74 22 66 18 56 20 C50 22 46 26 42 30Z" fill="#9b5de5"/>
    <circle cx="66" cy="10" r="7" fill="#9b5de5"/>
    <circle cx="53" cy="33" r="2.6" fill="#2b2245"/><circle cx="67" cy="33" r="2.6" fill="#2b2245"/>
    <circle cx="49" cy="38" r="3" fill="#ffb0c8"/><circle cx="71" cy="38" r="3" fill="#ffb0c8"/>
    <path d="M55 40 Q60 44 65 40" stroke="#2b2245" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M78 60 L100 36" stroke="#c99a1a" stroke-width="3" stroke-linecap="round"/>
    <polygon points="102,24 105,31 112,32 107,37 108,44 102,40 96,44 97,37 92,32 99,31" fill="#ffd23f" stroke="#e0a800" stroke-width="1.5"/>
  </g>
  <!-- Einhorn-Silhouette für Sammelkarten (Farbe = currentColor) -->
  <g id="uni">
    <path d="M30 94 C25 72 27 55 35 43 C40 35 46 29 53 26 L50 17 L59 24 C63 22 67 22 71 24 C79 28 87 38 91 48 C93 55 90 61 84 61 C78 61 75 57 71 57 C67 61 65 67 65 75 C65 83 67 89 71 94 Z" fill="currentColor" stroke="#2b2245" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M58 24 L76 2 L67 27 Z" fill="#ffd23f" stroke="#c99a1a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M36 42 C27 40 20 47 18 56 C25 53 27 58 22 64 C29 64 31 68 27 75 C34 72 36 77 33 86 C29 72 29 56 36 42Z" fill="url(#rb)" stroke="#2b2245" stroke-width="2" stroke-linejoin="round"/>

function tone(f,d=.15,type='sine',v=.15,t0=0,f2=null){
  if(!store.sound)return;const a=ac();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}

{ /* 2: Muster */
  name:'Perlenkette', e:'📿', c:'#e3d6ff',

  make(){
    const shapes=Object.keys(SH), cols=['rot','gelb','blau','gruen','lila','rosa'];
    const mk=(unit,len,vary)=>{
      const seq=[];for(let k=0;k<len;k++)seq.push(unit[k%unit.length]);
      const ans=unit[len%unit.length];
      const pool=[...new Map(unit.map(e=>[e.s+e.c,e])).values()].filter(e=>e.s+e.c!==ans.s+ans.c);
      let extra;do{extra=vary==='c'?{s:ans.s,c:rnd(cols)}:vary==='s'?{s:rnd(shapes),c:ans.c}:{s:rnd(shapes),c:rnd(cols)}}while(unit.some(e=>e.s+e.c===extra.s+extra.c));
      const opts=shuffle([ans,...pool,extra].slice(0,3));
      return{seq,ans,opts,unit,vary};
    };
    const two=(vary)=>{const s=shuffle(shapes),c=shuffle(cols);
      if(vary==='c')return[{s:s[0],c:c[0]},{s:s[0],c:c[1]}];
      if(vary==='s')return[{s:s[0],c:c[0]},{s:s[1],c:c[0]}];
      return[{s:s[0],c:c[0]},{s:s[1],c:c[1]}]};
    const [A,B]=two('cs');const t1=mk([A,B],5,'cs');
    const [C,D]=two('c');const t2=mk([C,D],5,'c');
    const [E,F]=two('s');const t3=mk(Math.random()<.5?[E,E,F]:[E,F,F],5,'s');
    const s3=shuffle(shapes),c3=shuffle(cols);const t4=mk([{s:s3[0],c:c3[0]},{s:s3[1],c:c3[1]},{s:s3[2],c:c3[2]}],5,'cs');
    return [t1,t2,t3,t4];
  },
  view(it){return{
    q:`<div class="row">${it.seq.map(e=>`<div class="bead">${shapeSVG(e.s,e.c)}</div>`).join('')}<div class="bead q">?</div></div>`,
    cls:'three', say:'Schau dir die Perlenkette an. Was kommt als Nächstes? Tippe auf das richtige Bild.',
    opts:it.opts.map(e=>({v:e.s+'-'+e.c,t:lab(e,it.vary,true),h:shapeSVG(e.s,e.c)}))}},
  right(it){return it.ans.s+'-'+it.ans.c},

      const g=i===3?hornG:partG[i];const s0=g.scale.clone();g.scale.multiplyScalar(.7);anim(g.scale,{x:s0.x,y:s0.y,z:s0.z,duration:.6,ease:'back.out(3)'});
      sparkle(to);res()};
    if(!tg){done();return}
    tg.to(o,{p:1,duration:1.5,ease:'power1.inOut',onUpdate:()=>{orb.position.lerpVectors(from,to,o.p);orb.position.y+=Math.sin(o.p*Math.PI)*2.2;halo.scale.setScalar(1.2+Math.sin(o.p*20)*.2)},onComplete:done});
  });
  function sparkle(at){const n=40,pos=new Float32Array(n*3),vel=[];for(let k=0;k<n;k++){pos.set([at.x,at.y,at.z],k*3);vel.push(V((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*3))}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const p=new THREE.Points(g,new THREE.PointsMaterial({size:.14,color:'#fff3b0',transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(p);
    let t=0;const f=()=>{t+=.016;for(let k=0;k<n;k++){pos[k*3]+=vel[k].x*.016;pos[k*3+1]+=(vel[k].y-t*4)*.016;pos[k*3+2]+=vel[k].z*.016}
      g.attributes.position.needsUpdate=true;p.material.opacity=1-t;if(t<1)requestAnimationFrame(f);else scene.remove(p)};f()}

  W.setDone=i=>{rings[i].material.color.set('#2fae6f');labels[i].material.map=labelTex(i,true);labels[i].material.needsUpdate=true};
  W.finale=sx=>new Promise(async res=>{
    finaleRunning=true;await fly(V(1.5,3.6,6.5),V(0,2.6,-5),1.6);
    hornM.emissive.set('#ffcf40');anim(hornM,{emissiveIntensity:2.2,duration:.8,yoyo:true,repeat:3});sx.magic();
    sparkle(uni.localToWorld(partOrigin[3].clone()));
    await wait(900);sx.roar();
    anim(uni.rotation,{z:.22,duration:.45,yoyo:true,repeat:1,ease:'power2.out'});anim(uni.position,{y:.35,duration:.45,yoyo:true,repeat:1,ease:'power2.out'});
    await wait(1100);
    arc.forEach((a,k)=>setTimeout(()=>{a.material=M(a.userData.col,{emissive:a.userData.col,emissiveIntensity:.9,roughness:.4});sx&&tone(600+k*120,.25,'sine',.06)},k*140));
    await wait(1100);sx.door();
    leaves.forEach(l=>anim(l.piv.rotation,{y:l.sd*1.5,duration:1.6,ease:'power2.inOut'}));
    anim(glowL,{intensity:40,duration:1.6});
    await wait(1800);finaleRunning=false;res();
  });
  W.reset=()=>{parts.forEach(ps=>ps.forEach(m=>{m.material=ghostM;m.castShadow=false}));rings.forEach((r,i)=>r.material.color.set(SCOL[i]));
    labels.forEach((l,i)=>{l.material.map=labelTex(i,false);l.material.needsUpdate=true});
    arc.forEach(a=>a.material=greyArc);leaves.forEach(l=>{tg&&tg.killTweensOf(l.piv.rotation);l.piv.rotation.y=0});glowL.intensity=0;
    hornM.emissiveIntensity=.35;hornM.emissive.set('#8a6000');uni.rotation.z=0;uni.position.y=0};
  W.setCollection=col=>slots.forEach((s,k)=>{s.material=col.includes(k)?M(DINOS[k][2],{emissive:DINOS[k][2],emissiveIntensity:.7,roughness:.2,metalness:.2}):slotGrey});
  W.setCollection(store.col);

  // Antippen & freie Kamera
  const ray=new THREE.Raycaster(),ptr=new Map();let down=null,pinch0=0;
  cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1)down={x:e.clientX,y:e.clientY,moved:0};
    if(ptr.size===2){const [a,b]=[...ptr.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)}});
  cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(down)down.moved+=Math.abs(dx)+Math.abs(dy);if(!free)return;
    if(ptr.size===1){OR.ty=Math.max(-.65,Math.min(.65,OR.ty-dx*.004));OR.tp=Math.max(-.16,Math.min(.28,OR.tp+dy*.003))}
    else if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);OR.td=Math.max(-4,Math.min(4,OR.td+(d-pinch0)*.02));pinch0=d}});
  const up=e=>{const was=ptr.size;ptr.delete(e.pointerId);
    if(was===1&&down&&down.moved<12){const r=cv.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
      const h=ray.intersectObjects(pickables,false)[0];if(h&&W.onPick)W.onPick(h.object.userData.i)}
    if(ptr.size===0)down=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);down=null});
  cv.addEventListener('wheel',e=>{if(!free)return;e.preventDefault();OR.td=Math.max(-4,Math.min(4,OR.td-e.deltaY*.004))},{passive:false});

  // Animationsschleife
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
  addEventListener('resize',resize);resize();
  const clock=new THREE.Clock();
  renderer.setAnimationLoop(()=>{const tm=clock.getElapsedTime();
    if(free&&!flying){OR.cy+=(OR.ty-OR.cy)*.1;OR.cp+=(OR.tp-OR.cp)*.1;OR.cd+=(OR.td-OR.cd)*.1;camera.position.copy(orbitPos(OR.cy,OR.cp,OR.cd));look.copy(HUB.l)}
    camera.lookAt(look);
    for(const f of floaters)f(tm);
    const a=dg.attributes.position.array;for(let k=0;k<N;k++){a[k*3+1]+=.004+(k%5)*.0008;if(a[k*3+1]>8)a[k*3+1]=0}dg.attributes.position.needsUpdate=true;
    renderer.render(scene,camera)});
}
W.onPick=i=>openStation(i);
</script>
