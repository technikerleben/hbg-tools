<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf7ff">
  <title>Kinder-Startseite</title>
  <style>
    :root{
      --bg:#f5fbff;
      --ink:#17324d;
      --muted:#5e7287;
      --card:#ffffff;
      --blue:#3f8fd2;
      --green:#4aa96c;
      --orange:#f2a65a;
      --shadow:0 10px 28px rgba(30,70,100,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#eaf7ff 0%,var(--bg) 42%,#fffaf0 100%);
      color:var(--ink);
      display:flex;
      justify-content:center;
    }
    main{
      width:min(920px,100%);
      padding:32px 18px 40px;
    }
    header{
      text-align:center;
      margin-bottom:28px;
    }
    h1{
      margin:0;
      font-size:clamp(2rem,7vw,3.6rem);
      line-height:1.05;
    }
    header p{
      margin:10px 0 0;
      font-size:clamp(1rem,3vw,1.25rem);
      color:var(--muted);
    }
    .grid{
      display:grid;
      gap:18px;
      grid-template-columns:repeat(3,1fr);
    }
    .card{
      min-height:240px;
      padding:24px 18px;
      border-radius:28px;
      background:var(--card);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:inherit;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:4px solid transparent;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .card:hover,.card:focus-visible{
      transform:translateY(-4px);
      box-shadow:0 14px 34px rgba(30,70,100,.18);
      outline:none;
    }
    .card:active{transform:translateY(0)}
    .icon{
      width:92px;
      height:92px;
      border-radius:26px;
      display:grid;
      place-items:center;
      font-size:3.5rem;
      margin-bottom:16px;
    }
    .card h2{
      margin:0;
      font-size:1.65rem;
    }
    .card p{
      margin:8px 0 0;
      color:var(--muted);
      line-height:1.35;
    }
    .frag{border-color:#b7dafe}
    .frag .icon{background:#e7f3ff}
    .klex{border-color:#bfe6c8}
    .klex .icon{background:#e9f8ed}
    .spiel{border-color:#ffd4a8}
    .spiel .icon{background:#fff0df}

    footer{
      margin-top:28px;
      text-align:center;
      color:var(--muted);
      font-size:.95rem;
    }

    @media (max-width:760px){
      main{padding-top:22px}
      .grid{grid-template-columns:1fr}
      .card{
        min-height:150px;
        flex-direction:row;
        justify-content:flex-start;
        text-align:left;
        gap:18px;
        padding:20px;
      }
      .icon{
        width:76px;
        height:76px;
        min-width:76px;
        margin:0;
        font-size:2.8rem;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .card{transition:none}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Was möchtest du machen?</h1>
      <p>Tippe auf eine Karte und lege los.</p>
    </header>

    <section class="grid" aria-label="Auswahl">
      <a class="card frag" href="https://www.fragfinn.de/" target="_blank" rel="noopener noreferrer">
        <div class="icon" aria-hidden="true">🔎</div>
        <div>
          <h2>FragFINN</h2>
          <p>Suche sicher im Internet.</p>
        </div>
      </a>

      <a class="card klex" href="https://klexikon.zum.de/" target="_blank" rel="noopener noreferrer">
        <div class="icon" aria-hidden="true">📚</div>
        <div>
          <h2>Klexikon</h2>
          <p>Schlage Wissen einfach nach.</p>
        </div>
      </a>

      <a class="card spiel" href="/spiele/zoo1x1.html">
        <div class="icon" aria-hidden="true">🐯</div>
        <div>
          <h2>Zoo-1×1</h2>
          <p>Übe das Einmaleins im Zoo-Spiel.</p>
        </div>
      </a>
    </section>

    <footer>HBG Tools · Kinder-Startseite</footer>
  </main>
</body>
</html>
