<title>Kanto-Abenteuer · Spieltisch</title>
<style>
:root{
  --red:#D63A2F;--red-d:#B42D23;--dark:#22313F;--blue:#2F5D8C;--grey:#6B7480;--line:#DDE2E7;
  --bg:#EEF1F5;--card:#fff;--gold:#B8921A;--green:#4E9A4A;--purple:#8E44AD;
  --good:#2E8B57;--bad:#C0504D;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--dark);font-size:17px;line-height:1.35;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.hidden{display:none!important}

/* Kopfzeile */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));
  background:var(--red);color:#fff;box-shadow:0 3px 0 var(--dark)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;white-space:nowrap}
.logo svg{width:34px;height:34px;flex:none}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}
.tab{min-height:50px;padding:6px 20px;border-radius:16px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;color:#fff;background:rgba(255,255,255,.12)}
.tab.on{background:#fff;color:var(--red)}
.tab .ti{font-size:22px}
.ib{min-width:50px;min-height:50px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.14);color:#fff}
main{padding:20px max(18px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom));max-width:1440px;margin:0 auto}

/* allgemeine Knöpfe */
.btn{min-height:52px;padding:10px 20px;border-radius:16px;font-weight:800;font-size:18px;background:var(--dark);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--dark);border:2px solid var(--line)}
.btn.small{min-height:44px;padding:6px 14px;font-size:16px;border-radius:13px}
.btn:disabled{opacity:.4}
.btn svg{width:28px;height:28px;flex:none}
.chip.swatch.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--dark)}
.btn:active,.tab:active,.attr:active,.mon:active,.abtn:active{transform:scale(.97)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--grey)}
h2.sec{font-size:22px;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:6px;height:26px;border-radius:3px;background:var(--sec,var(--red))}

/* Leerer Zustand */
.empty{max-width:640px;margin:60px auto;text-align:center;background:#fff;border-radius:28px;padding:40px 28px;border:4px solid #fff;box-shadow:0 10px 28px rgba(30,50,70,.1)}
.empty h1{margin:14px 0 6px;font-size:32px}
.empty p{color:var(--grey);font-size:19px;margin:0 0 24px}

/* Trainer-Ausweise */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.tcard{background:#fff;border-radius:22px;border:3px solid var(--tc);overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.05)}
.th{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;background:var(--tc);color:#fff}
.avatar{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--tc);display:grid;place-items:center;font-size:30px;font-weight:900;overflow:hidden;border:3px solid rgba(255,255,255,.75);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;background:#fff}
.tn{flex:1;min-width:0}
.tname{font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:15px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .ib{background:rgba(255,255,255,.2)}
.tlv{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:16px}
.pill.lvl{background:#E5ECF4;color:var(--blue)}
.pill.money{background:#FBF3DC;color:#8A6D12}
.orden{display:flex;gap:5px;padding:6px 14px 2px;flex-wrap:nowrap}
.hex{width:30px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#E4E7EA;display:grid;place-items:center;font-size:12px;font-weight:800;color:#A6ADB4}
.hex.on{background:linear-gradient(160deg,#F5D76E,#B8921A);color:#fff}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 6px}
.attr{border:2.5px solid var(--ac);background:var(--acl);border-radius:16px;padding:6px 10px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;min-height:60px;text-align:left}
.attr .ai{font-size:22px}
.attr .an{font-weight:800;font-size:15px;line-height:1.1}
.attr .an small{display:block;font-weight:600;color:var(--grey);font-size:12px}
.attr .av{font-size:30px;font-weight:900;color:var(--ac)}
.bag{margin:6px 12px;padding:8px 10px;border-radius:14px;background:#F5F7F9;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-height:52px;width:calc(100% - 24px);text-align:left}
.bag span{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:16px}
.bag svg{width:20px;height:20px}
.team{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 12px 12px}
.mon{position:relative;border-radius:15px;border:2.5px solid var(--tc,#ccc);background:var(--tcl,#fff);padding:7px 9px 9px;display:grid;grid-template-columns:42px 1fr;gap:2px 8px;align-items:center;min-height:68px;text-align:left}
.mon .me{grid-row:span 2;width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px;overflow:hidden}
.mon .me img{width:100%;height:100%;object-fit:cover}
.mon .mn{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .mk{font-size:13px;font-weight:700;color:var(--grey);display:flex;align-items:center;gap:4px}
.mon .bar{grid-column:1/-1;height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
.mon .bar i{display:block;height:100%;border-radius:4px}
.mon.ko{filter:grayscale(.9);opacity:.6}
.mon .spark{position:absolute;top:-8px;right:-6px;font-size:20px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.mon.slot{border:2.5px dashed #CDD3D9;background:#fff;color:#B0B7BE;display:flex;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.tfoot{display:flex;gap:8px;padding:0 12px 14px;flex-wrap:wrap}
.tfoot .btn{flex:1}
.tadd{min-height:200px;border-radius:22px;border:3px dashed #C3CAD2;color:var(--grey);font-size:22px;font-weight:800;display:grid;place-items:center;background:rgba(255,255,255,.5)}

/* Pokémon-Karte */
.pcard{--tc:#999;background:#fff;border:5px solid var(--tc);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.pch{display:flex;justify-content:space-between;align-items:flex-start;background:var(--tcl);border-radius:12px;padding:8px 12px}
.pcn{font-size:24px;font-weight:900;line-height:1.1}
.pcn small{display:block;font-size:14px;color:var(--grey);font-weight:700}
.pckp{text-align:right;font-weight:900;font-size:28px;line-height:1}
.pckp small{display:block;font-size:12px}
.pckp span{font-size:16px;color:var(--grey)}
.hp{height:12px;border-radius:6px;background:#E6E9EC;overflow:hidden}
.hp i{display:block;height:100%;border-radius:6px;transition:width .5s}
.pct{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tp{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;color:#fff;font-weight:800;font-size:14px}
.pnr{margin-left:auto;color:var(--grey);font-size:13px}
.pcp{position:relative;height:150px;border:2px dashed #C8CED4;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#FAFBFC}
.pcp img{width:100%;height:100%;object-fit:contain}
.pce{font-size:72px;opacity:.85}
.ini{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;line-height:1}
.ini small{font-size:9px;display:block;text-align:center;margin-bottom:-6px}
.stchip{position:absolute;left:8px;top:8px;padding:5px 11px;border-radius:999px;color:#fff;font-weight:800;font-size:14px}
.drawhint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--grey);background:#fff;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.pca{list-style:none;margin:0;padding:0}
.pca li{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:center;padding:7px 0;border-top:1px solid #E6E9EC}
.pca li:first-child{border-top:0}
.pca .dot{width:13px;height:13px;border-radius:50%}
.pca b{font-size:17px}
.pca b small{font-weight:600;color:var(--grey);font-size:13px;margin-left:5px}
.pca em{font-style:normal;font-weight:900;font-size:18px}
.pca .eff{grid-column:2/-1;font-size:13px;color:#4A5560}
.pcf{font-size:13px;color:var(--grey);border-top:1px solid #E6E9EC;padding-top:6px}
.pcard.small{padding:9px;border-width:4px;gap:6px}
.pcard.small .pcn{font-size:18px}.pcard.small .pckp{font-size:21px}
.pcard.small .pcp{height:84px}.pcard.small .pce{font-size:46px}
.pcard.small .ini{width:36px;height:36px;font-size:15px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,30,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:26px;max-width:1080px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;position:relative;-webkit-overflow-scrolling:touch}
.mbox.narrow{max-width:640px}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mhead h1{font-size:26px;margin:0;flex:1}
.xbtn{width:52px;height:52px;border-radius:50%;background:#EEF1F5;font-size:26px;font-weight:800;flex:none}
.sheet{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:22px;align-items:start}
.panel{background:#F5F7F9;border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:18px}
.kpctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpbig{font-size:40px;font-weight:900;min-width:110px;text-align:center}
.kpbig span{font-size:22px;color:var(--grey)}
.step{min-width:56px;min-height:56px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:6px 16px;border-radius:999px;border:2.5px solid var(--cc,#CDD3D9);background:#fff;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--cc,var(--dark));color:#fff}
.abtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.abtn{position:relative;min-height:74px;border-radius:16px;border:3px solid var(--tc);background:var(--tcl);padding:8px 12px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}
.abtn b{font-size:19px}
.abtn span{font-size:14px;color:#4A5560;font-weight:700}
.abtn em{font-style:normal;font-weight:900;font-size:20px;grid-row:1/3;grid-column:2}
.abtn .badge{position:absolute;top:-10px;right:10px;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800;font-size:14px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}
.field input{min-height:52px;border-radius:14px;border:2px solid var(--line);padding:8px 14px;font-size:20px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.attrpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.attrpick .attr{min-height:96px;grid-template-columns:1fr;text-align:center;justify-items:center}
.attrpick .attr .av{font-size:34px}
.starters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.starters button{border-radius:18px;border:4px solid transparent;padding:0;background:none;text-align:left}
.starters button.on{border-color:var(--dark)}
.starters button:disabled{opacity:.35}
.itemrow{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #E1E5E9}
.itemrow:first-child{border-top:0}
.itemrow .ic{font-size:26px;display:grid;place-items:center}
.itemrow .ic svg{width:30px;height:30px}
.itemrow .nm{font-weight:800}
.itemrow .nm small{display:block;font-weight:600;color:var(--grey);font-size:13px}
.itemrow .ct{font-size:24px;font-weight:900;min-width:36px;text-align:center}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dexgrid>button{text-align:left;border-radius:20px}
.search{min-height:52px;border-radius:16px;border:2px solid var(--line);padding:8px 16px;font-size:19px;flex:1;min-width:200px}

/* Würfel */
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.dicebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dicebtn{min-height:150px;border-radius:22px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:22px}
.dicebtn svg{width:72px;height:72px}
.dicebtn small{font-size:14px;color:var(--grey);font-weight:700}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:18px}
.hist{list-style:none;margin:0;padding:0;max-height:640px;overflow:auto}
.hist li{padding:10px 4px;border-top:1px solid #E6E9EC;display:flex;gap:10px;align-items:baseline}
.hist li:first-child{border-top:0}
.hist time{color:var(--grey);font-size:13px;min-width:44px}
.target{font-size:20px;font-weight:800;margin:10px 0}
.target b{font-size:30px}

/* Würfel-Overlay */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,22,30,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:#fff;border-radius:30px;padding:26px;max-width:720px;width:100%;text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.drow{display:flex;justify-content:center;gap:26px;flex-wrap:wrap}
.dslot{display:flex;flex-direction:column;align-items:center;gap:6px}
.dwrap{width:130px;height:130px;position:relative}
.dwrap svg{width:100%;height:100%}
.dwrap .dplus{position:absolute;right:-22px;bottom:4px;font-size:28px;font-weight:900;color:var(--dark)}
.dcap{font-weight:800;color:var(--grey);font-size:16px}
.rolling{animation:shake .14s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(-4px)}50%{transform:rotate(10deg) translateY(3px)}100%{transform:rotate(-12deg) translateY(-4px)}}
.landed{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.dhead{font-size:34px;font-weight:900;margin:18px 0 6px}
.dhead.good{color:var(--good)}.dhead.bad{color:var(--bad)}.dhead.crit{color:#C98A00}.dhead.patzer{color:var(--purple)}.dhead.info{color:var(--blue)}
.dlines p{font-size:20px;margin:8px 0;line-height:1.4}
.dmath{font-size:15px;color:var(--grey);margin-top:8px}
.dbig{display:inline-block;margin:10px 0 2px;padding:10px 22px;border-radius:18px;background:#FFF2C6;font-size:24px;font-weight:900}
.dbtns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.dbtns .btn{min-width:180px;min-height:60px;font-size:20px}

/* Entwicklung */
.evo{width:220px;height:220px;margin:10px auto;border-radius:50%;display:grid;place-items:center;font-size:110px;background:radial-gradient(circle,#fff 0,var(--tc) 70%);animation:evo 2.6s ease-in-out}
@keyframes evo{0%{filter:brightness(1);transform:scale(1)}20%{filter:brightness(3)}35%{filter:brightness(1);transform:scale(.9)}50%{filter:brightness(4);transform:scale(1.1)}65%{filter:brightness(1.5)}80%{filter:brightness(5);transform:scale(1.15)}100%{filter:brightness(1);transform:scale(1)}}

/* Malen */
.drawwrap{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.drawwrap canvas{width:min(62vh,560px);height:min(62vh,560px);border-radius:18px;border:3px solid var(--line);background:#fff;touch-action:none;display:block}
.palette{display:grid;grid-template-columns:repeat(2,56px);gap:10px}
.palette button{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.palette button.on{box-shadow:0 0 0 4px var(--dark)}
.palette .tool{border-radius:16px;background:#F0F2F5;font-size:24px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--dark);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .sheet{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .tab{padding:6px 12px}
  .logo span{display:none}
}
@media (max-width:700px){
  .tab .tl{display:none}
  .dicebtns{grid-template-columns:1fr 1fr}
  .attrpick,.starters{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

/* ---------- Ton ---------- */
let AC = null;
function sfx(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    const tone = (f, st, d, type = 'sine', v = .14) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t0 + st); g.gain.exponentialRampToValueAtTime(.001, t0 + st + d); o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + d + .03); };
    if(kind === 'roll') for(let i = 0; i < 8; i++) tone(160 + Math.random() * 280, i * .09, .05, 'square', .04);
    else if(kind === 'good') [523,659,784].forEach((f,i) => tone(f, i * .1, .2, 'triangle', .13));
    else if(kind === 'great') [523,659,784,1047,1319].forEach((f,i) => tone(f, i * .08, .25, 'triangle', .13));
    else if(kind === 'bad') { tone(220, 0, .25, 'sawtooth', .05); tone(160, .16, .32, 'sawtooth', .05); }
    else if(kind === 'evo') for(let i = 0; i < 14; i++) tone(330 + i * 45, i * .16, .22, 'sine', .08);
  }catch(e){}
}

/* ---------- Overlay: Würfeln und Ergebnis ---------- */
// rolls: [{sides, val, cap, color, plus}] · res: {head, cls, lines[], math, big, buttons:[{t, v, cls}]}
function showRoll(rolls, res, done){
  const ov = $('#dice'); ov.classList.remove('hidden');
  ov.innerHTML = `<div class="dbox" role="dialog" aria-modal="true"><div class="drow">${rolls.map((r,i) => `<div class="dslot"><div class="dwrap" id="dw${i}"></div><div class="dcap">${esc(r.cap || '')}</div></div>`).join('')}</div><div id="dres"></div></div>`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = rolls.length ? (reduce ? 0 : 900) : 0;
  if(rolls.length) sfx('roll');
  const t0 = performance.now(); let last = 0;
  const draw = fin => rolls.forEach((r,i) => { const el = $('#dw' + i); if(!el) return; el.innerHTML = dieSVG(r.sides, fin ? r.val : rnd(r.sides), r.color) + (r.plus ? `<span class="dplus">${esc(r.plus)}</span>` : ''); el.className = 'dwrap ' + (fin ? 'landed' : 'rolling'); });
  function frame(now){
    if(now - t0 >= dur){ draw(true); finish(); return; }
    if(now - last > 75){ draw(false); last = now; }
    requestAnimationFrame(frame);
  }
  function finish(){
    const btns = res.buttons || [{t:'Weiter', v:'ok'}];
    $('#dres').innerHTML = `${res.head ? `<div class="dhead ${res.cls || 'info'}">${esc(res.head)}</div>` : ''}${res.big ? `<div class="dbig">${esc(res.big)}</div>` : ''}<div class="dlines">${(res.lines || []).map(l => `<p>${esc(l)}</p>`).join('')}</div>${res.math ? `<div class="dmath">${esc(res.math)}</div>` : ''}<div class="dbtns">${btns.map((b,i) => `<button class="btn ${b.cls || (i === btns.length - 1 ? 'red' : 'ghost')}" data-v="${i}">${esc(b.t)}</button>`).join('')}</div>`;
    $('#dres').querySelectorAll('[data-v]').forEach(el => el.onclick = () => { ov.classList.add('hidden'); ov.innerHTML = ''; const b = btns[+el.dataset.v]; done && done(b.v); });
    sfx({good:'good', crit:'great', bad:'bad', patzer:'bad'}[res.cls] || (rolls.length ? 'good' : ''));
    const first = $('#dres .btn.red') || $('#dres .btn'); first && first.focus();
  }
  if(rolls.length) draw(false);
  requestAnimationFrame(frame);
}
const showMsg = (res, done) => showRoll([], res, done);

/* ---------- Entwicklung ---------- */
function evoInfo(m){
  const e = SP[m.sp].evolve; if(!e) return null;
  const o = owner(m.id); const orden = o && o.orden.some(Boolean);
  if(e.upgrade) return m.upgraded ? null : {ok:orden, need:'nach dem 1. Orden', label:'Stärker werden'};
  if(e.orden) return {ok:orden, need:'nach dem 1. Orden', to:e.to};
  if(e.siege) return {ok:(m.siege || 0) >= e.siege, need:`nach ${e.siege} Siegen (${m.siege || 0}/${e.siege})`, to:e.to};
  if(e.stone) return {ok:!!(o && o.items.mondstein > 0), need:'mit einem Mondstein', to:e.to, stone:true};
  return null;
}
function evolve(pid, then){
  const m = S.mons[pid], info = evoInfo(m); if(!info || !info.ok) return;
  const o = owner(pid), before = nm(m), oldSp = m.sp, e = SP[m.sp].evolve;
  if(info.stone) o.items.mondstein--;
  if(e.upgrade){ m.extraKp = e.upgrade.kp; m.extra = [e.upgrade.atk]; m.upgraded = true; }
  else { m.sp = info.to; m.siege = 0; }
  m.kp = maxKP(m); m.status = null;
  log(e.upgrade ? `${before} ist stärker geworden!` : `${before} hat sich zu ${m.sp} entwickelt!`);
  save();
  const ov = $('#dice'); ov.classList.remove('hidden');
  const c1 = TC[SP[oldSp].types[0]];
  ov.innerHTML = `<div class="dbox"><div class="dhead info">Moment …!</div><div class="dlines"><p>Mit ${esc(before)} passiert etwas! Es fängt an zu leuchten. Das Licht wird heller und heller …</p></div><div class="evo" style="--tc:${c1}">${m.pic ? `<img src="${m.pic}" style="width:70%;height:70%;object-fit:contain;border-radius:50%">` : TE[SP[oldSp].types[0]]}</div></div>`;
  sfx('evo');
  setTimeout(() => {
    ov.classList.add('hidden'); ov.innerHTML = '';
    showMsg({head:'✨ Entwicklung! ✨', cls:'crit',
      lines: e.upgrade ? [`${before} wird stärker! Es bekommt 4 KP mehr und lernt Elektroball (Elektro, W6+1).`, 'Wir sind ein starkes Team!']
        : [`${before} hat sich zu ${m.sp} entwickelt!`, `Es schaut dich an, als wollte es sagen: Wir sind ein starkes Team!`, 'Es ist jetzt ganz gesund.'],
      buttons:[{t:'Super!', v:1, cls:'red'}]}, () => { commit(); then && then(); });
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 2700);
}

/* ---------- Angreifen ---------- */
const FUNNY = ['stolpert über die eigenen Füße und plumpst ins Gras.', 'gähnt ganz laut und schaut einem Schmetterling hinterher.', 'jagt plötzlich seinen eigenen Schwanz und dreht sich im Kreis.', 'niest so laut, dass es sich selbst erschreckt.', 'winkt dem Gegner freundlich zu, statt anzugreifen.'];
const ST_TXT = {schlaf:'Dem Gegner fallen die Augen zu. Zzz … (Legt den Zzz-Token auf den Gegner.)', gift:'Der Gegner wird ganz blass. Er ist vergiftet! (Gift-Token auf den Gegner.)', brennt:'Autsch! Eine kleine Flamme brennt am Gegner. (Brennt-Token auf den Gegner.)', laehmung:'Es knistert und zuckt. Der Gegner ist gelähmt! (Lähmungs-Token auf den Gegner.)'};
function attack(i){
  const m = S.mons[curMon], t = owner(curMon), n = nm(m);
  if(m.status === 'schlaf'){
    showMsg({head:'💤 Zzz …', cls:'info', lines:[`${n} schläft tief und fest und setzt diese Runde aus.`, 'Danach wacht es von selbst wieder auf.'], buttons:[{t:'Aufwachen', v:1}]}, () => { m.status = null; log(`${n} wacht wieder auf.`); commit(); });
    return;
  }
  let a = atks(m)[i];
  const rolls = [], lines = [], math = [];
  const r20 = rnd(20), ch = t.ch;
  rolls.push({sides:20, val:r20, cap:`Befehl · CH ${ch}`, color:'#8E44AD'});
  if(a.fx && a.fx.metronom){ const r = rnd(6); a = D.metronom[r - 1]; rolls.push({sides:6, val:r, cap:'Metronom', color:'#8E44AD'}); lines.push(`Metronom! ${n} wedelt mit dem Finger … und setzt ${a.name} ein!`); }
  const out = r20 === 1 ? 'crit' : r20 === 20 ? 'patzer' : r20 <= ch ? 'ok' : 'half';
  const foe = S.foe || [];
  let head, cls, big = '';
  if(out === 'patzer'){ head = 'Patzer! 🙈'; cls = 'patzer'; lines.push(`${n} ${FUNNY[rnd(FUNNY.length) - 1]}`); lines.push('Diesmal gibt es keinen Schaden.'); }
  else if(a.plus === null){
    if(out === 'half'){ head = 'Klappt nicht'; cls = 'bad'; lines.push(`${n} versucht ${a.name} … aber der Gegner lässt sich nicht beeindrucken.`); }
    else {
      head = out === 'crit' ? 'Super! ✨' : 'Geklappt!'; cls = 'good';
      const x = a.fx || {};
      if(x.st) lines.push(ST_TXT[x.st]);
      if(x.shield) lines.push(`${n} macht sich ganz hart. Der nächste Treffer gegen ${n} macht 3 Schaden weniger. (−3-Token auf deine Karte.)`);
      if(x.weaken) lines.push('Der Gegner erschrickt. Seine nächste Attacke macht 2 Schaden weniger. (−2-Token auf den Gegner.)');
      if(x.expose) lines.push('Der Gegner wird unsicher. Der nächste Treffer gegen ihn macht 2 Schaden mehr. (+2-Token auf den Gegner.)');
      if(x.heal){ const h = Math.min(x.heal, maxKP(m) - m.kp); m.kp += h; lines.push(`${n} leuchtet sanft und heilt ${h} KP. Das geht nur einmal pro Kampf!`); }
      if(x.nothing){ head = 'Platsch!'; cls = 'info'; lines.push(`${n} zappelt und platscht. Es passiert … gar nichts!`); }
    }
  } else {
    const d6 = rnd(6); rolls.push({sides:6, val:d6, cap:'Schaden', color:TC[a.type], plus:a.plus ? '+' + a.plus : ''});
    const ne = foe.length && noEff(a.type, foe), ad = foe.length && !ne && hasAdv(a.type, foe);
    let dmg = d6 + a.plus; math.push(`W6: ${d6}${a.plus ? ' + ' + a.plus : ''}`);
    if(ad){ dmg += 2; math.push('+ 2 Typ-Vorteil'); }
    if(ne){ dmg = 0; math.push('kein Effekt'); }
    if(out === 'crit' && !ne){ dmg *= 2; math.push('× 2 Volltreffer'); }
    if(out === 'half' && !ne){ dmg = Math.ceil(dmg / 2); math.push('halbiert'); }
    if(out === 'crit'){ head = 'Volltreffer! ✨'; cls = 'crit'; lines.push(`Wow! ${n} gibt alles! Es ist so schnell, dass man es kaum sehen kann.`); }
    else if(out === 'ok'){ head = 'Treffer!'; cls = 'good'; lines.push(`„${n}, ${a.name}!“ ${n} hört genau auf dich und trifft!`); }
    else { head = 'Nur halb so stark'; cls = 'bad'; lines.push(`${n} zögert einen Moment … und greift nur halb so stark an.`); }
    if(ne) lines.push('Die Attacke trifft … aber nichts passiert. Das hat überhaupt nicht gewirkt!');
    else if(ad) lines.push('Das war sehr effektiv! 2 Schaden extra!');
    big = `${dmg} Schaden`;
    if(!ne && a.fx){
      if(a.fx.on && d6 === a.fx.on) lines.push('Zusatzeffekt! ' + ST_TXT[a.fx.onSt]);
      if(a.fx.drain){ const h = Math.min(a.fx.drain, maxKP(m) - m.kp); if(h > 0){ m.kp += h; lines.push(`${n} heilt sich um ${h} KP.`); } }
      if(a.fx.zahltag) lines.push('Münzen fliegen durch die Luft! Nach dem Kampf: 1W6 × 10 Pokédollar extra.');
    }
    if(!foe.length && dmg > 0) math.push('Tipp: Tippe den Typ des Gegners an, dann rechnet die App den Typ-Vorteil mit.');
  }
  log(`${n}: ${a.name} – ${head}${big ? ' ' + big : ''}`);
  save();
  showRoll(rolls, {head, cls, big, lines, math:math.join(' ')}, () => commit());
}

/* ---------- Proben, Fangen, Flucht ---------- */
function probeResult(r, target){
  if(r === 1) return {head:'Super-Erfolg! ✨', cls:'crit', lines:['Das klappt ganz besonders gut!']};
  if(r === 20) return {head:'Patzer! 🙈', cls:'patzer', lines:['Ein lustiges Missgeschick passiert … Was genau, erzählt die Spielleitung.']};
  if(r <= target) return {head:'Geschafft! 🎉', cls:'good', lines:['Das hat geklappt!']};
  return {head:'Nicht geschafft', cls:'bad', lines:['Diesmal klappt es leider nicht. Die Geschichte geht trotzdem weiter!']};
}
function rollProbe(t, k, mod, help, done){
  const a = AT[k], target = t[k] + mod + (help ? 2 : 0), r = rnd(20);
  const res = probeResult(r, target);
  res.math = `Gewürfelt: ${r} · Ziel: ${target} oder weniger (${a.n} ${t[k]}${mod ? (mod > 0 ? ' +' : ' ') + mod : ''}${help ? ' +2 Hilfe' : ''})`;
  log(`${t.name}: Probe auf ${a.n} (${target}) – ${r} – ${res.head}`);
  save();
  showRoll([{sides:20, val:r, cap:`${a.n} · ${target}`, color:a.c}], res, () => { commit(); done && done(r, target); });
}
let probeModal = null;
function openProbe(tid, k){ probeModal = {t:tid, k, mod:0, help:false}; openModal(probeView, 'narrow'); }
function probeView(){
  const p = probeModal, t = T(p.t), a = AT[p.k], target = t[p.k] + p.mod + (p.help ? 2 : 0);
  return `${mhead(`${a.i} ${a.n}-Probe`)}<p style="font-size:19px;margin-top:0"><b>${esc(t.name)}</b> hat ${a.n} <b>${t[p.k]}</b>.</p>
    <div class="chips">${[[-4,'sehr schwer −4'],[-2,'schwer −2'],[0,'normal'],[2,'leicht +2'],[4,'sehr leicht +4']].map(([v,l]) => `<button class="chip ${p.mod === v ? 'on' : ''}" data-a="pmMod" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="chips" style="margin-top:10px"><button class="chip ${p.help ? 'on' : ''}" style="--cc:var(--green)" data-a="pmHelp">🤝 Jemand hilft (+2)</button></div>
    <div class="target">Würfle <b>${Math.max(1, target)}</b> oder weniger!</div>
    <button class="btn red" style="width:100%;min-height:64px;font-size:22px" data-a="pmRoll">🎲 Würfeln</button>`;
}
let catchM = null;
function openCatch(tid){
  const t = T(tid);
  if(!(t.items.pokeball || t.items.superball)) return toast(`${t.name} hat keine Pokébälle mehr. Im Pokémarkt gibt es neue!`);
  catchM = {t:tid, ball:t.items.pokeball ? 'pokeball' : 'superball', kp:'voll', st:false};
  openModal(catchView, 'narrow');
}
const CATCH_KP = [['voll','volle KP',-4],['mehr','mehr als die Hälfte',-2],['haelfte','höchstens die Hälfte',0],['wenig','nur noch 1–3 KP',4]];
function catchTarget(){ const c = catchM, t = T(c.t); let mod = CATCH_KP.find(x => x[0] === c.kp)[2]; if(c.st) mod += 2; if(c.ball === 'superball') mod += 2; return {t, mod, target:t.ge + mod}; }
function catchView(){
  const c = catchM, {t, target} = catchTarget();
  return `${mhead('Wildes Pokémon fangen')}
    <div class="field"><label>Welcher Ball?</label><div class="chips">${['pokeball','superball'].map(k => `<button class="chip ${c.ball === k ? 'on' : ''}" data-a="cBall" data-k="${k}" ${t.items[k] ? '' : 'disabled'}><span style="width:24px;display:inline-flex">${itemIcon(k)}</span>${k === 'pokeball' ? 'Pokéball' : 'Superball (+2)'} · ${t.items[k]}</button>`).join('')}</div></div>
    <div class="field"><label>Wie geht es dem wilden Pokémon? (Frag die Spielleitung)</label><div class="chips">${CATCH_KP.map(([k,l,v]) => `<button class="chip ${c.kp === k ? 'on' : ''}" data-a="cKp" data-k="${k}">${l} (${v > 0 ? '+' : ''}${v || '±0'})</button>`).join('')}</div></div>
    <div class="chips"><button class="chip ${c.st ? 'on' : ''}" style="--cc:#5B7FD1" data-a="cSt">💤⚡ schläft oder ist gelähmt (+2)</button></div>
    <div class="target">${esc(t.name)} würfelt auf Geschick: <b>${Math.max(1, target)}</b> oder weniger!</div>
    <button class="btn red" style="width:100%;min-height:64px;font-size:22px" data-a="cThrow">${ballSVG().replace('<svg', '<svg width="34" height="34"')} Werfen!</button>`;
}
function throwBall(){
  const c = catchM, {t, target} = catchTarget();
  t.items[c.ball]--;
  const r = rnd(20), caught = r === 1 || (r !== 20 && r <= target);
  closeModal();
  const lines = ['Du holst aus und wirfst! Der Ball fliegt durch die Luft und trifft. Er fällt ins Gras und wackelt. Einmal … zweimal … dreimal …'];
  let res;
  if(r === 1) res = {head:'Super-Wurf! ✨', cls:'crit', lines:['Was für ein Wurf! Der Ball wackelt nicht einmal. Klick! Sofort gefangen!']};
  else if(r === 20) res = {head:'Hoppla! 🙈', cls:'patzer', lines:['Der Pokéball rutscht dir aus der Hand. Er kullert ins Gebüsch und ist weg. Das wilde Pokémon schaut verdutzt.']};
  else if(caught) res = {head:'Gefangen! 🎉', cls:'good', lines:[...lines, 'Klick! Der Ball hört auf zu wackeln. Du hast es gefangen!']};
  else res = {head:'Ausgebrochen!', cls:'bad', lines:[...lines, 'Plopp! Der Ball springt auf. Das Pokémon ist wieder draußen. Fast hättest du es gehabt!']};
  res.math = `Gewürfelt: ${r} · Ziel: ${target} oder weniger`;
  if(caught) res.buttons = [{t:'Welches Pokémon war es?', v:1}];
  log(`${t.name} wirft einen ${c.ball === 'pokeball' ? 'Pokéball' : 'Superball'}: ${r} – ${res.head}`);
  save();
  showRoll([{sides:20, val:r, cap:`Geschick · ${target}`, color:'#4E9A4A'}], res, () => { commit(); if(caught) pickSpecies(t.id, 'catch'); });
}

      ${[5,10,22].map(s => `<button class="tool ${pen.size === s ? 'on' : ''}" data-a="pSize" data-v="${s}" aria-label="Pinsel"><span style="display:inline-block;width:${s}px;height:${s}px;border-radius:50%;background:var(--dark)"></span></button>`).join('')}
      <button class="tool" data-a="pUndo" aria-label="Zurück">↩️</button><button class="tool" data-a="pClear" aria-label="Alles löschen">🗑️</button></div>
      <button class="btn red" style="width:100%;margin-top:14px" data-a="pSave">Fertig</button></div></div>`);
  setupCanvas();
}
function setupCanvas(){
  const cv = $('#cv'); if(!cv) return; const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  const src = pen.kind === 'trainer' ? T(pen.id).pic : S.mons[pen.id].pic;
  if(src){ const im = new Image(); im.onload = () => cx.drawImage(im, 0, 0, cv.width, cv.height); im.src = src; }
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  let down = false, lx = 0, ly = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); down = true; [lx, ly] = pos(e); if(pen.undo.length > 15) pen.undo.shift(); pen.undo.push(cx.getImageData(0, 0, cv.width, cv.height)); cx.strokeStyle = pen.col; cx.lineWidth = pen.size; cx.beginPath(); cx.arc(lx, ly, pen.size / 2, 0, 7); cx.fillStyle = pen.col; cx.fill(); };
  cv.onpointermove = e => { if(!down) return; const [x, y] = pos(e); cx.strokeStyle = pen.col; cx.lineWidth = pen.size; cx.beginPath(); cx.moveTo(lx, ly); cx.lineTo(x, y); cx.stroke(); lx = x; ly = y; };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
}
function saveDrawing(){
  const cv = $('#cv'); const out = document.createElement('canvas'); out.width = out.height = 280;
  out.getContext('2d').drawImage(cv, 0, 0, 280, 280);
  const url = out.toDataURL('image/png');
  if(pen.kind === 'trainer') T(pen.id).pic = url; else S.mons[pen.id].pic = url;
  const back = pen.kind === 'mon' ? pen.id : null;
  closeModal(); commit(); if(back) openMon(back);
}

/* ---------- Menü ---------- */
function menuView(){
  return `${mhead('⚙️ Einstellungen')}
    <div class="panel"><h3>Ton</h3><button class="btn ${S.sound ? 'green' : 'ghost'}" data-a="sound">${S.sound ? '🔊 Ton an' : '🔇 Ton aus'}</button></div>
    <div class="panel"><h3>Sicherung</h3><p class="muted" style="margin-top:0">Alles wird auf diesem Gerät gespeichert. Mach ab und zu eine Sicherung, zum Beispiel vor einem neuen Spielabend.</p>
      <div class="row"><button class="btn blue" data-a="export">💾 Sicherung speichern</button><label class="btn ghost" style="cursor:pointer">📂 Sicherung laden<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
    <div class="panel"><h3>Ganz neu anfangen</h3><button class="btn ghost" data-a="reset">🗑️ Alle Ausweise und Pokémon löschen</button></div>
    <p class="muted">Pokémon Pen &amp; Paper · Spieleransicht · Regelwerk Version ${esc(D.version)}<br>Fan-Projekt für den privaten Spieltisch. Pokémon ist eine Marke von Nintendo, Creatures Inc. und GAME FREAK.</p>`;
}

/* ---------- Aktionen ---------- */
const A = {
  tab: d => { S.tab = d.k; save(); render(); window.scrollTo(0, 0); },
  close: () => closeModal(),
  menu: () => openModal(menuView, 'narrow'),
  sound: () => { S.sound = !S.sound; commit(); },
  export: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `kanto-sicherung-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Sicherung gespeichert.');
  },
  reset: () => confirmBox('Alle Trainer-Ausweise und Pokémon werden gelöscht.', () => confirmBox('Wirklich alles löschen? Das geht nicht rückgängig.', () => { S = fresh(); closeModal(); commit(); toast('Alles gelöscht.'); }, 'Alles löschen'), 'Weiter'),
  newTrainer: () => newTrainer(),
  dTyp: d => { draft.typ = draft.typ === d.k ? '' : d.k; refreshModal(); },
  dCol: d => { draft.color = d.k; refreshModal(); },
  dAttr: d => { if(draft.order.includes(d.k)) draft.order = []; else draft.order.push(d.k); refreshModal(); },
  dReset: () => { draft.order = []; refreshModal(); },
  dStarter: d => { draft.starter = d.k; refreshModal(); },
  dCreate: () => createTrainer(),
  editTrainer: d => editTrainer(d.t),
  eTyp: d => { const t = T(edit); t.typ = t.typ === d.k ? '' : d.k; commit(); },
  eCol: d => { T(edit).color = d.k; commit(); },
  eAttr: d => { const t = T(edit); t[d.k] = Math.max(8, Math.min(17, t[d.k] + +d.v)); commit(); },
  eOrden: d => { const t = T(edit); t.orden[+d.v] = !t.orden[+d.v]; commit(); },
  ordenFlow: () => ordenFlow(edit),
  oSel: d => { ordenM.i = +d.v; refreshModal(); },
  oAttr: d => { ordenM.attr = d.k; refreshModal(); },
  oDone: () => ordenDone(),
  delTrainer: () => { const t = T(edit); confirmBox(`Der Ausweis von ${t.name} und alle seine Pokémon werden gelöscht.`, () => { [...t.team, ...t.box].forEach(p => delete S.mons[p]); S.trainers = S.trainers.filter(x => x !== t); closeModal(); commit(); }, 'Löschen'); },
  drawTrainer: d => openDraw('trainer', d.t),
  drawMon: d => openDraw('mon', d.p),
  pCol: d => { pen.col = d.k; document.querySelectorAll('.palette [data-a=pCol]').forEach(b => b.classList.toggle('on', b.dataset.k === d.k)); },
  pSize: d => { pen.size = +d.v; document.querySelectorAll('.palette [data-a=pSize]').forEach(b => b.classList.toggle('on', +b.dataset.v === pen.size)); },
  pUndo: () => { const cv = $('#cv'); const u = pen.undo.pop(); if(u) cv.getContext('2d').putImageData(u, 0, 0); },
  pClear: () => { const cv = $('#cv'), cx = cv.getContext('2d'); pen.undo.push(cx.getImageData(0, 0, cv.width, cv.height)); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); },
  pSave: () => saveDrawing(),
  probe: d => openProbe(d.t, d.k),
  pmMod: d => { probeModal.mod = +d.v; refreshModal(); },
  pmHelp: () => { probeModal.help = !probeModal.help; refreshModal(); },
  pmRoll: () => { const p = probeModal; closeModal(); rollProbe(T(p.t), p.k, p.mod, p.help); },
  psel: d => { probeSel.t = d.t; render(); },
  pk: d => { probeSel.k = d.k; render(); },
  pmod: d => { probeSel.mod = +d.v; render(); },
  phelp: () => { probeSel.help = !probeSel.help; render(); },
  doProbe: () => { rollProbe(T(probeSel.t), probeSel.k, probeSel.mod, probeSel.help, () => { probeSel.help = false; probeSel.mod = 0; render(); }); },
  free: d => {
    if(d.k === 'w20'){ const r = rnd(20); log(`W20: ${r}`); save(); showRoll([{sides:20, val:r, cap:'W20'}], {head:String(r), cls: r === 1 ? 'crit' : r === 20 ? 'patzer' : 'info', lines: r === 1 ? ['Eine 1 – super!'] : r === 20 ? ['Eine 20 – Patzer!'] : []}, () => commit()); }
    else if(d.k === 'w6'){ const r = rnd(6); log(`W6: ${r}`); save(); showRoll([{sides:6, val:r, cap:'W6', color:'#2F5D8C'}], {head:String(r), cls:'info'}, () => commit()); }
    else if(d.k === 'w61'){ const r = rnd(6); log(`W6+1: ${r}+1 = ${r + 1}`); save(); showRoll([{sides:6, val:r, cap:'W6', color:'#E2872A', plus:'+1'}], {head:`${r} + 1 = ${r + 1}`, cls:'info'}, () => commit()); }
    else { const r = rnd(6); const res = r <= 3 ? {head:'Nichts gefunden', cls:'bad', lines:['Ihr sucht und sucht … aber im Gras ist nur Gras.']} : r <= 5 ? {head:'Eine Beere! 🍓', cls:'good', lines:['Zwischen den Halmen leuchtet eine Beere. Wer steckt sie ein?']} : {head:'Ein toller Fund! ✨', cls:'crit', lines:['Ihr findet einen Pokéball oder einen Trank. Ihr dürft euch eins aussuchen!']};
      log(`Im Gras gesucht: ${r} – ${res.head}`); save(); showRoll([{sides:6, val:r, cap:'Fundsuche', color:'#4E9A4A'}], res, () => commit()); }
  },
  dexType: d => { dexType = d.k; render(); },
  dexCard: d => {
    const sp = d.k;
    openModal(() => `${mhead(esc(sp))}<div class="sheet"><div>${cardHTML({sp})}</div><div>
      <div class="panel"><h3>Wo es lebt</h3><p style="margin:0">${esc(SP[sp].ort)}</p></div>
      ${S.trainers.length ? `<div class="panel"><h3>Ins Team aufnehmen</h3><p class="muted" style="margin-top:0">Nur wenn die Spielleitung es sagt, zum Beispiel wenn sich ein Pokémon euch freiwillig anschließt.</p><div class="row">${S.trainers.map(t => `<button class="btn small ghost" data-a="dexGive" data-t="${t.id}" data-k="${esc(sp)}">🤝 Zu ${esc(t.name)}</button>`).join('')}</div></div>` : ''}
    </div></div>`);
  },
  dexGive: d => { const t = T(d.t); const pid = addMon(t, d.k); log(`${d.k} kommt zu ${t.name}.`); closeModal(); commit(); toast(`${d.k} ist jetzt bei ${t.name}!`); openMon(pid); },
  mon: d => openMon(d.p),
  kp: d => { const m = S.mons[curMon]; m.kp = Math.max(0, Math.min(maxKP(m), m.kp + +d.v)); if(m.kp === 0) m.status = null; commit(); },
  tick: () => { const m = S.mons[curMon]; m.kp = Math.max(0, m.kp - 2); log(`${nm(m)} verliert 2 KP (${STATUS[m.status].n}).`); if(m.kp === 0) m.status = null; commit(); },
  status: d => { const m = S.mons[curMon]; m.status = d.k || null; commit(); },
  foeType: d => { const f = S.foe || []; S.foe = f.includes(d.k) ? f.filter(x => x !== d.k) : [...f, d.k].slice(-2); commit(); },
  foeClear: () => { S.foe = []; commit(); },
  attack: d => attack(+d.i),
  use: d => {
    const m = S.mons[curMon], t = owner(curMon), n = nm(m), max = maxKP(m);
    if(!t.items[d.k]) return;
    let line;
    if(d.k === 'trank'){ const h = Math.min(10, max - m.kp); if(!h) return toast(`${n} hat schon volle KP.`); m.kp += h; line = `${n} trinkt den Trank und heilt ${h} KP.`; }
    else if(d.k === 'beere'){ if(m.status){ line = `${n} knabbert die Beere. ${STATUS[m.status].n} ist weg!`; m.status = null; } else { const h = Math.min(5, max - m.kp); if(!h) return toast(`${n} hat schon volle KP und keinen Zustand.`); m.kp += h; line = `${n} knabbert die Beere und heilt ${h} KP.`; } }
    else { m.kp = Math.ceil(max / 2); m.status = null; line = `${n} öffnet langsam die Augen. Es ist wieder da, mit ${m.kp} KP!`; }
    t.items[d.k]--; log(line); save();
    showMsg({head:'Mmh!', cls:'good', lines:[line, 'Im Kampf kostet das die Runde: Dein Pokémon greift diesmal nicht an.']}, () => commit());
  },
  center: () => confirmBox('Seid ihr im Pokémon-Center? Dann werden alle Pokémon aller Trainer wieder ganz gesund.', () => {
    Object.values(S.mons).forEach(m => { m.kp = maxKP(m); m.status = null; }); log('Pokémon-Center: Alle Pokémon sind wieder gesund.'); save();
    showMsg({head:'🏥 Pokémon-Center', cls:'good', lines:['Schwester Joy legt eure Pokébälle in eine Maschine. Es piept fröhlich. Fertig!', 'Eure Pokémon sind wieder ganz gesund.']}, () => commit());
  }, 'Ja, heilen'),
  evolve: () => evolve(curMon),
  siege: d => { const m = S.mons[curMon]; m.siege = Math.max(0, (m.siege || 0) + +d.v); commit(); },
  bonus: d => { const m = S.mons[curMon]; const nb = Math.max(0, (m.bonus || 0) + +d.v); const diff = nb - (m.bonus || 0); m.bonus = nb; m.kp = Math.max(0, Math.min(maxKP(m), m.kp + diff)); commit(); },
  tm: d => { const m = S.mons[curMon], x = D.tms[+d.v]; confirmBox(`Soll ${nm(m)} die TM ${x.name} lernen? Jedes Pokémon kann nur eine TM lernen.`, () => { m.tm = JSON.parse(JSON.stringify(x)); log(`${nm(m)} lernt ${x.name}.`); commit(); }, 'Lernen'); },
  toBox: () => { const t = owner(curMon); t.team = t.team.filter(p => p !== curMon); t.box.push(curMon); commit(); toast('Ab ins Labor zu Professor Eich!'); },
  toTeam: () => { const t = owner(curMon); if(t.team.length >= 6) return; t.box = t.box.filter(p => p !== curMon); t.team.push(curMon); commit(); },
  give: d => { const from = owner(curMon), to = T(d.t), m = S.mons[curMon]; confirmBox(`${nm(m)} geht von ${from.name} zu ${to.name}.`, () => { from.team = from.team.filter(p => p !== curMon); from.box = from.box.filter(p => p !== curMon); (to.team.length < 6 ? to.team : to.box).push(curMon); log(`${from.name} gibt ${nm(m)} an ${to.name}.`); commit(); }, 'Tauschen'); },
  release: () => { const t = owner(curMon), m = S.mons[curMon]; confirmBox(`${nm(m)} wird freigelassen und läuft zurück in die Wildnis. Tschüss!`, () => { t.team = t.team.filter(p => p !== curMon); t.box = t.box.filter(p => p !== curMon); delete S.mons[curMon]; log(`${t.name} lässt ${nm(m)} frei.`); closeModal(); commit(); }, 'Freilassen'); },
  bag: d => { bagT = d.t; openModal(bagView, 'narrow'); },
  money: d => { const t = T(bagT); t.geld = Math.max(0, t.geld + +d.v); commit(); },
  item: d => { const t = T(bagT); t.items[d.k] = Math.max(0, (t.items[d.k] || 0) + +d.v); commit(); },
  buy: d => { const t = T(bagT), it = ITEMS.find(i => i.k === d.k); if(t.geld < it.p) return; t.geld -= it.p; t.items[d.k] = (t.items[d.k] || 0) + 1; log(`${t.name} kauft: ${it.n}`); commit(); toast(`${it.n} gekauft!`); },
  box: d => { boxT = d.t; openModal(boxView); },
  catch: d => openCatch(d.t),
  cBall: d => { catchM.ball = d.k; refreshModal(); },
  cKp: d => { catchM.kp = d.k; refreshModal(); },
  cSt: () => { catchM.st = !catchM.st; refreshModal(); },
  cThrow: () => throwBall(),
  pkSel: d => { pick.sp = d.k; pick.kp = SP[d.k].kp; refreshModal(); },
  pkBack: () => { pick.sp = null; refreshModal(); },
  pkKp: d => { pick.kp = Math.max(1, Math.min(SP[pick.sp].kp, pick.kp + +d.v)); refreshModal(); },
  pkOk: () => { const t = T(pick.t); const pid = addMon(t, pick.sp, pick.mode === 'catch' ? pick.kp : null); log(`${pick.sp} gehört jetzt zu ${t.name}!`); closeModal(); commit(); openMon(pid); },
  flee: d => { const t = T(d.t); const k = t.mu >= t.ge ? 'mu' : 'ge';
    showMsg({head:'🏃 Weglaufen?', cls:'info', lines:['Vor wilden Pokémon dürft ihr weglaufen. Vor anderen Trainern nicht – das ist Trainer-Ehre!', `Würfle auf Mut (${t.mu}) oder Geschick (${t.ge}). Klappt es nicht, darf das wilde Pokémon noch einmal angreifen.`], buttons:[{t:'Abbrechen', v:''}, {t:`Mut ${t.mu}`, v:'mu', cls:'ghost'}, {t:`Geschick ${t.ge}`, v:'ge', cls:'red'}]},
      v => { if(!v) return; rollProbe(t, v, 0, false); }); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const fn = A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.f && draft){ draft[el.dataset.f] = el.value; const b = $('[data-a=dCreate]'); if(b) b.disabled = !(draft.name.trim() && draft.order.length === 4 && draft.starter); }
  else if(el.dataset.e){ const t = T(edit); t[el.dataset.e] = el.value; save(); render(); }
  else if(el.dataset.m){ S.mons[curMon][el.dataset.m] = el.value.slice(0, 16); save(); render(); }
  else if(el.id === 'dexq'){ dexQ = el.value; $('#dexgrid').innerHTML = dexGrid(); }
  else if(el.id === 'pickq'){ pick.q = el.value; const q = pick.q.trim().toLowerCase(); $('#pickgrid').innerHTML = D.pokemon.filter(p => !q || p.name.toLowerCase().includes(q)).map(p => `<button data-a="pkSel" data-k="${esc(p.name)}">${cardHTML({sp:p.name}, {small:true})}</button>`).join(''); }
});
document.addEventListener('change', e => {
  if(e.target.id !== 'imp') return;
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const o = JSON.parse(rd.result); if(!o || !Array.isArray(o.trainers) || typeof o.mons !== 'object') throw 0; S = Object.assign(fresh(), o); closeModal(); commit(); toast('Sicherung geladen!'); }catch(err){ toast('Diese Datei ist keine Kanto-Sicherung.'); } };
  rd.readAsText(f);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(!$('#dice').classList.contains('hidden')){ const b = $('#dres .btn.red') || $('#dres .btn'); b && b.click(); }
  else if(modalView) closeModal();
});
render();
</script>
