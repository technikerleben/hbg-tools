<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171126" />
  <title>Kristallchroniken</title>
  <style>
    :root {
      --bg-1: #120d21;
      --bg-2: #281b42;
      --panel: rgba(28, 20, 48, 0.91);
      --panel-2: rgba(50, 36, 77, 0.88);
      --gold: #f3cf77;
      --gold-2: #b98a3f;
      --text: #fff8e8;
      --muted: #c9bfd9;
      --danger: #ff8895;
      --good: #83e0ae;
      --cell-gap: clamp(3px, 0.9vw, 5px);
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg-1); color: var(--text); font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; overflow: hidden; touch-action: manipulation; }
    button { font: inherit; }

    .app {
      position: relative;
      width: min(100%, 480px);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(138, 93, 196, .28), transparent 32%),
        radial-gradient(circle at 87% 78%, rgba(41, 156, 159, .18), transparent 34%),
        linear-gradient(160deg, var(--bg-2), var(--bg-1) 64%);
      isolation: isolate;
    }

    .app::before,
    .app::after {
      content: "";
      position: absolute;
      inset: -30%;
      pointer-events: none;
      z-index: -1;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.55) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(243,207,119,.45) 0 1px, transparent 1.5px);
      background-size: 44px 44px, 71px 71px;
      background-position: 8px 14px, 29px 5px;
      opacity: .33;
      animation: drift 24s linear infinite;
      will-change: transform;
    }
    .app::after { opacity: .16; transform: rotate(25deg) scale(1.25); animation-duration: 38s; }
    @keyframes drift { to { transform: translate3d(40px, 55px, 0); } }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      transition: opacity .25s ease, transform .25s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.985); }

    .topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 48px; }
    .icon-btn {
      width: 42px; height: 42px; border: 1px solid rgba(243,207,119,.3); border-radius: 14px;
      color: var(--text); background: rgba(255,255,255,.07); display: grid; place-items: center;
      box-shadow: inset 0 1px rgba(255,255,255,.12); cursor: pointer;
      transition: transform .12s ease;
    }
    .icon-btn:active { transform: scale(.92); }
    .title-wrap { text-align: center; min-width: 0; }
    .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    .title { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(20px, 5.6vw, 27px); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hud {
      display: grid;
      grid-template-columns: 1fr .9fr 1fr;
      gap: 8px;
      margin-top: 5px;
    }
    .hud-card {
      min-width: 0;
      padding: 8px 8px 7px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.05));
      border: 1px solid rgba(243,207,119,.22);
      text-align: center;
      box-shadow: 0 7px 20px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.09);
    }
    .hud-label { color: var(--muted); text-transform: uppercase; font-size: 9px; letter-spacing: .12em; }
    .hud-value { margin-top: 1px; font-weight: 850; font-size: clamp(17px, 5vw, 23px); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .hud-value.bump { animation: hudBump .3s ease; }
    @keyframes hudBump { 40% { transform: scale(1.14); } }

    .progress-shell { position: relative; margin: 8px 2px 9px; height: 11px; border-radius: 999px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.08); overflow: hidden; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #7cd9bd, #f3cf77 70%, #fff0a3); box-shadow: 0 0 15px rgba(243,207,119,.55); transition: width .45s cubic-bezier(.3,.9,.35,1.1); }
    .progress-bar::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 62%);
      background-size: 220% 100%; background-position: 180% 0;
      opacity: 0;
    }
    .progress-shell.surge .progress-bar::after { opacity: 1; animation: barSheen .7s ease; }
    @keyframes barSheen { from { background-position: 180% 0; } to { background-position: -60% 0; } }

    .board-wrap {
      position: relative;
      width: 100%;
      max-height: calc(100dvh - 234px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      aspect-ratio: 1 / 1;
      margin: auto 0;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(124,91,166,.48), rgba(19,13,31,.9));
      border: 1px solid rgba(243,207,119,.37);
      box-shadow: 0 18px 38px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.15), 0 0 25px rgba(104,71,150,.2);
    }
    .board-wrap::before { content:""; position:absolute; inset:4px; border:1px solid rgba(255,255,255,.06); border-radius:18px; pointer-events:none; }
    .board {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: var(--cell-gap);
      user-select: none;
      touch-action: none;
    }
    .cell {
      position: relative;
      min-width: 0; min-height: 0;
      display: grid; place-items: center;
      border-radius: 10px;
      background: rgba(8, 6, 16, .28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.035);
      overflow: hidden;
    }
    .cell:nth-child(16n+1), .cell:nth-child(16n+3), .cell:nth-child(16n+5), .cell:nth-child(16n+7),
    .cell:nth-child(16n+10), .cell:nth-child(16n+12), .cell:nth-child(16n+14), .cell:nth-child(16n+16) { background: rgba(255,255,255,.035); }
    .cell.selected { box-shadow: inset 0 0 0 3px var(--gold), 0 0 12px rgba(243,207,119,.7); z-index: 4; }
    .cell.selected .gem { animation: selectedBob 1s ease-in-out infinite alternate; }
    @keyframes selectedBob { from { transform: scale(1); } to { transform: scale(1.09) translateY(-2%); } }
    .cell.hint .gem { animation: hintPulse .75s ease-in-out infinite alternate; }
    .cell.invalid { animation: nudge .22s ease 2; }
    .cell.void { background: rgba(0,0,0,.58); box-shadow: inset 0 0 13px rgba(0,0,0,.8); }
    .cell.void::after { content:""; width: 60%; height: 60%; border-radius: 50%; border: 1px solid rgba(138,114,173,.18); box-shadow: 0 0 12px rgba(54,32,83,.55); }

    @keyframes nudge { 50% { transform: translateX(4px); } }
    @keyframes hintPulse { from { transform: scale(.94); filter: brightness(1); } to { transform: scale(1.1); filter: brightness(1.35) drop-shadow(0 0 7px currentColor); } }

    .gem {
      --gem-main: #fff;
      --gem-light: #fff;
      --gem-dark: #777;
      position: relative;
      width: 82%; height: 82%;
      display: grid; place-items: center;
      color: var(--gem-main);
      filter: drop-shadow(0 4px 4px rgba(0,0,0,.42));
      transform-origin: center;
      cursor: pointer;
      will-change: transform;
    }
    .gem > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .gem .sheen {
      position: absolute; inset: 6% 10%;
      clip-path: inherit;
      pointer-events: none;
      opacity: 0;
    }
    .gem.twinkle > svg .spark-dot { animation: twinkle .8s ease; }
    @keyframes twinkle { 30% { opacity: 1; transform: scale(2.1); } 100% { opacity: .85; transform: scale(1); } }
    .gem.ruby { --gem-main:#e0446f; --gem-light:#ff92aa; --gem-dark:#861c43; }
    .gem.sapphire { --gem-main:#3b82f0; --gem-light:#8fd0ff; --gem-dark:#17409e; }
    .gem.emerald { --gem-main:#2bc487; --gem-light:#9af3c9; --gem-dark:#126845; }
    .gem.amethyst { --gem-main:#a05df0; --gem-light:#d9a8ff; --gem-dark:#542491; }
    .gem.topaz { --gem-main:#f5ad3d; --gem-light:#ffe39a; --gem-dark:#a35a15; }
    .gem.moon { --gem-main:#e7edf9; --gem-light:#ffffff; --gem-dark:#8897ba; }

    /* Spielfeld-Effektschicht: Scherben, Funken, Strahlen, Schockwellen */
    .fx-layer { position:absolute; inset:8px; z-index:11; pointer-events:none; overflow:hidden; border-radius:16px; }
    .spark { position:absolute; width:6px; height:6px; border-radius:2px; background:currentColor; box-shadow:0 0 8px currentColor; transform:translate(-50%,-50%) rotate(45deg); will-change: transform, opacity; }
    .shard { position:absolute; width:11px; height:11px; background: linear-gradient(150deg, #fff 0%, currentColor 45%, rgba(0,0,0,.55) 130%); clip-path: polygon(50% 0, 100% 74%, 12% 100%); transform: translate(-50%,-50%); filter: drop-shadow(0 0 4px currentColor); will-change: transform, opacity; }
    .glowring { position:absolute; border-radius:50%; border:3px solid #fff6cf; box-shadow:0 0 18px rgba(243,207,119,.85), inset 0 0 12px rgba(255,244,190,.7); transform:translate(-50%,-50%) scale(.15); opacity:0; will-change: transform, opacity; }
    .beam { position:absolute; border-radius:999px; background:linear-gradient(90deg, transparent, #fff9d0 18%, #ffffff 50%, #fff9d0 82%, transparent); box-shadow:0 0 16px rgba(255,248,205,.9), 0 0 34px rgba(243,207,119,.6); opacity:0; will-change: transform, opacity; }
    .beam.v { background:linear-gradient(180deg, transparent, #fff9d0 18%, #ffffff 50%, #fff9d0 82%, transparent); }
    .boardflash { position:absolute; inset:0; background:radial-gradient(circle, rgba(255,255,255,.95), rgba(243,207,119,.35) 60%, transparent 78%); opacity:0; will-change: opacity; }
    .cellflash { position:absolute; inset:-8%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 68%); opacity:0; pointer-events:none; will-change: transform, opacity; }

    .turn-score {
      position:absolute; z-index:13; left:50%; top:58%; transform:translate(-50%,-50%) scale(.7);
      font:900 clamp(21px,7vw,31px)/1 Georgia,serif; color:#fff9d3; text-shadow:0 2px 0 #72501f, 0 0 12px #f3cf77;
      opacity:0; pointer-events:none; white-space:nowrap;
    }
    .turn-score.show { animation:scoreRise .85s ease forwards; }
    @keyframes scoreRise { 0%{opacity:0;transform:translate(-50%,-35%) scale(.65)} 22%{opacity:1;transform:translate(-50%,-55%) scale(1.08)} 100%{opacity:0;transform:translate(-50%,-115%) scale(.95)} }

    /* CSS-Fallback-Animationen: aktiv nur, wenn GSAP nicht geladen werden konnte */
    .gsap-ready .burst .gem, .gsap-ready .burst .rock, .gsap-ready .falling .gem, .gsap-ready .spawn-special .gem { animation:none; }

    .special-mark { position: absolute; z-index: 2; left: 21%; top: 21%; width: 58%; height: 58%; pointer-events: none; }
    .special-line-h::before, .special-line-v::before {
      content:""; position:absolute; inset: 42% -20%; border-radius: 999px;
      background: #fff9c7; box-shadow: 0 0 8px #fff, 0 0 14px var(--gold);
      animation: markPulse 1.4s ease-in-out infinite alternate;
    }
    .special-line-v::before { transform: rotate(90deg); }
    .special-bomb { border: 3px solid #fff8cf; border-radius: 50%; box-shadow: 0 0 8px #fff, inset 0 0 7px #fff; animation: markPulse 1.4s ease-in-out infinite alternate; }
    .special-bomb::before, .special-bomb::after { content:""; position:absolute; inset: 45% -16%; background:#fff8cf; border-radius:999px; box-shadow:0 0 5px #fff; }
    .special-bomb::after { transform: rotate(90deg); }
    @keyframes markPulse { from { filter: brightness(.92); } to { filter: brightness(1.35) drop-shadow(0 0 4px #fff); } }
    .gem.color {
      width: 84%; height: 84%;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.55)) drop-shadow(0 5px 4px rgba(0,0,0,.45));
    }
    .gem.color::before {
      content:""; position:absolute; inset:0;
      clip-path: polygon(50% 0, 82% 11%, 100% 40%, 91% 75%, 62% 100%, 29% 94%, 5% 68%, 0 34%, 22% 8%);
      background: conic-gradient(#ff5d7c, #ffcf55, #68e3a1, #61b7ff, #b87cff, #ff5d7c);
      border: 2px solid rgba(255,255,255,.9);
      animation: hueSpin 3.5s linear infinite;
    }
    .gem.color::after { content:""; position:absolute; left:34.5%; top:34.5%; width: 31%; height:31%; border-radius:50%; background:#fff; box-shadow:0 0 12px #fff; animation: corePulse 1.6s ease-in-out infinite alternate; }
    @keyframes hueSpin { to { filter: hue-rotate(360deg); } }
    @keyframes corePulse { from { transform: scale(.9); } to { transform: scale(1.12); box-shadow: 0 0 18px #fff, 0 0 30px rgba(255,255,255,.6); } }

    .cell.chain::before {
      content:""; position:absolute; inset:4px; z-index:7; pointer-events:none;
      border: 3px dashed rgba(221,225,235,.8); border-radius: 11px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); transform: rotate(-5deg);
    }
    .cell.ice::after {
      content:""; position:absolute; inset:1px; z-index:6; pointer-events:none; border-radius:10px;
      background:
        linear-gradient(32deg, transparent 44%, rgba(255,255,255,.75) 45% 48%, transparent 49%),
        linear-gradient(118deg, transparent 52%, rgba(210,244,255,.7) 53% 55%, transparent 56%),
        rgba(159,224,255,.16);
      border: 2px solid rgba(191,237,255,.66);
      box-shadow: inset 0 0 10px rgba(214,246,255,.42);
    }
    .cell.ice-2::after { border-width:4px; background-color: rgba(134,211,250,.28); }

    .rock {
      width: 84%; height: 79%; position:relative;
      clip-path: polygon(20% 5%, 75% 0, 98% 32%, 90% 79%, 61% 100%, 15% 88%, 0 42%);
      background:
        linear-gradient(140deg, rgba(255,255,255,.22), transparent 27%),
        linear-gradient(155deg, #756c82, #383242 65%, #26212f);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.11), 0 6px 5px rgba(0,0,0,.35);
    }
    .rock.hp2::after { content:""; position:absolute; inset:8% 15%; background:linear-gradient(110deg, transparent 45%, rgba(20,16,25,.8) 47% 52%, transparent 54%); transform:rotate(15deg); }

    .burst .gem { animation: burst .25s ease forwards; }
    .burst .rock { animation: rockHit .25s ease; }
    .falling .gem { animation: fallIn .3s cubic-bezier(.3,.7,.35,1.1); }
    .spawn-special .gem { animation: specialBorn .42s ease; }
    @keyframes burst { 35% { transform:scale(1.18) rotate(7deg); filter:brightness(1.7) drop-shadow(0 0 10px currentColor); } 100% { transform:scale(.1) rotate(25deg); opacity:0; } }
    @keyframes rockHit { 50% { transform: scale(1.07) rotate(-3deg); filter:brightness(1.5); } }
    @keyframes fallIn { from { transform:translateY(var(--fall, -60%)) scale(.94); opacity:.4; } to { transform:none; opacity:1; } }
    @keyframes specialBorn { 0% { transform:scale(.25) rotate(-90deg); } 70% { transform:scale(1.25) rotate(8deg); } 100% { transform:none; } }

    .controls { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:9px; }
    .control-btn {
      min-height: 47px; border: 1px solid rgba(243,207,119,.25); border-radius: 15px;
      color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.045));
      display:flex; align-items:center; justify-content:center; gap:7px; font-weight:750; font-size:13px; cursor:pointer;
      box-shadow: inset 0 1px rgba(255,255,255,.1);
      transition: transform .12s ease;
    }
    .control-btn:active { transform: scale(.96); }
    .control-btn:disabled { opacity:.4; cursor:not-allowed; }

    .home {
      overflow-y: auto;
      scrollbar-width: none;
      padding-left: 18px; padding-right: 18px;
    }
    .home::-webkit-scrollbar { display:none; }
    .brand { text-align:center; padding-top: max(28px, 4vh); }
    .brand-gem { width:88px; height:88px; margin:0 auto 10px; animation: brandFloat 4.5s ease-in-out infinite alternate; }
    @keyframes brandFloat { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-8px) rotate(2deg); } }
    .brand h1 { margin:0; font:700 clamp(34px, 9vw, 48px)/.95 Georgia, serif; letter-spacing:-.03em; }
    .brand p { color:var(--muted); margin:9px auto 20px; max-width:330px; font-size:14px; }
    .main-actions { display:grid; gap:10px; }
    .primary, .secondary {
      border:0; border-radius:17px; min-height:56px; padding:12px 18px; font-weight:850; cursor:pointer;
      transition: transform .12s ease;
    }
    .primary { color:#2b1b0b; background:linear-gradient(180deg, #ffe6a0, var(--gold)); box-shadow:0 8px 20px rgba(243,207,119,.25), inset 0 1px #fff8d4; }
    .secondary { color:var(--text); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); }
    .primary:active, .secondary:active { transform:scale(.975); }
    .section-title { margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; }
    .section-title h2 { margin:0; font:700 20px Georgia,serif; }
    .section-title span { color:var(--muted); font-size:12px; }
    .levels { display:grid; grid-template-columns:repeat(5,1fr); gap:9px; padding-bottom:22px; }
    .level-btn {
      position:relative; aspect-ratio:1; border-radius:15px; border:1px solid rgba(243,207,119,.26);
      background:rgba(255,255,255,.07); color:var(--text); font-weight:850; cursor:pointer;
      display:grid; place-items:center; box-shadow:inset 0 1px rgba(255,255,255,.1);
      transition: transform .12s ease;
    }
    .level-btn:not(.locked):active { transform: scale(.93); }
    .level-btn.locked { opacity:.36; filter:grayscale(.7); cursor:not-allowed; }
    .level-btn.completed { background:linear-gradient(145deg, rgba(243,207,119,.28), rgba(255,255,255,.06)); }
    .level-stars { position:absolute; left:3px; right:3px; bottom:2px; display:flex; justify-content:center; gap:1px; font-size:8px; color:var(--gold); }

    .modal-backdrop {
      position:absolute; inset:0; z-index:20; display:grid; place-items:center; padding:18px;
      background:rgba(6,4,12,.72); backdrop-filter:blur(8px); opacity:1; transition:opacity .2s ease;
    }
    .modal-backdrop.hidden { opacity:0; pointer-events:none; }
    .modal {
      width:min(100%, 400px); max-height:88dvh; overflow:auto;
      border-radius:24px; padding:22px;
      background:linear-gradient(155deg, rgba(61,43,88,.98), rgba(25,17,42,.98));
      border:1px solid rgba(243,207,119,.35); box-shadow:0 25px 60px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.13);
      transform:translateY(0) scale(1); transition:transform .26s cubic-bezier(.3,1.35,.5,1);
    }
    .modal-backdrop.hidden .modal { transform:translateY(14px) scale(.97); }
    .modal h2 { margin:0 0 8px; font:700 28px Georgia,serif; text-align:center; }
    .modal p { color:var(--muted); text-align:center; margin:0 0 18px; line-height:1.45; }
    .modal-actions { display:grid; gap:9px; }
    .result-score { font-size:42px; font-weight:900; text-align:center; color:var(--gold); margin:8px 0 2px; font-variant-numeric:tabular-nums; }
    .result-meta { text-align:center; color:var(--muted); margin-bottom:16px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .settings-row:last-of-type { border-bottom:0; }
    .settings-row small { display:block; color:var(--muted); margin-top:3px; }
    .switch { width:50px; height:29px; border-radius:999px; border:0; background:#514661; padding:3px; cursor:pointer; transition:.2s; flex-shrink:0; }
    .switch::before { content:""; display:block; width:23px; height:23px; border-radius:50%; background:#fff; transition:.2s; }
    .switch.on { background:#6fc99b; }
    .switch.on::before { transform:translateX(21px); }
    .legend { display:grid; gap:9px; margin:14px 0 18px; }
    .legend-item { display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:center; color:var(--muted); font-size:13px; }
    .legend-symbol { height:38px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.07); color:var(--text); font-weight:900; }
    .highscores { display:grid; gap:7px; margin:10px 0 18px; }
    .highscore-row { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:9px 10px; border-radius:12px; background:rgba(255,255,255,.055); }
    .highscore-row span:last-child { font-weight:850; color:var(--gold); }

    .toast {
      position:absolute; z-index:30; left:50%; bottom:88px; transform:translate(-50%, 18px);
      max-width:82%; padding:10px 14px; border-radius:999px; background:rgba(20,14,32,.94); border:1px solid rgba(243,207,119,.3);
      color:var(--text); font-weight:700; font-size:13px; text-align:center; box-shadow:0 12px 28px rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:.22s ease;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .combo {
      position:absolute; z-index:12; left:50%; top:43%; transform:translate(-50%,-50%) scale(.6);
      font:900 clamp(28px,9vw,42px) Georgia,serif; color:#fff4b8; text-shadow:0 2px 0 #7c5320, 0 0 14px #f3cf77;
      opacity:0; pointer-events:none;
    }
    .combo.show { animation:comboPop .75s ease forwards; }
    @keyframes comboPop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)} 100%{opacity:0;transform:translate(-50%,-95%) scale(.95)} }

    @media (max-height: 680px) {
      .topbar { min-height:42px; }
      .icon-btn { width:38px;height:38px;border-radius:12px; }
      .hud-card { padding:5px 6px; }

    @media (min-width: 560px) {
      body { background:#0b0812; }
      .app { box-shadow:0 0 70px rgba(0,0,0,.65); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
    }
