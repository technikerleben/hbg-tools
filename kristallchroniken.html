  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
  (() => {
    'use strict';

    const SIZE = 8;
    const TYPES = ['ruby', 'sapphire', 'emerald', 'amethyst', 'topaz', 'moon'];
    const MAX_CASCADES = 6;
    const CASCADE_STEP = 0.22;
    const MAX_CASCADE_MULTIPLIER = 1.88;
    const STORAGE_KEY = 'kristallchroniken_v1';
    const ACTIVE_KEY = 'kristallchroniken_active_v1';
    const GEM_COLORS = { ruby:'#ff708f', sapphire:'#65b7ff', emerald:'#68e3a1', amethyst:'#c58aff', topaz:'#ffd36b', moon:'#ffffff' };

    const LEVELS = [
      { target: 2200, moves: 18, colors: 5 },
      { target: 3000, moves: 19, colors: 5 },
      { target: 3800, moves: 20, colors: 5, ice: 6 },
      { target: 4600, moves: 21, colors: 5, ice: 10 },
      { target: 5400, moves: 22, colors: 6, ice: 12 },
      { target: 6200, moves: 22, colors: 6, chains: 5 },
      { target: 7000, moves: 23, colors: 6, rocks: 4 },
      { target: 7800, moves: 24, colors: 6, ice: 10, chains: 6 },
      { target: 8600, moves: 24, colors: 6, rocks: 6 },
      { target: 9400, moves: 25, colors: 6, voidPattern: 'corners', ice: 10 },
      { target: 10200, moves: 25, colors: 6, ice: 16, chains: 8 },
      { target: 11000, moves: 26, colors: 6, rocks: 7, chains: 6 },
      { target: 11800, moves: 26, colors: 6, voidPattern: 'gates', ice: 14 },
      { target: 12600, moves: 27, colors: 6, ice: 18, rocks: 6 },
      { target: 13400, moves: 27, colors: 6, chains: 11, rocks: 7 },
      { target: 14200, moves: 28, colors: 6, voidPattern: 'diagonal', rocks: 5 },
      { target: 15000, moves: 28, colors: 6, ice: 22, rocks: 7 },
      { target: 16000, moves: 29, colors: 6, chains: 14, rocks: 8 },
      { target: 17200, moves: 30, colors: 6, voidPattern: 'crown', ice: 18, chains: 10, rocks: 7 },
      { target: 18500, moves: 30, colors: 6, voidPattern: 'gates', ice: 22, chains: 12, rocks: 9, hardRocks: 4 }
    ];

    const state = {
      mode: 'level',
      levelIndex: 0,
      board: [],
      score: 0,
      movesLeft: 0,
      target: 0,
      colors: 6,
      busy: false,
      selected: null,
      hintCells: [],
      clearingCells: new Set(),
      fallingCells: new Set(),
      spawnCells: new Set(),
      fallFrom: new Map(),
      cascade: 0,
      lastTurnScore: 0,
      hintTimer: null,
      twinkleTimer: null,
      pointerStart: null,
      settings: null
    };

    const els = {
      home: document.getElementById('homeScreen'),
      game: document.getElementById('gameScreen'),
      board: document.getElementById('board'),
      boardWrap: document.getElementById('boardWrap'),
      levelGrid: document.getElementById('levelGrid'),
      continueBtn: document.getElementById('continueBtn'),
      freePlayBtn: document.getElementById('freePlayBtn'),
      highscoreBtn: document.getElementById('highscoreBtn'),
      progressText: document.getElementById('progressText'),
      backBtn: document.getElementById('backBtn'),
      settingsBtn: document.getElementById('settingsBtn'),
      hintBtn: document.getElementById('hintBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      restartBtn: document.getElementById('restartBtn'),
      modeLabel: document.getElementById('modeLabel'),
      levelTitle: document.getElementById('levelTitle'),
      scoreValue: document.getElementById('scoreValue'),
      movesValue: document.getElementById('movesValue'),
      targetLabel: document.getElementById('targetLabel'),
      targetValue: document.getElementById('targetValue'),
      progressShell: document.getElementById('progressShell'),
      progressBar: document.getElementById('progressBar'),
      comboText: document.getElementById('comboText'),
      fxLayer: document.getElementById('fxLayer'),
      turnScoreText: document.getElementById('turnScoreText'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalContent: document.getElementById('modalContent'),
      toast: document.getElementById('toast')
    };

    function defaultSave() {
      return {
        unlocked: 1,
        levelBest: Array(LEVELS.length).fill(0),
        levelStars: Array(LEVELS.length).fill(0),
        freeScores: [],
        settings: { autoHints: true, reducedMotion: false, sound: true },
        seenIntro: false
      };
    }

    function loadSave() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        const base = defaultSave();
        if (!raw) return base;
        return {
          ...base,
          ...raw,
          settings: { ...base.settings, ...(raw.settings || {}) },
          levelBest: Array.from({ length: LEVELS.length }, (_, i) => Number(raw.levelBest?.[i] || 0)),
          levelStars: Array.from({ length: LEVELS.length }, (_, i) => Number(raw.levelStars?.[i] || 0)),
          freeScores: Array.isArray(raw.freeScores) ? raw.freeScores.slice(0, 5) : []
        };
      } catch {
        return defaultSave();
      }
    }

    let saveData = loadSave();
    state.settings = saveData.settings;
    document.documentElement.classList.toggle('gsap-ready', Boolean(window.gsap));
    applyMotionSetting();

    function persistSave() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    }

    function hasActiveGame() {
      try {
        const active = JSON.parse(localStorage.getItem(ACTIVE_KEY) || 'null');
        return Boolean(active?.board?.length === SIZE * SIZE && active.movesLeft > 0);
      } catch { return false; }
    }

    function saveActiveGame() {
      if (!state.board.length || state.busy) return;
      const payload = {
        version: 1,
        mode: state.mode,
        levelIndex: state.levelIndex,
        board: state.board,
        score: state.score,
        movesLeft: state.movesLeft,
        target: state.target,
        colors: state.colors
      };
      localStorage.setItem(ACTIVE_KEY, JSON.stringify(payload));
      updateContinueButton();
    }

    function clearActiveGame() {
      localStorage.removeItem(ACTIVE_KEY);
      updateContinueButton();
    }

    function updateContinueButton() {
      els.continueBtn.hidden = !hasActiveGame();
    }

    function cellIndex(r, c) { return r * SIZE + c; }
    function rowCol(index) { return { r: Math.floor(index / SIZE), c: index % SIZE }; }
    function inBounds(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }
    function neighbors(index) {
      const { r, c } = rowCol(index);
      return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc]) => inBounds(rr,cc)).map(([rr,cc]) => cellIndex(rr,cc));
    }
    function areAdjacent(a, b) {
      const p = rowCol(a), q = rowCol(b);
      return Math.abs(p.r - q.r) + Math.abs(p.c - q.c) === 1;
    }
    function randomType() { return TYPES[Math.floor(Math.random() * state.colors)]; }
    function crystal(type = randomType(), special = null) { return { type, special }; }
    function blankCell() { return { crystal: null, void: false, rock: 0, ice: 0, chain: 0 }; }
    function isBlocked(cell) { return !cell || cell.void || cell.rock > 0; }
    function isSwappable(cell) { return cell && !isBlocked(cell) && cell.crystal && cell.chain === 0; }

    function getVoidSet(pattern) {
      const coords = {
        corners: [[0,0],[0,7],[7,0],[7,7]],
        gates: [[0,3],[0,4],[7,3],[7,4],[3,0],[4,0],[3,7],[4,7]],
        diagonal: [[0,0],[1,1],[6,6],[7,7],[0,7],[1,6],[6,1],[7,0]],
        crown: [[0,0],[0,7],[1,1],[1,6],[7,3],[7,4]]
      };
      return new Set((coords[pattern] || []).map(([r,c]) => cellIndex(r,c)));
    }

    function generateBoard(config) {
      state.colors = config.colors || 6;
      let tries = 0;
      let board;
      do {
        board = Array.from({ length: SIZE * SIZE }, blankCell);
        const voids = getVoidSet(config.voidPattern);
        voids.forEach(i => board[i].void = true);
        placeRocks(board, config.rocks || 0, config.hardRocks || 0);
        fillWithoutMatches(board);
        placeOverlays(board, 'ice', config.ice || 0, config.ice > 16 ? 4 : 0);
        placeOverlays(board, 'chain', config.chains || 0, 0, new Set(board.map((c,i) => c.ice ? i : -1)));
        state.board = board;
        tries++;
      } while ((findMatches().matched.size > 0 || !findPossibleMove()) && tries < 80);
      return board;
    }

    function placeRocks(board, count, hardCount) {
      const candidates = board.map((c,i) => (!c.void && i > 7 && i < 56 ? i : -1)).filter(i => i >= 0);
      shuffleArray(candidates);
      for (let n = 0; n < Math.min(count, candidates.length); n++) {
        board[candidates[n]].rock = n < hardCount ? 2 : 1;
      }
    }

    function placeOverlays(board, key, count, doubleCount = 0, excluded = new Set()) {
      const candidates = board.map((c,i) => (!isBlocked(c) && c.crystal && !excluded.has(i) ? i : -1)).filter(i => i >= 0);
      shuffleArray(candidates);
      for (let n = 0; n < Math.min(count, candidates.length); n++) board[candidates[n]][key] = n < doubleCount ? 2 : 1;
    }

    function fillWithoutMatches(board) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const i = cellIndex(r,c);
          if (isBlocked(board[i])) continue;
          let options = TYPES.slice(0, state.colors);
          if (c >= 2) {
            const a = board[cellIndex(r,c-1)]?.crystal?.type;
            const b = board[cellIndex(r,c-2)]?.crystal?.type;
            if (a && a === b) options = options.filter(t => t !== a);
          }
          if (r >= 2) {
            const a = board[cellIndex(r-1,c)]?.crystal?.type;
            const b = board[cellIndex(r-2,c)]?.crystal?.type;
            if (a && a === b) options = options.filter(t => t !== a);
          }
          board[i].crystal = crystal(options[Math.floor(Math.random() * options.length)] || randomType());
        }
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    /* ------------------------------------------------------------------ */
    /* Persistenter Renderer                                              */
    /* 64 Zellen werden genau einmal erzeugt. Danach wird pro Zelle nur   */
    /* dann DOM ausgetauscht, wenn sich ihr Inhalt tatsächlich geändert   */
    /* hat (Signaturvergleich). Zustandsklassen (selected, hint, burst…)  */
    /* sind reine classList-Toggles. Dadurch überleben laufende GSAP-     */
    /* Transformationen den Renderzyklus, und der Browser muss nie das    */
    /* gesamte Brett neu aufbauen.                                        */
    /* ------------------------------------------------------------------ */

    const cellEls = [];
    const cellSig = [];

    function buildBoardDom() {
      els.board.textContent = '';
      cellEls.length = 0;
      cellSig.length = 0;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < SIZE * SIZE; i++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.index = i;
        el.setAttribute('role', 'gridcell');
        frag.appendChild(el);
        cellEls.push(el);
        cellSig.push(null);
      }
      els.board.appendChild(frag);
    }

    /* Jeder Kristall bekommt eine unsichtbare Identität. Sonst hält der
       Renderer einen geräumten Rubin und einen frisch nachgefallenen Rubin
       für dasselbe Element, recycelt den alten DOM-Knoten samt seiner
       Auflöse-Animation (opacity 0) – und der neue Kristall bliebe unsichtbar. */
    const crystalUid = new WeakMap();
    let crystalSeq = 0;
    function crystalId(cr) {
      let id = crystalUid.get(cr);
      if (id === undefined) { id = ++crystalSeq; crystalUid.set(cr, id); }
      return id;
    }

    function cellSignature(cell) {
      if (cell.void) return 'void';
      if (cell.rock) return `rock${cell.rock}`;
      const cry = cell.crystal
        ? `${cell.crystal.type || 'x'}:${cell.crystal.special || ''}#${crystalId(cell.crystal)}`
        : 'empty';
      return `${cry}|i${cell.ice}|c${cell.chain}`;
    }

    function cellContent(cell) {
      if (cell.void || !cell) return '';
      if (cell.rock) return `<div class="rock ${cell.rock > 1 ? 'hp2' : ''}" aria-label="Felsen"></div>`;
      if (!cell.crystal) return '';
      const sp = cell.crystal.special;
      if (sp === 'color') return '<div class="gem color" data-special="color" aria-hidden="true"></div>';
      let mark = '';
      if (sp === 'lineH') mark = '<span class="special-mark special-line-h"></span>';
      if (sp === 'lineV') mark = '<span class="special-mark special-line-v"></span>';
      if (sp === 'bomb') mark = '<span class="special-mark special-bomb"></span>';
      const t = cell.crystal.type;
      return `<div class="gem ${t}" data-special="${sp || ''}" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#cry-${t}"/></svg>${mark}</div>`;
    }

    function syncCell(i) {
      const el = cellEls[i];
      const cell = state.board[i];
      const sig = cellSignature(cell);
      if (sig !== cellSig[i]) {
        el.innerHTML = cellContent(cell);
        cellSig[i] = sig;
        el.setAttribute('aria-label', cellLabel(cell));
        el.classList.toggle('void', cell.void);
        el.classList.toggle('ice', cell.ice > 0);
        el.classList.toggle('ice-2', cell.ice > 1);
        el.classList.toggle('chain', cell.chain > 0);
      }
      el.classList.toggle('selected', state.selected === i);
      el.classList.toggle('hint', state.hintCells.includes(i));
      el.classList.toggle('burst', state.clearingCells.has(i));
      el.classList.toggle('falling', state.fallingCells.has(i));
      el.classList.toggle('spawn-special', state.spawnCells.has(i));
    }

    function renderBoard() {
      if (!cellEls.length) buildBoardDom();
      for (let i = 0; i < SIZE * SIZE; i++) syncCell(i);
      renderHud();
    }

    function gemAt(i) { return cellEls[i]?.querySelector('.gem'); }

    /* Sicherheitsnetz. Wird eine Animation unterbrochen – etwa weil das Level
       mitten in einer Kaskade neu gestartet wird – bleiben Inline-Styles auf
       den Kristallen liegen. Am Zugende bewegt sich garantiert nichts mehr,
       also wird hier aufgeräumt. */
    function normalizeGems() {
      const nodes = els.board.querySelectorAll('.gem, .rock');
      if (!nodes.length) return;
      if (useGsap()) {
        gsap.killTweensOf(nodes);
        gsap.set(nodes, { clearProps: 'all' });
      } else {
        nodes.forEach(el => { el.removeAttribute('style'); });
      }
    }

    function boardMetrics() {
      const rect = els.board.getBoundingClientRect();
      const gap = parseFloat(getComputedStyle(els.board).columnGap) || 4;
      const cellSize = (rect.width - gap * (SIZE - 1)) / SIZE;
      return { rect, gap, cellSize, pitch: cellSize + gap };
    }

    function cellCenter(i, metrics) {
      const { r, c } = rowCol(i);
      return {
        x: c * metrics.pitch + metrics.cellSize / 2,
        y: r * metrics.pitch + metrics.cellSize / 2
      };
    }

    function cellLabel(cell) {
      if (cell.void) return 'Abgrund';
      if (cell.rock) return cell.rock > 1 ? 'Starker Felsen' : 'Felsen';
      if (!cell.crystal) return 'Leeres Feld';
      const names = { ruby:'Rubin', sapphire:'Saphir', emerald:'Smaragd', amethyst:'Amethyst', topaz:'Topas', moon:'Mondkristall' };
      const special = { lineH:' Reihen-Kristall', lineV:' Spalten-Kristall', bomb:' Explosionskristall', color:' Farbkristall' }[cell.crystal.special] || '';
      return `${names[cell.crystal.type] || 'Farbkristall'}${special}${cell.chain ? ', angekettet' : ''}${cell.ice ? ', vereist' : ''}`;
    }

    /* Punkteanzeige zählt animiert hoch statt zu springen. */
    const scoreDisplay = { val: 0 };
    function renderHud() {
      if (useGsap()) {
        gsap.to(scoreDisplay, {
          val: state.score, duration: .45, ease: 'power1.out', overwrite: true,
          onUpdate: () => { els.scoreValue.textContent = formatNumber(scoreDisplay.val); }
        });
      } else {
        scoreDisplay.val = state.score;
        els.scoreValue.textContent = formatNumber(state.score);
      }
      els.movesValue.textContent = state.movesLeft;
      els.targetLabel.textContent = state.mode === 'free' ? 'Bestwert' : 'Ziel';
      const bestFree = saveData.freeScores[0]?.score || 0;
      els.targetValue.textContent = formatNumber(state.mode === 'free' ? bestFree : state.target);
      const pct = state.mode === 'free'
        ? Math.min(100, state.score / Math.max(bestFree, 10000) * 100)
        : Math.min(100, state.score / state.target * 100);
      els.progressBar.style.width = `${pct}%`;
      els.shuffleBtn.textContent = '⟳ Mischen −1';
      els.hintBtn.disabled = state.busy;
      els.shuffleBtn.disabled = state.busy || state.movesLeft <= 1;
      els.restartBtn.disabled = state.busy;
    }

    function bumpHud(el) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }

    function surgeProgress() {
      els.progressShell.classList.remove('surge');
      void els.progressShell.offsetWidth;
      els.progressShell.classList.add('surge');
    }

    function formatNumber(n) { return Math.round(n).toLocaleString('de-DE'); }
    function delay(ms) { return new Promise(resolve => setTimeout(resolve, state.settings.reducedMotion ? Math.min(ms, 30) : ms)); }
    function useGsap() { return Boolean(window.gsap) && !state.settings.reducedMotion; }

    /* ------------------------------------------------------------------ */
    /* Soundeffekte: winzige WebAudio-Synthese, keine Dateien nötig        */
    /* ------------------------------------------------------------------ */

    const SFX = {
      ctx: null,
      master: null,
      ensure() {
        if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.16;
          this.master.connect(this.ctx.destination);
        } catch {}
      },
      tone(freq, { dur = .16, type = 'triangle', vol = 1, when = 0, glide = 0 } = {}) {
        if (!this.ctx || !state.settings.sound) return;
        const t0 = this.ctx.currentTime + when;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glide), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(this.master);
        osc.start(t0);
        osc.stop(t0 + dur + .02);
      },
      pop(cascade = 1, count = 3) {
        const base = 300 + Math.min(cascade, 6) * 55;
        this.tone(base + Math.random() * 40, { dur: .13, type: 'triangle', vol: .9 });
        this.tone(base * 1.5, { dur: .1, type: 'sine', vol: .4, when: .015 });
        if (count >= 8) this.tone(base * 2, { dur: .12, type: 'sine', vol: .35, when: .04 });
      },
      special() {
        this.tone(620, { dur: .14, type: 'sine', vol: .7 });
        this.tone(930, { dur: .2, type: 'sine', vol: .6, when: .07 });
      },
      spawn() {
        this.tone(500, { dur: .18, type: 'sine', vol: .55, glide: 420 });
      },
      invalid() {
        this.tone(150, { dur: .12, type: 'square', vol: .28, glide: -40 });
      },
      swap() {
        this.tone(360, { dur: .07, type: 'sine', vol: .3 });
      },
      win() {
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, { dur: .22, type: 'triangle', vol: .7, when: i * .11 }));
      },
      lose() {
        [330, 262, 196].forEach((f, i) => this.tone(f, { dur: .26, type: 'triangle', vol: .5, when: i * .14 }));
      }
    };

    function buzz(ms) { try { navigator.vibrate?.(ms); } catch {} }

    /* ------------------------------------------------------------------ */
    /* Animationen: echte Geometrie statt Zufallswerte                     */
    /* ------------------------------------------------------------------ */

    function animateSwappedGems(a, b) {
      if (!useGsap()) return delay(110);
      const gemA = gemAt(a);
      const gemB = gemAt(b);
      if (!gemA || !gemB) return delay(110);
      const m = boardMetrics();
      const pa = cellCenter(a, m), pb = cellCenter(b, m);
      const dx = pb.x - pa.x, dy = pb.y - pa.y;
      gsap.killTweensOf([gemA, gemB]);
      return new Promise(resolve => {
        const tl = gsap.timeline({ onComplete: resolve });
        tl.fromTo(gemA, { x: dx, y: dy, scale: .92, zIndex: 5 }, { x: 0, y: 0, scale: 1, duration: .18, ease: 'back.out(1.6)' }, 0)
          .fromTo(gemB, { x: -dx, y: -dy, scale: .92 }, { x: 0, y: 0, scale: 1, duration: .18, ease: 'back.out(1.6)' }, 0);
      });
    }

    function animateClearing(clearSet) {
      if (!useGsap()) return delay(255);
      const gems = [];
      const rocks = [];
      for (const i of clearSet) {
        const g = gemAt(i);
        if (g) { gsap.killTweensOf(g); gems.push(g); }
        const rock = cellEls[i]?.querySelector('.rock');
        if (rock) { gsap.killTweensOf(rock); rocks.push(rock); }
        spawnCellFlash(i);
      }
      if (!gems.length && !rocks.length) return delay(80);
      return new Promise(resolve => {
        const tl = gsap.timeline({ onComplete: () => {
          /* Die Kristalle stehen jetzt auf opacity 0 / scale .06. Der Knoten
             wird gleich ersetzt oder wiederverwendet – in beiden Fällen darf
             er diese Werte nicht behalten. Der Reset passiert noch vor dem
             nächsten Frame, ist also nicht sichtbar. */
          gsap.set([...gems, ...rocks], { clearProps: 'all' });
          resolve();
        } });
        if (gems.length) {
          tl.to(gems, { scale: 1.22, filter: 'brightness(1.9)', duration: .09, ease: 'power2.out', stagger: { each: .006, from: 'random' } }, 0)
            .to(gems, { scale: .06, rotation: () => gsap.utils.random(-40, 40), opacity: 0, duration: .17, ease: 'power2.in', stagger: { each: .004, from: 'random' } }, .09);
        }
        if (rocks.length) {
          tl.to(rocks, { scale: 1.09, rotation: -4, filter: 'brightness(1.6)', duration: .1, yoyo: true, repeat: 1, ease: 'power2.out' }, 0);
        }
      });
    }

    function spawnCellFlash(i) {
      const cell = cellEls[i];
      if (!cell || !state.board[i]?.crystal) return;
      const flash = document.createElement('span');
      flash.className = 'cellflash';
      cell.appendChild(flash);
      gsap.fromTo(flash, { opacity: .9, scale: .4 }, {
        opacity: 0, scale: 1.5, duration: .32, ease: 'power2.out',
        onComplete: () => flash.remove()
      });
    }

    /* Fallende Kristalle: die Fallhöhe stammt aus der Gravitationslogik.
       Ein Kristall, der fünf Reihen fällt, fällt sichtbar fünf Reihen –
       mit Beschleunigung und einem kleinen Aufprall-Squash. */
    function animateFalling() {
      if (!state.fallFrom.size) return Promise.resolve();
      if (!useGsap()) {
        for (const [i, deltaCells] of state.fallFrom) {
          const g = gemAt(i);
          if (g) g.style.setProperty('--fall', `${-deltaCells * 122}%`);
        }
        return delay(300);
      }
      const m = boardMetrics();
      return new Promise(resolve => {
        const tl = gsap.timeline({ onComplete: resolve });
        for (const [i, deltaCells] of state.fallFrom) {
          const gem = gemAt(i);
          if (!gem) continue;
          gsap.killTweensOf(gem);
          gsap.set(gem, { clearProps: 'all' });
          const d = deltaCells * m.pitch;
          const { c } = rowCol(i);
          const dur = Math.min(.42, .13 + deltaCells * .05);
          tl.fromTo(gem, { y: -d, scale: .97 }, {
            keyframes: [
              { y: 0, scale: 1, duration: dur, ease: 'power2.in' },
              { scaleY: .84, scaleX: 1.12, duration: .055, ease: 'power1.out' },
              { scaleY: 1, scaleX: 1, duration: .1, ease: 'power2.out' }
            ]
          }, c * .014 + Math.random() * .02);
        }
        if (!tl.getChildren().length) resolve();
      });
    }

    function animateSpecialSpawns() {
      if (!useGsap() || !state.spawnCells.size) return;
      for (const i of state.spawnCells) {
        const gem = gemAt(i);
        if (!gem) continue;
        spawnGlowRing(i, 1.4);
        /* Ein frisch entstandener Spezialkristall kann gleichzeitig fallen.
           Dann gehört die Bühne der Fall-Animation – sonst würde sie die
           Geburtsdrehung mittendrin abschneiden und der Kristall bliebe schief. */
        if (state.fallFrom.has(i)) continue;
        gsap.killTweensOf(gem);
        gsap.fromTo(gem, { scale: .2, rotation: -110 }, { scale: 1, rotation: 0, duration: .45, ease: 'back.out(2.2)' });
      }
      SFX.spawn();
    }

    /* ------------------------------------------------------------------ */
    /* Spezialeffekte auf der FX-Ebene                                     */
    /* ------------------------------------------------------------------ */

    function spawnGlowRing(i, maxScale = 2.6) {
      if (!useGsap()) return;
      const m = boardMetrics();
      const { x, y } = cellCenter(i, m);
      const ring = document.createElement('span');
      ring.className = 'glowring';
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      ring.style.width = `${m.cellSize}px`;
      ring.style.height = `${m.cellSize}px`;
      els.fxLayer.appendChild(ring);
      gsap.fromTo(ring, { opacity: 1, scale: .15 }, {
        opacity: 0, scale: maxScale, duration: .45, ease: 'power2.out',
        onComplete: () => ring.remove()
      });
    }

    function spawnBeam(i, dir) {
      if (!useGsap()) return;
      const m = boardMetrics();
      const { x, y } = cellCenter(i, m);
      const beam = document.createElement('span');
      beam.className = `beam ${dir === 'v' ? 'v' : ''}`;
      if (dir === 'h') {
        beam.style.left = '0'; beam.style.right = '0';
        beam.style.top = `${y - m.cellSize * .22}px`;
        beam.style.height = `${m.cellSize * .44}px`;
        beam.style.transformOrigin = `${x}px center`;
      } else {
        beam.style.top = '0'; beam.style.bottom = '0';
        beam.style.left = `${x - m.cellSize * .22}px`;
        beam.style.width = `${m.cellSize * .44}px`;
        beam.style.transformOrigin = `center ${y}px`;
      }
      els.fxLayer.appendChild(beam);
      gsap.fromTo(beam, { opacity: 1, [dir === 'h' ? 'scaleX' : 'scaleY']: .05 }, {
        [dir === 'h' ? 'scaleX' : 'scaleY']: 1, duration: .17, ease: 'power3.out',
        onComplete: () => gsap.to(beam, { opacity: 0, duration: .22, onComplete: () => beam.remove() })
      });
    }

    function spawnBoardFlash() {
      if (!useGsap()) return;
      const flash = document.createElement('span');
      flash.className = 'boardflash';
      els.fxLayer.appendChild(flash);
      gsap.fromTo(flash, { opacity: .85 }, { opacity: 0, duration: .5, ease: 'power2.out', onComplete: () => flash.remove() });
    }

    /* Vor dem Auflösen: welche Spezialkristalle werden gerade gezündet? */
    function emitSpecialFx(clearSet) {
      let fired = false;
      for (const i of clearSet) {
        const sp = state.board[i]?.crystal?.special;
        if (!sp) continue;
        fired = true;
        if (sp === 'lineH') spawnBeam(i, 'h');
        if (sp === 'lineV') spawnBeam(i, 'v');
        if (sp === 'bomb') spawnGlowRing(i, 3.1);
        if (sp === 'color') spawnBoardFlash();
      }
      if (fired) { SFX.special(); buzz(28); }
      return fired;
    }

    function emitParticles(clearSet) {
      if (!useGsap() || !els.fxLayer) return;
      const m = boardMetrics();
      const indices = [...clearSet].filter(i => state.board[i]?.crystal).slice(0, 20);
      for (const i of indices) {
        const { x, y } = cellCenter(i, m);
        const type = state.board[i]?.crystal?.type;
        const color = GEM_COLORS[type] || '#fff4b8';
        for (let n = 0; n < 2; n++) {
          const spark = document.createElement('i');
          spark.className = 'spark';
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;
          spark.style.color = color;
          els.fxLayer.appendChild(spark);
          gsap.to(spark, {
            x: gsap.utils.random(-40, 40), y: gsap.utils.random(-46, 32), rotation: gsap.utils.random(-160, 160),
            scale: 0, opacity: 0, duration: gsap.utils.random(.36, .56), ease: 'power2.out',
            onComplete: () => spark.remove()
          });
        }
        /* Kristallscherben: fliegen auseinander und sinken dann ab */
        for (let n = 0; n < 3; n++) {
          const shard = document.createElement('i');
          shard.className = 'shard';
          shard.style.left = `${x}px`;
          shard.style.top = `${y}px`;
          shard.style.color = color;
          els.fxLayer.appendChild(shard);
          const vx = gsap.utils.random(-46, 46);
          gsap.timeline({ onComplete: () => shard.remove() })
            .to(shard, { x: vx * .6, y: gsap.utils.random(-46, -14), rotation: gsap.utils.random(-200, 200), duration: .2, ease: 'power2.out' })
            .to(shard, { x: vx, y: gsap.utils.random(30, 62), rotation: `+=${gsap.utils.random(60, 160)}`, opacity: 0, scale: .5, duration: .34, ease: 'power1.in' });
        }
      }
    }

    function shakeBoard(strength = 1) {
      if (!useGsap()) return;
      const amp = 2.5 * strength;
      gsap.fromTo(els.boardWrap, { x: 0, y: 0 }, {
        keyframes: [
          { x: amp, y: -amp * .5, duration: .04 },
          { x: -amp, y: amp * .4, duration: .05 },
          { x: amp * .5, y: -amp * .3, duration: .05 },
          { x: 0, y: 0, duration: .06 }
        ],
        ease: 'none',
        overwrite: 'auto'
      });
    }

    /* Gelegentliches Funkeln eines zufälligen Kristalls */
    function scheduleTwinkle() {
      clearTimeout(state.twinkleTimer);
      state.twinkleTimer = setTimeout(() => {
        if (!els.game.classList.contains('hidden') && !state.busy && !state.settings.reducedMotion) {
          const candidates = state.board.map((c, i) => c.crystal && !c.crystal.special ? i : -1).filter(i => i >= 0);
          if (candidates.length) {
            const gem = gemAt(candidates[Math.floor(Math.random() * candidates.length)]);
            if (gem) {
              gem.classList.remove('twinkle');
              void gem.offsetWidth;
              gem.classList.add('twinkle');
            }
          }
        }
        scheduleTwinkle();
      }, 1700 + Math.random() * 2200);
    }

    function showTurnScore(points) {
      if (!points) return;
      els.turnScoreText.textContent = `+${formatNumber(points)}`;
      els.turnScoreText.classList.remove('show');
      void els.turnScoreText.offsetWidth;
      els.turnScoreText.classList.add('show');
    }

    /* Levelstart: das komplette Brett regnet in Wellen ein. */
    function playBoardEntrance() {
      state.fallFrom = new Map();
      state.board.forEach((cell, i) => {
        if (cell.crystal && !isBlocked(cell)) state.fallFrom.set(i, rowCol(i).r + 2 + Math.random());
      });
      animateFalling().then(() => { state.fallFrom = new Map(); });
    }

    function startLevel(index, restore = null) {
      clearHintTimer();
      state.mode = 'level';
      state.levelIndex = index;
      const cfg = LEVELS[index];
      state.score = restore?.score ?? 0;
      scoreDisplay.val = state.score;
      state.lastTurnScore = 0;
      state.movesLeft = restore?.movesLeft ?? cfg.moves;
      state.target = cfg.target;
      state.colors = restore?.colors ?? cfg.colors;
      state.board = restore?.board ?? generateBoard(cfg);
      state.busy = false;
      state.selected = null;
      state.hintCells = [];
      els.modeLabel.textContent = 'Chronik';
      els.levelTitle.textContent = `Level ${index + 1}`;
      showGame();
      renderBoard();
      playBoardEntrance();
      saveActiveGame();
      scheduleAutoHint();
      scheduleTwinkle();
      if (!saveData.seenIntro) showIntro();
    }

    function startFree(restore = null) {
      clearHintTimer();
      state.mode = 'free';
      state.levelIndex = -1;
      state.score = restore?.score ?? 0;
      scoreDisplay.val = state.score;
      state.lastTurnScore = 0;
      state.movesLeft = restore?.movesLeft ?? 60;
      state.target = 0;
      state.colors = restore?.colors ?? 6;
      state.board = restore?.board ?? generateBoard({ colors: 6 });
      state.busy = false;
      state.selected = null;
      state.hintCells = [];
      els.modeLabel.textContent = 'Freies Spiel';
      els.levelTitle.textContent = 'Kristalljagd';
      showGame();
      renderBoard();
      playBoardEntrance();
      saveActiveGame();
      scheduleAutoHint();
      scheduleTwinkle();
    }

    function resumeActive() {
      try {
        const active = JSON.parse(localStorage.getItem(ACTIVE_KEY) || 'null');
        if (!active?.board?.length) return;
        if (active.mode === 'free') startFree(active);
        else startLevel(active.levelIndex || 0, active);
      } catch {
        clearActiveGame();
      }
    }

    function showGame() {
      els.home.classList.add('hidden');
      els.game.classList.remove('hidden');
    }

    function showHome() {
      clearHintTimer();
      clearTimeout(state.twinkleTimer);
      state.busy = false;
      closeModal();
      els.game.classList.add('hidden');
      els.home.classList.remove('hidden');
      renderLevelGrid();
      updateContinueButton();
    }

    function renderLevelGrid() {
      const completed = saveData.levelBest.filter(Boolean).length;
      els.progressText.textContent = `${completed} von ${LEVELS.length} gemeistert`;
      els.levelGrid.innerHTML = LEVELS.map((_, i) => {
        const locked = i + 1 > saveData.unlocked;
        const stars = saveData.levelStars[i] || 0;
        return `<button class="level-btn ${locked ? 'locked' : ''} ${stars ? 'completed' : ''}" data-level="${i}" ${locked ? 'disabled' : ''} aria-label="Level ${i+1}${locked ? ' gesperrt' : ''}">
          <span>${locked ? '◆' : i + 1}</span>
          <span class="level-stars">${'✦'.repeat(stars)}${'·'.repeat(3-stars)}</span>
        </button>`;
      }).join('');
      if (useGsap()) {
        gsap.fromTo('#levelGrid .level-btn', { opacity: 0, y: 8, scale: .92 }, {
          opacity: 1, y: 0, scale: 1, duration: .3, ease: 'power2.out', stagger: .018, clearProps: 'all'
        });
      }
    }

    function findMatches() {
      const runs = [];
      const matched = new Set();

      for (let r = 0; r < SIZE; r++) {
        let c = 0;
        while (c < SIZE) {
          const start = c;
          const cell = state.board[cellIndex(r,c)];
          const type = (!isBlocked(cell) && cell.crystal?.special !== 'color') ? cell.crystal?.type : null;
          if (!type) { c++; continue; }
          c++;
          while (c < SIZE) {
            const next = state.board[cellIndex(r,c)];
            if (isBlocked(next) || next.crystal?.special === 'color' || next.crystal?.type !== type) break;
            c++;
          }
          if (c - start >= 3) {
            const cells = [];
            for (let x = start; x < c; x++) { const i = cellIndex(r,x); cells.push(i); matched.add(i); }
            runs.push({ dir:'H', type, cells });
          }
        }
      }

      for (let c = 0; c < SIZE; c++) {
        let r = 0;
        while (r < SIZE) {
          const start = r;
          const cell = state.board[cellIndex(r,c)];
          const type = (!isBlocked(cell) && cell.crystal?.special !== 'color') ? cell.crystal?.type : null;
          if (!type) { r++; continue; }
          r++;
          while (r < SIZE) {
            const next = state.board[cellIndex(r,c)];
            if (isBlocked(next) || next.crystal?.special === 'color' || next.crystal?.type !== type) break;
            r++;
          }
          if (r - start >= 3) {
            const cells = [];
            for (let y = start; y < r; y++) { const i = cellIndex(y,c); cells.push(i); matched.add(i); }
            runs.push({ dir:'V', type, cells });
          }
        }
      }

      return { runs, matched };
    }

    function buildMatchGroups(runs) {
      const groups = [];
      for (const run of runs) {
        const touching = groups.filter(g => run.cells.some(i => g.cells.has(i)));
        if (!touching.length) {
          groups.push({ cells:new Set(run.cells), runs:[run], type:run.type });
        } else {
          const base = touching[0];
          run.cells.forEach(i => base.cells.add(i));
          base.runs.push(run);
          for (let t = 1; t < touching.length; t++) {
            touching[t].cells.forEach(i => base.cells.add(i));
            base.runs.push(...touching[t].runs);
            groups.splice(groups.indexOf(touching[t]), 1);
          }
        }
      }
      return groups;
    }

    function chooseSpecials(matchInfo, preferred = []) {
      const groups = buildMatchGroups(matchInfo.runs);
      const specials = new Map();
      for (const group of groups) {
        let special = null;
        const hasH = group.runs.some(r => r.dir === 'H');
        const hasV = group.runs.some(r => r.dir === 'V');
        const longest = Math.max(...group.runs.map(r => r.cells.length));
        if (longest >= 5) special = 'color';
        else if (hasH && hasV) special = 'bomb';
        else if (longest === 4) special = group.runs.find(r => r.cells.length === 4)?.dir === 'H' ? 'lineH' : 'lineV';
        if (!special) continue;
        let spawn = preferred.find(i => group.cells.has(i));
        if (spawn == null) {
          const run = group.runs.sort((a,b) => b.cells.length - a.cells.length)[0];
          spawn = run.cells[Math.floor(run.cells.length / 2)];
        }
        specials.set(spawn, { special, type: group.type });
      }
      return specials;
    }

    function collectClearSet(initial, colorSwap = null) {
      const clear = new Set(initial);
      const queue = [...clear];

      if (colorSwap) {
        const { colorIndex, otherIndex, otherCrystal } = colorSwap;
        clear.add(colorIndex);
        if (otherCrystal?.special === 'color') {
          state.board.forEach((cell,i) => { if (cell.crystal) clear.add(i); });
        } else {
          const targetType = otherCrystal?.type;
          state.board.forEach((cell,i) => { if (cell.crystal?.type === targetType) clear.add(i); });
          if (otherCrystal?.special) clear.add(otherIndex);
        }
        queue.push(...clear);
      }

      const processed = new Set();
      while (queue.length) {
        const i = queue.shift();
        if (processed.has(i)) continue;
        processed.add(i);
        const cell = state.board[i];
        if (!cell?.crystal) continue;
        const sp = cell.crystal.special;
        let extra = [];
        const { r, c } = rowCol(i);
        if (sp === 'lineH') extra = Array.from({length:SIZE}, (_,x) => cellIndex(r,x));
        if (sp === 'lineV') extra = Array.from({length:SIZE}, (_,y) => cellIndex(y,c));
        if (sp === 'bomb') {
          for (let rr = r-1; rr <= r+1; rr++) for (let cc = c-1; cc <= c+1; cc++) if (inBounds(rr,cc)) extra.push(cellIndex(rr,cc));
        }
        if (sp === 'color' && !colorSwap) {
          const counts = {};
          state.board.forEach(x => { if (x.crystal && x.crystal.special !== 'color') counts[x.crystal.type] = (counts[x.crystal.type] || 0) + 1; });
          const targetType = Object.entries(counts).sort((a,b) => b[1]-a[1])[0]?.[0];
          state.board.forEach((x,j) => { if (x.crystal?.type === targetType) extra.push(j); });
        }
        for (const j of extra) if (!clear.has(j)) { clear.add(j); queue.push(j); }
      }
      return clear;
    }

    async function attemptSwap(a, b) {
      if (state.busy || !areAdjacent(a,b)) return;
      clearHintTimer();
      clearHints();
      const ca = state.board[a], cb = state.board[b];
      if (!isSwappable(ca) || !isSwappable(cb)) {
        flashInvalid([a,b]);
        SFX.invalid();
        scheduleAutoHint();
        return;
      }

      state.busy = true;
      state.selected = null;
      SFX.swap();
      [ca.crystal, cb.crystal] = [cb.crystal, ca.crystal];
      renderBoard();
      await animateSwappedGems(a, b);

      let colorSwap = null;
      if (ca.crystal?.special === 'color' || cb.crystal?.special === 'color') {
        const colorIndex = ca.crystal?.special === 'color' ? a : b;
        const otherIndex = colorIndex === a ? b : a;
        colorSwap = { colorIndex, otherIndex, otherCrystal: state.board[otherIndex].crystal };
      }

      const matches = findMatches();
      if (!matches.matched.size && !colorSwap) {
        [ca.crystal, cb.crystal] = [cb.crystal, ca.crystal];
        renderBoard();
        await animateSwappedGems(a, b);
        flashInvalid([a,b]);
        SFX.invalid();
        state.busy = false;
        scheduleAutoHint();
        return;
      }

      state.movesLeft--;
      bumpHud(els.movesValue);
      state.cascade = 0;
      await resolveBoard(matches, [b,a], colorSwap);
      state.busy = false;
      saveActiveGame();
      await checkEndState();
      if (!state.busy) scheduleAutoHint();
    }

    async function resolveBoard(initialMatch, preferred = [], colorSwap = null) {
      let matchInfo = initialMatch;
      let first = true;
      let turnScore = 0;
      do {
        state.cascade++;
        const specials = chooseSpecials(matchInfo, first ? preferred : []);
        let clearSet = collectClearSet(matchInfo.matched, first ? colorSwap : null);
        for (const spawnIndex of specials.keys()) clearSet.delete(spawnIndex);

        state.clearingCells = clearSet;
        renderBoard();
        emitSpecialFx(clearSet);
        emitParticles(clearSet);
        SFX.pop(state.cascade, clearSet.size);
        buzz(12);
        if (state.cascade > 1) showCombo(state.cascade);
        if (clearSet.size >= 10 || state.cascade >= 3) shakeBoard(clearSet.size >= 16 ? 1.6 : 1);
        await animateClearing(clearSet);

        const gained = clearCells(clearSet, specials, state.cascade);
        turnScore += gained;
        state.score += gained;
        state.clearingCells = new Set();
        applyGravity();
        renderBoard();
        surgeProgress();
        animateSpecialSpawns();
        await animateFalling();
        state.fallingCells = new Set();
        state.spawnCells = new Set();
        state.fallFrom = new Map();
        renderBoard();

        matchInfo = findMatches();
        first = false;
        if (matchInfo.matched.size && state.cascade >= MAX_CASCADES) {
          stabilizeBoard();
          renderBoard();
          toast('Das Kristallfeld beruhigt sich.');
          await delay(180);
          state.fallingCells = new Set();
          renderBoard();
          matchInfo = findMatches();
        }
      } while (matchInfo.matched.size);

      normalizeGems();
      state.lastTurnScore = turnScore;
      showTurnScore(turnScore);
      if (!findPossibleMove()) {
        toast('Keine Züge mehr – das Feld wird neu gemischt.');
        await delay(350);
        reshuffle(false, true);
      }
    }

    function clearCells(clearSet, specials, cascade) {
      let crystalCount = 0;
      let obstacleBonus = 0;
      const rockHits = new Set();
      const specialTriggered = new Set();

      for (const i of clearSet) {
        const cell = state.board[i];
        if (!cell || cell.void) continue;
        if (cell.rock) {
          rockHits.add(i);
          continue;
        }
        if (cell.crystal) {
          crystalCount++;
          if (cell.crystal.special) specialTriggered.add(cell.crystal.special);
          if (cell.ice) { cell.ice--; obstacleBonus += 90; }
          if (cell.chain) { cell.chain--; obstacleBonus += 110; }
          cell.crystal = null;
          neighbors(i).forEach(n => { if (state.board[n].rock) rockHits.add(n); });
        }
      }

      for (const i of rockHits) {
        const cell = state.board[i];
        if (cell.rock) {
          cell.rock--;
          obstacleBonus += 130;
          if (cell.rock === 0) cell.crystal = null;
        }
      }

      for (const [i, info] of specials) {
        const cell = state.board[i];
        if (!cell || isBlocked(cell)) continue;
        cell.crystal = crystal(info.special === 'color' ? null : info.type, info.special);
        if (info.special === 'color') cell.crystal.type = null;
        state.spawnCells.add(i);
      }

      const specialBonus = specialTriggered.size * 130;
      const cascadeMultiplier = Math.min(MAX_CASCADE_MULTIPLIER, 1 + (cascade - 1) * CASCADE_STEP);
      return Math.round(crystalCount * 60 * cascadeMultiplier + obstacleBonus + specialBonus);
    }

    function createsMatchAt(index) {
      const cell = state.board[index];
      const type = cell?.crystal?.type;
      if (!type || cell.crystal.special === 'color' || isBlocked(cell)) return false;
      const { r, c } = rowCol(index);
      let horizontal = 1;
      for (let x = c - 1; x >= 0; x--) {
        const xCell = state.board[cellIndex(r, x)];
        if (isBlocked(xCell) || xCell.crystal?.special === 'color' || xCell.crystal?.type !== type) break;
        horizontal++;
      }
      for (let x = c + 1; x < SIZE; x++) {
        const xCell = state.board[cellIndex(r, x)];
        if (isBlocked(xCell) || xCell.crystal?.special === 'color' || xCell.crystal?.type !== type) break;
        horizontal++;
      }
      if (horizontal >= 3) return true;
      let vertical = 1;
      for (let y = r - 1; y >= 0; y--) {
        const yCell = state.board[cellIndex(y, c)];
        if (isBlocked(yCell) || yCell.crystal?.special === 'color' || yCell.crystal?.type !== type) break;
        vertical++;
      }
      for (let y = r + 1; y < SIZE; y++) {
        const yCell = state.board[cellIndex(y, c)];
        if (isBlocked(yCell) || yCell.crystal?.special === 'color' || yCell.crystal?.type !== type) break;
        vertical++;
      }
      return vertical >= 3;
    }

    function placeSafeCrystal(index, avoidType = null) {
      const options = shuffleArray(TYPES.slice(0, state.colors).filter(type => type !== avoidType));
      const cell = state.board[index];
      for (const type of options) {
        cell.crystal = crystal(type);
        if (!createsMatchAt(index)) return;
      }
      cell.crystal = crystal(options[0] || randomType());
    }

    function applyGravity() {
      state.fallingCells = new Set();
      state.fallFrom = new Map();
      const spawnList = [];
      for (let c = 0; c < SIZE; c++) {
        let segEnd = SIZE - 1;
        while (segEnd >= 0) {
          while (segEnd >= 0 && isBlocked(state.board[cellIndex(segEnd,c)])) segEnd--;
          if (segEnd < 0) break;
          let segStart = segEnd;
          while (segStart >= 0 && !isBlocked(state.board[cellIndex(segStart,c)])) segStart--;
          segStart++;

          const crystals = [];
          for (let r = segStart; r <= segEnd; r++) {
            const i = cellIndex(r,c);
            const cell = state.board[i];
            if (cell.crystal) crystals.push({ crystal: cell.crystal, fromRow: r });
            cell.crystal = null;
          }
          let ptr = crystals.length - 1;
          for (let r = segEnd; r >= segStart; r--) {
            const i = cellIndex(r,c);
            if (ptr >= 0) {
              const item = crystals[ptr--];
              state.board[i].crystal = item.crystal;
              if (item.fromRow !== r) {
                state.fallingCells.add(i);
                state.fallFrom.set(i, r - item.fromRow);
              }
            } else {
              spawnList.push({ i, segStart, r });
            }
          }
          segEnd = segStart - 1;
        }
      }

      /* Neue Kristalle werden einzeln geprüft. Sie dürfen keine sofortige
         Dreierreihe bilden; echte Kaskaden aus bereits vorhandenen Steinen bleiben möglich.
         Die Fallhöhe entspricht dem Weg von oberhalb ihres Segments bis zum Zielfeld. */
      spawnList.sort((a,b) => a.i - b.i);
      for (const { i, segStart, r } of spawnList) {
        placeSafeCrystal(i);
        state.fallingCells.add(i);
        state.fallFrom.set(i, r - segStart + 1);
      }
    }

    function stabilizeBoard() {
      let guard = 0;
      let matchInfo = findMatches();
      while (matchInfo.matched.size && guard < 24) {
        for (const run of matchInfo.runs) {
          const candidates = run.cells.filter(i => isSwappable(state.board[i]));
          const i = candidates[candidates.length - 1];
          if (i == null) continue;
          const oldType = state.board[i].crystal?.type;
          placeSafeCrystal(i, oldType);
          state.fallingCells.add(i);
        }
        matchInfo = findMatches();
        guard++;
      }
    }

    function findPossibleMove() {
      for (let i = 0; i < state.board.length; i++) {
        const cell = state.board[i];
        if (!isSwappable(cell)) continue;
        const { r, c } = rowCol(i);
        for (const [dr,dc] of [[0,1],[1,0]]) {
          const rr = r+dr, cc = c+dc;
          if (!inBounds(rr,cc)) continue;
          const j = cellIndex(rr,cc);
          if (!isSwappable(state.board[j])) continue;
          if (cell.crystal.special === 'color' || state.board[j].crystal.special === 'color') return [i,j];
          [state.board[i].crystal, state.board[j].crystal] = [state.board[j].crystal, state.board[i].crystal];
          const valid = findMatches().matched.size > 0;
          [state.board[i].crystal, state.board[j].crystal] = [state.board[j].crystal, state.board[i].crystal];
          if (valid) return [i,j];
        }
      }
      return null;
    }

    function reshuffle(costsMove = true, allowWhileBusy = false) {
      if (state.busy && !allowWhileBusy) return;
      if (costsMove) {
        if (state.movesLeft <= 1) return toast('Zum Mischen brauchst du noch mindestens zwei Züge.');
        state.movesLeft--;
      }
      clearHintTimer();
      const movable = state.board.map((c,i) => isSwappable(c) ? i : -1).filter(i => i >= 0);
      const gems = movable.map(i => state.board[i].crystal);
      let tries = 0;
      do {
        shuffleArray(gems);
        movable.forEach((i,n) => state.board[i].crystal = gems[n]);
        tries++;
      } while ((findMatches().matched.size || !findPossibleMove()) && tries < 100);
      if (tries >= 100) {
        movable.forEach(i => state.board[i].crystal = crystal());
        while (findMatches().matched.size) {
          fillProblemMatches();
        }
      }
      renderBoard();
      if (useGsap()) {
        const targets = movable.map(i => gemAt(i)).filter(Boolean);
        gsap.killTweensOf(targets);
        gsap.fromTo(targets, { scale: 0, rotation: () => gsap.utils.random(-70, 70) }, {
          scale: 1, rotation: 0, duration: .32, ease: 'back.out(1.9)', stagger: { each: .004, from: 'random' },
          onComplete: () => gsap.set(targets, { clearProps: 'all' })
        });
      } else {
        state.fallingCells = new Set(movable);
        renderBoard();
        setTimeout(() => { state.fallingCells = new Set(); renderBoard(); }, state.settings.reducedMotion ? 30 : 300);
      }
      saveActiveGame();
      scheduleAutoHint();
    }

    function fillProblemMatches() {
      const matches = findMatches().matched;
      matches.forEach(i => { if (isSwappable(state.board[i])) state.board[i].crystal = crystal(); });
    }

    async function checkEndState() {
      if (state.mode === 'level' && state.score >= state.target) {
        state.busy = true;
        await delay(280);
        finishLevel(true);
        return;
      }
      if (state.movesLeft <= 0) {
        state.busy = true;
        await delay(220);
        if (state.mode === 'free') finishFree();
        else finishLevel(false);
      }
    }

    function finishLevel(won) {
      clearActiveGame();
      if (won) {
        SFX.win();
        buzz([20, 40, 40]);
        const idx = state.levelIndex;
        saveData.levelBest[idx] = Math.max(saveData.levelBest[idx] || 0, state.score);
        const ratio = state.score / state.target;
        const stars = ratio >= 1.45 ? 3 : ratio >= 1.18 ? 2 : 1;
        saveData.levelStars[idx] = Math.max(saveData.levelStars[idx] || 0, stars);
        saveData.unlocked = Math.max(saveData.unlocked, Math.min(LEVELS.length, idx + 2));
        persistSave();
        const nextExists = idx < LEVELS.length - 1;
        showModal(`
          <h2>Chronik gemeistert</h2>
          <div class="result-score">${formatNumber(state.score)}</div>
          <div class="result-meta">${'✦'.repeat(stars)}${'·'.repeat(3-stars)} · Ziel ${formatNumber(state.target)}</div>
          <p>Die Kristallenergie reicht aus. Der nächste Abschnitt der Chronik ist geöffnet.</p>
          <div class="modal-actions">
            ${nextExists ? '<button class="primary" data-action="next-level">Nächstes Level</button>' : '<button class="primary" data-action="home">Zur Chronik</button>'}
            <button class="secondary" data-action="replay">Level wiederholen</button>
          </div>`);
      } else {
        SFX.lose();
        showModal(`
          <h2>Die Energie reicht noch nicht</h2>
          <div class="result-score">${formatNumber(state.score)}</div>
          <div class="result-meta">Ziel: ${formatNumber(state.target)}</div>
          <p>Ein paar stärkere Kombinationen fehlen noch. Vierer- und Fünferreihen bringen den größten Schub.</p>
          <div class="modal-actions">
            <button class="primary" data-action="replay">Noch einmal</button>
            <button class="secondary" data-action="home">Zur Chronik</button>
          </div>`);
      }
    }

    function finishFree() {
      clearActiveGame();
      SFX.win();
      saveData.freeScores.push({ score: state.score, date: new Date().toISOString() });
      saveData.freeScores.sort((a,b) => b.score - a.score);
      saveData.freeScores = saveData.freeScores.slice(0,5);
      persistSave();
      const rank = saveData.freeScores.findIndex(x => x.score === state.score) + 1;
      showModal(`
        <h2>Kristalljagd beendet</h2>
        <div class="result-score">${formatNumber(state.score)}</div>
        <div class="result-meta">${rank ? `Platz ${rank} in deiner Bestenliste` : 'Runde beendet'}</div>
        <div class="modal-actions">
          <button class="primary" data-action="replay-free">Neue Runde</button>
          <button class="secondary" data-action="highscores">Bestenliste</button>
          <button class="secondary" data-action="home">Zur Chronik</button>
        </div>`);
    }

    function showIntro() {
      saveData.seenIntro = true;
      persistSave();
      showModal(`
        <h2>So spielst du</h2>
        <p>Wische einen Kristall in eine Richtung oder tippe zwei benachbarte Kristalle an. Mindestens drei gleiche müssen eine Reihe bilden.</p>
        <div class="legend">
          <div class="legend-item"><div class="legend-symbol">4</div><div>Vier Kristalle erzeugen einen Reihen- oder Spaltenkristall.</div></div>
          <div class="legend-item"><div class="legend-symbol">T / L</div><div>Eine T- oder L-Form erzeugt eine Explosion.</div></div>
          <div class="legend-item"><div class="legend-symbol">5</div><div>Fünf Kristalle erzeugen einen Farbkristall.</div></div>
          <div class="legend-item"><div class="legend-symbol">◆</div><div>Eis, Ketten und Felsen erschweren spätere Level.</div></div>
        </div>
        <button class="primary" data-action="close">Chronik beginnen</button>`);
    }

    function showSettings() {
      const auto = state.settings.autoHints;
      const reduced = state.settings.reducedMotion;
      const sound = state.settings.sound;
      showModal(`
        <h2>Einstellungen</h2>
        <div class="settings-row">
          <div><strong>Automatische Hinweise</strong><small>Zeigt nach einigen Sekunden einen möglichen Zug.</small></div>
          <button class="switch ${auto ? 'on' : ''}" data-setting="autoHints" aria-label="Automatische Hinweise umschalten"></button>
        </div>
        <div class="settings-row">
          <div><strong>Soundeffekte</strong><small>Dezente Klänge für Kombinationen und Erfolge.</small></div>
          <button class="switch ${sound ? 'on' : ''}" data-setting="sound" aria-label="Soundeffekte umschalten"></button>
        </div>
        <div class="settings-row">
          <div><strong>Reduzierte Bewegung</strong><small>Verkürzt Fall- und Explosionseffekte.</small></div>
          <button class="switch ${reduced ? 'on' : ''}" data-setting="reducedMotion" aria-label="Animationen reduzieren"></button>
        </div>
        <div class="modal-actions" style="margin-top:16px">
          <button class="primary" data-action="close">Fertig</button>
          <button class="secondary" data-action="reset-progress">Fortschritt zurücksetzen</button>
        </div>`);
    }

    function showHighscores() {
      const rows = saveData.freeScores.length
        ? saveData.freeScores.map((x,i) => `<div class="highscore-row"><span>${i+1}.</span><span>${new Date(x.date).toLocaleDateString('de-DE')}</span><span>${formatNumber(x.score)}</span></div>`).join('')
        : '<p>Noch keine Runde gespeichert.</p>';
      showModal(`
        <h2>Bestenliste</h2>
        <p>Deine fünf besten Ergebnisse aus dem freien Spiel.</p>
        <div class="highscores">${rows}</div>
        <button class="primary" data-action="close">Schließen</button>`);
    }

    function showModal(html) {
      els.modalContent.innerHTML = html;
      els.modalBackdrop.classList.remove('hidden');
    }
    function closeModal() {
      els.modalBackdrop.classList.add('hidden');
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove('show'), 1800);
    }

    function showCombo(n) {
      els.comboText.textContent = `KOMBO ×${n}`;
      els.comboText.classList.remove('show');
      void els.comboText.offsetWidth;
      els.comboText.classList.add('show');
    }

    function clearHints() {
      state.hintCells = [];
    }
    function showHint() {
      if (state.busy) return;
      const move = findPossibleMove();
      if (!move) return;
      state.hintCells = move;
      renderBoard();
      setTimeout(() => { clearHints(); renderBoard(); }, state.settings.reducedMotion ? 250 : 1900);
    }
    function scheduleAutoHint() {
      clearHintTimer();
      if (!state.settings.autoHints || state.busy || state.movesLeft <= 0) return;
      state.hintTimer = setTimeout(showHint, 5200);
    }
    function clearHintTimer() {
      clearTimeout(state.hintTimer);
      state.hintTimer = null;
    }

    function flashInvalid(indices) {
      indices.forEach(i => cellEls[i]?.classList.add('invalid'));
      setTimeout(() => indices.forEach(i => cellEls[i]?.classList.remove('invalid')), 500);
    }

    function handleTap(index) {
      if (state.busy) return;
      clearHintTimer();
      clearHints();
      if (!isSwappable(state.board[index])) {
        state.selected = null;
        renderBoard();
        flashInvalid([index]);
        SFX.invalid();
        scheduleAutoHint();
        return;
      }
      if (state.selected == null) {
        state.selected = index;
        renderBoard();
        return;
      }
      if (state.selected === index) {
        state.selected = null;
        renderBoard();
        scheduleAutoHint();
        return;
      }
      if (areAdjacent(state.selected, index)) {
        const a = state.selected;
        state.selected = null;
        attemptSwap(a, index);
      } else {
        state.selected = index;
        renderBoard();
      }
    }

    function handleSwipe(index, dx, dy) {
      if (state.busy) return;
      const { r, c } = rowCol(index);
      let rr = r, cc = c;
      if (Math.abs(dx) > Math.abs(dy)) cc += dx > 0 ? 1 : -1;
      else rr += dy > 0 ? 1 : -1;
      if (!inBounds(rr,cc)) return flashInvalid([index]);
      attemptSwap(index, cellIndex(rr,cc));
    }

    function applyMotionSetting() {
      document.documentElement.style.setProperty('--motion-scale', state.settings?.reducedMotion ? '0' : '1');
      document.body.classList.toggle('reduced-motion', Boolean(state.settings?.reducedMotion));
      document.documentElement.classList.toggle('gsap-ready', Boolean(window.gsap) && !state.settings?.reducedMotion);
    }

    els.board.addEventListener('pointerdown', e => {
      SFX.ensure();
      const cell = e.target.closest('.cell');
      if (!cell) return;
      const index = Number(cell.dataset.index);
      state.pointerStart = { index, x:e.clientX, y:e.clientY, id:e.pointerId };
      cell.setPointerCapture?.(e.pointerId);
    });

    els.board.addEventListener('pointerup', e => {
      if (!state.pointerStart || state.pointerStart.id !== e.pointerId) return;
      const { index, x, y } = state.pointerStart;
      state.pointerStart = null;
      const dx = e.clientX - x, dy = e.clientY - y;
      if (Math.hypot(dx,dy) > 24) handleSwipe(index,dx,dy);
      else handleTap(index);
    });

    els.board.addEventListener('pointercancel', () => state.pointerStart = null);
    els.levelGrid.addEventListener('click', e => {
      SFX.ensure();
      const btn = e.target.closest('[data-level]');
      if (!btn || btn.disabled) return;
      clearActiveGame();
      startLevel(Number(btn.dataset.level));
    });

    els.continueBtn.addEventListener('click', () => { SFX.ensure(); resumeActive(); });
    els.freePlayBtn.addEventListener('click', () => { SFX.ensure(); clearActiveGame(); startFree(); });
    els.highscoreBtn.addEventListener('click', showHighscores);
    els.backBtn.addEventListener('click', () => { saveActiveGame(); showHome(); });
    els.settingsBtn.addEventListener('click', showSettings);
    els.hintBtn.addEventListener('click', () => { clearHintTimer(); showHint(); scheduleAutoHint(); });
    els.shuffleBtn.addEventListener('click', () => reshuffle(true));
    els.restartBtn.addEventListener('click', () => {
      showModal(`<h2>Neu beginnen?</h2><p>Der aktuelle Spielstand dieser Runde wird verworfen.</p><div class="modal-actions"><button class="primary" data-action="confirm-restart">Neu beginnen</button><button class="secondary" data-action="close">Weiterspielen</button></div>`);
    });

    els.modalContent.addEventListener('click', e => {
      const setting = e.target.closest('[data-setting]');
      if (setting) {
        const key = setting.dataset.setting;
        state.settings[key] = !state.settings[key];
        saveData.settings = state.settings;
        persistSave();
        applyMotionSetting();
        showSettings();
        if (key === 'autoHints') scheduleAutoHint();
        if (key === 'sound' && state.settings.sound) { SFX.ensure(); SFX.pop(1); }
        return;
      }
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'close') closeModal();
      if (action === 'home') showHome();
      if (action === 'replay') { closeModal(); startLevel(state.levelIndex); }
      if (action === 'next-level') { closeModal(); startLevel(Math.min(LEVELS.length-1, state.levelIndex + 1)); }
      if (action === 'replay-free') { closeModal(); startFree(); }
      if (action === 'highscores') showHighscores();
      if (action === 'confirm-restart') {
        closeModal();
        if (state.mode === 'free') startFree(); else startLevel(state.levelIndex);
      }
      if (action === 'reset-progress') {
        showModal(`<h2>Wirklich zurücksetzen?</h2><p>Level-Fortschritt, Bestwerte und gespeicherte Runden werden gelöscht.</p><div class="modal-actions"><button class="primary" data-action="confirm-reset">Alles löschen</button><button class="secondary" data-action="settings">Abbrechen</button></div>`);
      }
      if (action === 'settings') showSettings();
      if (action === 'confirm-reset') {
        saveData = defaultSave();
        state.settings = saveData.settings;
        persistSave();
        clearActiveGame();
        applyMotionSetting();
        showHome();
        toast('Fortschritt wurde zurückgesetzt.');
      }
    });

    els.modalBackdrop.addEventListener('click', e => {
      if (e.target === els.modalBackdrop && !state.busy) closeModal();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !els.game.classList.contains('hidden')) saveActiveGame();
    });
    window.addEventListener('beforeunload', saveActiveGame);

    buildBoardDom();
    renderLevelGrid();
    updateContinueButton();
  })();
  </script>
</body>
</html>
